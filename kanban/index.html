     block of lines rather than one line, so it cannot be read line by line. */
  meta.agenda = readAgenda(lines);
  /* Read in a second pass: a description sits on the line after the note it
     belongs to, so this cannot be decided one line at a time. */
  const tickets = readJiraRun(lines, '');
  if (tickets.length) meta.jira = tickets[0];
  return meta;
}

/* One Jira note as a board key and a summary. The key is whatever sat in the
   brackets, upper-cased so `dsys` and `DSYS` are the same board; an empty key
   means every board is offered. */
function readJira(line){
  const m = JIRA_NOTE.exec(line);
  const key = (m && m[2] ? m[2] : '').trim().toUpperCase();
  return { key, summary: quoted(line), description: '', raw: line, descRaw: '' };
}

/* Jira notes out of one run of note lines, each taking the description written
   under it. Order is what pairs them: a description belongs to the last Jira
   note seen, so a step carrying two tickets keeps two separate bodies rather
   than both of them collapsing onto the first. */
function readJiraRun(lines, where){
  const out = [];
  lines.forEach(l => {
    if (JIRA_NOTE.test(l)) out.push(Object.assign(readJira(l), { where }));
    else if (DESC_NOTE.test(l) && out.length) { out[out.length - 1].description = quoted(l); out[out.length - 1].descRaw = l; }
  });
  return out;
}

/* Every task and sub-step as one flat list. The reference sections all filter
   this, so an entry can never exist without the thing it points at. */
function allItems(){
  const out = [];
  state.doc.buckets.forEach((b, bi) => {
    const color = BUCKET_COLOR[bi % BUCKET_COLOR.length];
    b.tiers.forEach(tier => tier.tasks.forEach(t => {
      const parts = splitBody(t);
      const own = noteMeta(parts.notes);
      out.push({
        id: t.id, task: t, sub: null, color,
        bucket: b.name, tier: tier.name, parent: '',
        title: t.title, done: t.done,
        due: t.due, start: t.start, ai: t.ai, impact: t.impact, effort: t.effort,
        urgent: t.urgent, week: t.week, rank: t.rank,
        slug: t.slug, blockedBy: t.blockedBy || [],
        message: own.message, draft: own.draft, prompt: own.prompt, jira: own.jira,
        agenda: own.agenda, prevAgenda: readPrevAgenda(parts.notes),
        repeat: readRepeat(t.repeat)
      });
      parts.steps.forEach(s => {
        const meta = noteMeta(s.notes);
        out.push({
          id: t.id, task: t, sub: s, color,
          bucket: b.name, tier: tier.name, parent: t.title,
          title: s.clean, done: s.done || t.done,
          due: s.due,
          /* A step cannot begin before the task it sits inside can, so it takes
             the later of its own start and its parent's. */
          start: laterOf(s.start, t.start),
          ai: s.ai || t.ai, impact: '', effort: '',
          urgent: false, week: s.week, rank: s.rank,
          slug: s.slug, blockedBy: s.blockedBy,
          message: meta.message, draft: meta.draft, prompt: meta.prompt, jira: meta.jira,
          /* A step can carry its own agenda, but the cycle is the task's — the
             meeting is the task, the steps are what happens inside it. */
          agenda: meta.agenda, prevAgenda: null, repeat: readRepeat(t.repeat)
        });
      });
    }));
  });
  return out;
}

function itemBySlug(items, slug){ return items.find(i => i.slug === slug) || null; }

/* Which of the things an item waits on are still outstanding. A blocker that is
   not ticked yet blocks it. So does a slug that names nothing in the file: he
   cannot act on a dependency he cannot even look up, so an unresolvable one
   counts the same as an unfinished one.

   A sub-step carries no blocked-by tag of its own, but it cannot start before
   the task it sits inside can, so it inherits its parent's. */
function unresolvedBlockers(items, it){
  const own = it.blockedBy || [];
  const inherited = it.sub ? (it.task.blockedBy || []) : [];
  return own.concat(inherited).filter(slug => {
    const src = itemBySlug(items, slug);
    return !src || !src.done;
  });
}
function actionable(items, it){ return unresolvedBlockers(items, it).length === 0; }
function byDue(a, b){
  if (!a.due && !b.due) return 0;
  if (!a.due) return 1;
  if (!b.due) return -1;
  return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
}

/* ---- The small bordered card every reference renders as ---- */

function refTags(it){
  let out = '';
  /* First, because on a recurring task how often it comes round is what frames
     every other tag on the card: the deadline is the next occurrence. */
  if (it.repeat) out += '<span class="tag repeat" title="Recurring ' +
    esc(it.repeat.label) + '">' + esc(it.repeat.label) + '</span>';
  const si = startInfo(it.start);
  if (si) out += '<span class="tag startdate">' + esc(si.label) + ' · ' + esc(si.note) + '</span>';
  const di = dueInfo(it.due, it.tier === WAIT_COL);
  if (di) out += '<span class="tag due ' + di.cls + '">' + esc(di.label) + (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (it.urgent) out += '<span class="tag urgent">urgent</span>';
  if (it.impact) out += '<span class="tag impact-' + esc(it.impact) + '" title="' + esc(it.impact) + ' impact">' + (IMPACT_EMOJI[it.impact] || esc(it.impact)) + '</span>';
  if (it.effort) out += '<span class="tag">' + esc(it.effort) + '</span>';
  if (it.ai && it.ai !== 'none') out += '<span class="tag ai ai-' + esc(it.ai) + '" title="' + esc(it.ai) + ' AI help">ai</span>';
  return out;
}

/* These sections are the only place the five views exist now, so a card has to
   be somewhere he can work rather than just read: tick it here, open it here,
   drop it out of the week here. The tick writes to the task or the sub-step,
   whichever the card was built from, so the board and the file agree instantly.

   opts.message / opts.prompt say whether to include the body text. */
function refCard(it, opts){
  opts = opts || {};
  /* This card is a copy shown away from its own column, so the column itself —
     what the board would otherwise say just by where the card sits — has to
     be spelled out here instead. Same "bucket · tier" order the matrix hover
     preview already uses, so the two read as the same fact. */
  const where = [it.bucket, it.parent, it.done ? DONE_COL : it.tier].filter(Boolean).map(esc).join(' · ');
  const target = it.sub ? ' data-sub="' + it.sub.line + '"' : '';
  let body = '';
  if (opts.message && it.message) {
    body += messageHTML(it.message, { draft: it.draft });
  }
  /* Switching a task to ai:full puts it here straight away, but the prompt is
     written by hand and lags behind the tag. Say so on the card, otherwise a
     task with nothing to paste looks the same as one that is ready to go. */
  if (opts.prompt) {
    body += it.prompt ? messageHTML(it.prompt, { claude:true, task:it.id })
                      : '<p class="reflead draft">Needs a prompt before this can be handed over</p>';
  }
  /* An agenda, on the same terms as a message: it is the whole of what the card
     is for, so it only shows where the section asked for it. */
  if (opts.agenda && it.agenda) body += agendaHTML(it.agenda, it.due);
  /* A ticket to raise is worth acting on from wherever the card is showing, so
     unlike a message or a prompt this needs no opts flag to turn it on. */
  if (it.jira) body += jiraHTML(it.jira);

  return '<article class="ref' + (it.done ? ' done' : '') + '" style="--bc:' + it.color + '">' +
    '<div class="refhead">' +
      '<button class="refbox" data-tick="' + it.id + '"' + target +
        ' role="checkbox" aria-checked="' + it.done + '"' +
        ' title="' + (it.done ? 'Mark as not done' : 'Mark as done') + '">' + (it.done ? '✓' : '') + '</button>' +
      '<button class="reftitle" data-open="' + it.id + '" title="Open this task">' + mdInline(it.title) + '</button>' +
      (opts.unweek
        ? '<button class="refdrop" data-unweek="' + it.id + '"' + target + ' title="Take this out of the week">Not this week</button>'
        : '') +
      (opts.quickDismiss
        ? '<button class="refdrop" data-quickdismiss="' + esc(quickKey(it)) + '" ' +
          'title="Dismiss this suggestion. Nothing about the task changes — it just stops showing here until you bring it back.">Dismiss</button>'
        : '') +
    '</div>' +
    '<div class="refwhere">' + where + '</div>' +
    (refTags(it) ? '<div class="meta">' + refTags(it) + '</div>' : '') +
    body +
  '</article>';
}

function refGroup(label, cards){
  if (!cards.length) return '';
  return '<h4 class="refgroup">' + esc(label) + '</h4>' + cards.join('');
}

/* ---- Capping how many cards one Overview column shows ----
   A column that scrolls past the fold is not an overview any more, it is the
   board again with extra steps — so each one stops at a card count he can
   actually take in, and says how many were left off rather than quietly
   shrinking. Nothing is lost: the full list is still the board and the other
   views, this is only about what one glance at Overview shows. */
const OV_CARD_LIMIT = 8;
function capCards(items, limit){
  limit = limit || OV_CARD_LIMIT;
  if (items.length <= limit) return { shown: items, hidden: 0 };
  return { shown: items.slice(0, limit), hidden: items.length - limit };
}
/* The same cap spent across several groups in one column — Quick wins and
   Delegate both split into sub-groups — so the column's total stays capped
   rather than each sub-group getting its own budget. Earlier groups keep
   their cards; a group hit once the budget is spent shrinks or disappears,
   in the order it would already have rendered. */
function capGroups(groups, limit){
  limit = limit || OV_CARD_LIMIT;
  let budget = limit, hidden = 0;
  const shown = groups.map(g => {
    if (budget <= 0) { hidden += g.length; return []; }
    if (g.length <= budget) { budget -= g.length; return g; }
    hidden += g.length - budget;
    const s = g.slice(0, budget);
    budget = 0;
    return s;
  });
  return { shown, hidden };
}
function moreNote(hidden){
  return hidden ? '<p class="refmore">+' + hidden + ' more not shown here — open the board to see the rest.</p>' : '';
}

/* ---- The five sections, each built from its tag ---- */

function weekSection(items){
  const live = items.filter(i => i.week).sort(byDue);
  if (!live.length) return '<p class="empty">Nothing is tagged <code>week</code> yet.</p>';
  const m = live.filter(i => i.effort === 'M' && !i.done).length;
  const warn = m > 2
    ? '<p class="refwarn">' + m + ' M-effort items this week. The ceiling is two once meetings are counted.</p>'
    : '';
  const { shown, hidden } = capCards(live);
  return warn + shown.map(i => refCard(i, { unweek:true })).join('') + moreNote(hidden);
}

/* A quick win has to be something he can act on right now. Anything still
   waiting on an unfinished blocker is not a win, it is a reminder that he cannot
   start — so it is left out. The count of what was held back is shown, because
   a section that quietly shrinks looks like a section with nothing in it.

   Anything tagged ai:full is left out too. Delegate to Claude already lists
   every one of them, ranked, and the two columns sit side by side on Overview —
   the same card in both reads as two jobs when it is one. Quick wins is what is
   left for him to do himself.

   Backlog is left out entirely, the same call the matrix makes with HELD_TIER —
   it has been parked on purpose, so however small it is, it is not a real
   priority and not something to surface here.

   What is left is ordered by byPriority, the dependency chain's own
   assessment: a two-minute message that happens to unblock a big rock outranks
   one that unblocks nothing, the same way the chain ranks a blocked card by
   what is riding on it rather than its own score alone. */
function quickSection(items){
  // ai:full belongs to Delegate to Claude, and Backlog is not a real priority —
  // neither belongs here.
  const open = items.filter(i => !i.done && i.ai !== 'full' && i.tier !== HELD_TIER);
  // Two separate reasons something is not a quick win yet: it waits on another
  // task, or its start date has not arrived. Neither is about the deadline —
  // an overdue task is the most actionable thing on the list, not the least.
  const live = byPriority(items, open.filter(i => actionable(items, i) && !notYet(i.start))).order;
  const heldByDep = open.filter(i => !actionable(items, i)).length;
  const heldByDate = open.filter(i => actionable(items, i) && notYet(i.start)).length;
  const heldByBacklog = items.filter(i => !i.done && i.ai !== 'full' && i.tier === HELD_TIER).length;
  const isS = i => i.sub === null && i.effort === 'S';
  const seen = new Set();
  const take = arr => arr.filter(i => { const k = i.id + '|' + i.title; if (seen.has(k)) return false; seen.add(k); return true; });

  /* Meetings first, and before the messages, because a standing meeting is the
     one thing here with a time on it rather than a deadline: 9:15 on Wednesday
     passes whether or not the agenda was ready. Nearest first.

     Only the ones with an agenda written, because the group is what he can clear
     in a gap and a written agenda is one paste from cleared. A recurring meeting
     with nothing on it yet is still on the board with its date, and it is still
     in the other groups if it is small — but it is not a quick win, it is the
     work. Nothing here says whether an agenda exists: the tick on the card is
     what says that, so a second answer to the same question is not wanted. */
  const preMeetings = take(live.filter(i => i.repeat && i.agenda && i.sub === null).sort(byDue));
  const preMessages = take(live.filter(i => i.message));
  const preDecide   = take(live.filter(i => isS(i) && i.ai === 'partial'));
  const preTalk     = take(live.filter(i => isS(i) && i.ai === 'none'));

  /* Dismissed here, not filtered out of `open` above: a dismissal is a
     preference about this list, not a fact about the task, so it must not
     touch heldByDep/heldByDate/heldByBacklog, which describe the task itself. */
  const dismissed = quickDismissedSet();
  const notDismissed = i => !dismissed.has(quickKey(i));
  const meetings = preMeetings.filter(notDismissed);
  const messages = preMessages.filter(notDismissed);
  const decide   = preDecide.filter(notDismissed);
  const talk     = preTalk.filter(notDismissed);
  const dismissedShown = (preMeetings.length - meetings.length) + (preMessages.length - messages.length) +
    (preDecide.length - decide.length) + (preTalk.length - talk.length);

  const reasons = [];
  if (heldByDep)  reasons.push('<strong>' + heldByDep + '</strong> waiting on another task');
  if (heldByDate) reasons.push('<strong>' + heldByDate + '</strong> not startable yet');
  if (heldByBacklog) reasons.push('<strong>' + heldByBacklog + '</strong> parked in ' + esc(HELD_TIER));
  const note = reasons.length
    ? '<p class="refheld">Left out: ' + reasons.join(' · ') + '.</p>'
    : '';

  const capped = capGroups([meetings, messages, decide, talk]);
  const [sMeetings, sMessages, sDecide, sTalk] = capped.shown;

  const out =
    refGroup('Costs one paste, before the meeting', sMeetings.map(i => refCard(i, { agenda:true, quickDismiss:true }))) +
    refGroup('Costs one message, already written', sMessages.map(i => refCard(i, { message:true, quickDismiss:true }))) +
    refGroup('Costs one decision', sDecide.map(i => refCard(i, { quickDismiss:true }))) +
    refGroup('Costs one conversation', sTalk.map(i => refCard(i, { quickDismiss:true })));
  const dismissedNote = dismissedShown
    ? '<p class="refmore">' + dismissedShown + ' dismissed. ' +
      '<button type="button" class="reflink" data-quickrestore>Show them again</button></p>'
    : '';
  return out
    ? note + out + moreNote(capped.hidden) + dismissedNote
    : note + dismissedNote + '<p class="empty">Nothing small enough to clear in a gap.</p>';
}

function bigRocksSection(items){
  const rocks = items.filter(i => i.sub === null && i.impact === 'high' && i.effort === 'L' && !i.done);
  if (!rocks.length) return '<p class="empty">No high impact, L effort tasks.</p>';
  const { shown, hidden } = capCards(rocks);
  return shown.map(i => refCard(i)).join('') + moreNote(hidden);
}

/* An item's own impact. Sub-steps are never scored, so one takes the score of
   the task it sits in — that is the work it is part of. */
function itemImpact(it){
  return IMPACT_N[it.impact || (it.sub ? it.task.impact : '')] || 0;
}

/* What is riding on a blocked card: its own impact, or the impact of anything
   still waiting on it, whichever is higher. A small task holding up a big one
   is worth unpicking for the big one's sake, and that carries down a chain, so
   this follows the whole tail rather than one step of it. `seen` is copied at
   each step, which keeps it to the current path and stops a circular
   blocked-by from looping forever. */
function chainWeight(waiters, it, seen){
  seen = seen ? new Set(seen) : new Set();
  let best = itemImpact(it);
  if (!it.slug || seen.has(it.slug)) return best;
  seen.add(it.slug);
  (waiters.get(it.slug) || []).forEach(o => {
    best = Math.max(best, chainWeight(waiters, o, seen));
  });
  return best;
}

/* Slug → everything still waiting on it, across every open item. Built once
   and shared: both the chain and quick wins ask the same question — "what
   does finishing this actually unblock" — and re-deriving the answer per
   caller would be the same walk of the list twice. */
function waitersMap(items){
  const waiters = new Map();
  items.forEach(o => {
    if (o.done) return;
    unresolvedBlockers(items, o).forEach(sl => {
      if (!waiters.has(sl)) waiters.set(sl, []);
      waiters.get(sl).push(o);
    });
  });
  return waiters;
}

/* Heaviest first — the same assessment the dependency chain uses, reused
   wherever "what's actually worth doing first" is the question. Ties go to
   whichever frees the most tasks, then to the nearest date. Weight is looked
   up from a precomputed map rather than called fresh per comparison, since a
   sort calls its comparator O(n log n) times and chainWeight walks the whole
   downstream chain on every call. Returns the order and the weights it was
   computed from, since a caller sometimes needs to explain a card's position,
   not just show it. */
function byPriority(items, list){
  const waiters = waitersMap(items);
  const weight = new Map(list.map(i => [i, chainWeight(waiters, i, null)]));
  const order = list.slice().sort((a, b) => {
    const wd = weight.get(b) - weight.get(a);
    if (wd) return wd;
    const fd = (waiters.get(b.slug) || []).length - (waiters.get(a.slug) || []).length;
    if (fd) return fd;
    return byDue(a, b);
  });
  return { order, weight };
}

function chainSection(items){
  const blocked = items.filter(i => i.blockedBy.length && !i.done);
  if (!blocked.length) return '<p class="empty">Nothing carries a <code>blocked-by:</code> tag.</p>';

  const { order, weight } = byPriority(items, blocked);

  return order.map(i => {
    const deps = i.blockedBy.map(slug => {
      const src = itemBySlug(items, slug);
      const card = src ? chainCard(src, { dep:true }) : chainMissing(slug);
      return '<div class="chaindep">' + card + '<span class="chainarrow" aria-hidden="true">→</span></div>';
    }).join('');
    return '<div class="chainitem">' +
      '<div class="chainrow">' +
        '<div class="chainfrom">' + deps + '</div>' +
        chainCard(i, { target:true }) +
      '</div>' +
      (weight.get(i) > itemImpact(i)
        ? '<div class="chainholds">Holds up higher impact work</div>' : '') +
    '</div>';
  }).join('');
}

/* One mini ticket in the chain — a blocker (dashed, dep:true) or the card
   waiting on it (target:true). Both open the full task on click. */
function chainCard(it, opts){
  opts = opts || {};
  const cls = 'chaincard' + (opts.dep ? ' dep' : '') + (opts.target ? ' target' : '') + (it.done ? ' done' : '');
  return '<div class="' + cls + '" style="--bc:' + it.color + '" data-open="' + it.id + '" title="Open this task">' +
    '<span class="chaintitle">' + mdInline(it.title) + (it.done ? ' ✓' : '') + '</span>' +
    '<div class="chainwhere">' + esc([it.bucket, it.done ? DONE_COL : it.tier].filter(Boolean).join(' · ')) + '</div>' +
  '</div>';
}

function chainMissing(slug){
  return '<div class="chaincard dep missing" title="No task carries this slug">' +
    '<span class="chaintitle">#' + esc(slug) + ' missing</span>' +
  '</div>';
}

/* Only ai:full work belongs here, and the ai: tag is the gate rather than the
   rank. A rank left behind on something he has taken back off Claude must not
   keep it in the list, otherwise the section quietly recommends delegating work
   he has already decided is his. */
function delegateSection(items){
  const ranked = items.filter(i => i.ai === 'full' && !i.done && i.rank != null)
                      .sort((a, b) => a.rank - b.rank);
  const unranked = items.filter(i => i.ai === 'full' && !i.done && i.rank == null);
  if (!ranked.length && !unranked.length) return '<p class="empty">Nothing is tagged <code>ai:full</code>.</p>';

  const capped = capGroups([ranked, unranked]);
  const [sRanked, sUnranked] = capped.shown;

  let html = sRanked.map(i =>
    '<div class="refrow"><span class="refnum">' + i.rank + '</span>' + refCard(i, { prompt:true }) + '</div>'
  ).join('');
  if (sUnranked.length) {
    html += refGroup('Not ranked yet', sUnranked.map(i => refCard(i, { prompt:true })));
  }
  return html + moreNote(capped.hidden);
}

/* ---- Small shared renderers ---- */

function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_]+)_/g, '$1<em>$2</em>');
}
/* A prompt is written to be handed to Claude, so the board can do the handing
   rather than leaving it as a copy-and-paste. claude.ai/new?q= opens a fresh
   chat with the text already sitting in the box, unsent — which is the point,
   because most of these prompts still have a [path] to fill in before they go.
   Only prompts get this. A suggested message is for a person, not for Claude. */
function claudeHref(text){
  return 'https://claude.ai/new?q=' + encodeURIComponent(text);
}
function claudeLink(text){
  return '<a class="toclaude" href="' + claudeHref(text) + '" target="_blank" rel="noopener"' +
         ' title="Opens a new Claude chat with this prompt in the box, unsent">Open in Claude</a>';
}

/* ---- Chats on a task ----
   The engine and the modal itself live in ai_chat/ now, loaded above as
   AIChat — see ai_chat/README.md for the shape of that module and why it
   never stores a transcript of its own.

   What stays here is this board's own business: minting and persisting the
   `chat:` tag on a task line (that marks the list dirty, same as any other
   edit), drawing the "Chats" field inside the drawer, and wiring this
   board's shared click handler to the widget's API.

   A task carries a list rather than one conversation, because the work on a
   task is not one conversation. Reading the 360 responses, drafting the
   message that comes out of it and checking last quarter's wording are
   three, and keeping them apart is the point — each stays short enough to
   be worth resuming. */

// Feature parked while ai_chat/ is being reworked elsewhere — server.py's
// AI_CHAT_DIR does not currently resolve to a real module, so /ai-chat/chat.js
// 404s and the real AIChat is never defined. Falling straight through to
// AIChat.create() would throw at the top level and stop the rest of this
// script (loadFile() included) from ever running — the board would sit on
// the start screen forever with no error shown. This stub keeps every call
// site working with the feature simply switched off, the same "no engine, no
// buttons, not a crash" rule server.py already follows.
const chat = (typeof AIChat !== 'undefined') ? AIChat.create({
  ownerLabel: taskId => { const loc = locate(taskId); return loc ? loc.task.title : ''; },
  // Worth explaining once, on the button that starts a chat, not on every
  // task's Chats section — see the Ask Claude / New chat tooltips.
  readOnlyHelp: '',
  // A session getting filed, a run finishing, or the modal closing can all
  // leave the drawer showing a stale "running" badge or an empty chat list —
  // this is the one place that redraws it.
  onSessionsChanged: () => { if (state.openTask) openDrawer(state.openTask); },
  onChange: () => { if (state.openTask) openDrawer(state.openTask); },
  // The status fetch on load is the first time claudeOn() can go from false
  // to true — the Ask Claude button on every prompt only exists once this
  // has answered, so the whole view needs a redraw, not just the drawer.
  onStatusChanged: () => { if (state.doc) renderView(); },
}) : {
  available: () => false,
  renderSection: () => '',
  newOwnerKey: () => '',
  openNew: () => {},
  openSession: () => {},
  forget: () => {},
  loadStatus: () => {},
};

function claudeOn(){ return chat.available() && !state.locked; }

/* The task's key, writing one onto the line if this is the first chat on it.
   That marks the list dirty, which is right — a task that has conversations
   under it is a task whose line has changed. */
function chatKeyFor(t, make){
  if (t.chat) return t.chat;
  if (!make) return '';
  t.chat = chat.newOwnerKey();
  t.dirty = true;
  markDirty();
  return t.chat;
}

function chatSection(t){
  const html = chat.renderSection({ ownerId: t.id, ownerKey: t.chat, label: 'Chats',
    collapsible: true, collapsed: sectionCollapsed('chats'), collapseKey: 'chats' });
  // A rule ahead of it marks it as its own section rather than one more
  // field, the same as the two suggestion lists below it — but only when
  // there is one: chat.renderSection() answers '' with no CLI behind it, and
  // a bare rule with nothing under it would be a dead end.
  return html ? '<hr class="dsep">' + html : '';
}

/* A prompt written on the task starts its own conversation, seeded with the
   prompt but not sent — most of them still have a [path] to fill in, and one
   that fired on click would send the placeholder. */
function askFromPrompt(taskId, text){
  const loc = locate(taskId);
  if (!loc) return;
  const key = chatKeyFor(loc.task, true);
  refreshView();
  chat.openNew(taskId, key, text);
}

function newChat(taskId){
  const loc = locate(taskId);
  if (!loc) return;
  const key = chatKeyFor(loc.task, true);
  refreshView();
  chat.openNew(taskId, key, '');
}

/* The list on a task and the prompt's "Ask Claude" button both land here,
   sharing the listener the drawer and board already use for everything else. */
function handleAsk(e){
  const ask = e.target.closest('.askclaude');
  if (ask) { askFromPrompt(ask.dataset.task, ask.dataset.ask || ''); return; }
  const open = e.target.closest('.aic-open');
  if (open) { chat.openSession(open.dataset.owner, open.dataset.key, open.dataset.session); return; }
  const forget = e.target.closest('.aic-forget');
  if (forget) { chat.forget(forget.dataset.key, forget.dataset.session); return; }
  const fresh = e.target.closest('.aic-addsub');
  if (fresh) newChat(fresh.dataset.owner);
}


/* The prompt's own row. Ask starts a conversation on the task; the link is
   still there for the times the web app is what you wanted. */
function claudeActions(text, taskId){
  if (!claudeOn() || !taskId) return claudeLink(text);
  return '<button type="button" class="askclaude" data-task="' + esc(taskId) + '"' +
    ' data-ask="' + esc(text) + '"' +
    ' title="Starts a chat on this task with the prompt ready to send, running in ' +
    esc(chat.home()) + '">Ask Claude</button>' + claudeLink(text);
}

/* Every Jira note on a task, its sub-steps included. The card marker and the
   panel section both need this, and a task's tickets can sit at either depth. */
function jiraNotes(t){
  const parts = splitBody(t);
  const out = readJiraRun(parts.notes, '');
  parts.steps.forEach(s => out.push.apply(out, readJiraRun(s.notes, s.clean)));
  return out;
}

/* ---- Raising a Jira ticket ----
   Same idea as the Claude link, and the same limit: the URL fills the create
   form in, it does not create anything. CreateIssueDetails!init.jspa opens the
   dialog with the fields already set and waits for Create to be pressed, which
   is the only version of this worth having — a link that raised a ticket on
   somebody's board from a click would be a link nobody could safely put on a
   card.

   Jira wants numeric ids rather than keys, so pid and issuetype come out of
   data/jira.json rather than being written on the task. reporter is per board
   on purpose: DSYS refuses to create without one, and WADE refuses to let it be
   set at all, so one setting could not serve both. */
function jiraBoards(key){
  const cfg = state.jira;
  if (!cfg || !cfg.boards || !cfg.boards.length) return [];
  if (!key) return cfg.boards;
  return cfg.boards.filter(b => String(b.key || '').toUpperCase() === key);
}
function jiraHref(board, note){
  const cfg = state.jira;
  const q = ['pid=' + encodeURIComponent(board.pid),
             'issuetype=' + encodeURIComponent(board.issuetype)];
  if (board.setReporter && cfg.reporter) q.push('reporter=' + encodeURIComponent(cfg.reporter));
  q.push('summary=' + encodeURIComponent(note.summary));
  if (note.description) q.push('description=' + encodeURIComponent(note.description));
  return String(cfg.site).replace(/\/+$/, '') + '/secure/CreateIssueDetails!init.jspa?' + q.join('&');
}
/* Copy is drawn as an icon, not a label, and stays visible without a hover —
   the one action on a suggestion module worth reaching for on sight. Copied
   swaps in the tick for a moment; both are single-path SVGs, same convention
   as the icon buttons in the header. */
const ICON_COPY = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 16.17 4.83 12l-1.41 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
function copyBtn(attrs){
  return '<button type="button" class="copy" data-copy="' + esc(attrs.text) + '"' +
    (attrs.html ? ' data-copy-html="' + escAttr(attrs.html) + '"' : '') +
    ' aria-label="Copy" title="' + esc(attrs.title || 'Copy') + '">' + ICON_COPY + '</button>';
}

/* The buttons for one Jira note. A note naming a board nothing is configured
   for still renders, saying so — a note that quietly showed nothing would look
   the same as no note at all, and the summary is worth reading either way.
   That note stays outside .msgextra: it is information, not a control, so
   hiding it behind a hover would hide the reason nothing else is there to
   press. opts.where and opts.dismiss are the same two the drawer already
   needed — see messageHTML just below, which takes them for the same reason. */
function jiraHTML(note, opts){
  opts = opts || {};
  const boards = jiraBoards(note.key);
  /* This is information, not a control, so it reads with the rest of the
     text rather than floating in the corner where a button would sit — it
     explains why nothing is there to press. */
  const noBoard = boards.length ? '' : '<em class="suggwhere draft">' +
    (state.jira ? 'no board configured as ' + esc(note.key) : 'no data/jira.json') + '</em>';
  const extra = (boards.length
    ? boards.map(b =>
        '<a class="tojira" href="' + jiraHref(b, note) + '" target="_blank" rel="noopener"' +
        ' title="Opens the Jira create form on ' + esc(b.name || b.key) + ', filled in and unsubmitted">' +
        'Raise in ' + esc(b.key) + '</a>').join('')
    : '') +
    (opts.dismiss ? dismissBtn(opts.dismiss, opts.dismissDesc) : '');
  return '<div class="msg jira">' +
    '<div class="msgtext">' +
      (opts.where ? '<em class="suggwhere">for: ' + esc(opts.where) + '</em>' : '') +
      mdInline(note.summary) +
      (note.description ? '<em class="jirabody">' + mdInline(note.description) + '</em>' : '') +
      noBoard +
    '</div>' +
    (extra ? '<div class="msgacts"><span class="msgextra">' + extra + '</span></div>' : '') +
  '</div>';
}
function dismissBtn(raw, descRaw){
  return '<button type="button" class="dismiss" data-dismiss="' + esc(raw) + '"' +
    (descRaw ? ' data-dismiss-desc="' + esc(descRaw) + '"' : '') +
    ' title="Remove this suggestion">Dismiss</button>';
}

/* A ready-to-send message, with a button that copies just the message text.
   opts.claude adds the hand-over link beside it. opts.where and opts.draft
   are the drawer's own: several of these can sit on one task there, each
   under its own sub-step, so each needs to say which one and whether it
   still wants editing before it goes — Overview never passes either, since
   one card there is already scoped to one task. opts.dismiss is the raw
   markdown line to remove; rendering the button at all is what turns
   dismissing on, so a caller with nowhere to persist a removal just omits it. */
function messageHTML(text, opts){
  opts = opts || {};
  const extra = (opts.claude ? claudeActions(text, opts.task) : '') +
    (opts.dismiss ? dismissBtn(opts.dismiss) : '');
  return '<div class="msg"><div class="msgtext">' +
      (opts.where ? '<em class="suggwhere">for: ' + esc(opts.where) + '</em>' : '') +
      (opts.draft ? '<em class="suggwhere draft">draft — read it before sending</em>' : '') +
      mdInline(text) +
    '</div>' +
    '<div class="msgacts">' + copyBtn({ text }) +
      (extra ? '<span class="msgextra">' + extra + '</span>' : '') +
    '</div></div>';
}
/* A message is one line, so it goes into a `data-copy` attribute as it stands.
   An agenda is several, and a newline inside an attribute survives the parser but
   only by accident of how it is written, so encode it and stop relying on that. */
function escAttr(s){ return esc(s).replace(/\n/g, '&#10;'); }

/* The agenda for a recurring meeting, shown as the thing it becomes once pasted:
   the meeting date as a title, then Agenda, then real nested bullets. Rendered as
   an actual <ul> rather than as styled indentation, so what is on screen and what
   lands in the document are the same shape rather than two designs of one list.

   `when` is the task's `[due:: ]`, which is the date of the occurrence this
   agenda is for. The block carries no date of its own — see AGENDA_NOTE.

   `opts.prev` renders it as last cycle's, quieter and titled differently, but it
   still carries its own Copy — see the comment on the button below for why.
   `opts.where` is the drawer's own, same reason as messageHTML's. */
function agendaHTML(ag, when, opts){
  opts = opts || {};
  const clip = agendaClipboard(ag, when);
  const title = opts.prev
    ? '<em class="suggwhere">last time' + (ag.date ? ', ' + esc(dueLabel(ag.date)) : '') + '</em>'
    : (when ? '<span class="agdate">' + esc(longDate(when)) + '</span>' : '');
  return '<div class="msg agenda' + (opts.prev ? ' prev' : '') + '">' +
    '<div class="msgtext">' +
      (opts.where ? '<em class="suggwhere">for: ' + esc(opts.where) + '</em>' : '') +
      title +
      '<span class="aglead">Agenda</span>' +
      '<ul class="aglist">' + ag.topics.map(t =>
        '<li>' + mdInline(t.title) +
        (t.context.length
          ? '<ul>' + t.context.map(c => '<li>' + mdInline(c) + '</li>').join('') + '</ul>'
          : '') +
        '</li>').join('') + '</ul>' +
    '</div>' +
    '<div class="msgacts">' +
      /* Last cycle's gets a Copy too, dated with the occurrence the card is
         pointing at now rather than the one it was written for. It reads
         oddly written down and is the right behaviour: the reason to copy a
         past agenda is that the meeting it belonged to was cancelled or
         moved, so what is wanted is those topics under the new date. */
      copyBtn({
        text: clip.text, html: clip.html,
        title: opts.prev
          ? 'Copies these topics under the date on the card now, for a meeting that moved'
          : 'Copies the title and the bullets. Pasted into Google Docs they stay real bullets, both levels'
      }) +
    '</div>' +
  '</div>';
}
/* ---- Context: standing facts, not tasks ----
   Who is away, whose contract runs out when, how names are spelt. It is the one
   part of the file that is not work and cannot be worked out from the tasks, so
   it is read straight out of the markdown rather than derived. Dates tagged
   on: or until: get a live countdown, since a leave date nobody is counting is
   how a plan ends up depending on somebody who is not there. */
const CTX_DATE = /`(on|until):(\d{4}-\d{2}-\d{2})`/;

function contextBlock(){
  const lines = state.doc.pre.concat(state.doc.post);
  let inside = false;
  const out = [];
  lines.forEach(l => {
    const h = /^##\s+(.*)$/.exec(l);
    if (h) { inside = /^context\b/i.test(h[1].trim()); return; }
    if (inside) out.push(l);
  });
  return out;
}

function contextSection(){
  const lines = contextBlock();
  if (!lines.length) return '';

  let html = '', group = '', items = [];
  // Grouped facts collapse behind their heading — a dozen `###` sections is
  // most of the column's length, and only one is usually the one being read.
  // Anything before the first heading has no title to collapse behind, so it
  // stays open, plain, the way it always has.
  const flush = () => {
    if (!items.length) return;
    html += group
      ? '<details class="ctxgroup"><summary>' + esc(group) + '</summary>' + items.join('') + '</details>'
      : items.join('');
    items = [];
  };

  lines.forEach(l => {
    const s = l.trim();
    if (!s || /^---+$/.test(s)) return;
    const h = /^###\s+(.*)$/.exec(s);
    if (h) { flush(); group = h[1]; return; }
    const b = /^[-*]\s+(.*)$/.exec(s);
    if (!b) return;

    const dm = CTX_DATE.exec(b[1]);
    let chip = '';
    if (dm) {
      const di = dueInfo(dm[2]);
      const past = di.days < 0;
      chip = '<span class="tag due ' + (past ? '' : di.cls) + '">' +
             (dm[1] === 'until' ? 'until ' : '') + esc(di.label) +
             ' · ' + (past ? Math.abs(di.days) + 'd ago' : 'in ' + di.days + 'd') + '</span>';
    }
    items.push('<article class="ref ctx">' +
      // Lifting the date out leaves "back on ." behind, so close the gap it left.
      '<div class="ctxtext">' + mdInline(
        b[1].replace(CTX_DATE, '').replace(/\s+([.,])/g, '$1').replace(/\s{2,}/g, ' ').trim()
      ) + '</div>' +
      (chip ? '<div class="meta">' + chip + '</div>' : '') +
    '</article>');
  });
  flush();
  return html;
}

/* Four tabs. Each reference section is generated from the tags on the tasks,
   so nothing here can name a task that is not on the board. */
function viewDefs(){
  return [
    { id:'overview', label:'Overview' },
    { id:'board',    label:'Board' },
    { id:'matrix',   label:'Matrix' },
    { id:'reports',  label:'Reports' },
    { id:'backups',  label:'Backups' }
  ];
}

/* =========================================================================
   4b2. Reports — what the file says about work that is already finished.

   Every other view answers "what should I do next". This one answers "what got
   done", which is the question that comes up in a one-to-one or a quarterly
   review and has never had an answer here that did not mean counting by hand.

   Read straight from state.doc, the same as every other view: nothing is
   fetched, nothing is stored, and a report of a backup preview describes that
   backup rather than the live file. Adding a second report means writing one
   more report*Report() that returns HTML and listing it in reportDefs().
   ========================================================================= */

/* Fixed choices rather than a free "since" date — this counts recent output,
   and each option answers "how am I doing lately" at a different grain. The
   30-day default is the one archiving also leaves alone (see the note in
   completedByCategoryReport), so it can never be quietly wrong about its own
   period. Past that, completedRecently() reads the archive to fill in the
   older end, which is what makes 60 and 90 trustworthy rather than a guess —
   90 is a quarter, close enough for the question a quarterly review actually
   asks. "This week" is the calendar week — Monday to today, not a rolling
   seven days — because that is the question Monday standup answers. */
const REPORT_WINDOWS = [
  { id:'week', label:'This week' },
  { id:'7',    label:'Past 7 days',  days:7 },
  { id:'15',   label:'Past 15 days', days:15 },
  { id:'30',   label:'Past 30 days', days:30 },
  { id:'60',   label:'Past 60 days', days:60 },
  { id:'90',   label:'Past 90 days', days:90 }
];
const REPORT_WINDOW_KEY = 'todo-board-report-window';
function readReportWindow(){
  try {
    const saved = localStorage.getItem(REPORT_WINDOW_KEY);
    return REPORT_WINDOWS.some(w => w.id === saved) ? saved : '30';
  } catch (e) { return '30'; }
}
let reportWindow = readReportWindow();
/* Returns whether it actually changed, so the caller knows whether a
   re-render is worth doing. */
function setReportWindow(id){
  if (reportWindow === id || !REPORT_WINDOWS.some(w => w.id === id)) return false;
  reportWindow = id;
  try { localStorage.setItem(REPORT_WINDOW_KEY, id); } catch (e) {}
  return true;
}
function reportWindowStart(){
  if (reportWindow === 'week') {
    const dow = (today().getDay() + 6) % 7;   // Monday = 0
    return new Date(today() - dow * 86400000);
  }
  const def = REPORT_WINDOWS.find(w => w.id === reportWindow);
  return new Date(today() - (def ? def.days : 30) * 86400000);
}
/* A function rather than a const, for two reasons: it depends on the picker
   above, and ARCHIVE_DAYS is declared further down the file, so a const
   reading either one up here would be evaluated before they exist. */
function reportDays(){ return Math.round((today() - reportWindowStart()) / 86400000); }
/* "This week" reads oddly re-said as "the last 3 days" on a Wednesday, so the
   two kinds of window get their own phrasing everywhere the count is put into
   a sentence. */
function reportWindowPhrase(){
  return reportWindow === 'week' ? 'this week' : 'in the last ' + reportDays() + ' days';
}

function reportDefs(){
  return [completedByCategoryReport, weeklyTrendReport];
}

/* "27 Aug" — the year is noise inside a 30 day window. */
function reportDay(iso){
  const d = parseDue(iso);
  return d ? d.toLocaleDateString(undefined, { day:'numeric', month:'short' }) : iso;
}

/* ---- Reading past the archive point ----

   Finished work older than ARCHIVE_DAYS can be lifted out of todo.md into
   data/backups/done-archive.md (see "Archiving finished work" further down).
   A window longer than that used to just say so and stop — the older end of
   the count was whatever hadn't been archived yet, which is not a count at
   all. The archive is the same task-line grammar as todo.md, grouped under
   "### Bucket · Tier" headings instead of nested columns, so it is parsed
   with the same parseTask() rather than a second parser.

   Fetched once and cached: the file only grows when Archive is actually used,
   which is rare enough that a stale cache is not a real risk, and the archive
   invalidates its own cache when that happens (see runArchive). */
let archiveEntries = null;             // null until the first fetch resolves
let archiveEntriesPromise = null;
let archiveEntriesError = false;

function parseArchiveEntries(text){
  const out = [];
  let bucketName = '', tierName = '';
  text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
    const h3 = /^###\s+(.*)$/.exec(line);
    if (h3) {
      const parts = h3[1].split(' · ');
      bucketName = (parts[0] || '').trim();
      tierName = (parts[1] || '').trim();
      return;
    }
    if (!TASK_RE.test(line)) return;
    const t = parseTask([line]);
    if (t.done && t.doneOn) out.push({ bucketName, tierName, title: t.title, doneOn: t.doneOn });
  });
  return out;
}

function invalidateArchiveEntries(){
  archiveEntries = null;
  archiveEntriesPromise = null;
  archiveEntriesError = false;
}

/* Returns the cached list once loaded, otherwise kicks off the one fetch and
   returns null. onReady is called when that fetch settles, so the caller can
   re-render — the same lazy pattern renderWrittenReports uses for report
   bodies. */
function archiveEntriesSync(onReady){
  if (archiveEntries) return archiveEntries;
  if (!archiveEntriesPromise) {
    archiveEntriesPromise = fetch('/data/backups/done-archive.md?t=' + Date.now(), { cache:'no-store' })
      .then(res => res.ok ? res.text() : Promise.reject(res.status))
      .then(text => { archiveEntries = parseArchiveEntries(text); })
      .catch(() => { archiveEntries = []; archiveEntriesError = true; })
      .then(onReady);
  }
  return null;
}

/* Every ticked, dated task inside the window, kept with the bucket and tier it
   was in so the breakdown does not need a second walk of the document. Once
   the window reaches past ARCHIVE_DAYS, archived work is merged in too — see
   above — so "sorted newest first" still means the whole period, not just
   whatever is still sitting in todo.md. */
function completedRecently(){
  const out = [];
  const days = reportDays();
  if (state.doc) state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (!t.done || !t.doneOn) return;
    const age = daysSince(t.doneOn);
    if (age == null || age < 0 || age > days) return;
    out.push({ bucketName:b.name, tierName:tier.name, title:t.title, doneOn:t.doneOn, taskId:t.id, age });
  })));
  if (days > ARCHIVE_DAYS) {
    const entries = archiveEntriesSync(() => renderCountedReports());
    (entries || []).forEach(e => {
      const age = daysSince(e.doneOn);
      if (age == null || age < 0 || age > days) return;
      out.push({ bucketName:e.bucketName, tierName:e.tierName, title:e.title, doneOn:e.doneOn, taskId:null, age });
    });
  }
  return out.sort((x, y) => x.age - y.age);
}

/* Ticked but undated. These are real finished work that the count cannot claim,
   because without a date there is no way to say which month it belongs to — so
   they are reported as a gap rather than folded in or ignored. */
function undatedDoneCount(){
  let n = 0;
  if (!state.doc) return n;
  state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (t.done && !t.doneOn) n++;
  })));
  return n;
}

function completedByCategoryReport(){
  const list = completedRecently();

  // Every bucket appears, including the empty ones. A bucket with nothing in it
  // is a finding, and dropping it would hide that. Matched by name rather than
  // by object identity so an archived entry, which has no live bucket to point
  // at, groups the same way a task still in todo.md does.
  const rows = state.doc.buckets.map((b, i) => ({
    name: b.name,
    color: BUCKET_COLOR[i % BUCKET_COLOR.length],
    items: list.filter(it => it.bucketName === b.name)
  }));
  const total = list.length;
  const most = rows.reduce((m, r) => Math.max(m, r.items.length), 0);

  const rowHTML = r => {
    const n = r.items.length;
    const pct = total ? Math.round(n / total * 100) : 0;
    const width = most ? (n / most * 100) : 0;
    // An archived task has no live id to open the drawer with, so it renders
    // as plain text instead of a button.
    const tasks = r.items.map(it =>
      '<li style="--bc:' + r.color + '">' +
        '<span class="dt">' + esc(reportDay(it.doneOn)) + '</span>' +
        (it.taskId
          ? '<button class="tt" data-open="' + it.taskId + '" title="Open this task">' + mdInline(it.title) + '</button>'
          : '<span class="tt archived" title="Archived — no longer in todo.md">' + mdInline(it.title) + '</span>') +
        '<span class="where">' + esc(it.tierName) + '</span>' +
      '</li>').join('');
    return '<div class="bkgroup">' +
        '<div class="row' + (n ? '' : ' zero') + '" style="--bc:' + r.color + '">' +
          '<span class="bkname"><i></i>' + esc(r.name) + '</span>' +
          '<span class="bar"><span style="width:' + width.toFixed(1) + '%"></span></span>' +
          '<span class="n">' + n + '</span>' +
          '<span class="pct">' + (total ? pct + '%' : '—') + '</span>' +
        '</div>' +
        (n ? '<details><summary>Show the ' + n + ' task' + (n === 1 ? '' : 's') + '</summary>' +
             '<ul class="done">' + tasks + '</ul></details>' : '') +
      '</div>';
  };

  const undated = undatedDoneCount();
  // Below 30 days this window sits inside the one archiving leaves alone, so the
  // count is a complete picture by construction. Past it, completeness depends
  // on the archive fetch above: still loading, failed, or in and merged.
  let archiveNote;
  if (reportDays() <= ARCHIVE_DAYS) {
    archiveNote = 'Finished work older than ' + ARCHIVE_DAYS + ' days can be archived out of todo.md. This window ' +
      'stays inside that, so the count above is the whole story for the period.';
  } else if (archiveEntriesError) {
    archiveNote = 'This window reaches past the ' + ARCHIVE_DAYS + '-day point where finished work moves to the ' +
      'archive, and that file could not be read — so the older end of this count may be incomplete.';
  } else if (archiveEntries === null) {
    archiveNote = 'Reading the archive for finished work older than ' + ARCHIVE_DAYS + ' days…';
  } else {
    archiveNote = 'This window reaches past the ' + ARCHIVE_DAYS + '-day point where finished work moves to ' +
      '`data/backups/done-archive.md` — counted in here too, so the total above still covers the whole period.';
  }
  const notes = [
    'Only tasks carrying a `done:` date are counted. The board writes that date when ' +
    'a task is ticked, so anything ticked before that was added is invisible here.',
    archiveNote
  ];
  if (undated) notes.unshift('<strong>' + undated + ' ticked task' + (undated === 1 ? ' has' : 's have') +
    ' no date</strong>, so ' + (undated === 1 ? 'it is' : 'they are') + ' not in the count above.');

  return '<div class="total"><span class="totaln">' + total + '</span>' +
      '<span class="totall">task' + (total === 1 ? '' : 's') + ' finished across ' +
      state.doc.buckets.length + ' categor' + (state.doc.buckets.length === 1 ? 'y' : 'ies') +
      '</span></div>' +
    (total ? rows.map(rowHTML).join('')
           : '<div class="empty">Nothing has been ticked off with a date ' +
             reportWindowPhrase() + '.</div>') +
    notes.map(n => '<p class="note">' + n + '</p>').join('');
}

/* ---- Weekly pace ----

   A count for one window says how much moved. It says nothing about whether
   that is more or less than usual, and reconstructing that by memory or by
   digging out old reports is exactly the kind of arithmetic this view exists
   to do instead. Eight trailing complete weeks, Monday to Sunday.

   Deliberately its own window rather than tied to the picker above: that one
   answers "how much lately" at whatever grain is asked for, this answers "is
   the pace climbing or flat", and letting one silently resize the other would
   make both harder to read. Reaches past ARCHIVE_DAYS by construction, so it
   reads the archive the same way completedRecently() does. */
const TREND_WEEKS = 8;

/* Which buckets the key has switched off. In memory only: it is a way of
   looking at the chart for a moment, not a setting worth keeping. */
const trendHidden = new Set();

function weekBuckets(n){
  const dow = (today().getDay() + 6) % 7;              // Monday = 0
  const thisMonday = new Date(today() - dow * 86400000);
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const start = new Date(thisMonday.getTime() - i * 7 * 86400000);
    out.push({ start, end: new Date(start.getTime() + 6 * 86400000) });
  }
  return out;
}

/* Every ticked, dated task's finish date across the trend's own lookback,
   live and archived alike, kept with the bucket it was in — a bar says how
   many, hovering it says which. */
function trendEntries(){
  const from = weekBuckets(TREND_WEEKS)[0].start;
  const out = [];
  if (state.doc) state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (!t.done || !t.doneOn) return;
    const d = parseDue(t.doneOn);
    if (d && d >= from) out.push({ date: d, bucketName: b.name });
  })));
  if (Math.round((today() - from) / 86400000) > ARCHIVE_DAYS) {
    const entries = archiveEntriesSync(() => renderCountedReports());
    (entries || []).forEach(e => {
      const d = parseDue(e.doneOn);
      if (d && d >= from) out.push({ date: d, bucketName: e.bucketName });
    });
  }
  return out;
}

function weeklyTrendReport(){
  const weeks = weekBuckets(TREND_WEEKS);
  const entries = trendEntries();
  // Bucket order and colour match the board's own, so a bucket reads the same
  // colour here as everywhere else. An archived bucket that no longer exists
  // still needs somewhere to go, so anything unmatched is appended, greyed.
  const bucketOrder = state.doc ? state.doc.buckets.map(b => b.name) : [];
  const colorOf = name => {
    const i = bucketOrder.indexOf(name);
    return i > -1 ? BUCKET_COLOR[i % BUCKET_COLOR.length] : 'var(--ink-faint)';
  };

  const weekData = weeks.map(w => {
    const inWeek = entries.filter(e => e.date >= w.start && e.date <= w.end);
    const counts = new Map();
    inWeek.forEach(e => counts.set(e.bucketName, (counts.get(e.bucketName) || 0) + 1));
    const order = bucketOrder.filter(n => counts.has(n))
      .concat([...counts.keys()].filter(n => !bucketOrder.includes(n)));
    return {
      start: w.start, end: w.end, total: inWeek.length,
      breakdown: order.map(n => ({ name: n, n: counts.get(n), color: colorOf(n) }))
    };
  });

  const counts = weekData.map(w => w.total);

  /* One series per bucket, each week's count read back out of that week's
     breakdown. Buckets that no longer exist in the list still finished work in
     this window, so any name the weeks turned up that the board no longer has
     is kept on the end rather than dropped. */
  const seriesNames = bucketOrder.concat(
    [...new Set(weekData.flatMap(w => w.breakdown.map(b => b.name)))].filter(n => !bucketOrder.includes(n))
  );
  const series = seriesNames.map(name => ({
    name, color: colorOf(name), hidden: trendHidden.has(name),
    values: weekData.map(w => (w.breakdown.find(b => b.name === name) || { n: 0 }).n)
  }));
  const shown = series.filter(s => !s.hidden);

  const n = weekData.length;
  const W = 700, H = 190, top = 12, base = H - 6;       // viewBox units, scaled to the card's width
  const peak = Math.max(1, ...shown.map(s => Math.max(...s.values)));
  const col = W / n;
  const cx = i => col * (i + 0.5);
  const cy = v => base - (v / peak) * (base - top);
  const f = x => x.toFixed(1);

  /* Both control points sit on the vertical midline between the two weeks
     they join, which keeps every curve inside the pair of values it connects.
     A smooth line can then never dip below zero or invent a peak no week had —
     the shape is decoration, the numbers under it are not. The line runs flat
     out to both edges so the chart fills its box rather than floating in it. */
  const curve = vals => {
    let d = 'M0,' + f(cy(vals[0])) + 'L' + f(cx(0)) + ',' + f(cy(vals[0]));
    for (let i = 1; i < n; i++){
      const mx = f((cx(i - 1) + cx(i)) / 2);
      d += 'C' + mx + ',' + f(cy(vals[i - 1])) + ' ' + mx + ',' + f(cy(vals[i])) +
        ' ' + f(cx(i)) + ',' + f(cy(vals[i]));
    }
    return d + 'L' + W + ',' + f(cy(vals[n - 1]));
  };

  const grid = weekData.map((w, i) =>
    '<line class="trendgrid" x1="' + f(cx(i)) + '" y1="' + top + '" x2="' + f(cx(i)) + '" y2="' + base + '"/>'
  ).join('');
  // Each band fades out downwards so overlapping ones stay readable through
  // each other, which a flat fill at any opacity does not.
  const defs = shown.map((s, i) =>
    '<linearGradient id="tgrad' + i + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + s.color + '" stop-opacity=".42"/>' +
      '<stop offset="1" stop-color="' + s.color + '" stop-opacity="0"/>' +
    '</linearGradient>').join('');
  const bands = shown.map((s, i) => {
    const d = curve(s.values);
    return '<path d="' + d + 'L' + W + ',' + base + 'L0,' + base + 'Z" fill="url(#tgrad' + i + ')"/>' +
      '<path class="trendline" d="' + d + '" stroke="' + s.color + '">' +
        '<title>' + esc(s.name) + '</title></path>';
  }).join('');
  /* One point per week per line, on top of the bands: a small dot to see, and
     a bigger transparent circle round it to actually hover — a 3px target is
     real but not a fair one. showTrendPreview reads the count and the week
     straight off these rather than re-deriving them, the same way matrixDot's
     aria-label is written once at render time rather than looked up on hover. */
  const points = shown.map(s =>
    s.values.map((v, i) => {
      const x = f(cx(i)), y = f(cy(v));
      return '<circle class="trenddot" cx="' + x + '" cy="' + y + '" r="2.5" fill="' + s.color + '"/>' +
        '<circle class="trendpt" cx="' + x + '" cy="' + y + '" r="9" tabindex="0"' +
        ' data-trendlabel="' + esc(s.name) + '" data-trendcolor="' + s.color + '"' +
        ' data-trendcount="' + v + '" data-trendweek="' + esc(reportDay(ymd(weekData[i].start))) + '"' +
        ' aria-label="' + esc(s.name) + ', ' + v + ' task' + (v === 1 ? '' : 's') +
        ', week of ' + esc(reportDay(ymd(weekData[i].start))) + '"></circle>';
    }).join('')
  ).join('');

  const chart = '<svg class="trendchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="Tasks finished per week, one line per bucket">' +
      '<defs>' + defs + '</defs>' + grid + bands + points +
      '<line class="trendbase" x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '"/>' +
    '</svg>' +
    '<div class="trendx">' + weekData.map((w, i) =>
      '<div class="trendxc' + (i === n - 1 ? ' current' : '') + '">' +
        '<span class="trendwk">' + esc(reportDay(ymd(w.start))) + '</span>' +
        '<span class="trendn">(' + w.total + ')</span>' +
      '</div>').join('') + '</div>' +
    '<div class="trendkey">' + series.map(s =>
      '<button class="tkey' + (s.hidden ? ' off' : '') + '" data-trendkey="' + esc(s.name) + '" ' +
        'style="--bc:' + s.color + '" aria-pressed="' + !s.hidden + '" ' +
        'title="Show or hide this bucket"><i></i>' + esc(s.name) + '</button>').join('') + '</div>';

  // Split the run in half and compare the two halves' averages, rather than
  // just the last week against the first — one quiet Friday should not read
  // as a slowdown.
  const half = Math.ceil(weeks.length / 2);
  const recentAvg = counts.slice(-half).reduce((a, b) => a + b, 0) / half;
  const earlierN = weeks.length - half;
  const earlierAvg = earlierN ? counts.slice(0, earlierN).reduce((a, b) => a + b, 0) / earlierN : recentAvg;
  let pace;
  if (recentAvg === 0 && earlierAvg === 0) {
    pace = 'Nothing finished with a date across these ' + weeks.length + ' weeks.';
  } else if (recentAvg > earlierAvg * 1.15) {
    pace = 'Climbing — the last ' + half + ' weeks are ahead of the ' + earlierN + ' before them.';
  } else if (recentAvg < earlierAvg * 0.85) {
    pace = 'Slowing — the last ' + half + ' weeks are behind the ' + earlierN + ' before them.';
  } else {
    pace = 'Flat — the last ' + half + ' weeks are close to the ' + earlierN + ' before them.';
  }

  return '<h2>Weekly pace</h2>' +
    '<p class="window">Tasks finished per week, Monday to Sunday, over the last ' +
      weeks.length + ' weeks, one line per bucket. The number under each week is its total.</p>' +
    '<div class="trend">' + chart + '</div>' +
    '<p class="note">' + esc(pace) + '</p>';
}

/* ---- Written reports ----

   The counted report above is arithmetic: it can only ever say how many. A
   written report says what moved and what it means, which is a judgement and so
   has to be written rather than derived.

   They are Markdown files in data/reports/, listed by the server at
   /reports.json. Kept as files rather than inside todo.md because a report is
   finished the day it is written, and the list is not — mixing the two would
   mean editing history every time a task changes. data/ rather than anywhere
   else, because a report about this list names people and internal decisions.

   The rules for writing one are in the README, under Reports. The short version
   is that a report never lists tasks. */

/* Body cache, keyed by url. A report never changes once written, so opening the
   same one twice should not go back to the server. */
const reportBodies = {};

/* Enough Markdown for a report and no more: headings, paragraphs, bullets and
   the inline marks mdInline already handles. Anything fancier is not something
   these files are allowed to contain. */
function mdBlocks(text){
  // Frontmatter is metadata for the list, not part of the report.
  const body = text.replace(/^---\n[\s\S]*?\n---\n/, '');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + mdInline(para.join(' ')) + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<ul class="repbul">' + list.join('') + '</ul>'); list = null; } };
  body.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); return; }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) {
      flushPara(); flushList();
      // The h1 is the report's own title, which the list already shows above it.
      if (h[1].length > 1) out.push('<h4>' + mdInline(h[2]) + '</h4>');
      return;
    }
    const b = /^[-*]\s+(.*)$/.exec(line);
    if (b) { flushPara(); (list = list || []).push('<li>' + mdInline(b[1]) + '</li>'); return; }
    flushList();
    para.push(line);
  });
  flushPara(); flushList();
  return out.join('');
}

/* The closed state is the list's whole job: title, date and standfirst are
   enough to say what a report found without opening it. Opening it is a
   separate choice — see openReportModal. */
function reportItemHTML(r){
  const when = [r.covers ? 'Covers ' + esc(r.covers) : '', r.topic ? esc(r.topic) : '']
    .filter(Boolean).join(' · ');
  return '<article class="repitem" data-report="' + esc(r.url) + '">' +
    '<button class="rephead" data-report-open="' + esc(r.url) + '">' +
      '<span class="reptitle">' + esc(r.title) + '</span>' +
      (r.date ? '<span class="repdate">' + esc(r.date) + '</span>' : '') +
    '</button>' +
    (when ? '<div class="repmeta">' + when + '</div>' : '') +
    (r.summary ? '<div class="repsum">' + mdInline(r.summary) + '</div>' : '') +
  '</article>';
}

/* A written report is a document, and a document wants a document's width —
   not 600 words read down this column's narrow gutter. Opens in showModal's
   wide variant instead of expanding inside its own card.

   Lazy and cached: the body is only fetched the first time a report is
   opened, and never again after that, since a written report never changes
   once it exists. */
function openReportModal(r){
  const when = [r.covers ? 'Covers ' + esc(r.covers) : '', r.topic ? esc(r.topic) : '']
    .filter(Boolean).join(' · ');
  const sub = [r.date ? esc(r.date) : '', when].filter(Boolean).join(' · ');
  showModal(r.title, sub,
    '<div class="repdoc">' + (reportBodies[r.url] || '<p class="empty">Loading…</p>') + '</div>',
    [{ label:'Close', primary:true }], { wide:true });
  if (!reportBodies[r.url]) loadReportBody(r.url);
}

async function loadReportBody(url){
  let html;
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    html = mdBlocks(await res.text());
    reportBodies[url] = html;
  } catch (err) {
    html = '<div class="err">Could not read that report. ' + esc(String(err.message || err)) + '</div>';
  }
  // The modal may have been closed, or moved on to a different report, while
  // this was in flight — write back only if it is still the one showing.
  const mid = modalEl && modalEl.querySelector('.mid .repdoc');
  if (mid) mid.innerHTML = html;
}

async function renderWrittenReports(){
  const out = $('#writtenOut');
  if (!out) return;
  try {
    const res = await fetch('/reports.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) {
      out.innerHTML = '<div class="err"><strong>The board helper needs restarting.</strong><br>' +
        'It is running, but it is an older copy that does not know about reports yet.</div>';
      return;
    }
    const list = (await res.json()).reports || [];
    if (!list.length) {
      out.innerHTML = '<div class="empty">Nothing written yet. Reports are Markdown files in ' +
        '<code>data/reports/</code>, and asking Claude for one is how they get there.</div>';
      return;
    }
    out.innerHTML = list.map(reportItemHTML).join('');
    out.querySelectorAll('[data-report-open]').forEach(btn => {
      const r = list.find(x => x.url === btn.dataset.reportOpen);
      btn.onclick = () => openReportModal(r);
    });
  } catch (err) {
    out.innerHTML = '<div class="err">Could not read the report list. ' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* Two columns, because the two kinds of report answer different questions and
   neither is a footnote to the other. Counted on the left, written on the right. */
function renderReportsView(){
  if (!state.doc) {
    $('#lists').innerHTML = '<div class="listcard reportsview"><h3>Reports</h3>' +
      '<div class="empty">No file loaded yet.</div></div>';
    return;
  }
  $('#lists').innerHTML =
    '<div class="lists rview">' +
      '<div class="listcard reportsview"><h3>Counted from the list</h3>' +
        '<label class="repwindow">Show ' + reportWindowSelectHTML() +
          '<span class="repdates" id="repDates">' + esc(reportDay(ymd(reportWindowStart()))) + '–' +
          esc(reportDay(ymd(today()))) + '</span></label>' +
        '<div id="countedOut"></div>' +
      '</div>' +
      '<div class="listcard reportsview written"><h3>Written reports</h3>' +
        '<p class="help listlead">What moved and what it means, rather than what was ticked. ' +
        'Ask Claude for one and it lands in the <code>data/reports/</code> folder.</p>' +
        '<div id="writtenOut">Loading…</div>' +
      '</div>' +
    '</div>';
  renderCountedReports();
  $('#reportWindow').onchange = e => {
    if (setReportWindow(e.target.value)) {
      renderCountedReports();
      $('#repDates').textContent = reportDay(ymd(reportWindowStart())) + '–' + reportDay(ymd(today()));
    }
  };
  renderWrittenReports();
}

function reportWindowSelectHTML(){
  return '<select id="reportWindow" title="How far back to count">' +
    REPORT_WINDOWS.map(w => '<option value="' + w.id + '"' + (w.id === reportWindow ? ' selected' : '') + '>' +
      esc(w.label) + '</option>').join('') +
  '</select>';
}
// Its own render path rather than folded into renderReportsView, so changing
// the window redraws only the counted card — not the written one beside it,
// which would otherwise re-fetch /reports.json for no reason.
function renderCountedReports(){
  const out = $('#countedOut');
  if (!out) return;
  out.innerHTML = reportDefs().map(fn => fn()).join('');
}

/* =========================================================================
   4b3. Backups — every copy of todo.md the board has kept, read from the same
   /backups.json the old standalone backups.html used. Fetched fresh each time
   the tab is opened, since a backup can land at any moment.
   ========================================================================= */
function backupSize(n){
  return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 102400 ? 1 : 0) + ' KB';
}

/* "3 days ago" is what tells him whether a copy is worth opening. The exact
   timestamp is there too, because for a backup the exact moment is the point. */
function backupAgo(iso){
  const then = new Date(iso), mins = Math.round((Date.now() - then) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return mins + ' minutes ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs === 1 ? 'an hour ago' : hrs + ' hours ago';
  const days = Math.round(hrs / 24);
  if (days < 7) return days === 1 ? 'yesterday' : days + ' days ago';
  const wks = Math.round(days / 7);
  return wks === 1 ? 'last week' : wks + ' weeks ago';
}

function backupWhen(iso){
  return new Date(iso).toLocaleString(undefined, {
    weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
  });
}

/* The week label is in the file name, and it is more use than the file name. */
function backupWeekOf(name){
  const m = /week-(\d{4})-W(\d{2})/.exec(name);
  return m ? 'Week ' + m[2] + ', ' + m[1] : null;
}

function backupRowHTML(b){
  const wk = backupWeekOf(b.name);
  const label = (b.kind === 'weekly' ? (wk || 'weekly snapshot') : 'session backup') +
    ' · ' + backupWhen(b.modified);
  return '<div class="row">' +
    '<span class="tag' + (b.kind === 'weekly' ? '' : ' session') + '">' +
      (b.kind === 'weekly' ? (wk || 'weekly') : 'session') + '</span>' +
    '<a class="when" href="' + esc(b.url) + '" target="_blank">' + esc(backupWhen(b.modified)) + '</a>' +
    '<span class="ago">' + esc(backupAgo(b.modified)) + '</span>' +
    '<span class="spacer"></span>' +
    '<span class="name">' + esc(b.name) + '</span>' +
    '<span class="size">' + backupSize(b.bytes) + '</span>' +
    '<button type="button" class="btn loadbtn" data-load-url="' + esc(b.url) + '" data-load-label="' + esc(label) + '">Load</button>' +
  '</div>';
}

function backupGroupHTML(title, list, blank){
  return '<h2>' + esc(title) + '</h2>' +
    (list.length ? list.map(backupRowHTML).join('') : '<div class="empty">' + esc(blank) + '</div>');
}

async function renderBackupsView(){
  $('#lists').innerHTML = '<div class="listcard backupsview"><h3>Backups</h3>' +
    '<p class="help listnote">Every copy of todo.md the board has kept. Click one to read it, ' +
    'or Load it to look through it on the board — Backup Preview opens read-only, so nothing in ' +
    'it can be changed or saved over today\'s list.</p>' +
    '<div id="backupsOut">Loading…</div></div>';
  try {
    const res = await fetch('/backups.json?t=' + Date.now(), { cache:'no-store' });
    if (res.status === 404) {
      $('#backupsOut').innerHTML = '<div class="err"><strong>The board helper needs restarting.</strong><br>' +
        'It is running, but it is an older copy that does not know about backups yet. Save anything ' +
        'unsaved on the board first, then run this in Terminal:<br>' +
        '<code style="display:inline-block; margin-top:7px; font-size:12px">' +
        'lsof -ti tcp:8765 | xargs kill</code><br><br>Then double-click <strong>board.command</strong> again.</div>';
      return;
    }
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const data = await res.json();
    const all = data.backups || [];
    // Weekly ones go by their week label, not their timestamp: a snapshot copied
    // late still belongs to its own week.
    const weekly = all.filter(b => b.kind === 'weekly').sort((x, y) => y.name.localeCompare(x.name));
    const session = all.filter(b => b.kind === 'session');

    /* The archive goes first and on its own. Every other file here is a copy of
       something that still exists; this is the only one holding work that has
       been taken out of the list. */
    const a = data.archive;
    const archive = !a ? '' :
      '<h2>Archived finished work</h2>' +
      '<div class="row">' +
        '<span class="tag">never pruned</span>' +
        '<a class="when" href="' + esc(a.url) + '" target="_blank">' + esc(backupWhen(a.modified)) + '</a>' +
        '<span class="ago">' + esc(backupAgo(a.modified)) + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="name">' + esc(a.name) + '</span>' +
        '<span class="size">' + backupSize(a.bytes) + '</span>' +
      '</div>' +
      '<p class="help" style="margin-top:8px">' + a.sections +
        (a.sections === 1 ? ' batch' : ' batches') +
        ' of tasks that were ticked off more than a month ago and lifted out of todo.md. ' +
        'Nothing is ever removed from this file.</p>';

    $('#backupsOut').innerHTML = archive +
      backupGroupHTML('Weekly snapshots', weekly, 'None yet — the first one is taken the next time the board runs in a new week.') +
      backupGroupHTML('Recent sessions', session, 'None yet — one is taken before the first save of each run.') +
      '<p class="help listnote">This week is ' + esc(data.week) + '. The board keeps the last ' +
        data.keep.session + ' session backups and the last ' + data.keep.weekly +
        ' weekly ones, then deletes the oldest.</p>';

    $('#backupsOut').querySelectorAll('[data-load-url]').forEach(btn => {
      btn.onclick = () => loadBackupPreview(btn.dataset.loadUrl, btn.dataset.loadLabel);
    });
  } catch (err) {
    $('#backupsOut').innerHTML = '<div class="err"><strong>Could not read the backup list.</strong><br>' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* =========================================================================
   4b4. Backup Preview — loading one of the files above straight into the
   board, so it can be looked through the same way as today's list, without
   any risk of it landing back on disk as the live todo.md.

   state.doc becomes the backup's parsed content and state.locked goes true;
   every place that would otherwise write to state.doc (setDone, dropTask,
   addTask, the drawer's field handlers, sub-step edits, headline, archive,
   saveFile, autosave, the outside-edit watcher) checks state.locked first and
   refuses. Exiting always re-fetches todo.md fresh from disk rather than
   restoring anything from memory — simplest, and no live edit can be lost
   from a mode that never allowed any.
   ========================================================================= */
async function loadBackupPreview(url, label){
  if (state.dirty) {
    alert('You have unsaved changes on today\'s list.\n\n' +
          'Save or discard them first, then Load the backup again.');
    return;
  }
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const text = await res.text();
    const doc = parseDoc(text);
    if (!doc.buckets.length) throw new Error('that file has no task buckets in it');
    closeDrawer();
    state.doc = doc;
    state.originalText = text;
    state.fileName = url.split('/').pop();
    state.activeBucket = ALL_BUCKETS;
    state.view = 'board';
    state.locked = true;
    state.demo = false;
    state.lockedLabel = label;
    updateLockUI();
    renderView();
  } catch (err) {
    alert('Could not load that backup.\n\n' + (err.message || err));
  }
}

async function exitBackupPreview(){
  state.locked = false;
  state.lockedLabel = '';
  state.demo = false;
  updateLockUI();
  await loadFile();
}

function updateLockUI(){
  document.body.classList.toggle('locked', state.locked);
  $('#lockFrame').classList.toggle('hidden', !state.locked);
  $('#lockBar').classList.toggle('hidden', !state.locked);
  $('#lockBarKind').textContent = state.demo ? 'Example data' : 'Backup Preview';
  $('#exitLock').textContent = state.demo ? 'Try todo.md again' : 'Return to today\'s list';
  $('#lockBarLabel').textContent = state.locked
    ? 'Viewing ' + state.lockedLabel + ' — nothing here can be edited or saved.'
    : '';
  $('#dataMenu').classList.toggle('hidden', state.locked);
  if (state.locked) $('#datasetMenu').classList.add('hidden');
  else if (state.datasets) $('#datasetMenu').classList.remove('hidden');
  syncLockBarHeight();
}

/* Tell the header how far down to stick. Both it and the bar are sticky at the
   top of the same scroller, so the header needs the bar's height as its offset
   or the two occupy the same strip and the bar, being the higher layer, hides
   the buttons underneath it. Measured rather than assumed: the bar wraps to a
   second line on a narrow window, and the Example data label is longer than the
   Backup Preview one, so no single number is right for both. */
function syncLockBarHeight(){
  const h = state.locked ? $('#lockBar').offsetHeight : 0;
  document.body.style.setProperty('--lockbar-h', h + 'px');
}

/* The bar changes height without the board re-rendering — the window is resized,
   or the label reflows — so remeasure from the element itself rather than only
   at the moments the mode changes. */
if (window.ResizeObserver) {
  new ResizeObserver(syncLockBarHeight).observe($('#lockBar'));
} else {
  window.addEventListener('resize', syncLockBarHeight);
}

$('#exitLock').onclick = exitBackupPreview;

/* =========================================================================
   4c. The matrix: impact against effort
   Tier one drawn as a grid rather than a sorted column. Nine cells, impact up
   the side, effort across the bottom, so the eye reads the shape of the whole
   list at once: how much sits in the expensive corner, whether the cheap
   high-impact cell is actually empty.

   A card per task will not fit — nine cells across one screen means roughly a
   thumbnail each — so a task is one dot, coloured by its bucket. The title is on
   hover and a click opens it, which keeps the grid scannable while losing
   nothing: everything is still one gesture from the real task.
   ========================================================================= */

/* Two tiers say something the scores cannot. A Backlog task has been parked on
   purpose, so however cheap and high impact it is, it is not what he should
   start today — and left on the grid it lands in "Do these first" and argues
   with the decision he already made. It comes off the grid entirely, into its
   own tray, where it is still one click from the card. Quick wins uses the
   same tier for the same reason: Backlog is not a real priority, so it is left
   out there too, not just muted.

   Waiting review is the softer case: the work is done and someone else has it.
   It belongs on the grid, since it still costs what it costs, but the dot is
   faded the way a done card is faded on the board. Anything blocked by an
   unfinished task is faded for the same reason — the grid can rank it, but he
   cannot start it. */
const HELD_TIER  = 'Backlog';
const MATRIX_MUTED_TIER = 'Waiting review';

const MATRIX_IMPACT = ['high', 'med', 'low'];      // top row down
const MATRIX_EFFORT = ['S', 'M', 'L'];             // left column across
const EFFORT_HINT = { S: 'under half a day', M: 'one to three days', L: 'a week or more' };

/* What each cell means, said plainly. The corner cells are the only two that
   need no explanation, and the middle is where lists quietly rot, so it gets the
   bluntest label. */
const CELL_ADVICE = {
  'high/S': 'Do these first',
  'high/M': 'Worth the time',
  'high/L': 'Protect time, or break down',
  'med/S':  'Clear in a gap',
  'med/M':  'Fine, not urgent',
  'med/L':  'Ask for a smaller version',
  'low/S':  'Batch or hand over',
  'low/M':  'Probably not worth it',
  'low/L':  'Cut these'
};

/* No `title` attribute. The browser's own tooltip would appear next to the
   floating preview a second later, saying a worse version of the same thing.
   aria-label still carries it for anyone not using a pointer. */
function matrixDot(t, color){
  const di = dueInfo(t.due);
  const label = [
