   invalidates its own cache when that happens (see runArchive). */
let archiveEntries = null;             // null until the first fetch resolves
let archiveEntriesPromise = null;
let archiveEntriesError = false;

function parseArchiveEntries(text){
  const out = [];
  let bucketName = '', tierName = '';
  text.replace(/\r\n?/g, '\n').split('\n').forEach(line => {
    const h3 = /^###\s+(.*)$/.exec(line);
    if (h3) {
      const parts = h3[1].split(' · ');
      bucketName = (parts[0] || '').trim();
      tierName = (parts[1] || '').trim();
      return;
    }
    if (!TASK_RE.test(line)) return;
    const t = parseTask([line]);
    if (t.done && t.doneOn) out.push({ bucketName, tierName, title: t.title, doneOn: t.doneOn });
  });
  return out;
}

function invalidateArchiveEntries(){
  archiveEntries = null;
  archiveEntriesPromise = null;
  archiveEntriesError = false;
}

/* Returns the cached list once loaded, otherwise kicks off the one fetch and
   returns null. onReady is called when that fetch settles, so the caller can
   re-render — the same lazy pattern renderWrittenReports uses for report
   bodies. */
function archiveEntriesSync(onReady){
  if (archiveEntries) return archiveEntries;
  if (!archiveEntriesPromise) {
    archiveEntriesPromise = fetch('/data/backups/done-archive.md?t=' + Date.now(), { cache:'no-store' })
      .then(res => res.ok ? res.text() : Promise.reject(res.status))
      .then(text => { archiveEntries = parseArchiveEntries(text); })
      .catch(() => { archiveEntries = []; archiveEntriesError = true; })
      .then(onReady);
  }
  return null;
}

/* Every ticked, dated task inside the window, kept with the bucket and tier it
   was in so the breakdown does not need a second walk of the document. Once
   the window reaches past ARCHIVE_DAYS, archived work is merged in too — see
   above — so "sorted newest first" still means the whole period, not just
   whatever is still sitting in todo.md. */
function completedRecently(){
  const out = [];
  const days = reportDays();
  if (state.doc) state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (!t.done || !t.doneOn) return;
    const age = daysSince(t.doneOn);
    if (age == null || age < 0 || age > days) return;
    out.push({ bucketName:b.name, tierName:tier.name, title:t.title, doneOn:t.doneOn, taskId:t.id, age });
  })));
  if (days > ARCHIVE_DAYS) {
    const entries = archiveEntriesSync(() => renderCountedReports());
    (entries || []).forEach(e => {
      const age = daysSince(e.doneOn);
      if (age == null || age < 0 || age > days) return;
      out.push({ bucketName:e.bucketName, tierName:e.tierName, title:e.title, doneOn:e.doneOn, taskId:null, age });
    });
  }
  return out.sort((x, y) => x.age - y.age);
}

/* Ticked but undated. These are real finished work that the count cannot claim,
   because without a date there is no way to say which month it belongs to — so
   they are reported as a gap rather than folded in or ignored. */
function undatedDoneCount(){
  let n = 0;
  if (!state.doc) return n;
  state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (t.done && !t.doneOn) n++;
  })));
  return n;
}

function completedByCategoryReport(){
  const list = completedRecently();

  // Every bucket appears, including the empty ones. A bucket with nothing in it
  // is a finding, and dropping it would hide that. Matched by name rather than
  // by object identity so an archived entry, which has no live bucket to point
  // at, groups the same way a task still in todo.md does.
  const rows = state.doc.buckets.map((b, i) => ({
    name: b.name,
    color: BUCKET_COLOR[i % BUCKET_COLOR.length],
    items: list.filter(it => it.bucketName === b.name)
  }));
  const total = list.length;
  const most = rows.reduce((m, r) => Math.max(m, r.items.length), 0);

  const rowHTML = r => {
    const n = r.items.length;
    const pct = total ? Math.round(n / total * 100) : 0;
    const width = most ? (n / most * 100) : 0;
    // An archived task has no live id to open the drawer with, so it renders
    // as plain text instead of a button.
    const tasks = r.items.map(it =>
      '<li style="--bc:' + r.color + '">' +
        '<span class="dt">' + esc(reportDay(it.doneOn)) + '</span>' +
        (it.taskId
          ? '<button class="tt" data-open="' + it.taskId + '" title="Open this task">' + mdInline(it.title) + '</button>'
          : '<span class="tt archived" title="Archived — no longer in todo.md">' + mdInline(it.title) + '</span>') +
        '<span class="where">' + esc(it.tierName) + '</span>' +
      '</li>').join('');
    return '<div class="bkgroup">' +
        '<div class="row' + (n ? '' : ' zero') + '" style="--bc:' + r.color + '">' +
          '<span class="bkname"><i></i>' + esc(r.name) + '</span>' +
          '<span class="bar"><span style="width:' + width.toFixed(1) + '%"></span></span>' +
          '<span class="n">' + n + '</span>' +
          '<span class="pct">' + (total ? pct + '%' : '—') + '</span>' +
        '</div>' +
        (n ? '<details><summary>Show the ' + n + ' task' + (n === 1 ? '' : 's') + '</summary>' +
             '<ul class="done">' + tasks + '</ul></details>' : '') +
      '</div>';
  };

  const undated = undatedDoneCount();
  // Below 30 days this window sits inside the one archiving leaves alone, so the
  // count is a complete picture by construction. Past it, completeness depends
  // on the archive fetch above: still loading, failed, or in and merged.
  let archiveNote;
  if (reportDays() <= ARCHIVE_DAYS) {
    archiveNote = 'Finished work older than ' + ARCHIVE_DAYS + ' days can be archived out of todo.md. This window ' +
      'stays inside that, so the count above is the whole story for the period.';
  } else if (archiveEntriesError) {
    archiveNote = 'This window reaches past the ' + ARCHIVE_DAYS + '-day point where finished work moves to the ' +
      'archive, and that file could not be read — so the older end of this count may be incomplete.';
  } else if (archiveEntries === null) {
    archiveNote = 'Reading the archive for finished work older than ' + ARCHIVE_DAYS + ' days…';
  } else {
    archiveNote = 'This window reaches past the ' + ARCHIVE_DAYS + '-day point where finished work moves to ' +
      '`data/backups/done-archive.md` — counted in here too, so the total above still covers the whole period.';
  }
  const notes = [
    'Only tasks carrying a `done:` date are counted. The board writes that date when ' +
    'a task is ticked, so anything ticked before that was added is invisible here.',
    archiveNote
  ];
  if (undated) notes.unshift('<strong>' + undated + ' ticked task' + (undated === 1 ? ' has' : 's have') +
    ' no date</strong>, so ' + (undated === 1 ? 'it is' : 'they are') + ' not in the count above.');

  return '<div class="total"><span class="totaln">' + total + '</span>' +
      '<span class="totall">task' + (total === 1 ? '' : 's') + ' finished across ' +
      state.doc.buckets.length + ' categor' + (state.doc.buckets.length === 1 ? 'y' : 'ies') +
      ' <span class="totalw">' + esc(reportWindowLabel()) + '</span></span></div>' +
    (total ? rows.map(rowHTML).join('')
           : '<div class="empty">Nothing has been ticked off with a date ' +
             reportWindowPhrase() + '.</div>') +
    notes.map(n => '<p class="note">' + n + '</p>').join('');
}

/* ---- Weekly pace ----

   A count for one window says how much moved. It says nothing about whether
   that is more or less than usual, and reconstructing that by memory or by
   digging out old reports is exactly the kind of arithmetic this view exists
   to do instead. Eight trailing complete weeks, Monday to Sunday.

   Deliberately its own window rather than tied to the picker above: that one
   answers "how much lately" at whatever grain is asked for, this answers "is
   the pace climbing or flat", and letting one silently resize the other would
   make both harder to read. Reaches past ARCHIVE_DAYS by construction, so it
   reads the archive the same way completedRecently() does. */
const TREND_WEEKS = 8;

/* Which buckets the key has switched off. In memory only: it is a way of
   looking at the chart for a moment, not a setting worth keeping. */
const trendHidden = new Set();

function weekBuckets(n){
  const dow = (today().getDay() + 6) % 7;              // Monday = 0
  const thisMonday = new Date(today() - dow * 86400000);
  const out = [];
  for (let i = n - 1; i >= 0; i--){
    const start = new Date(thisMonday.getTime() - i * 7 * 86400000);
    out.push({ start, end: new Date(start.getTime() + 6 * 86400000) });
  }
  return out;
}

/* Every ticked, dated task's finish date across the trend's own lookback,
   live and archived alike, kept with the bucket it was in — a bar says how
   many, hovering it says which. */
function trendEntries(){
  const from = weekBuckets(TREND_WEEKS)[0].start;
  const out = [];
  if (state.doc) state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (!t.done || !t.doneOn) return;
    const d = parseDue(t.doneOn);
    if (d && d >= from) out.push({ date: d, bucketName: b.name });
  })));
  if (Math.round((today() - from) / 86400000) > ARCHIVE_DAYS) {
    const entries = archiveEntriesSync(() => renderCountedReports());
    (entries || []).forEach(e => {
      const d = parseDue(e.doneOn);
      if (d && d >= from) out.push({ date: d, bucketName: e.bucketName });
    });
  }
  return out;
}

function weeklyTrendReport(){
  const weeks = weekBuckets(TREND_WEEKS);
  const entries = trendEntries();
  // Bucket order and colour match the board's own, so a bucket reads the same
  // colour here as everywhere else. An archived bucket that no longer exists
  // still needs somewhere to go, so anything unmatched is appended, greyed.
  const bucketOrder = state.doc ? state.doc.buckets.map(b => b.name) : [];
  const colorOf = name => {
    const i = bucketOrder.indexOf(name);
    return i > -1 ? BUCKET_COLOR[i % BUCKET_COLOR.length] : 'var(--ink-faint)';
  };

  const weekData = weeks.map(w => {
    const inWeek = entries.filter(e => e.date >= w.start && e.date <= w.end);
    const counts = new Map();
    inWeek.forEach(e => counts.set(e.bucketName, (counts.get(e.bucketName) || 0) + 1));
    const order = bucketOrder.filter(n => counts.has(n))
      .concat([...counts.keys()].filter(n => !bucketOrder.includes(n)));
    return {
      start: w.start, end: w.end, total: inWeek.length,
      breakdown: order.map(n => ({ name: n, n: counts.get(n), color: colorOf(n) }))
    };
  });


  /* One series per bucket, each week's count read back out of that week's
     breakdown. Buckets that no longer exist in the list still finished work in
     this window, so any name the weeks turned up that the board no longer has
     is kept on the end rather than dropped. */
  const seriesNames = bucketOrder.concat(
    [...new Set(weekData.flatMap(w => w.breakdown.map(b => b.name)))].filter(n => !bucketOrder.includes(n))
  );
  const series = seriesNames.map(name => ({
    name, color: colorOf(name), hidden: trendHidden.has(name),
    values: weekData.map(w => (w.breakdown.find(b => b.name === name) || { n: 0 }).n)
  }));
  const shown = series.filter(s => !s.hidden);

  /* Every number on this report counts the buckets currently switched on, not
     all of them. The key hides a line from the chart, and a headline total or a
     pace sentence still describing the hidden ones would contradict the picture
     directly above it. Before the total existed the pace line quietly did that;
     it does not now. */
  const counts = weekData.map((w, i) => shown.reduce((a, sr) => a + sr.values[i], 0));
  const hiddenN = series.length - shown.length;

  const n = weekData.length;
  const W = 700, H = 190, top = 12, base = H - 6;       // viewBox units, scaled to the card's width
  const peak = Math.max(1, ...shown.map(s => Math.max(...s.values)));
  const col = W / n;
  const cx = i => col * (i + 0.5);
  const cy = v => base - (v / peak) * (base - top);
  const f = x => x.toFixed(1);

  /* Both control points sit on the vertical midline between the two weeks
     they join, which keeps every curve inside the pair of values it connects.
     A smooth line can then never dip below zero or invent a peak no week had —
     the shape is decoration, the numbers under it are not. The line runs flat
     out to both edges so the chart fills its box rather than floating in it. */
  const curve = vals => {
    let d = 'M0,' + f(cy(vals[0])) + 'L' + f(cx(0)) + ',' + f(cy(vals[0]));
    for (let i = 1; i < n; i++){
      const mx = f((cx(i - 1) + cx(i)) / 2);
      d += 'C' + mx + ',' + f(cy(vals[i - 1])) + ' ' + mx + ',' + f(cy(vals[i])) +
        ' ' + f(cx(i)) + ',' + f(cy(vals[i]));
    }
    return d + 'L' + W + ',' + f(cy(vals[n - 1]));
  };

  const grid = weekData.map((w, i) =>
    '<line class="trendgrid" x1="' + f(cx(i)) + '" y1="' + top + '" x2="' + f(cx(i)) + '" y2="' + base + '"/>'
  ).join('');
  // Each band fades out downwards so overlapping ones stay readable through
  // each other, which a flat fill at any opacity does not.
  const defs = shown.map((s, i) =>
    '<linearGradient id="tgrad' + i + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0" stop-color="' + s.color + '" stop-opacity=".42"/>' +
      '<stop offset="1" stop-color="' + s.color + '" stop-opacity="0"/>' +
    '</linearGradient>').join('');
  const bands = shown.map((s, i) => {
    const d = curve(s.values);
    return '<path d="' + d + 'L' + W + ',' + base + 'L0,' + base + 'Z" fill="url(#tgrad' + i + ')"/>' +
      '<path class="trendline" d="' + d + '" stroke="' + s.color + '">' +
        '<title>' + esc(s.name) + '</title></path>';
  }).join('');
  /* One point per week per line, on top of the bands: a small dot to see, and
     a bigger transparent circle round it to actually hover — a 3px target is
     real but not a fair one. showTrendPreview reads the count and the week
     straight off these rather than re-deriving them, the same way matrixDot's
     aria-label is written once at render time rather than looked up on hover. */
  const points = shown.map(s =>
    s.values.map((v, i) => {
      const x = f(cx(i)), y = f(cy(v));
      return '<circle class="trenddot" cx="' + x + '" cy="' + y + '" r="2.5" fill="' + s.color + '"/>' +
        '<circle class="trendpt" cx="' + x + '" cy="' + y + '" r="9" tabindex="0"' +
        ' data-trendlabel="' + esc(s.name) + '" data-trendcolor="' + s.color + '"' +
        ' data-trendcount="' + v + '" data-trendweek="' + esc(reportDay(ymd(weekData[i].start))) + '"' +
        ' aria-label="' + esc(s.name) + ', ' + v + ' task' + (v === 1 ? '' : 's') +
        ', week of ' + esc(reportDay(ymd(weekData[i].start))) + '"></circle>';
    }).join('')
  ).join('');

  const chart = '<svg class="trendchart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="Tasks finished per week, one line per bucket">' +
      '<defs>' + defs + '</defs>' + grid + bands + points +
      '<line class="trendbase" x1="0" y1="' + base + '" x2="' + W + '" y2="' + base + '"/>' +
    '</svg>' +
    '<div class="trendx">' + weekData.map((w, i) =>
      '<div class="trendxc' + (i === n - 1 ? ' current' : '') + '">' +
        '<span class="trendwk">' + esc(reportDay(ymd(w.start))) + '</span>' +
        '<span class="trendn">(' + counts[i] + ')</span>' +
      '</div>').join('') + '</div>' +
    '<div class="trendkey">' + series.map(s =>
      '<button class="tkey' + (s.hidden ? ' off' : '') + '" data-trendkey="' + esc(s.name) + '" ' +
        'style="--bc:' + s.color + '" aria-pressed="' + !s.hidden + '" ' +
        'title="Show or hide this bucket"><i></i>' + esc(s.name) + '</button>').join('') + '</div>';

  // Split the run in half and compare the two halves' averages, rather than
  // just the last week against the first — one quiet Friday should not read
  // as a slowdown.
  const half = Math.ceil(weeks.length / 2);
  const recentAvg = counts.slice(-half).reduce((a, b) => a + b, 0) / half;
  const earlierN = weeks.length - half;
  const earlierAvg = earlierN ? counts.slice(0, earlierN).reduce((a, b) => a + b, 0) / earlierN : recentAvg;
  let pace;
  if (recentAvg === 0 && earlierAvg === 0) {
    pace = 'Nothing finished with a date across these ' + weeks.length + ' weeks.';
  } else if (recentAvg > earlierAvg * 1.15) {
    pace = 'Climbing — the last ' + half + ' weeks are ahead of the ' + earlierN + ' before them.';
  } else if (recentAvg < earlierAvg * 0.85) {
    pace = 'Slowing — the last ' + half + ' weeks are behind the ' + earlierN + ' before them.';
  } else {
    pace = 'Flat — the last ' + half + ' weeks are close to the ' + earlierN + ' before them.';
  }
  if (hiddenN) pace += ' ' + hiddenN + ' bucket' + (hiddenN === 1 ? ' is' : 's are') +
    ' hidden, so every number here counts only the rest.';

  return '<h2>Weekly pace</h2>' +
    '<p class="window">Tasks finished per week, Monday to Sunday, over the last ' +
      weeks.length + ' weeks, one line per bucket. The number under each week is its total.</p>' +
    '<div class="trend">' + chart + '</div>' +
    '<p class="note">' + esc(pace) + '</p>';
}

/* ---- Written reports ----

   The counted report above is arithmetic: it can only ever say how many. A
   written report says what moved and what it means, which is a judgement and so
   has to be written rather than derived.

   They are Markdown files in data/reports/, listed by the server at
   /reports.json. Kept as files rather than inside todo.md because a report is
   finished the day it is written, and the list is not — mixing the two would
   mean editing history every time a task changes. data/ rather than anywhere
   else, because a report about this list names people and internal decisions.

   The rules for writing one are in the README, under Reports. The short version
   is that a report never lists tasks. */

/* Body cache, keyed by url. A report never changes once written, so opening the
   same one twice should not go back to the server. */
const reportBodies = {};

/* Enough Markdown for a report and no more: headings, paragraphs, bullets and
   the inline marks mdInline already handles. Anything fancier is not something
   these files are allowed to contain. */
function mdBlocks(text){
  // Frontmatter is metadata for the list, not part of the report.
  const body = text.replace(/^---\n[\s\S]*?\n---\n/, '');
  const out = [];
  let para = [], list = null;
  const flushPara = () => { if (para.length) { out.push('<p>' + mdInline(para.join(' ')) + '</p>'); para = []; } };
  const flushList = () => { if (list) { out.push('<ul class="repbul">' + list.join('') + '</ul>'); list = null; } };
  body.split('\n').forEach(raw => {
    const line = raw.trim();
    if (!line) { flushPara(); flushList(); return; }
    const h = /^(#{1,4})\s+(.*)$/.exec(line);
    if (h) {
      flushPara(); flushList();
      // The h1 is the report's own title, which the list already shows above it.
      if (h[1].length > 1) out.push('<h4>' + mdInline(h[2]) + '</h4>');
      return;
    }
    const b = /^[-*]\s+(.*)$/.exec(line);
    if (b) { flushPara(); (list = list || []).push('<li>' + mdInline(b[1]) + '</li>'); return; }
    flushList();
    para.push(line);
  });
  flushPara(); flushList();
  return out.join('');
}

/* The closed state is the list's whole job: title, date and standfirst are
   enough to say what a report found without opening it. Opening it is a
   separate choice — see openReportModal. */
function reportItemHTML(r){
  const when = [r.covers ? 'Covers ' + esc(r.covers) : '', r.topic ? esc(r.topic) : '']
    .filter(Boolean).join(' · ');
  return '<article class="repitem" data-report="' + esc(r.url) + '">' +
    '<button class="rephead" data-report-open="' + esc(r.url) + '">' +
      '<span class="reptitle">' + esc(r.title) + '</span>' +
      (r.date ? '<span class="repdate">' + esc(r.date) + '</span>' : '') +
    '</button>' +
    (when ? '<div class="repmeta">' + when + '</div>' : '') +
    (r.summary ? '<div class="repsum">' + mdInline(r.summary) + '</div>' : '') +
  '</article>';
}

/* A written report is a document, and a document wants a document's width —
   not 600 words read down this column's narrow gutter. Opens in showModal's
   wide variant instead of expanding inside its own card.

   Lazy and cached: the body is only fetched the first time a report is
   opened, and never again after that, since a written report never changes
   once it exists. */
function openReportModal(r){
  const when = [r.covers ? 'Covers ' + esc(r.covers) : '', r.topic ? esc(r.topic) : '']
    .filter(Boolean).join(' · ');
  const sub = [r.date ? esc(r.date) : '', when].filter(Boolean).join(' · ');
  showModal(r.title, sub,
    '<div class="repdoc">' + (reportBodies[r.url] || '<p class="empty">Loading…</p>') + '</div>',
    [{ label:'Close', primary:true }], { wide:true });
  if (!reportBodies[r.url]) loadReportBody(r.url);
}

async function loadReportBody(url){
  let html;
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    html = mdBlocks(await res.text());
    reportBodies[url] = html;
  } catch (err) {
    html = '<div class="err">Could not read that report. ' + esc(String(err.message || err)) + '</div>';
  }
  // The modal may have been closed, or moved on to a different report, while
  // this was in flight — write back only if it is still the one showing.
  const mid = modalEl && modalEl.querySelector('.mid .repdoc');
  if (mid) mid.innerHTML = html;
}

async function renderWrittenReports(){
  const out = $('#writtenOut');
  if (!out) return;
  try {
    const res = await fetch('/reports.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) {
      out.innerHTML = '<div class="err"><strong>The board helper needs restarting.</strong><br>' +
        'It is running, but it is an older copy that does not know about reports yet.</div>';
      return;
    }
    const list = (await res.json()).reports || [];
    if (!list.length) {
      out.innerHTML = '<div class="empty">Nothing written yet. Reports are Markdown files in ' +
        '<code>data/reports/</code>, and asking Claude for one is how they get there.</div>';
      return;
    }
    out.innerHTML = list.map(reportItemHTML).join('');
    out.querySelectorAll('[data-report-open]').forEach(btn => {
      const r = list.find(x => x.url === btn.dataset.reportOpen);
      btn.onclick = () => openReportModal(r);
    });
  } catch (err) {
    out.innerHTML = '<div class="err">Could not read the report list. ' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* Two columns, because the two kinds of report answer different questions and
   neither is a footnote to the other. Counted on the left, written on the right. */
function renderReportsView(){
  if (!state.doc) {
    $('#lists').innerHTML = '<div class="listcard reportsview"><h3>Reports</h3>' +
      '<div class="empty">No file loaded yet.</div></div>';
    return;
  }
  $('#lists').innerHTML =
    '<div class="lists rview">' +
      '<div class="listcard reportsview"><h3>Counted from the list</h3>' +
        '<label class="repwindow">Show ' + reportWindowSelectHTML() +
          '<span class="repdates" id="repDates">' + esc(reportDateRange()) + '</span></label>' +
        '<div id="countedOut"></div>' +
      '</div>' +
      '<div class="listcard reportsview written"><h3>Written reports</h3>' +
        '<p class="help listlead">What moved and what it means, rather than what was ticked. ' +
        'Ask Claude for one and it lands in the <code>data/reports/</code> folder.</p>' +
        '<div id="writtenOut">Loading…</div>' +
      '</div>' +
    '</div>';
  renderCountedReports();
  $('#reportWindow').onchange = e => {
    if (setReportWindow(e.target.value)) {
      renderCountedReports();
      $('#repDates').textContent = reportDateRange();
    }
  };
  renderWrittenReports();
}

/* The span the picker is currently showing. "All" has no start date to name —
   the earliest thing counted is whatever the archive happens to still hold, and
   that is not known until it has loaded — so it says what it is instead of
   printing a date that would be wrong for the first second and misleading after. */
function reportDateRange(){
  if (reportWindow === 'all') return 'everything still on record';
  return reportDay(ymd(reportWindowStart())) + '–' + reportDay(ymd(today()));
}

function reportWindowSelectHTML(){
  return '<select id="reportWindow" title="How far back to count">' +
    REPORT_WINDOWS.map(w => '<option value="' + w.id + '"' + (w.id === reportWindow ? ' selected' : '') + '>' +
      esc(w.label) + '</option>').join('') +
  '</select>';
}
// Its own render path rather than folded into renderReportsView, so changing
// the window redraws only the counted card — not the written one beside it,
// which would otherwise re-fetch /reports.json for no reason.
function renderCountedReports(){
  const out = $('#countedOut');
  if (!out) return;
  out.innerHTML = reportDefs().map(fn => fn()).join('');
}

/* =========================================================================
   4b2b. Plans — what the nightly agent worked out while nobody was watching.

   Files in data/<dataset>/plans/<night>/, listed by the server at /plans.json,
   read exactly the way written reports are. They are a separate view rather
   than a third column in Reports because they answer the opposite question: a
   report says what happened, a plan proposes what to do, and a plan stops being
   true the moment it is acted on.

   Three states, and the difference between the last two matters:

     unread    nobody has looked at it
     read      looked at, doing nothing about it yet
     actioned  acted on, so it no longer describes outstanding work

   Marking one actioned is the only write in here, and it writes the plan file.
   The runner's ledger picks it up and plans that task afresh on the next run,
   which is how a task he has moved on gets a new plan instead of being skipped
   for looking unchanged. Nothing in this view goes near todo.md.
   ========================================================================= */

const planBodies = {};
let planList = [];

function planItemHTML(p){
  const meta = [p.bucket, p.column, p.night].filter(Boolean).map(esc).join(' · ');
  const cls = p.status === 'actioned' ? ' actioned' : (p.status === 'read' ? ' read' : '');
  return '<article class="repitem' + cls + '" data-plan="' + esc(p.url) + '">' +
    '<button class="rephead" data-plan-open="' + esc(p.url) + '">' +
      '<span class="reptitle">' + esc(p.title) + '</span>' +
      '<span class="repdate">' + esc(p.status === 'unread' ? 'new' : p.status) + '</span>' +
    '</button>' +
    (meta ? '<div class="repmeta">' + meta + '</div>' : '') +
    (p.summary ? '<div class="repsum">' + mdInline(p.summary) + '</div>' : '') +
  '</article>';
}

/* Opening one marks it read, on the grounds that having it open is what being
   read means. Actioned stays a deliberate press, because that is a claim about
   the work rather than about him, and it is the one the runner acts on. */
function openPlanModal(p){
  const sub = [p.bucket, p.column, p.night, p.agent].filter(Boolean).map(esc).join(' · ');
  showModal(p.title, sub,
    '<div class="repdoc">' + (planBodies[p.url] || '<p class="empty">Loading…</p>') + '</div>',
    [{ label:'Mark actioned', run: () => setPlanStatus(p, 'actioned') },
     { label:'Close', primary:true }], { wide:true });
  if (!planBodies[p.url]) loadPlanBody(p.url);
  if (p.status === 'unread') setPlanStatus(p, 'read', true);
}

async function loadPlanBody(url){
  let html;
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    html = mdBlocks(await res.text());
    planBodies[url] = html;
  } catch (err) {
    html = '<div class="err">Could not read that plan. ' + esc(String(err.message || err)) + '</div>';
  }
  const mid = modalEl && modalEl.querySelector('.mid .repdoc');
  if (mid) mid.innerHTML = html;
}

/* `quiet` is the read-on-open case: it should not redraw the list underneath an
   open modal, which would be a card shuffling itself while he is reading it. */
async function setPlanStatus(p, status, quiet){
  try {
    const res = await fetch('/plan/status', {
      method:'POST',
      headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
      body: JSON.stringify({ night: p.night, name: p.name, status })
    });
    if (!res.ok) throw new Error(res.status);
    p.status = status;
    if (!quiet) renderPlansList();
  } catch (err) {
    if (!quiet) showToast('Could not mark that plan: ' + (err.message || err), 'bad');
  }
}

function renderPlansList(){
  const out = $('#plansOut');
  if (!out) return;
  const live = planList.filter(p => p.status !== 'actioned');
  const done = planList.filter(p => p.status === 'actioned');
  out.innerHTML =
    (live.length ? live.map(planItemHTML).join('')
                 : '<div class="empty">Nothing waiting. Everything written has been actioned.</div>') +
    (done.length ? '<details><summary>' + done.length + ' actioned</summary>' +
                   done.map(planItemHTML).join('') + '</details>' : '');
  out.querySelectorAll('[data-plan-open]').forEach(btn => {
    const p = planList.find(x => x.url === btn.dataset.planOpen);
    btn.onclick = () => openPlanModal(p);
  });
}

/* -------------------------------------------------------------------------
   The queue — what tonight would plan, and the one place to change it.

   Nothing here is scheduled or stored. /queue.json is pick.select() run
   against todo.md this second, the same call the runner makes at 02:00, so
   the column cannot drift from what actually happens and there is no queued
   batch to go stale. Tick a task off and it leaves the list on the next
   render.

   What a drag writes is only the ordering, to plans/queue-order.json. The
   order matters because the batch stops on a budget, on a window floor or on
   a usage limit: the front of this list is the part that reliably gets
   planned, and the back is the part that might not. Holding a card back is
   the other half of the same control — it is the only way to say "not this
   one" without editing todo.md, which this view must never do.

   Neither the order nor the hold list decides what the queue contains. Every
   rule in nightly/pick.py still does that. A title in the file that has since
   been ticked off, blocked or renamed is simply never matched, which is why
   nothing here ever needs pruning.
   ------------------------------------------------------------------------- */

let queueRows = [];      // what tonight would plan, in order
let queueHeld = [];      // deliberately held back
let queueSkipped = [];   // dropped by a rule, with the reason
let queueOrder = [];     // the stored ordering, so held ranks survive a save
let queueDrag = null;

function queueItemHTML(r, i){
  const meta = [r.bucket, r.column, r.agent].filter(Boolean).map(esc).join(' · ');
  const held = r.state === 'held';
  return '<article class="qitem' + (held ? ' held' : '') + '"' +
      (held ? '' : ' draggable="true"') + ' data-qi="' + i + '">' +
    '<div class="qhead">' +
      '<span class="qpos">' + (held ? '—' : r.position) + '</span>' +
      '<span class="qtitle">' + esc(r.title) + '</span>' +
      '<button class="qhold" data-qhold="' + i + '" title="' +
        (held ? 'Put it back in the queue' : 'Hold it back from tonight') + '">' +
        (held ? 'Release' : 'Hold') + '</button>' +
    '</div>' +
    (meta ? '<div class="repmeta">' + meta + '</div>' : '') +
    '<div class="qwhy">' + esc(r.why || '') +
      (r.last ? ' · last planned ' + esc(r.last) : '') + '</div>' +
  '</article>';
}

function renderQueueList(){
  const out = $('#queueOut');
  if (!out) return;
  out.innerHTML =
    (queueRows.length
      ? queueRows.map((r, i) => queueItemHTML(r, i)).join('')
      : '<div class="empty">Nothing to plan tonight. Everything eligible has a ' +
        'plan already, and none of them have changed since.</div>') +
    (queueHeld.length
      ? '<details open class="qfold"><summary>' + queueHeld.length + ' held back</summary>' +
        queueHeld.map((r, i) => queueItemHTML(r, queueRows.length + i)).join('') + '</details>'
      : '') +
    (queueSkipped.length
      ? '<details class="qfold"><summary>' + queueSkipped.length + ' not eligible</summary>' +
        queueSkipped.map(r =>
          '<div class="qskip"><span>' + esc(r.title) + '</span><em>' + esc(r.why) + '</em></div>'
        ).join('') + '</details>'
      : '');
  wireQueue();
}

/* One list of rows across both arrays, indexed the way the DOM is, so a drag
   and a hold press can name a card without caring which half it is in. */
function queueAt(i){
  return i < queueRows.length ? queueRows[i] : queueHeld[i - queueRows.length];
}

function wireQueue(){
  const out = $('#queueOut');
  out.querySelectorAll('[data-qhold]').forEach(btn => {
    btn.onclick = e => { e.stopPropagation(); toggleHold(+btn.dataset.qhold); };
  });

  /* The same reorder gesture the sub-steps in the drawer use: drop above or
     below whichever card the cursor is over, decided by its midpoint. Held
     cards are not draggable — a held card has no position to hold. */
  const rows = out.querySelectorAll('.qitem:not(.held)');
  const clear = () => rows.forEach(r => r.classList.remove('over-top','over-bottom','dragging'));
  rows.forEach(row => {
    row.ondragstart = e => {
      queueDrag = +row.dataset.qi;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', 'queue');
      row.classList.add('dragging');
    };
    row.ondragend = () => { queueDrag = null; clear(); };
    row.ondragover = e => {
      if (queueDrag === null) return;
      e.preventDefault();
      const r = row.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      row.classList.toggle('over-bottom', after);
      row.classList.toggle('over-top', !after);
    };
    row.ondragleave = () => row.classList.remove('over-top','over-bottom');
    row.ondrop = e => {
      if (queueDrag === null) return;
      e.preventDefault(); e.stopPropagation();
      const r = row.getBoundingClientRect();
      let to = +row.dataset.qi + (e.clientY > r.top + r.height / 2 ? 1 : 0);
      const from = queueDrag;
      queueDrag = null; clear();
      if (to > from) to--;
      if (to === from) return;
      queueRows.splice(to, 0, queueRows.splice(from, 1)[0]);
      queueRows.forEach((row, i) => { row.position = i + 1; });
      renderQueueList();
      saveQueueOrder();
    };
  });
}

function toggleHold(i){
  const row = queueAt(i);
  if (!row) return;
  if (row.state === 'held') {
    row.state = 'queued';
    queueHeld.splice(queueHeld.indexOf(row), 1);
    queueRows.push(row);
  } else {
    row.state = 'held';
    row.why = 'held back from the board';
    queueRows.splice(queueRows.indexOf(row), 1);
    queueHeld.push(row);
  }
  queueRows.forEach((r, n) => { r.position = n + 1; });
  renderQueueList();
  saveQueueOrder();
}

/* Titles the server has stored but that are not on screen — held cards from an
   earlier session, tasks blocked this week — are carried through rather than
   dropped, so releasing one later puts it back where it was rather than at the
   end of the queue. */
async function saveQueueOrder(){
  const norm = t => String(t || '').trim().toLowerCase();
  const shown = queueRows.map(r => r.title);
  const seen = new Set(shown.map(norm));
  const order = shown.concat(queueOrder.filter(t => !seen.has(norm(t))));
  const hold = queueHeld.map(r => r.title);
  try {
    const res = await fetch('/queue/order', {
      method:'POST',
      headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
      body: JSON.stringify({ order, hold })
    });
    if (!res.ok) throw new Error(res.status);
    queueOrder = order;
  } catch (err) {
    showToast('Could not save the queue order: ' + (err.message || err), 'bad');
  }
}

async function renderQueue(){
  const out = $('#queueOut');
  if (!out) return;
  try {
    const res = await fetch('/queue.json?t=' + Date.now(), { cache:'no-store' });
    if (res.status === 404) {
      out.innerHTML = '<div class="empty">No nightly agent in this checkout, so there is ' +
        'nothing queued and nothing to order.</div>';
      return;
    }
    if (!res.ok) {
      out.innerHTML = '<div class="err"><strong>The board helper needs restarting.</strong><br>' +
        'It is running, but it is an older copy that does not know about the queue yet.</div>';
      return;
    }
    const q = await res.json();
    queueRows = q.queue || [];
    queueHeld = q.held || [];
    queueSkipped = q.skipped || [];
    queueOrder = q.order || [];
    renderQueueList();
  } catch (err) {
    out.innerHTML = '<div class="err">Could not read the queue. ' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* -------------------------------------------------------------------------
   In flight — the run happening right now, or the last one that happened.

   Read from the lock directory and the log, which is the only honest way: the
   agents are subprocesses of a shell launchd started, and nothing here can ask
   them anything. One card, because plan.py runs its agents strictly one at a
   time, which is a deliberate choice rather than a limitation — a runaway
   agent then costs one timeout rather than the whole night.
   ------------------------------------------------------------------------- */

let flightTimer = null;

function flightRowHTML(r, kind){
  return '<div class="frow ' + kind + '">' +
    '<span class="fname">' + esc(r.title) + '</span>' +
    '<span class="fmeta">' + esc(
      kind === 'done' ? r.took + 's · $' + r.cost.toFixed(2) : (r.why || '')
    ) + '</span>' +
  '</div>';
}

function renderFlight(n){
  const out = $('#flightOut');
  if (!out) return;
  const when = s => s ? esc(s.slice(11, 16)) : '';
  let html = '';

  if (n.live && n.current) {
    html += '<div class="fnow"><i class="fspin"></i>' +
      '<div><strong>' + esc(n.current.title) + '</strong>' +
      '<div class="repmeta">' + esc(n.current.agent) + ' · started ' +
      when(n.current.since) + '</div></div></div>';
  } else if (n.live) {
    html += '<div class="fnow"><i class="fspin"></i><div><strong>A run is going</strong>' +
      '<div class="repmeta">between tasks — nothing in flight this second</div></div></div>';
  } else if (n.orphan) {
    html += '<div class="err">The last run stopped part way through <strong>' +
      esc(n.orphan.title) + '</strong> and never finished. Its lock is gone, so ' +
      'nothing is running now.</div>';
  } else {
    html += '<div class="fidle">Nothing running. The next wake is on the hour, ' +
      'and it plans only if a usage window allows it.</div>';
  }

  if (n.started) {
    html += '<dl class="schedmeta"><dt>Run started</dt><dd>' +
      esc(n.started.slice(0, 16)) + '</dd>' +
      '<dt>Planned</dt><dd>' + n.done.length +
      (n.toPlan ? ' of ' + n.toPlan : '') + '</dd>' +
      (n.left ? '<dt>Left</dt><dd>' + n.left + '</dd>' : '') +
      '</dl>';
  }
  if (n.stopped) html += '<p class="fstop">' + esc(n.stopped) + '</p>';

  /* Only when nothing is going. run.sh holds a lock and would refuse a second
     batch anyway, but it refuses by logging and exiting cleanly, which from a
     button looks exactly like starting — so the button is not offered rather
     than offered and quietly ignored. */
  if (!n.live) {
    html += '<button class="btn frun" id="runNight">Run the agent now</button>';
  }
  if (n.done.length) {
    const spent = n.done.reduce((a, d) => a + d.cost, 0);
    html += '<h4 class="fhead">Written this run — $' + spent.toFixed(2) + '</h4>' +
      n.done.map(d => flightRowHTML(d, 'done')).join('');
  }
  if (n.failed.length) {
    html += '<h4 class="fhead">Failed</h4>' +
      n.failed.map(d => flightRowHTML(d, 'failed')).join('');
  }
  if (!n.started) {
    html += '<p class="help">The log has nothing since the last run started. ' +
      'A wake that found no window logs its reason and stops without starting one.</p>';
  }
  out.innerHTML = html;
  const btn = $('#runNight');
  if (btn) btn.onclick = () => confirmNightlyRun();
}

/* Spending money is a deliberate press and then a second one. The confirm says
   what it will cost and what it will do, because "run the agent" does not
   convey either — and the one thing worth being clear about is that it plans
   and never executes, which is true of the agent whatever hour it runs at. */
function confirmNightlyRun(){
  const n = queueRows.length;
  showModal('Run the nightly agent now?', 'It normally waits for the small hours',
    '<div class="repdoc">' +
      '<p>' + (n ? 'It will work through the <strong>' + n + '</strong> task' +
        (n === 1 ? '' : 's') + ' in the queue, in that order, one agent each'
        : 'There is nothing in the queue, so it will start and stop') +
      ', and write a plan for each into the Written plans column.</p>' +
      '<p>Up to <strong>$12</strong> across the batch and <strong>$2</strong> a task, ' +
      'stopping early if either runs out. It ignores the clock and the usage window, ' +
      'so it will spend in whatever window is open now — including the one you are ' +
      'working in.</p>' +
      '<p>Nothing it writes is carried out. Every plan waits for you.</p>' +
    '</div>',
    [{ label:'Run it', primary:true, run: startNightlyRun },
     { label:'Cancel' }]);
}

async function startNightlyRun(){
  try {
    const res = await fetch('/nightly/run', {
      method:'POST', headers: { 'Content-Type':'application/json', 'X-Board':'1' }
    });
    const got = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(got.error || res.status);
    showToast('The agent is running. Watch it here.', 'good');
    // The log gets its first line within a second or two; the poll's own ten
    // seconds is too long to wait when you have just pressed the button.
    setTimeout(renderNightly, 1200);
  } catch (err) {
    showToast('Could not start it: ' + (err.message || err), 'bad');
  }
}

/* Polls while the tab is on Plans and stops the moment it is not. Faster while
   a run is live, because that is the only time anything moves; an agent takes
   minutes, so ten seconds is frequent enough to watch and rare enough to
   ignore. */
async function renderNightly(){
  clearTimeout(flightTimer);
  const out = $('#flightOut');
  if (!out) return;
  let live = false;
  try {
    const res = await fetch('/nightly.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error(res.status);
    const n = await res.json();
    live = !!n.live;
    renderFlight(n);
  } catch (err) {
    out.innerHTML = '<div class="err">Could not read the run log. ' +
      esc(String(err.message || err)) + '</div>';
  }
  flightTimer = setTimeout(() => {
    if (state.view === 'plans' && $('#flightOut')) renderNightly();
  }, live ? 10000 : 60000);
}

/* =========================================================================
   4b2c. Schedule — what runs on a clock, and what the usage windows are doing.

   Three things around this app run on a schedule rather than on demand: the
   nightly prep agent's twelve launchd wakes, the companion's morning briefing,
   and the weekly backup thread inside this server. Until this view they were
   three separate places to go and look, and "did the nightly job actually run"
   had no answer short of reading a log.

   A list rather than a calendar, deliberately. Twelve wakes a night render as
   noise on a grid and as one line in a list.

   Two sources behind it, and they are not alternatives — the server's
   schedule_listing() explains why. Live says whether a job is armed and when it
   fires next; the log says what it actually did.

   The second half is the usage windows, which have no other home. The nightly
   agent's whole schedule is built around them, and until now the only way to
   see one was to run core/windows.py at a terminal.
   ========================================================================= */

function schedRow(j){
  const dot = j.armed ? 'on' : 'off';
  const when = j.next ? new Date(j.next) : null;
  return '<article class="schedjob">' +
    '<div class="schedhead">' +
      '<i class="dot ' + dot + '"></i>' +
      '<span class="schedname">' + esc(j.name) + '</span>' +
      '<span class="schedstate ' + dot + '">' + esc(j.state) + '</span>' +
    '</div>' +
    '<p class="schedwhat">' + esc(j.what) + '</p>' +
    '<dl class="schedmeta">' +
      '<dt>Runs</dt><dd>' + esc(j.schedule || '—') + '</dd>' +
      '<dt>Next</dt><dd>' + (when ? esc(when.toLocaleString([], {
          weekday:'short', day:'numeric', month:'short',
          hour:'2-digit', minute:'2-digit' })) : '—') + '</dd>' +
      '<dt>Last</dt><dd>' + esc(j.last || '—') + '</dd>' +
    '</dl>' +
    (j.hint ? '<p class="schedhint">Not armed. To start it:<code>' + esc(j.hint) + '</code></p>' : '') +
    (j.recent && j.recent.length
      ? '<details class="schedlog"><summary>Recent</summary><pre>' +
        j.recent.map(esc).join('\n') + '</pre></details>' : '') +
  '</article>';
}

/* Tokens are shown in millions throughout. The raw figures run to hundreds of
   millions and nothing here is a number he does arithmetic on — it is a
   comparison between windows, which is what the bar is for. */
function tokM(n){ return (n / 1e6).toFixed(n >= 1e8 ? 0 : 1) + 'M'; }

/* Past a billion, "3043M" is a number nobody reads. The weekly line crosses
   that within a fortnight of normal use, so it gets its own unit. */
function tokBig(n){
  if (n < 1) return '0';          // "0.0M" on an axis is three characters of noise
  return n >= 1e9 ? (n / 1e9).toFixed(n >= 1e10 ? 0 : 1) + 'B' : tokM(n);
}

/* -------------------------------------------------------------------------
   The usage chart — both series as a share of their ceiling, one axis.

   Each five-hour session is a vertical line at the time it opened, and the
   rolling seven-day total is a line across them. Percentages rather than raw
   tokens, because a weekly total and a single session are different sizes of
   number and one raw axis flattens the sessions into the floor. As shares of
   their own ceiling they sit on one axis and can be read against each other,
   which is the whole point of the pairing.

   Where the ceiling comes from is the part worth knowing, and the card says it
   out loud rather than implying an authority it does not have. Nothing on this
   machine is told what the allowance is: core/windows.py reconstructs what each
   window spent, and the error a real limit returns names the reset time and not
   the ceiling. So until a run is actually refused — at which point plan.py
   writes what the window had spent into window.json, and that becomes a
   measured floor under the real allowance — 100% is the heaviest session seen
   in the period. That still answers "is today unusual", which is the question
   being asked, and it stops pretending to answer "how much is left".

   The week never has a measured source. Nothing here has any notion of a weekly
   allowance at all, so it is always against the busiest seven days seen.
   ------------------------------------------------------------------------- */

function usageChart(u){
  const wins = u.windows || [];
  const roll = u.rolling || [];
  const cap = u.ceiling || {};
  if (!wins.length || !cap.session) return '';

  /* Sized close to the column it sits in rather than to a round number. It
     scales to fit either way, but text scales with it, and a 660-wide box in a
     380-wide column renders 10px labels at six. */
  const W = 400, H = 190, L = 30, R = 12, T = 14, B = 22;
  const x0 = L, x1 = W - R, y0 = T, y1 = H - B;

  const t = s => new Date(s).getTime();
  // Noon, so a day's point sits in the middle of the day it is about rather
  // than on the boundary between two.
  const dayT = s => new Date(s + 'T12:00:00').getTime();

  const tMin = t(wins[0].start);
  const tMax = Math.max(Date.now(), t(wins[wins.length - 1].end));
  const px = ms => x0 + (ms - tMin) / (tMax - tMin || 1) * (x1 - x0);

  /* One axis, 0 to 100, and a session can exceed its own ceiling only when the
     ceiling is measured and an older window was heavier — so the scale runs to
     whichever is larger and the 100% rule stays where it belongs. */
  const pctS = w => w.tok / cap.session * 100;
  const pctR = r => r.tok / (cap.week || 1) * 100;
  const top = Math.max(100, ...wins.map(pctS), ...roll.map(pctR));
  const py = v => y1 - v / top * (y1 - y0);

  let grid = '';
  for (const v of [0, 50, 100]) {
    grid +=
      '<line class="ugrid' + (v === 100 ? ' cap' : '') + '" x1="' + x0 + '" y1="' +
        py(v).toFixed(1) + '" x2="' + x1 + '" y2="' + py(v).toFixed(1) + '"/>' +
      '<text class="uaxl y" x="' + (x0 - 5) + '" y="' + (py(v) + 3.2).toFixed(1) + '">' +
        v + '%</text>';
  }

  /* Each session is its own vertical line, standing where it opened. They are
     discrete five-hour events rather than a continuous quantity, and joining
     them into a curve draws slopes between windows that never existed. */
  const bars = wins.map(w =>
    '<line class="ubarv' + (w.night ? ' night' : '') + (w.open ? ' live' : '') +
      '" x1="' + px(t(w.start)).toFixed(1) + '" y1="' + py(0).toFixed(1) +
      '" x2="' + px(t(w.start)).toFixed(1) + '" y2="' + py(pctS(w)).toFixed(1) + '"/>'
  ).join('');

  const rPts = roll.map(r => px(dayT(r.day)).toFixed(1) + ',' + py(pctR(r)).toFixed(1));

  // Four date ticks, evenly spaced across the range rather than on round
  // dates — the range is thirty days and never starts on a Monday.
  let ticks = '';
  for (let i = 0; i <= 3; i++) {
    const ms = tMin + (tMax - tMin) * i / 3;
    ticks += '<text class="uaxl d" x="' + px(ms).toFixed(1) + '" y="' + (y1 + 13) + '">' +
      esc(new Date(ms).toLocaleDateString([], { day:'numeric', month:'short' })) + '</text>';
  }

  const nowX = px(Date.now()).toFixed(1);
  const measured = cap.source === 'measured';

  return '<div class="uchart">' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
      'aria-label="Each five-hour session and the rolling seven-day total, as a ' +
      'share of their ceiling">' +
      grid + ticks + bars +
      (rPts.length > 1 ? '<polyline class="uline r" points="' + rPts.join(' ') + '"/>' : '') +
      '<line class="unow" x1="' + nowX + '" y1="' + y0 + '" x2="' + nowX + '" y2="' + py(0).toFixed(1) + '"/>' +
    '</svg>' +
    '<div class="ukey">' +
      '<span class="k s">Five-hour session</span>' +
      '<span class="k n">Opened in the night</span>' +
      (rPts.length > 1 ? '<span class="k r">Rolling seven days</span>' : '') +
    '</div>' +
    /* One line, not a paragraph. A percentage axis with an unstated denominator
       says nothing, so what 100% is has to be on the card — but which of the
       two sources it came from is the only part that needs saying, and it fits
       in a word. */
    '<p class="ucap">100% = <b>' + esc(tokBig(cap.session)) + '</b> session' +
      (measured ? ' <em>measured at a limit' +
        (cap.measuredAt ? ', ' + esc(cap.measuredAt) : '') + '</em>' : '') +
      ' · <b>' + esc(tokBig(cap.week)) + '</b> week' +
      (measured ? '' : ' <em>heaviest in ' + u.days + ' days</em>') +
    '</p>' +
  '</div>';
}

function usageRow(w, peak){
  const a = new Date(w.start), b = new Date(w.end);
  const hm = d => String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  return '<div class="urow' + (w.open ? ' live' : '') + (w.night ? ' night' : '') + '">' +
    '<span class="uday">' + esc(a.toLocaleDateString([], { weekday:'short', day:'numeric', month:'short' })) + '</span>' +
    '<span class="uspan">' + hm(a) + '–' + hm(b) + '</span>' +
    '<span class="ubar"><span style="width:' + Math.max(1, Math.round(w.tok / peak * 100)) + '%"></span></span>' +
    '<span class="utok">' + tokM(w.tok) + '</span>' +
  '</div>';
}

async function renderUsage(){
  const out = $('#usageOut');
  if (!out) return;
  try {
    const res = await fetch('/usage.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const u = await res.json();
    if (!u.available) {
      out.innerHTML = '<div class="empty">No <code>core/windows.py</code> in this checkout, ' +
        'so there is nothing to read the usage windows with.</div>';
      return;
    }
    const wins = u.windows.slice().reverse();
    const peak = Math.max(1, ...wins.map(w => w.tok));
    const nights = u.windows.filter(w => w.night).length;

    /* The decision line first, because it is the one thing here that answers a
       question about tonight rather than about the past: would the agent spend
       right now, and why not. */
    out.innerHTML =
      '<div class="udecide ' + esc(u.decision.action) + '">' +
        '<strong>' + esc(u.decision.action.toUpperCase()) + '</strong> — ' + esc(u.decision.why) +
      '</div>' +
      /* The five-hour rule, the 07:00 boundary and the 02:00 cutoff used to be
         spelled out here in a paragraph. They are in nightly/README.md, and the
         decision line above already says what they add up to tonight. */
      usageChart(u) +
      '<div class="ustats">' +
        '<span><b>' + u.windows.length + '</b> windows in ' + u.days + ' days</span>' +
        '<span><b>' + tokM(u.median) + '</b> median</span>' +
        '<span><b>' + tokM(u.p90) + '</b> p90</span>' +
        '<span><b>' + nights + '</b> started in the night</span>' +
      '</div>' +
      /* The rows are still here, one per window, but folded. They read as a
         log, which is the wrong shape for "is this getting better" and the
         right one for "what happened on Tuesday". */
      '<details class="ufold"><summary>Every window, newest first</summary>' +
        '<div class="ulist">' + wins.map(w => usageRow(w, peak)).join('') + '</div>' +
      '</details>';
  } catch (err) {
    out.innerHTML = '<div class="err">Could not read the usage windows. ' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* =========================================================================
   4b3. Backups — every copy of todo.md the board has kept, read from the same
   /backups.json the old standalone backups.html used. Fetched fresh each time
   the tab is opened, since a backup can land at any moment.
   ========================================================================= */
function backupSize(n){
  return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 102400 ? 1 : 0) + ' KB';
}

/* "3 days ago" is what tells him whether a copy is worth opening. The exact
   timestamp is there too, because for a backup the exact moment is the point. */
function backupAgo(iso){
  const then = new Date(iso), mins = Math.round((Date.now() - then) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return mins + ' minutes ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs === 1 ? 'an hour ago' : hrs + ' hours ago';
  const days = Math.round(hrs / 24);
  if (days < 7) return days === 1 ? 'yesterday' : days + ' days ago';
  const wks = Math.round(days / 7);
  return wks === 1 ? 'last week' : wks + ' weeks ago';
}

function backupWhen(iso){
  return new Date(iso).toLocaleString(undefined, {
    weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
  });
}

/* The week label is in the file name, and it is more use than the file name. */
function backupWeekOf(name){
  const m = /week-(\d{4})-W(\d{2})/.exec(name);
  return m ? 'Week ' + m[2] + ', ' + m[1] : null;
}

function backupRowHTML(b){
  const wk = backupWeekOf(b.name);
  const label = (b.kind === 'weekly' ? (wk || 'weekly snapshot') : 'session backup') +
    ' · ' + backupWhen(b.modified);
  return '<div class="row">' +
    '<span class="tag' + (b.kind === 'weekly' ? '' : ' session') + '">' +
      (b.kind === 'weekly' ? (wk || 'weekly') : 'session') + '</span>' +
    '<a class="when" href="' + esc(b.url) + '" target="_blank">' + esc(backupWhen(b.modified)) + '</a>' +
    '<span class="ago">' + esc(backupAgo(b.modified)) + '</span>' +
    '<span class="spacer"></span>' +
    '<span class="name">' + esc(b.name) + '</span>' +
    '<span class="size">' + backupSize(b.bytes) + '</span>' +
    '<button type="button" class="btn loadbtn" data-load-url="' + esc(b.url) + '" data-load-label="' + esc(label) + '">Load</button>' +
  '</div>';
}

function backupGroupHTML(title, list, blank){
  return '<h2>' + esc(title) + '</h2>' +
    (list.length ? list.map(backupRowHTML).join('') : '<div class="empty">' + esc(blank) + '</div>');
}

async function renderBackupsView(){
  $('#lists').innerHTML = '<div class="listcard backupsview"><h3>Backups</h3>' +
    '<p class="help listnote">Every copy of todo.md the board has kept. Click one to read it, ' +
    'or Load it to look through it on the board — Backup Preview opens read-only, so nothing in ' +
    'it can be changed or saved over today\'s list.</p>' +
    '<div id="backupsOut">Loading…</div></div>';
  try {
    const res = await fetch('/backups.json?t=' + Date.now(), { cache:'no-store' });
    if (res.status === 404) {
      $('#backupsOut').innerHTML = '<div class="err"><strong>The board helper needs restarting.</strong><br>' +
        'It is running, but it is an older copy that does not know about backups yet. Save anything ' +
        'unsaved on the board first, then run this in Terminal:<br>' +
        '<code style="display:inline-block; margin-top:7px; font-size:12px">' +
        'lsof -ti tcp:8765 | xargs kill</code><br><br>Then open <strong>To-Do Board.app</strong> again, or double-click <strong>run.command</strong>.</div>';
      return;
    }
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const data = await res.json();
    const all = data.backups || [];
    // Weekly ones go by their week label, not their timestamp: a snapshot copied
    // late still belongs to its own week.
    const weekly = all.filter(b => b.kind === 'weekly').sort((x, y) => y.name.localeCompare(x.name));
    const session = all.filter(b => b.kind === 'session');

    /* The archive goes first and on its own. Every other file here is a copy of
       something that still exists; this is the only one holding work that has
       been taken out of the list. */
    const a = data.archive;
    const archive = !a ? '' :
      '<h2>Archived finished work</h2>' +
      '<div class="row">' +
        '<span class="tag">never pruned</span>' +
        '<a class="when" href="' + esc(a.url) + '" target="_blank">' + esc(backupWhen(a.modified)) + '</a>' +
        '<span class="ago">' + esc(backupAgo(a.modified)) + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="name">' + esc(a.name) + '</span>' +
        '<span class="size">' + backupSize(a.bytes) + '</span>' +
      '</div>' +
      '<p class="help" style="margin-top:8px">' + a.sections +
        (a.sections === 1 ? ' batch' : ' batches') +
        ' of tasks that were ticked off more than a month ago and lifted out of todo.md. ' +
        'Nothing is ever removed from this file.</p>';

    $('#backupsOut').innerHTML = archive +
      backupGroupHTML('Weekly snapshots', weekly, 'None yet — the first one is taken the next time the board runs in a new week.') +
      backupGroupHTML('Recent sessions', session, 'None yet — one is taken before the first save of each run.') +
      '<p class="help listnote">This week is ' + esc(data.week) + '. The board keeps the last ' +
        data.keep.session + ' session backups and the last ' + data.keep.weekly +
        ' weekly ones, then deletes the oldest.</p>';

    $('#backupsOut').querySelectorAll('[data-load-url]').forEach(btn => {
      btn.onclick = () => loadBackupPreview(btn.dataset.loadUrl, btn.dataset.loadLabel);
    });
  } catch (err) {
    $('#backupsOut').innerHTML = '<div class="err"><strong>Could not read the backup list.</strong><br>' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* =========================================================================
   4b4. Backup Preview — loading one of the files above straight into the
   board, so it can be looked through the same way as today's list, without
   any risk of it landing back on disk as the live todo.md.

   state.doc becomes the backup's parsed content and state.locked goes true;
   every place that would otherwise write to state.doc (setDone, dropTask,
   addTask, the drawer's field handlers, sub-step edits, headline, archive,
   saveFile, autosave, the outside-edit watcher) checks state.locked first and
   refuses. Exiting always re-fetches todo.md fresh from disk rather than
   restoring anything from memory — simplest, and no live edit can be lost
   from a mode that never allowed any.
   ========================================================================= */
async function loadBackupPreview(url, label){
  if (state.dirty) {
    alert('You have unsaved changes on today\'s list.\n\n' +
          'Save or discard them first, then Load the backup again.');
    return;
  }
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const text = await res.text();
    const doc = parseDoc(text);
    if (!doc.buckets.length) throw new Error('that file has no task buckets in it');
    closeDrawer();
    state.doc = doc;
    state.originalText = text;
    state.fileName = url.split('/').pop();
    state.activeBucket = ALL_BUCKETS;
    state.view = 'board';
    state.locked = true;
    state.demo = false;
    state.lockedLabel = label;
    updateLockUI();
    renderView();
  } catch (err) {
    alert('Could not load that backup.\n\n' + (err.message || err));
  }
}

async function exitBackupPreview(){
  state.locked = false;
  state.lockedLabel = '';
  state.demo = false;
  updateLockUI();
  await loadFile();
}

function updateLockUI(){
  document.body.classList.toggle('locked', state.locked);
  $('#lockFrame').classList.toggle('hidden', !state.locked);
  $('#lockBar').classList.toggle('hidden', !state.locked);
  $('#lockBarKind').textContent = state.demo ? 'Example data' : 'Backup Preview';
  $('#exitLock').textContent = state.demo ? 'Try todo.md again' : 'Return to today\'s list';
  $('#lockBarLabel').textContent = state.locked
    ? 'Viewing ' + state.lockedLabel + ' — nothing here can be edited or saved.'
    : '';
  $('#dataMenu').classList.toggle('hidden', state.locked);
  if (state.locked) $('#datasetMenu').classList.add('hidden');
  else if (state.datasets) $('#datasetMenu').classList.remove('hidden');
  syncLockBarHeight();
}

/* Tell the header how far down to stick. Both it and the bar are sticky at the
   top of the same scroller, so the header needs the bar's height as its offset
   or the two occupy the same strip and the bar, being the higher layer, hides
   the buttons underneath it. Measured rather than assumed: the bar wraps to a
   second line on a narrow window, and the Example data label is longer than the
   Backup Preview one, so no single number is right for both. */
function syncLockBarHeight(){
  const h = state.locked ? $('#lockBar').offsetHeight : 0;
  document.body.style.setProperty('--lockbar-h', h + 'px');
}

/* The bar changes height without the board re-rendering — the window is resized,
   or the label reflows — so remeasure from the element itself rather than only
   at the moments the mode changes. */
if (window.ResizeObserver) {
  new ResizeObserver(syncLockBarHeight).observe($('#lockBar'));
} else {
  window.addEventListener('resize', syncLockBarHeight);
}

/* How much of the viewport the app's own header (and the lock bar above it,
   when one is showing) already takes up — read back with getBoundingClientRect
   rather than added by hand, since the two can each change height on their
   own (the lock bar wraps, the header wraps). Used to size the timeline's own
   scrolling pane so it fits under the header instead of running off the
   bottom of the window — see .tlscroll's max-height. */
function syncHeaderHeight(){
  document.body.style.setProperty('--header-h', Math.round($('header').getBoundingClientRect().bottom) + 'px');
}
if (window.ResizeObserver) {
  new ResizeObserver(syncHeaderHeight).observe($('header'));
} else {
  window.addEventListener('resize', syncHeaderHeight);
}

$('#exitLock').onclick = exitBackupPreview;

/* =========================================================================
   4c. The matrix: impact against effort
   Tier one drawn as a grid rather than a sorted column. Nine cells, impact up
   the side, effort across the bottom, so the eye reads the shape of the whole
   list at once: how much sits in the expensive corner, whether the cheap
   high-impact cell is actually empty.

   A card per task will not fit — nine cells across one screen means roughly a
   thumbnail each — so a task is one dot, coloured by its bucket. The title is on
   hover and a click opens it, which keeps the grid scannable while losing
   nothing: everything is still one gesture from the real task.
   ========================================================================= */

/* Two tiers say something the scores cannot. A Backlog task has been parked on
   purpose, so however cheap and high impact it is, it is not what he should
   start today — and left on the grid it lands in "Do these first" and argues
   with the decision he already made. It comes off the grid entirely, into its
   own tray, where it is still one click from the card. Quick wins uses the
   same tier for the same reason: Backlog is not a real priority, so it is left
   out there too, not just muted.

   Waiting review is the softer case: the work is done and someone else has it.
   It belongs on the grid, since it still costs what it costs, but the dot is
   faded the way a done card is faded on the board. Anything blocked by an
   unfinished task is faded for the same reason — the grid can rank it, but he
   cannot start it. */
const HELD_TIER  = 'Backlog';
const MATRIX_MUTED_TIER = 'Waiting review';

const MATRIX_IMPACT = ['high', 'med', 'low'];      // top row down
const MATRIX_EFFORT = ['S', 'M', 'L'];             // left column across
const EFFORT_HINT = { S: 'under half a day', M: 'one to three days', L: 'a week or more' };

/* What each cell means, said plainly. The corner cells are the only two that
   need no explanation, and the middle is where lists quietly rot, so it gets the
   bluntest label. */
const CELL_ADVICE = {
  'high/S': 'Do these first',
  'high/M': 'Worth the time',
  'high/L': 'Protect time, or break down',
  'med/S':  'Clear in a gap',
  'med/M':  'Fine, not urgent',
  'med/L':  'Ask for a smaller version',
  'low/S':  'Batch or hand over',
  'low/M':  'Probably not worth it',
  'low/L':  'Cut these'
};

/* No `title` attribute. The browser's own tooltip would appear next to the
   floating preview a second later, saying a worse version of the same thing.
   aria-label still carries it for anyone not using a pointer. */
function matrixDot(t, color){
  const di = dueInfo(t.due);
  const label = [
    t.title,
    t.bucket + ' · ' + t.tierName,
    t.blocked ? 'blocked' : '',
    di ? 'due ' + di.label + (di.note ? ', ' + di.note : '') : 'no date'
  ].filter(Boolean).join(', ');
  return '<button class="mdot' + (t.headline ? ' hl' : '') + (t.urgent ? ' urgent' : '') +
    (t.muted ? ' muted' : '') +
    '" data-open="' + t.id + '" style="--bc:' + color + '"' +
    ' aria-label="' + esc(label) + '"></button>';
}

/* ---- Hover preview ----
   The dot says where a task sits, not what it is. Rather than a tooltip that
   paraphrases the card, this shows the card itself — the same cardHTML the board
   renders — so hovering a dot answers the same question as looking at the board.

   Fixed position and appended to the body, because the grid sits inside a
   scrolling column and an absolutely positioned child would be clipped by it.
   pointer-events:none throughout, so the preview can never sit between the
   cursor and the dot it describes and swallow the click. */
let mPreviewEl = null;
function matrixPreview(){
  if (!mPreviewEl) {
    mPreviewEl = document.createElement('div');
    mPreviewEl.className = 'mpreview';
    mPreviewEl.setAttribute('aria-hidden', 'true');
    document.body.appendChild(mPreviewEl);
  }
  return mPreviewEl;
}
function showMatrixPreview(dot){
  const loc = locate(dot.dataset.open);
  if (!loc) return;
  const el = matrixPreview();
  const color = BUCKET_COLOR[state.doc.buckets.indexOf(loc.bucket) % BUCKET_COLOR.length];
  const where = loc.bucket.name + ' · ' + (loc.task.done ? DONE_COL : loc.tier.name);
  el.innerHTML = cardHTML(loc.task, color, where, { static: true, muted: loc.tier.name === WAIT_COL });
  el.classList.add('on');
  placeMatrixPreview(dot);
}
/* Beside the dot, flipping to the other side rather than running off the edge,
   and never taller than the window allows. */
function placeMatrixPreview(dot){
  const el = mPreviewEl;
  if (!el) return;
  const r = dot.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight, gap = 12, edge = 8;
  let left = r.right + gap;
  if (left + w > window.innerWidth - edge) left = r.left - gap - w;
  left = Math.max(edge, Math.min(left, window.innerWidth - w - edge));
  let top = r.top + r.height / 2 - h / 2;
  top = Math.max(edge, Math.min(top, window.innerHeight - h - edge));
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
}
function hideMatrixPreview(){ if (mPreviewEl) mPreviewEl.classList.remove('on'); }

/* ---- Weekly pace hover popover ----
   Same shape as the Matrix's own hover preview just above — a single fixed
   element, reused rather than rebuilt on every point, positioned fresh each
   time it is shown. The content is read straight off the point's own data
   attributes, written once when the chart was drawn. */
let tPreviewEl = null;
function trendPreview(){
  if (!tPreviewEl) {
    tPreviewEl = document.createElement('div');
    tPreviewEl.className = 'tpreview';
    tPreviewEl.setAttribute('aria-hidden', 'true');
    document.body.appendChild(tPreviewEl);
  }
  return tPreviewEl;
}
function showTrendPreview(pt){
  const el = trendPreview();
  const count = +pt.dataset.trendcount;
  el.innerHTML =
    '<div class="tprow" style="--bc:' + esc(pt.dataset.trendcolor) + '"><i></i>' + esc(pt.dataset.trendlabel) + '</div>' +
    '<div class="tpcount"><strong>' + count + '</strong> task' + (count === 1 ? '' : 's') +
      ', week of ' + esc(pt.dataset.trendweek) + '</div>';
  el.classList.add('on');
  placeTrendPreview(pt);
}
/* Above the point by default — a tooltip reads as pointing at what it is
   about, and below would sit over the line and the point it just left. Only
   drops beneath when there is no room above. */
function placeTrendPreview(pt){
  const el = tPreviewEl;
  if (!el) return;
  const r = pt.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight, gap = 10, edge = 8;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(edge, Math.min(left, window.innerWidth - w - edge));
  let top = r.top - gap - h;
  if (top < edge) top = r.bottom + gap;
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
}
function hideTrendPreview(){ if (tPreviewEl) tPreviewEl.classList.remove('on'); }

/* Top-level tasks only. Sub-steps carry no impact or effort of their own, so
   they have no position here — placing them under their parent's scores would
   double-count the same piece of work. Done tasks are left out: this is a tool
   for deciding what is next, not a record of what happened. */
function matrixTasks(){
  const items = allItems();
  const out = [];
  // Same bucket tabs as the board. Blocker lookups still resolve against the
  // full, unfiltered items above — a blocker sitting in a bucket that is
  // currently hidden is still real and still done or not, so only which dots
  // get drawn is scoped, not what they're allowed to depend on.
  const shownNames = new Set(shownBuckets().map(b => b.name));
  state.doc.buckets.forEach((b, bi) => {
    if (!shownNames.has(b.name)) return;
    const color = BUCKET_COLOR[bi % BUCKET_COLOR.length];
    b.tiers.forEach(tier => tier.tasks.forEach(t => {
      if (t.done || !matches(t)) return;
      const it = items.find(i => i.id === t.id && !i.sub);
      const blocked = !!it && !actionable(items, it);
      const waiting = tier.name === MATRIX_MUTED_TIER;
      out.push({ id: t.id, title: t.title, impact: t.impact, effort: t.effort,
                 due: t.due, ai: t.ai, urgent: t.urgent, headline: !!t.headline,
                 bucket: b.name, tierName: tier.name, color,
                 held: tier.name === HELD_TIER,
                 blocked,
                 waiting,
                 muted: waiting || blocked });
    }));
  });
  return out;
}

function matrixSection(){
  const all = matrixTasks();
  const hideWaiting = state.matrixHideWaiting;
  const hiddenWaiting = hideWaiting ? all.filter(t => t.waiting).length : 0;
  const visible = hideWaiting ? all.filter(t => !t.waiting) : all;
  const held = visible.filter(t => t.held);
  const tasks = visible.filter(t => !t.held);
  const placed = tasks.filter(t => IMPACT_N[t.impact] && EFFORT_N[t.effort]);
  const missing = tasks.filter(t => !IMPACT_N[t.impact] || !EFFORT_N[t.effort]);

  const legend = '<div class="mlegend">' +
    '<span class="mkey mkeyhl"><i></i>the one thing</span>' +
    '<span class="mkey mkeyurg"><i></i>urgent</span>' +
    '<span class="mkey mkeymuted"><i></i>waiting or blocked</span>' +
    '<label class="mxfilter"><input type="checkbox" data-mxfilter' +
      (hideWaiting ? ' checked' : '') + '> Hide Waiting review</label>' +
  '</div>';

  let grid = '<div class="mgrid">' +
    '<div class="mcorner">' +
      '<span class="maxis">Effort →</span>' +
      '<span class="maxis">↓ Impact</span>' +
    '</div>' +
    MATRIX_EFFORT.map(e => '<div class="mhead">' + esc(e) +
      '<span class="mhint">' + esc(EFFORT_HINT[e]) + '</span></div>').join('');

  MATRIX_IMPACT.forEach(imp => {
    grid += '<div class="mside">' + esc(imp) + '</div>';
    MATRIX_EFFORT.forEach(eff => {
      const key = imp + '/' + eff;
      const inCell = placed.filter(t => t.impact === imp && t.effort === eff);
      const score = IMPACT_N[imp] / EFFORT_N[eff];
      grid += '<div class="mcell' + (key === 'high/S' ? ' first' : '') +
          (inCell.length ? '' : ' empty') + '" data-score="' + score.toFixed(2) + '"' +
          ' style="--w:' + score.toFixed(2) + '">' +
        '<div class="mcellhead">' +
          '<span class="madvice">' + esc(CELL_ADVICE[key]) + '</span>' +
          '<span class="mcount">' + inCell.length + '</span>' +
        '</div>' +
        '<div class="mdots">' + inCell.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>';
    });
  });
  grid += '</div>';

  const tray = missing.length
    ? '<div class="mtray"><div class="mtrayhead">' +
        '<strong>' + missing.length + ' not on the matrix</strong>' +
        '<span>Missing an impact or an effort score, so they have no position. ' +
        'Click one to score it.</span></div>' +
        '<div class="mdots">' + missing.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>'
    : '';

  const holdTray = held.length
    ? '<div class="mtray mhold"><div class="mtrayhead">' +
        '<strong>' + held.length + ' in ' + esc(HELD_TIER) + '</strong>' +
        '<span>Parked on purpose, so they are kept off the grid however they ' +
        'score. Move one out of ' + esc(HELD_TIER) + ' and it takes its ' +
        'cell.</span></div>' +
        '<div class="mdots">' + held.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>'
    : '';

  const total = placed.length;
  /* Counted on what he could pick up today. A high impact, cheap task that is
     waiting on a review or on another task is not a place to start, so it is
     left out of the advice even though its dot is still in the cell. */
  const cheapWins = placed.filter(t => t.impact === 'high' && t.effort === 'S' && !t.muted).length;
  const cut = placed.filter(t => t.impact === 'low' && t.effort === 'L').length;
  const heavy = placed.filter(t => t.effort === 'L').length;
  const waiting = placed.filter(t => t.muted).length;
  let read = '';
  if (total) {
    const bits = [];
    bits.push(cheapWins
      ? '<strong>' + cheapWins + '</strong> high impact and cheap — start there'
      : 'nothing is both high impact and cheap right now');
    bits.push('<strong>' + heavy + '</strong> of ' + total + ' need a week or more');
    if (cut) bits.push('<strong>' + cut + '</strong> in the cut corner');
    if (waiting) bits.push('<strong>' + waiting + '</strong> waiting or blocked');
    read = '<p class="mread">' + bits.join(' · ') + '</p>';
  }

  const hiddenNote = hiddenWaiting
    ? '<p class="mhidden">' + hiddenWaiting + ' hidden, sitting in Waiting review.</p>'
    : '';

  return legend + read + hiddenNote + grid + tray + holdTray;
}

/* =========================================================================
   4c. Timeline — top-level tasks as bars across dates, grouped by bucket.

   `start:` and `due:` already exist on every task and sub-step (see "Two
   dates, not one" in the README) — this view is the first thing to draw both
   of them at once rather than reading one and ignoring the other.

   Nothing here invents a date the file doesn't have. A task with both draws
   as a bar; a task with only `due:` — most of the list — draws as a diamond
   on that date rather than a bar backed by a start date nobody set; a task
   with only `start:` draws as a bar out to today, since "started, no
   deadline yet" is still two real dates once today is one of them. A task
   with neither sits in the tray below the lanes rather than being dropped.
   ========================================================================= */
const TL_DAY_PX = 28;
const TL_MIN_DAYS = 56;          // ~8 weeks, so a short list isn't a sliver

function addDays(d, n){ const r = new Date(d); r.setDate(r.getDate() + n); return r; }
/* Standard ISO-8601 week number — the same figure `week_tag` in server.py
   already stamps a weekly backup with, computed here instead because the
   header labels every week in range, not just the current one. */
function isoWeekNumber(d){
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = (t.getUTCDay() + 6) % 7;               // Mon=0..Sun=6
  t.setUTCDate(t.getUTCDate() - day + 3);            // nearest Thursday
  const firstThu = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
  const firstDay = (firstThu.getUTCDay() + 6) % 7;
  firstThu.setUTCDate(firstThu.getUTCDate() - firstDay + 3);
  return 1 + Math.round((t - firstThu) / (7 * 86400000));
}

/* Same split `matrixTasks` does — top-level only, open only, `matches()`
   filtered — plus the one extra split this view needs: dated vs undated.
   "Dated" means the task itself carries a date, or one of its steps does,
   since a step's own bar would otherwise never be reachable. */
function timelineTasks(){
  const items = allItems();
  const dated = [], undated = [];
  // Same bucket tabs as the board and Matrix — see the comment in
  // matrixTasks for why blocker lookups stay against the full items list.
