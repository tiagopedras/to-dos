        bucket: b.name, tier: tier.name, parent: '',
        title: t.title, done: t.done,
        due: t.due, start: t.start, ai: t.ai, impact: t.impact, effort: t.effort,
        urgent: t.urgent, week: t.week, rank: t.rank,
        slug: t.slug, blockedBy: t.blockedBy || [],
        message: own.message, draft: own.draft, prompt: own.prompt, jira: own.jira,
        agenda: own.agenda, prevAgenda: readPrevAgenda(parts.notes),
        repeat: readRepeat(t.repeat)
      });
      parts.steps.forEach(s => {
        const meta = noteMeta(s.notes);
        out.push({
          id: t.id, task: t, sub: s, color,
          bucket: b.name, tier: tier.name, parent: t.title,
          title: s.clean, done: s.done || t.done,
          due: s.due,
          /* A step cannot begin before the task it sits inside can, so it takes
             the later of its own start and its parent's. */
          start: laterOf(s.start, t.start),
          ai: s.ai || t.ai, impact: '', effort: '',
          urgent: false, week: s.week, rank: s.rank,
          slug: s.slug, blockedBy: s.blockedBy,
          message: meta.message, draft: meta.draft, prompt: meta.prompt, jira: meta.jira,
          /* A step can carry its own agenda, but the cycle is the task's — the
             meeting is the task, the steps are what happens inside it. */
          agenda: meta.agenda, prevAgenda: null, repeat: readRepeat(t.repeat)
        });
      });
    }));
  });
  return out;
}

function itemBySlug(items, slug){ return items.find(i => i.slug === slug) || null; }

/* Which of the things an item waits on are still outstanding. A blocker that is
   not ticked yet blocks it. So does a slug that names nothing in the file: he
   cannot act on a dependency he cannot even look up, so an unresolvable one
   counts the same as an unfinished one.

   A sub-step carries no blocked-by tag of its own, but it cannot start before
   the task it sits inside can, so it inherits its parent's. */
function unresolvedBlockersFor(items, slugs){
  return (slugs || []).filter(slug => {
    const src = itemBySlug(items, slug);
    return !src || !src.done;
  });
}
function unresolvedBlockers(items, it){
  const own = it.blockedBy || [];
  const inherited = it.sub ? (it.task.blockedBy || []) : [];
  return unresolvedBlockersFor(items, own.concat(inherited));
}
function actionable(items, it){ return unresolvedBlockers(items, it).length === 0; }

/* Same rule as actionable, asked the other way round: not "should this be
   suggested" but "can this be ticked off right now". A task cannot be marked
   done while something it waits on is still open — the tick means the work
   is finished, and it cannot be if a dependency it needed first is not.
   Unticking is never gated; only the move onto Done is. Returns a status-line
   message naming what it is still waiting on, or '' if nothing is in the way. */
function blockedMessage(items, slugs){
  const unresolved = unresolvedBlockersFor(items, slugs);
  if (!unresolved.length) return '';
  const names = unresolved.map(slug => {
    const src = itemBySlug(items, slug);
    return src ? src.title : ('#' + slug);
  });
  return 'still waiting on ' + names.join(', ') + ' — finish that first';
}
/* Shown at the card, not the header status line — see .toasts above. Stacks
   if fired more than once before the first clears; each one clears itself. */
function showToast(msg, kind){
  const host = $('#toasts');
  if (!host) return;
  const el = document.createElement('div');
  el.className = 'toast' + (kind ? ' ' + kind : '');
  el.textContent = msg;
  host.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  setTimeout(() => {
    el.classList.remove('show');
    setTimeout(() => el.remove(), 200);
  }, 3200);
}
function byDue(a, b){
  if (!a.due && !b.due) return 0;
  if (!a.due) return 1;
  if (!b.due) return -1;
  return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
}

/* ---- The small bordered card every reference renders as ---- */

function refTags(it){
  let out = '';
  /* First, because on a recurring task how often it comes round is what frames
     every other tag on the card: the deadline is the next occurrence. */
  if (it.repeat) out += '<span class="tag repeat" title="Recurring ' +
    esc(it.repeat.label) + '">' + esc(it.repeat.label) + '</span>';
  const si = startInfo(it.start);
  if (si) out += '<span class="tag startdate">' + esc(si.label) + ' · ' + esc(si.note) + '</span>';
  const di = dueInfo(it.due, it.tier === WAIT_COL);
  if (di) out += '<span class="tag due ' + di.cls + '">' + esc(di.label) + (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (it.urgent) out += '<span class="tag urgent">urgent</span>';
  if (it.impact) out += '<span class="tag impact-' + esc(it.impact) + '" title="' + esc(it.impact) + ' impact">' + (IMPACT_EMOJI[it.impact] || esc(it.impact)) + '</span>';
  if (it.effort) out += '<span class="tag">' + esc(it.effort) + '</span>';
  if (it.ai && it.ai !== 'none') out += '<span class="tag ai ai-' + esc(it.ai) + '" title="' + esc(it.ai) + ' AI help">ai</span>';
  return out;
}

/* These sections are the only place the five views exist now, so a card has to
   be somewhere he can work rather than just read: tick it here, open it here,
   drop it out of the week here. The tick writes to the task or the sub-step,
   whichever the card was built from, so the board and the file agree instantly.

   opts.message / opts.prompt say whether to include the body text. */
function refCard(it, opts){
  opts = opts || {};
  /* This card is a copy shown away from its own column, so the column itself —
     what the board would otherwise say just by where the card sits — has to
     be spelled out here instead. Same "bucket · tier" order the matrix hover
     preview already uses, so the two read as the same fact. */
  const where = [it.bucket, it.parent, it.done ? DONE_COL : it.tier].filter(Boolean).map(esc).join(' · ');
  const target = it.sub ? ' data-sub="' + it.sub.line + '"' : '';
  let body = '';
  if (opts.message && it.message) {
    body += messageHTML(it.message, { draft: it.draft });
  }
  /* Switching a task to ai:full puts it here straight away, but the prompt is
     written by hand and lags behind the tag. Say so on the card, otherwise a
     task with nothing to paste looks the same as one that is ready to go. */
  if (opts.prompt) {
    body += it.prompt ? messageHTML(it.prompt, { claude:true, task:it.id })
                      : '<p class="reflead draft">Needs a prompt before this can be handed over</p>';
  }
  /* An agenda, on the same terms as a message: it is the whole of what the card
     is for, so it only shows where the section asked for it. */
  if (opts.agenda && it.agenda) body += agendaHTML(it.agenda, it.due);
  /* A ticket to raise is worth acting on from wherever the card is showing, so
     unlike a message or a prompt this needs no opts flag to turn it on. */
  if (it.jira) body += jiraHTML(it.jira);

  return '<article class="ref' + (it.done ? ' done' : '') + '" style="--bc:' + it.color + '">' +
    '<div class="refhead">' +
      '<button class="refbox" data-tick="' + it.id + '"' + target +
        ' role="checkbox" aria-checked="' + it.done + '"' +
        ' title="' + (it.done ? 'Mark as not done' : 'Mark as done') + '">' + (it.done ? '✓' : '') + '</button>' +
      '<button class="reftitle" data-open="' + it.id + '" title="Open this task">' + mdInline(it.title) + '</button>' +
      (opts.unweek
        ? '<button class="refdrop" data-unweek="' + it.id + '"' + target + ' title="Take this out of the week">Not this week</button>'
        : '') +
      (opts.quickDismiss
        ? '<button class="refdrop" data-quickdismiss="' + esc(quickKey(it)) + '" ' +
          'title="Dismiss this suggestion. Nothing about the task changes — it just stops showing here until you bring it back.">Dismiss</button>'
        : '') +
    '</div>' +
    '<div class="refwhere">' + where + '</div>' +
    (refTags(it) ? '<div class="meta">' + refTags(it) + '</div>' : '') +
    body +
  '</article>';
}

function refGroup(label, cards){
  if (!cards.length) return '';
  return '<h4 class="refgroup">' + esc(label) + '</h4>' + cards.join('');
}

/* ---- Capping how many cards one Overview column shows ----
   A column that scrolls past the fold is not an overview any more, it is the
   board again with extra steps — so each one stops at a card count he can
   actually take in, and says how many were left off rather than quietly
   shrinking. Nothing is lost: the full list is still the board and the other
   views, this is only about what one glance at Overview shows. */
const OV_CARD_LIMIT = 8;
function capCards(items, limit){
  limit = limit || OV_CARD_LIMIT;
  if (items.length <= limit) return { shown: items, hidden: 0 };
  return { shown: items.slice(0, limit), hidden: items.length - limit };
}
/* The same cap spent across several groups in one column — Quick wins and
   Delegate both split into sub-groups — so the column's total stays capped
   rather than each sub-group getting its own budget. Earlier groups keep
   their cards; a group hit once the budget is spent shrinks or disappears,
   in the order it would already have rendered. */
function capGroups(groups, limit){
  limit = limit || OV_CARD_LIMIT;
  let budget = limit, hidden = 0;
  const shown = groups.map(g => {
    if (budget <= 0) { hidden += g.length; return []; }
    if (g.length <= budget) { budget -= g.length; return g; }
    hidden += g.length - budget;
    const s = g.slice(0, budget);
    budget = 0;
    return s;
  });
  return { shown, hidden };
}
function moreNote(hidden){
  return hidden ? '<p class="refmore">+' + hidden + ' more not shown here — open the board to see the rest.</p>' : '';
}

/* ---- The five sections, each built from its tag ---- */

function weekSection(items){
  const live = items.filter(i => i.week).sort(byDue);
  if (!live.length) return '<p class="empty">Nothing is tagged <code>week</code> yet.</p>';
  const m = live.filter(i => i.effort === 'M' && !i.done).length;
  const warn = m > 2
    ? '<p class="refwarn">' + m + ' M-effort items this week. The ceiling is two once meetings are counted.</p>'
    : '';
  const { shown, hidden } = capCards(live);
  return warn + shown.map(i => refCard(i, { unweek:true })).join('') + moreNote(hidden);
}

/* A quick win has to be something he can act on right now. Anything still
   waiting on an unfinished blocker is not a win, it is a reminder that he cannot
   start — so it is left out. The count of what was held back is shown, because
   a section that quietly shrinks looks like a section with nothing in it.

   Anything tagged ai:full is left out too. Delegate to Claude already lists
   every one of them, ranked, and the two columns sit side by side on Overview —
   the same card in both reads as two jobs when it is one. Quick wins is what is
   left for him to do himself.

   Backlog is left out entirely, the same call the matrix makes with HELD_TIER —
   it has been parked on purpose, so however small it is, it is not a real
   priority and not something to surface here.

   What is left is ordered by byPriority, the dependency chain's own
   assessment: a two-minute message that happens to unblock a big rock outranks
   one that unblocks nothing, the same way the chain ranks a blocked card by
   what is riding on it rather than its own score alone. */
function quickSection(items){
  // ai:full belongs to Delegate to Claude, and Backlog is not a real priority —
  // neither belongs here.
  const open = items.filter(i => !i.done && i.ai !== 'full' && i.tier !== HELD_TIER);
  // Two separate reasons something is not a quick win yet: it waits on another
  // task, or its start date has not arrived. Neither is about the deadline —
  // an overdue task is the most actionable thing on the list, not the least.
  const live = byPriority(items, open.filter(i => actionable(items, i) && !notYet(i.start))).order;
  const heldByDep = open.filter(i => !actionable(items, i)).length;
  const heldByDate = open.filter(i => actionable(items, i) && notYet(i.start)).length;
  const heldByBacklog = items.filter(i => !i.done && i.ai !== 'full' && i.tier === HELD_TIER).length;
  const isS = i => i.sub === null && i.effort === 'S';
  const seen = new Set();
  const take = arr => arr.filter(i => { const k = i.id + '|' + i.title; if (seen.has(k)) return false; seen.add(k); return true; });

  /* Meetings first, and before the messages, because a standing meeting is the
     one thing here with a time on it rather than a deadline: 9:15 on Wednesday
     passes whether or not the agenda was ready. Nearest first.

     Only the ones with an agenda written, because the group is what he can clear
     in a gap and a written agenda is one paste from cleared. A recurring meeting
     with nothing on it yet is still on the board with its date, and it is still
     in the other groups if it is small — but it is not a quick win, it is the
     work. Nothing here says whether an agenda exists: the tick on the card is
     what says that, so a second answer to the same question is not wanted. */
  const preMeetings = take(live.filter(i => i.repeat && i.agenda && i.sub === null).sort(byDue));
  const preMessages = take(live.filter(i => i.message));
  const preDecide   = take(live.filter(i => isS(i) && i.ai === 'partial'));
  const preTalk     = take(live.filter(i => isS(i) && i.ai === 'none'));

  /* Dismissed here, not filtered out of `open` above: a dismissal is a
     preference about this list, not a fact about the task, so it must not
     touch heldByDep/heldByDate/heldByBacklog, which describe the task itself. */
  const dismissed = quickDismissedSet();
  const notDismissed = i => !dismissed.has(quickKey(i));
  const meetings = preMeetings.filter(notDismissed);
  const messages = preMessages.filter(notDismissed);
  const decide   = preDecide.filter(notDismissed);
  const talk     = preTalk.filter(notDismissed);
  const dismissedShown = (preMeetings.length - meetings.length) + (preMessages.length - messages.length) +
    (preDecide.length - decide.length) + (preTalk.length - talk.length);

  const reasons = [];
  if (heldByDep)  reasons.push('<strong>' + heldByDep + '</strong> waiting on another task');
  if (heldByDate) reasons.push('<strong>' + heldByDate + '</strong> not startable yet');
  if (heldByBacklog) reasons.push('<strong>' + heldByBacklog + '</strong> parked in ' + esc(HELD_TIER));
  const note = reasons.length
    ? '<p class="refheld">Left out: ' + reasons.join(' · ') + '.</p>'
    : '';

  const capped = capGroups([meetings, messages, decide, talk]);
  const [sMeetings, sMessages, sDecide, sTalk] = capped.shown;

  const out =
    refGroup('Costs one paste, before the meeting', sMeetings.map(i => refCard(i, { agenda:true, quickDismiss:true }))) +
    refGroup('Costs one message, already written', sMessages.map(i => refCard(i, { message:true, quickDismiss:true }))) +
    refGroup('Costs one decision', sDecide.map(i => refCard(i, { quickDismiss:true }))) +
    refGroup('Costs one conversation', sTalk.map(i => refCard(i, { quickDismiss:true })));
  const dismissedNote = dismissedShown
    ? '<p class="refmore">' + dismissedShown + ' dismissed. ' +
      '<button type="button" class="reflink" data-quickrestore>Show them again</button></p>'
    : '';
  return out
    ? note + out + moreNote(capped.hidden) + dismissedNote
    : note + dismissedNote + '<p class="empty">Nothing small enough to clear in a gap.</p>';
}

function bigRocksSection(items){
  const rocks = items.filter(i => i.sub === null && i.impact === 'high' && i.effort === 'L' && !i.done);
  if (!rocks.length) return '<p class="empty">No high impact, L effort tasks.</p>';
  const { shown, hidden } = capCards(rocks);
  return shown.map(i => refCard(i)).join('') + moreNote(hidden);
}

/* An item's own impact. Sub-steps are never scored, so one takes the score of
   the task it sits in — that is the work it is part of. */
function itemImpact(it){
  return IMPACT_N[it.impact || (it.sub ? it.task.impact : '')] || 0;
}

/* What is riding on a blocked card: its own impact, or the impact of anything
   still waiting on it, whichever is higher. A small task holding up a big one
   is worth unpicking for the big one's sake, and that carries down a chain, so
   this follows the whole tail rather than one step of it. `seen` is copied at
   each step, which keeps it to the current path and stops a circular
   blocked-by from looping forever. */
function chainWeight(waiters, it, seen){
  seen = seen ? new Set(seen) : new Set();
  let best = itemImpact(it);
  if (!it.slug || seen.has(it.slug)) return best;
  seen.add(it.slug);
  (waiters.get(it.slug) || []).forEach(o => {
    best = Math.max(best, chainWeight(waiters, o, seen));
  });
  return best;
}

/* Slug → everything still waiting on it, across every open item. Built once
   and shared: both the chain and quick wins ask the same question — "what
   does finishing this actually unblock" — and re-deriving the answer per
   caller would be the same walk of the list twice. */
function waitersMap(items){
  const waiters = new Map();
  items.forEach(o => {
    if (o.done) return;
    unresolvedBlockers(items, o).forEach(sl => {
      if (!waiters.has(sl)) waiters.set(sl, []);
      waiters.get(sl).push(o);
    });
  });
  return waiters;
}

/* Heaviest first — the same assessment the dependency chain uses, reused
   wherever "what's actually worth doing first" is the question. Ties go to
   whichever frees the most tasks, then to the nearest date. Weight is looked
   up from a precomputed map rather than called fresh per comparison, since a
   sort calls its comparator O(n log n) times and chainWeight walks the whole
   downstream chain on every call. Returns the order and the weights it was
   computed from, since a caller sometimes needs to explain a card's position,
   not just show it. */
function byPriority(items, list){
  const waiters = waitersMap(items);
  const weight = new Map(list.map(i => [i, chainWeight(waiters, i, null)]));
  const order = list.slice().sort((a, b) => {
    const wd = weight.get(b) - weight.get(a);
    if (wd) return wd;
    const fd = (waiters.get(b.slug) || []).length - (waiters.get(a.slug) || []).length;
    if (fd) return fd;
    return byDue(a, b);
  });
  return { order, weight };
}

function chainSection(items){
  const blocked = items.filter(i => i.blockedBy.length && !i.done);
  if (!blocked.length) return '<p class="empty">Nothing carries a <code>blocked-by:</code> tag.</p>';

  const { order, weight } = byPriority(items, blocked);

  return order.map(i => {
    const deps = i.blockedBy.map(slug => {
      const src = itemBySlug(items, slug);
      const card = src ? chainCard(src, { dep:true }) : chainMissing(slug);
      return '<div class="chaindep">' + card + '<span class="chainarrow" aria-hidden="true">→</span></div>';
    }).join('');
    return '<div class="chainitem">' +
      '<div class="chainrow">' +
        '<div class="chainfrom">' + deps + '</div>' +
        chainCard(i, { target:true }) +
      '</div>' +
      (weight.get(i) > itemImpact(i)
        ? '<div class="chainholds">Holds up higher impact work</div>' : '') +
    '</div>';
  }).join('');
}

/* One mini ticket in the chain — a blocker (dashed, dep:true) or the card
   waiting on it (target:true). Both open the full task on click. */
function chainCard(it, opts){
  opts = opts || {};
  const cls = 'chaincard' + (opts.dep ? ' dep' : '') + (opts.target ? ' target' : '') + (it.done ? ' done' : '');
  return '<div class="' + cls + '" style="--bc:' + it.color + '" data-open="' + it.id + '" title="Open this task">' +
    '<span class="chaintitle">' + mdInline(it.title) + (it.done ? ' ✓' : '') + '</span>' +
    '<div class="chainwhere">' + esc([it.bucket, it.done ? DONE_COL : it.tier].filter(Boolean).join(' · ')) + '</div>' +
  '</div>';
}

function chainMissing(slug){
  return '<div class="chaincard dep missing" title="No task carries this slug">' +
    '<span class="chaintitle">#' + esc(slug) + ' missing</span>' +
  '</div>';
}

/* Only ai:full work belongs here, and the ai: tag is the gate rather than the
   rank. A rank left behind on something he has taken back off Claude must not
   keep it in the list, otherwise the section quietly recommends delegating work
   he has already decided is his. */
function delegateSection(items){
  const ranked = items.filter(i => i.ai === 'full' && !i.done && i.rank != null)
                      .sort((a, b) => a.rank - b.rank);
  const unranked = items.filter(i => i.ai === 'full' && !i.done && i.rank == null);
  if (!ranked.length && !unranked.length) return '<p class="empty">Nothing is tagged <code>ai:full</code>.</p>';

  const capped = capGroups([ranked, unranked]);
  const [sRanked, sUnranked] = capped.shown;

  let html = sRanked.map(i =>
    '<div class="refrow"><span class="refnum">' + i.rank + '</span>' + refCard(i, { prompt:true }) + '</div>'
  ).join('');
  if (sUnranked.length) {
    html += refGroup('Not ranked yet', sUnranked.map(i => refCard(i, { prompt:true })));
  }
  return html + moreNote(capped.hidden);
}

/* ---- Small shared renderers ---- */

function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_]+)_/g, '$1<em>$2</em>');
}
/* A prompt is written to be handed to Claude, so the board can do the handing
   rather than leaving it as a copy-and-paste. claude.ai/new?q= opens a fresh
   chat with the text already sitting in the box, unsent — which is the point,
   because most of these prompts still have a [path] to fill in before they go.
   Only prompts get this. A suggested message is for a person, not for Claude. */
function claudeHref(text){
  return 'https://claude.ai/new?q=' + encodeURIComponent(text);
}
function claudeLink(text){
  return '<a class="toclaude" href="' + claudeHref(text) + '" target="_blank" rel="noopener"' +
         ' title="Opens a new Claude chat with this prompt in the box, unsent">Open in Claude</a>';
}

/* ---- Chats on a task ----
   The engine and the modal itself live in ai_chat/ now, loaded above as
   AIChat — see ai_chat/README.md for the shape of that module and why it
   never stores a transcript of its own.

   What stays here is this board's own business: minting and persisting the
   `chat:` tag on a task line (that marks the list dirty, same as any other
   edit), drawing the "Chats" field inside the drawer, and wiring this
   board's shared click handler to the widget's API.

   A task carries a list rather than one conversation, because the work on a
   task is not one conversation. Reading the 360 responses, drafting the
   message that comes out of it and checking last quarter's wording are
   three, and keeping them apart is the point — each stays short enough to
   be worth resuming. */

// The stub below is the no-engine case, not a parked feature: on this machine
// server.py's AI_CHAT_DIR resolves to ../ai_chat_engine and /claude.json
// answers, so the real AIChat loads and the buttons draw. Where that sibling
// folder is missing — a checkout of this repo on its own, or the board served
// statically — /ai-chat/chat.js 404s and AIChat is never defined. Falling
// straight through to AIChat.create() would throw at the top level and stop the
// rest of this script (loadFile() included) from ever running, and the board
// would sit on the start screen forever with no error shown. The stub keeps
// every call site working with the feature simply switched off, the same
// "no engine, no buttons, not a crash" rule server.py already follows.
// A session getting filed, a run finishing, or the modal closing can all
// leave the drawer showing a stale "running" badge or an empty chat list —
// this is the one place that redraws it. It is also where a prompt run
// waiting to learn its own session id (see onPromptRunSend below) finds it:
// whichever row under its key wasn't there a moment ago, stamped before this
// moves on to the ordinary redraw.
function onSessionsChanged(index){
  if (state.pendingPromptRun) {
    const p = state.pendingPromptRun;
    const had = new Set((state.chats[p.key] || []).map(r => r.id));
    const fresh = ((index || {})[p.key] || []).find(r => !had.has(r.id));
    if (fresh) { notePrompt(p.key, fresh.id, p.raw); state.pendingPromptRun = null; }
  }
  state.chats = index || {};
  if (state.pendingChat) {
    const want = state.pendingChat;
    state.pendingChat = '';
    openChatByKey(want);
  }
  if (state.openTask) openDrawer(state.openTask);
  if (state.view === 'canvas') renderCanvas();
}
/* Fired the instant a message leaves the composer, before any reply — the
   one moment "a prompt was actually run" rather than merely opened can be
   told apart from "the modal was opened and closed again". See "A prompt is
   used up by being run" in AI-CANVAS.md for why this has to be on send
   rather than on the Ask Claude click that opens the modal. */
function onPromptRunSend(payload){
  const p = state.pendingPromptRun;
  if (!p || payload.session || payload.key !== p.key) return;
  const task = tasksByChatKey()[p.key];
  if (task) { removeBodyLine(task, p.raw); refreshView(); }
  // pendingPromptRun stays set, now waiting on onSessionsChanged above to
  // learn the session id the line's text gets recorded against.
}
function onChatChange(){ if (state.openTask) openDrawer(state.openTask); }
// The status fetch on load is the first time claudeOn() can go from false to
// true — the Ask Claude button on every prompt only exists once this has
// answered, so the whole view needs a redraw, not just the drawer.
function onChatStatusChanged(cfg){
  state.chatsOn = !!cfg;
  state.chatsChecked = true;
  if (state.doc) renderView();
}

const chat = (typeof AIChat !== 'undefined') ? AIChat.create({
  ownerLabel: taskId => { const loc = locate(taskId); return loc ? loc.task.title : ''; },
  // Worth explaining once, on the button that starts a chat, not on every
  // task's Chats section — see the Ask Claude / New chat tooltips.
  readOnlyHelp: '',
  onSessionsChanged, onSend: onPromptRunSend, onChange: onChatChange, onStatusChanged: onChatStatusChanged,
}) : {
  available: () => false,
  renderSection: () => '',
  newOwnerKey: () => '',
  openNew: () => {},
  openSession: () => {},
  forget: () => Promise.resolve(),
  loadSessions: () => Promise.resolve(),
  loadStatus: () => {},
};

function claudeOn(){ return chat.available() && !state.locked; }

/* A top-level task by its exact title — the only thing durable enough to
   name a task from outside todo.md, since t.id is 'a counter reset on every
   load and would not survive a task moving between two loads. Used by
   drainAttachQueue() below: /pa-attach can only tell the board which task by
   what it saw when it ran, and by the time the board next loads, that is
   what it still has to go on. */
function findTaskByTitle(title){
  if (!title || !state.doc) return null;
  for (const b of state.doc.buckets) for (const ti of b.tiers) for (const t of ti.tasks) {
    if (t.title === title) return t;
  }
  return null;
}

/* What /pa-attach, or a session picked up from a terminal while the board
   was closed, left in data/<dataset>/attach-queue.json — see
   attach_queue_path() in server.py for why the skill cannot write this
   itself. Called only from loadFile(), after state.locked is confirmed
   false: this mints a `chat:` key through the ordinary edit path for any
   task that needs one, which is a write to todo.md and must never run on a
   demo, a backup preview, or a locked tab.

   An entry whose task cannot be found by title — renamed or deleted since
   the skill ran — is written back rather than dropped, so nothing queued is
   silently lost; it simply waits for the next load, in case the rename gets
   undone or was itself a mistake. */
async function drainAttachQueue(){
  if (!chat.available()) return;
  let items;
  try {
    const res = await fetch('/attach-queue.json?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) return;
    items = await res.json();
  } catch (err) { return; }
  if (!Array.isArray(items) || !items.length) return;

  const left = [];
  let filed = 0;
  for (const item of items) {
    const task = item && findTaskByTitle(item.title);
    if (!task || !item.session || !item.cwd) { left.push(item); continue; }
    const key = chatKeyFor(task, true);
    try {
      const res = await fetch('/claude/attach', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
        body: JSON.stringify({ owner: key, session: item.session, cwd: item.cwd, title: item.title || '' })
      });
      if (res.ok) filed++; else left.push(item);
    } catch (err) { left.push(item); }
  }
  if (!filed) return;

  await fetch('/attach-queue.json', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
    body: JSON.stringify(left)
  }).catch(() => {});
  await chat.loadSessions();
  $('#status').textContent = filed + ' conversation' + (filed === 1 ? '' : 's') +
    ' attached from ' + (filed === 1 ? 'the terminal' : 'terminal sessions') + ' — save to apply';
}

/* The task's key, writing one onto the line if this is the first chat on it.
   That marks the list dirty, which is right — a task that has conversations
   under it is a task whose line has changed. */
function chatKeyFor(t, make){
  if (t.chat) return t.chat;
  if (!make) return '';
  t.chat = chat.newOwnerKey();
  t.dirty = true;
  markDirty();
  return t.chat;
}

/* The task's Chats field, drawn with cvCardHTML — the same card the canvas
   draws, stacked in a column instead of scattered on a surface. One renderer
   either way: same markup, same dot, same click, wired below in handleAsk
   rather than in chat.js's own renderSection, which this host no longer
   calls. A rule ahead of it marks it as its own section rather than one more
   field, the same as the two suggestion lists below it — but only when
   there is something to show: with no chat engine at all, chat.available()
   is false and a bare rule with nothing under it would be a dead end. */
function chatSection(t){
  if (!chat.available()) return '';
  const key = t.chat || '';
  // state.chats rather than chat.sessionsFor(): the board's own cached copy
  // of the sessions index, kept current by onSessionsChanged, is what
  // canvasModel() reads too — sessionsFor() answers from chat.js's own
  // index, which only fills in once loadSessions() has actually run.
  const rows = (key && state.chats[key] || [])
    .slice().sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')));
  const cards = rows.map(row => cvCardHTML(row, key, t.title, false)).join('');
  const labelHTML = 'AI processes' + (rows.length ? ' <em class="aic-sublabel">' + rows.length + '</em>' : '');
  const body =
    '<div class="cvstack">' + (cards || '<p class="aic-none">No conversations yet.</p>') + '</div>' +
    '<div class="aic-actions">' +
      '<button type="button" class="aic-addsub" data-owner="' + esc(t.id) + '">+ New chat</button>' +
      '<button type="button" class="aic-addsub aic-attach" data-owner="' + esc(t.id) +
        '">Attach a session…</button>' +
    '</div>';
  const html = '<details class="aic-field aic-collapse"' + (sectionCollapsed('chats') ? '' : ' open') +
    ' data-collapse="chats">' + '<summary>' + labelHTML + '</summary>' + body + '</details>';
  return '<hr class="dsep">' + html;
}

/* ---- Attaching a session that started elsewhere ----
   The other half of AI-CANVAS.md's "Attaching a session that started in the
   terminal": /pa-attach handles the case where you are already in the
   conversation; this is the case where you are already looking at the task
   instead, and want to reach for a conversation Claude Code has on disk but
   this board has never filed.

   No queue needed here — unlike /pa-attach, which cannot touch todo.md at
   all, this runs inside the board that is the one thing allowed to write it,
   so chatKeyFor() mints the key and /claude/attach files the session in the
   same click. */
async function openAttachPicker(taskId){
  const loc = locate(taskId);
  if (!loc || !claudeOn()) return;
  const overlay = document.createElement('div');
  overlay.className = 'attachpick-wrap';
  overlay.innerHTML = '<div class="attachpick" role="dialog" aria-label="Attach a session">' +
    '<header>Attach a session' +
      '<button type="button" class="attachpick-close" aria-label="Close">×</button>' +
    '</header>' +
    '<div class="attachpick-body"><p class="aic-none">Loading…</p></div>' +
  '</div>';
  document.body.appendChild(overlay);
  const close = () => { overlay.remove(); document.removeEventListener('keydown', onKey); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  document.addEventListener('keydown', onKey);
  overlay.onclick = e => { if (e.target === overlay) close(); };
  overlay.querySelector('.attachpick-close').onclick = close;

  let sessions = [];
  try {
    const res = await fetch('/claude/attachable.json?t=' + Date.now(), { cache: 'no-store' });
    sessions = res.ok ? ((await res.json()).sessions || []) : [];
  } catch (err) { sessions = []; }
  if (!overlay.isConnected) return;   // closed while the list was loading

  const body = overlay.querySelector('.attachpick-body');
  if (!sessions.length) {
    body.innerHTML = '<p class="aic-none">Nothing on disk that isn’t filed against a task already.</p>';
    return;
  }
  body.innerHTML = sessions.map(s =>
    '<button type="button" class="attachpick-row" data-session="' + esc(s.id) + '"' +
      ' data-cwd="' + esc(s.cwd) + '" data-title="' + esc(s.title || '') + '">' +
      '<span class="attachpick-title">' + esc(s.title || 'Untitled conversation') + '</span>' +
      '<span class="attachpick-meta">' + esc(cvWhen(s.updated)) + ' · ' + esc(s.cwd) + '</span>' +
    '</button>'
  ).join('');
  body.querySelectorAll('.attachpick-row').forEach(row => {
    row.onclick = async () => {
      body.querySelectorAll('.attachpick-row').forEach(r => r.disabled = true);
      const key = chatKeyFor(loc.task, true);
      try {
        await fetch('/claude/attach', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
          body: JSON.stringify({
            owner: key, session: row.dataset.session,
            cwd: row.dataset.cwd, title: row.dataset.title
          })
        });
      } catch (err) { /* nothing to do — the drawer just won't show it */ }
      close();
      await chat.loadSessions();
      refreshView();
      openDrawer(taskId);
    };
  });
}

/* A prompt written on the task starts its own conversation, seeded with the
   prompt but not sent — most of them still have a [path] to fill in, and one
   that fired on click would send the placeholder.

   raw is the exact markdown line the prompt came from, the same text a
   manual Dismiss would remove. Opening the modal does not touch it — see "A
   prompt is used up by being run" in AI-CANVAS.md — it only marks this as
   the run to watch for: if the first message actually sent on this owner
   key matches, onSend above deletes the line, and onSessionsChanged records
   the prompt against whatever session id that send turns out to create. */
function askFromPrompt(taskId, text, raw){
  const loc = locate(taskId);
  if (!loc) return;
  const key = chatKeyFor(loc.task, true);
  state.pendingPromptRun = raw ? { key, raw } : null;
  refreshView();
  chat.openNew(taskId, key, text);
}

// The task's own title and description, so a fresh chat opens with something
// to work from rather than a blank box — seeded the same unsent way
// askFromPrompt() seeds an authored prompt.
function taskDescription(t){
  const notes = dedent(bodyParts(t).notes);
  return notes ? t.title + '\n\n' + notes : t.title;
}

function newChat(taskId){
  const loc = locate(taskId);
  if (!loc) return;
  const key = chatKeyFor(loc.task, true);
  // Not seeded from a suggestion, so nothing here is "a prompt run" — a
  // stale pending one from a modal opened and abandoned must not have its
  // line deleted by a send that has nothing to do with it.
  state.pendingPromptRun = null;
  refreshView();
  chat.openNew(taskId, key, taskDescription(loc.task));
}

/* The list on a task and the prompt's "Ask Claude" button both land here,
   sharing the listener the drawer and board already use for everything else.
   The card itself — .cvbody to open, .cvclose to take it off the board — is
   the same markup the canvas draws and wires through wireCanvas(); openCard()
   below is shared between the two rather than written twice. */
function handleAsk(e){
  const ask = e.target.closest('.askclaude');
  if (ask) { askFromPrompt(ask.dataset.task, ask.dataset.ask || '', ask.dataset.raw || ''); return; }
  const body = e.target.closest('.cvbody');
  if (body) { openCard(body); return; }
  const close = e.target.closest('.cvclose');
  if (close) { closeCard(close.dataset.owner, close.dataset.session); return; }
  const fresh = e.target.closest('.aic-addsub');
  if (fresh && !fresh.classList.contains('aic-attach')) { newChat(fresh.dataset.owner); return; }
  const attach = e.target.closest('.aic-attach');
  if (attach) openAttachPicker(attach.dataset.owner);
}



/* =========================================================================
   The canvas — conversations with Claude, grouped by the task they belong to.

   Two things make this different from the Electron canvas next door, and both
   come from what this board already is:

   A group here is a task, not a project invented for the purpose. Claude Code
   has no idea what a piece of work is, so ai_canvas had to make projects up
   and store them. This board has had tasks all along, with ids that survive a
   rename, a reorder and a move between buckets, and the `chat:` key on a task
   line is already how conversations are filed against it. So the canvas groups
   by something that exists rather than keeping a second grouping beside it.

   And nothing here starts a session. This is a view of filing: which
   conversations are open and what work each belongs to. The one thing it
   writes to todo.md is a `chat:` key, minted when a card is dropped onto a
   task that has never had one, which is the same write the drawer already
   makes when you start a chat from a task.

   The arithmetic — where a card sits, the box around a group, the box's
   refusal to shrink below what is in it — is cards.js in the chat engine,
   shared with ai_canvas rather than written twice.
   ========================================================================= */

/* A loose conversation belongs to no task. Its owner key is minted with this
   prefix so it is recognisable on sight in sessions.json, and so nothing ever
   mistakes it for a task's key. The engine's OWNER_KEY pattern allows letters,
   digits, dash and underscore, which is why this is a dash rather than the
   colon that would read better. */
const LOOSE_PREFIX = 'canvas-';
function isLoose(key){ return String(key || '').startsWith(LOOSE_PREFIX); }

/* Every task on the list that carries a chat key, by key. Rebuilt per draw
   rather than cached: a task can gain a key at any point, and a stale map is
   how a card ends up in the wrong box. */
function tasksByChatKey(){
  const map = {};
  if (!state.doc) return map;
  state.doc.buckets.forEach(b => b.tiers.forEach(ti => ti.tasks.forEach(t => {
    if (t.chat) map[t.chat] = t;
  })));
  return map;
}

/* The canvas model: one entry per owner that has conversations, each either a
   task with a box or a loose card with none.

   An owner key pointing at no task is loose. That covers two cases and treats
   them the same on purpose: a conversation started loose, and one whose task
   has since been archived out of todo.md. Both are conversations with no work
   attached, the transcripts survive either way, and re-filing one is the same
   gesture. */
function canvasModel(){
  const byKey = tasksByChatKey();
  const groups = [];
  const loose = [];
  Object.keys(state.chats || {}).forEach(key => {
    const rows = (state.chats[key] || []).slice()
      .sort((a, b) => String(b.updated || '').localeCompare(String(a.updated || '')));
    if (!rows.length) return;
    const task = byKey[key];
    if (task) groups.push({ key, task, rows });
    else rows.forEach(row => loose.push({ key, row }));
  });
  groups.sort((a, b) => a.task.title.localeCompare(b.task.title));
  return { groups, loose };
}

/* ---- The geometry store ----
   Read once on load, written back debounced. A card the store has never seen
   is laid out where the model puts it and written down on the next save, so
   an arrangement builds itself the first time the canvas is opened rather
   than needing every card placed by hand. */
async function loadCanvasStore(){
  if (state.canvasLoaded) return;
  state.canvasLoaded = true;
  try {
    const res = await fetch('/canvas.json', { cache: 'no-store' });
    if (!res.ok) return;
    const data = await res.json();
    state.canvas = {
      version: 1,
      cards: (data && data.cards) || {},
      boxes: (data && data.boxes) || {},
      viewed: (data && data.viewed) || {}
    };
  } catch (err) { /* no helper, no stored layout — the canvas lays itself out */ }
}

/* Opening a card is what "read" means — the same rule sessionPool.ts uses
   in ai_canvas, just kept here instead: this board has no live process to
   ask, so the unread flag is only ever a comparison against when the card
   was last opened, not something a running session reports on its own. */
function markCanvasViewed(id){
  state.canvas.viewed = state.canvas.viewed || {};
  state.canvas.viewed[id] = new Date().toISOString();
  saveCanvas();
  renderCanvas();
}

let canvasSaveTimer = null;
function saveCanvas(){
  // A locked tab cannot write anything, layout included. Same guard the file
  // save uses, and for the same reason — a backup preview is a look at
  // something that was, not a thing to rearrange.
  if (state.locked) return;
  clearTimeout(canvasSaveTimer);
  canvasSaveTimer = setTimeout(() => {
    // Checked again on the way out, not just on the way in. Half a second is
    // long enough to drag a card and then open a backup preview, and a write
    // scheduled by the live tab should not land after the tab has been locked.
    if (state.locked) return;
    fetch('/canvas', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
      body: JSON.stringify(state.canvas)
    }).catch(() => { /* the layout is not worth an error message */ });
  }, 500);
}

/* Where a card sits, from the store or from a first-time layout. Cards are
   dealt out inside their group's box, groups down the canvas in the order
   the model put them, and loose cards in a column of their own on the left. */
function layoutCanvas(model){
  const C = window.AICards;
  const cards = {};          /* session id -> geometry */
  const boxes = {};          /* owner key   -> rect */
  const stored = state.canvas.cards || {};
  const GAP = C ? C.LAYOUT.gap : 20;
  const CARD_W = 280, CARD_H = 108;

  let y = 60;
  model.groups.forEach(group => {
    let x = 260;
    group.rows.forEach(row => {
      const held = stored[row.id];
      cards[row.id] = held
        ? { x: held.x, y: held.y, width: CARD_W, height: CARD_H, z: held.z || 1 }
        : { x: x, y: y, width: CARD_W, height: CARD_H, z: 1 };
      x += CARD_W + GAP;
    });
    const members = group.rows.map(r => ({ id: r.id, geometry: cards[r.id] }));
    const held = state.canvas.boxes[group.key];
    boxes[group.key] = C
      ? C.containBox(held, members, {}, { fallbackHeight: CARD_H })
      : held || null;
    // Only advance the default row when this group used one. A group whose
    // cards were all placed by hand should not push the next group down the
    // canvas to make room for a row it never occupied.
    if (group.rows.some(r => !stored[r.id])) y += CARD_H + 90;
  });

  let ly = y + 20;
  model.loose.forEach(item => {
    const held = stored[item.row.id];
    cards[item.row.id] = held
      ? { x: held.x, y: held.y, width: CARD_W, height: CARD_H, z: held.z || 1 }
      : { x: 40, y: ly, width: CARD_W, height: CARD_H, z: 1 };
    if (!held) ly += CARD_H + GAP;
  });

  return { cards, boxes };
}

/* When a conversation last did anything, in the words the drawer already
   uses for the same rows. */
function cvWhen(iso){
  if (!iso) return '';
  const then = new Date(iso);
  if (isNaN(then)) return '';
  const days = Math.round((startOfDay(new Date()) - startOfDay(then)) / 86400000);
  if (days <= 0) return 'today';
  if (days === 1) return 'yesterday';
  if (days < 7) return days + ' days ago';
  return then.toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
}
function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }

function cvCardHTML(row, ownerKey, ownerLabel, isLooseCard){
  // Unread since the canvas last saw it opened — state.canvas.viewed is
  // furniture, same as position, so it survives a reload. A row with no
  // `updated` (shouldn't happen) never lights up rather than always doing so.
  const viewedAt = (state.canvas.viewed || {})[row.id];
  const unread = !!row.updated && (!viewedAt || row.updated > viewedAt);
  return '<article class="cvcard" data-session="' + esc(row.id) + '"' +
      ' data-owner="' + esc(ownerKey) + '">' +
    '<div class="cvgrip" title="Drag to move. Drop on a task to file it there.">⠿</div>' +
    '<button type="button" class="cvclose" data-session="' + esc(row.id) + '"' +
      ' data-owner="' + esc(ownerKey) + '"' +
      ' title="Take this conversation off the board. The transcript stays on disk.">×</button>' +
    '<button type="button" class="cvbody" data-session="' + esc(row.id) + '"' +
        ' data-owner="' + esc(ownerKey) + '">' +
      '<span class="cvtitle">' + esc(row.title || 'Untitled conversation') +
        (unread ? '<i class="unread-dot" title="New output since you last opened it"></i>' : '') +
      '</span>' +
      '<span class="cvowner' + (isLooseCard ? ' loose' : '') + '">' +
        esc(isLooseCard ? 'Not filed against a task' : ownerLabel) + '</span>' +
      '<span class="cvmeta">' + esc(cvWhen(row.updated)) +
        (row.mode === 'work' ? '<em class="cvmode">can write</em>' : '') +
      '</span>' +
    '</button>' +
  '</article>';
}

function renderCanvas(){
  const host = $('#canvas');
  if (!host) return;
  if (!state.canvasLoaded) { loadCanvasStore().then(renderCanvas); }

  const model = canvasModel();
  const placed = layoutCanvas(model);

  if (!model.groups.length && !model.loose.length) {
    host.innerHTML = '<div class="cvsurface"><div class="cvempty">' +
      '<h2>No conversations yet</h2>' +
      '<p>Every chat you start from a task shows up here, in a box named after ' +
      'that task. Drag a card onto a different box to re-file it, or out of ' +
      'every box to leave it unattached.</p>' +
      '<p>Start one from the AI processes section of any task.</p>' +
      '</div></div>';
    return;
  }

  // Boxes first so they sit behind their cards. Both are absolutely
  // positioned siblings rather than nested, because a card has to be
  // draggable out of its box and nesting would make that a reparent
  // mid-drag rather than a move.
  let html = '<div class="cvsurface">';
  model.groups.forEach(group => {
    const rect = placed.boxes[group.key];
    if (!rect) return;
    const loc = locate(group.task.id);
    const bc = loc ? BUCKET_COLOR[loc.bi % BUCKET_COLOR.length] : 'var(--ink-faint)';
    html += '<section class="cvbox" data-box="' + esc(group.key) + '"' +
        ' style="left:' + rect.x + 'px; top:' + rect.y + 'px;' +
        ' width:' + rect.width + 'px; height:' + rect.height + 'px">' +
      '<header class="cvboxbar" data-box="' + esc(group.key) + '">' +
        '<i class="bkdot" style="background:' + bc + '"' +
          ' title="' + esc(loc ? loc.bucket.name : '') + '"></i>' +
        '<button type="button" class="cvopen" data-task="' + esc(group.task.id) + '"' +
          ' title="Open this task">' + esc(group.task.title) + '</button>' +
        '<span class="cvcount">' + group.rows.length + '</span>' +
      '</header>' +
      '<div class="cvgrow" data-box="' + esc(group.key) + '"' +
        ' title="Drag to resize. It will not go smaller than the cards in it."></div>' +
    '</section>';
  });

  model.groups.forEach(group => {
    group.rows.forEach(row => {
      const g = placed.cards[row.id];
      html += cvCardHTML(row, group.key, group.task.title, false)
        .replace('<article class="cvcard"',
          '<article class="cvcard" style="left:' + g.x + 'px; top:' + g.y + 'px; z-index:' + (10 + g.z) + '"');
    });
  });
  model.loose.forEach(item => {
    const g = placed.cards[item.row.id];
    html += cvCardHTML(item.row, item.key, '', true)
      .replace('<article class="cvcard"',
        '<article class="cvcard" style="left:' + g.x + 'px; top:' + g.y + 'px; z-index:' + (10 + g.z) + '"');
  });
  html += '</div>';
  host.innerHTML = html;

  // Remember what the layout worked out, so a canvas opened once and never
  // touched still comes back the same way rather than being re-derived from a
  // model that may have gained a card since.
  Object.keys(placed.cards).forEach(id => {
    const g = placed.cards[id];
    state.canvas.cards[id] = { x: g.x, y: g.y, z: g.z };
  });
  Object.keys(placed.boxes).forEach(key => {
    if (placed.boxes[key]) state.canvas.boxes[key] = placed.boxes[key];
  });

  wireCanvas(host);
}


/* ---- Moving things about ----
   One pointer handler on the canvas rather than one per card. It is cheaper
   with a few dozen cards on screen, and it keeps a drag working when the
   cursor outruns the card — the same call ai_canvas made, for the same
   reason.

   A card drags by the strip along its top and opens by its body, which is the
   bargain a window title bar makes: the bar belongs to the furniture, the body
   belongs to the content. Without that split there is no gesture left for
   opening a card, since a card that moves when you press it cannot also be a
   button. */
let cvDrag = null;

/* Opening a card, from wherever it was clicked — the canvas, wired below, or
   the drawer's own stack, wired through handleAsk instead since that markup
   sits inside #dbody rather than #canvas. */
function openCard(el){
  const owner = el.dataset.owner, id = el.dataset.session;
  const task = tasksByChatKey()[owner];
  markCanvasViewed(id);
  chat.openSession(task ? task.id : owner, owner, id);
}

function wireCanvas(host){
  host.querySelectorAll('.cvbody').forEach(el => { el.onclick = () => openCard(el); });
  host.querySelectorAll('.cvopen').forEach(el => {
    el.onclick = e => { e.stopPropagation(); openDrawer(el.dataset.task); };
  });
  host.querySelectorAll('.cvclose').forEach(el => {
    el.onclick = e => { e.stopPropagation(); closeCard(el.dataset.owner, el.dataset.session); };
  });

  // A locked tab can look and open, and cannot rearrange — the same line
  // every other view draws.
  if (state.locked) return;

  host.onpointerdown = e => {
    const grip = e.target.closest('.cvgrip');
    const bar = e.target.closest('.cvboxbar');
    const grow = e.target.closest('.cvgrow');
    if (!grip && !bar && !grow) return;
    if (e.target.closest('.cvopen') || e.target.closest('.cvclose')) return;
    e.preventDefault();

    if (grow) {
      const box = grow.closest('.cvbox');
      cvDrag = {
        kind: 'resize', el: box, key: box.dataset.box,
        dx: e.clientX, dy: e.clientY,
        ow: box.offsetWidth, oh: box.offsetHeight
      };
    } else if (grip) {
      const card = grip.closest('.cvcard');
      cvDrag = {
        kind: 'card', el: card, id: card.dataset.session, from: card.dataset.owner,
        dx: e.clientX, dy: e.clientY,
        ox: parseFloat(card.style.left) || 0, oy: parseFloat(card.style.top) || 0
      };
      card.classList.add('dragging');
      card.style.zIndex = 999;
    } else {
      const box = bar.closest('.cvbox');
      const key = box.dataset.box;
      const cards = [...host.querySelectorAll('.cvcard')]
        .filter(c => c.dataset.owner === key)
        .map(c => ({ el: c, ox: parseFloat(c.style.left) || 0, oy: parseFloat(c.style.top) || 0 }));
      cvDrag = {
        kind: 'box', el: box, key: key, cards: cards,
        dx: e.clientX, dy: e.clientY,
        ox: parseFloat(box.style.left) || 0, oy: parseFloat(box.style.top) || 0
      };
    }
    host.setPointerCapture(e.pointerId);
  };

  host.onpointermove = e => {
    if (!cvDrag) return;
    const mx = e.clientX - cvDrag.dx, my = e.clientY - cvDrag.dy;
    if (cvDrag.kind === 'resize') {
      // Live, the box follows the corner freely — including inwards past its
      // own cards, because a gesture that stops dead under your hand feels
      // broken. The floor is applied on release, by cards.js, which is where
      // it belongs: dragging inwards is allowed and simply has no effect
      // below what the box contains.
      cvDrag.el.style.width = Math.max(120, cvDrag.ow + mx) + 'px';
      cvDrag.el.style.height = Math.max(60, cvDrag.oh + my) + 'px';
      return;
    }
    cvDrag.el.style.left = (cvDrag.ox + mx) + 'px';
    cvDrag.el.style.top = (cvDrag.oy + my) + 'px';
    if (cvDrag.kind === 'box') {
      cvDrag.cards.forEach(c => {
        c.el.style.left = (c.ox + mx) + 'px';
        c.el.style.top = (c.oy + my) + 'px';
      });
    } else {
      // Light up the box the card would land in, so dropping is not a guess.
      const over = cvBoxUnder(cvDrag.el);
      host.querySelectorAll('.cvbox').forEach(b => {
        b.classList.toggle('over', !!over && b.dataset.box === over && over !== cvDrag.from);
      });
    }
  };

  host.onpointerup = () => {
    if (!cvDrag) return;
    const drag = cvDrag;
    cvDrag = null;
    host.querySelectorAll('.cvbox.over').forEach(b => b.classList.remove('over'));

    if (drag.kind === 'resize') {
      const held = state.canvas.boxes[drag.key] || { x: 0, y: 0 };
      const members = [...host.querySelectorAll('.cvcard')]
        .filter(c => c.dataset.owner === drag.key)
        .map(c => ({
          id: c.dataset.session,
          geometry: {
            x: parseFloat(c.style.left) || 0, y: parseFloat(c.style.top) || 0,
            width: c.offsetWidth, height: c.offsetHeight, z: 1
          }
        }));
      const asked = {
        x: held.x, y: held.y,
        width: parseFloat(drag.el.style.width) || drag.ow,
        height: parseFloat(drag.el.style.height) || drag.oh
      };
      // The same floor the Electron canvas uses, from the same function: a box
      // grows to cover its cards and never shrinks below them.
      const rect = window.AICards
        ? window.AICards.containBox(asked, members, {}) : asked;
      state.canvas.boxes[drag.key] = rect;
      drag.el.style.left = rect.x + 'px';
      drag.el.style.top = rect.y + 'px';
      drag.el.style.width = rect.width + 'px';
      drag.el.style.height = rect.height + 'px';
      saveCanvas();
      return;
    }

    if (drag.kind === 'box') {
      state.canvas.boxes[drag.key] = Object.assign({}, state.canvas.boxes[drag.key], {
        x: parseFloat(drag.el.style.left) || 0,
        y: parseFloat(drag.el.style.top) || 0
      });
      drag.cards.forEach(c => cvRecord(c.el));
      saveCanvas();
      return;
    }

    drag.el.classList.remove('dragging');
    drag.el.style.zIndex = '';
    cvRecord(drag.el);
    saveCanvas();

    const landed = cvBoxUnder(drag.el);
    if (landed === drag.from) return;
    if (landed) return void adoptCard(drag.id, drag.from, landed);
    // Dragged clear of every box. A card that was in one is being taken out
    // of it deliberately; one that was already loose has simply been moved.
    if (!isLoose(drag.from)) void releaseCard(drag.id, drag.from);
  };
}

/* Which box a card is sitting on, by its own centre rather than by overlap —
   a card is wider than the gap between two boxes, so any test based on
   touching would find two of them. */
function cvBoxUnder(cardEl){
  const cx = (parseFloat(cardEl.style.left) || 0) + cardEl.offsetWidth / 2;
  const cy = (parseFloat(cardEl.style.top) || 0) + cardEl.offsetHeight / 2;
  const boxes = state.canvas.boxes || {};
  const hit = Object.keys(boxes).filter(key => {
    const r = boxes[key];
    return r && cx >= r.x && cx <= r.x + r.width && cy >= r.y && cy <= r.y + r.height;
  });
  // Boxes should not overlap, but if two do, the smaller one is the one the
  // eye reads as containing the card.
  hit.sort((a, b) => (boxes[a].width * boxes[a].height) - (boxes[b].width * boxes[b].height));
  return hit[0] || null;
}

function cvRecord(cardEl){
  const id = cardEl.dataset.session;
  const held = state.canvas.cards[id] || {};
  state.canvas.cards[id] = {
    x: parseFloat(cardEl.style.left) || 0,
    y: parseFloat(cardEl.style.top) || 0,
    z: held.z || 1
  };
}

/* ---- Filing a card by dropping it ----
   The third way to file a conversation, alongside starting one from a task and
   attaching one from the terminal. All three end in the same place: a row in
   sessions.json under the task's key.

   The one write to todo.md in the whole canvas is here — a task that has never
   had a conversation gets a `chat:` key minted on its line, exactly as
   starting a chat from its drawer would. It goes through markDirty and the
   ordinary autosave rather than round the side of it. */
async function adoptCard(sessionId, fromKey, toKey){
  const task = tasksByChatKey()[toKey];
  if (!task) return;
  await cvAssign(fromKey, sessionId, toKey);
}

/* Taking a card out of every box. The conversation keeps its transcript and
   its history and stops being filed against the work — which is what you want
   when it wandered off the task it started on. It gets a loose key of its own
   rather than being left under the task's, so the box it came out of stops
   counting it. */
async function releaseCard(sessionId, fromKey){
  await cvAssign(fromKey, sessionId, LOOSE_PREFIX + chat.newOwnerKey());
}

/* ---- Taking a conversation off the board ----
   The same thing the × on a drawer row does, and worth being exact about what
   it is: the row leaves sessions.json, so the board stops listing the
   conversation, and Claude Code's transcript is left exactly where it is. The
   conversation is not deleted, it is unfiled — `claude --resume <id>` still
   opens it, and Claude Desktop still imports it.

   Which is why the wording asks about the board rather than about the
   conversation. "Delete this chat?" would be a promise this cannot keep: the
   file belongs to Claude Code and nothing here should be reaching into it.

   It is still a confirm. Nothing on the board undoes it, and putting a
   conversation back means finding the id again. */
async function closeCard(ownerKey, sessionId){
  const rows = state.chats[ownerKey] || [];
  const row = rows.find(r => r.id === sessionId);
  const label = (row && row.title) || 'this conversation';
  if (!confirm('Take “' + label + '” off the board?\n\n' +
               'It stops being listed here. The transcript stays on disk, so ' +
               'the conversation can still be resumed in Claude Code or opened ' +
               'in Claude Desktop.')) return;

  await chat.forget(ownerKey, sessionId);
  // Its place on the canvas goes with it. Leaving the geometry behind would
  // quietly re-place the card at its old spot if the same session were ever
  // filed again, which is a surprise nobody asked for.
  delete state.canvas.cards[sessionId];
  delete state.canvas.viewed[sessionId];
  saveCanvas();
  await chat.loadSessions();
  renderCanvas();
}

/* The one write onSend's line-deletion above cannot make itself: by the time
   a run's session id exists, the send that started it is long past. Fire and
   forget, the same as saveCanvas() — a session that never gets its prompt
   recorded (server unreachable, tab closed mid-run) has simply lost a nicety,
   not the conversation, which is why nothing here waits on or retries it. */
function notePrompt(ownerKey, sessionId, raw){
  fetch('/claude/note', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
    body: JSON.stringify({ owner: ownerKey, session: sessionId, prompt: raw })
  }).catch(() => {});
}

async function cvAssign(fromKey, sessionId, toKey){
  try {
    const res = await fetch('/claude/assign', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Board': '1' },
      body: JSON.stringify({ owner: fromKey, session: sessionId, to: toKey })
    });
    if (!res.ok) return;
  } catch (err) { return; }
  await chat.loadSessions();
  renderCanvas();
}

/* The prompt's own row. Ask starts a conversation on the task; the link is
   still there for the times the web app is what you wanted. */
function claudeActions(text, taskId, raw){
  if (!claudeOn() || !taskId) return claudeLink(text);
  return '<button type="button" class="askclaude" data-task="' + esc(taskId) + '"' +
    ' data-ask="' + esc(text) + '"' +
    (raw ? ' data-raw="' + esc(raw) + '"' : '') +
    ' title="Starts a chat on this task with the prompt ready to send, running in ' +
    esc(chat.home()) + '">Ask Claude</button>' + claudeLink(text);
}

/* Every Jira note on a task, its sub-steps included. The card marker and the
   panel section both need this, and a task's tickets can sit at either depth. */
function jiraNotes(t){
  const parts = splitBody(t);
  const out = readJiraRun(parts.notes, '');
  parts.steps.forEach(s => out.push.apply(out, readJiraRun(s.notes, s.clean)));
  return out;
}

/* ---- Raising a Jira ticket ----
   Same idea as the Claude link, and the same limit: the URL fills the create
   form in, it does not create anything. CreateIssueDetails!init.jspa opens the
   dialog with the fields already set and waits for Create to be pressed, which
   is the only version of this worth having — a link that raised a ticket on
   somebody's board from a click would be a link nobody could safely put on a
   card.

   Jira wants numeric ids rather than keys, so pid and issuetype come out of
   data/jira.json rather than being written on the task. reporter is per board
   on purpose: DSYS refuses to create without one, and WADE refuses to let it be
   set at all, so one setting could not serve both. */
function jiraBoards(key){
  const cfg = state.jira;
  if (!cfg || !cfg.boards || !cfg.boards.length) return [];
  if (!key) return cfg.boards;
  return cfg.boards.filter(b => String(b.key || '').toUpperCase() === key);
}
function jiraHref(board, note){
  const cfg = state.jira;
  const q = ['pid=' + encodeURIComponent(board.pid),
             'issuetype=' + encodeURIComponent(board.issuetype)];
  if (board.setReporter && cfg.reporter) q.push('reporter=' + encodeURIComponent(cfg.reporter));
  q.push('summary=' + encodeURIComponent(note.summary));
  if (note.description) q.push('description=' + encodeURIComponent(note.description));
  return String(cfg.site).replace(/\/+$/, '') + '/secure/CreateIssueDetails!init.jspa?' + q.join('&');
}
/* Copy is drawn as an icon, not a label, and stays visible without a hover —
   the one action on a suggestion module worth reaching for on sight. Copied
   swaps in the tick for a moment; both are single-path SVGs, same convention
   as the icon buttons in the header. */
const ICON_COPY = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';
const ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 16.17 4.83 12l-1.41 1.41L9 19 21 7l-1.41-1.41z"/></svg>';
function copyBtn(attrs){
  return '<button type="button" class="copy" data-copy="' + esc(attrs.text) + '"' +
    (attrs.html ? ' data-copy-html="' + escAttr(attrs.html) + '"' : '') +
    ' aria-label="Copy" title="' + esc(attrs.title || 'Copy') + '">' + ICON_COPY + '</button>';
}

/* The buttons for one Jira note. A note naming a board nothing is configured
   for still renders, saying so — a note that quietly showed nothing would look
   the same as no note at all, and the summary is worth reading either way.
   That note stays outside .msgextra: it is information, not a control, so
   hiding it behind a hover would hide the reason nothing else is there to
   press. opts.where and opts.dismiss are the same two the drawer already
   needed — see messageHTML just below, which takes them for the same reason. */
function jiraHTML(note, opts){
  opts = opts || {};
  const boards = jiraBoards(note.key);
  /* This is information, not a control, so it reads with the rest of the
     text rather than floating in the corner where a button would sit — it
     explains why nothing is there to press. */
  const noBoard = boards.length ? '' : '<em class="suggwhere draft">' +
    (state.jira ? 'no board configured as ' + esc(note.key) : 'no data/jira.json') + '</em>';
  const extra = (boards.length
    ? boards.map(b =>
        '<a class="tojira" href="' + jiraHref(b, note) + '" target="_blank" rel="noopener"' +
        ' title="Opens the Jira create form on ' + esc(b.name || b.key) + ', filled in and unsubmitted">' +
        'Raise in ' + esc(b.key) + '</a>').join('')
    : '') +
    (opts.dismiss ? dismissBtn(opts.dismiss, opts.dismissDesc) : '');
  return '<div class="msg jira">' +
    '<div class="msgtext">' +
      (opts.where ? '<em class="suggwhere">for: ' + esc(opts.where) + '</em>' : '') +
      mdInline(note.summary) +
      (note.description ? '<em class="jirabody">' + mdInline(note.description) + '</em>' : '') +
      noBoard +
    '</div>' +
    (extra ? '<div class="msgacts"><span class="msgextra">' + extra + '</span></div>' : '') +
  '</div>';
}
function dismissBtn(raw, descRaw){
  return '<button type="button" class="dismiss" data-dismiss="' + esc(raw) + '"' +
    (descRaw ? ' data-dismiss-desc="' + esc(descRaw) + '"' : '') +
    ' title="Remove this suggestion">Dismiss</button>';
}

/* A ready-to-send message, with a button that copies just the message text.
   opts.claude adds the hand-over link beside it. opts.where and opts.draft
   are the drawer's own: several of these can sit on one task there, each
   under its own sub-step, so each needs to say which one and whether it
   still wants editing before it goes — Overview never passes either, since
   one card there is already scoped to one task. opts.dismiss is the raw
   markdown line to remove; rendering the button at all is what turns
   dismissing on, so a caller with nowhere to persist a removal just omits it. */
function messageHTML(text, opts){
  opts = opts || {};
  // opts.dismiss is already the exact raw line, when there is one — the same
  // text a manual Dismiss removes is what "used up by being run" removes.
  const extra = (opts.claude ? claudeActions(text, opts.task, opts.dismiss) : '') +
    (opts.dismiss ? dismissBtn(opts.dismiss) : '');
  return '<div class="msg"><div class="msgtext">' +
      (opts.where ? '<em class="suggwhere">for: ' + esc(opts.where) + '</em>' : '') +
      (opts.draft ? '<em class="suggwhere draft">draft — read it before sending</em>' : '') +
      mdInline(text) +
    '</div>' +
    '<div class="msgacts">' + copyBtn({ text }) +
      (extra ? '<span class="msgextra">' + extra + '</span>' : '') +
    '</div></div>';
}
/* A message is one line, so it goes into a `data-copy` attribute as it stands.
   An agenda is several, and a newline inside an attribute survives the parser but
   only by accident of how it is written, so encode it and stop relying on that. */
function escAttr(s){ return esc(s).replace(/\n/g, '&#10;'); }

/* The agenda for a recurring meeting, shown as the thing it becomes once pasted:
   the meeting date as a title, then Agenda, then real nested bullets. Rendered as
   an actual <ul> rather than as styled indentation, so what is on screen and what
   lands in the document are the same shape rather than two designs of one list.

   `when` is the task's `[due:: ]`, which is the date of the occurrence this
   agenda is for. The block carries no date of its own — see AGENDA_NOTE.

   `opts.prev` renders it as last cycle's, quieter and titled differently, but it
   still carries its own Copy — see the comment on the button below for why.
   `opts.where` is the drawer's own, same reason as messageHTML's. */
function agendaHTML(ag, when, opts){
  opts = opts || {};
  const clip = agendaClipboard(ag, when);
  const title = opts.prev
    ? '<em class="suggwhere">last time' + (ag.date ? ', ' + esc(dueLabel(ag.date)) : '') + '</em>'
    : (when ? '<span class="agdate">' + esc(longDate(when)) + '</span>' : '');
  return '<div class="msg agenda' + (opts.prev ? ' prev' : '') + '">' +
    '<div class="msgtext">' +
      (opts.where ? '<em class="suggwhere">for: ' + esc(opts.where) + '</em>' : '') +
      title +
      '<span class="aglead">Agenda</span>' +
      '<ul class="aglist">' + ag.topics.map(t =>
        '<li>' + mdInline(t.title) +
        (t.context.length
          ? '<ul>' + t.context.map(c => '<li>' + mdInline(c) + '</li>').join('') + '</ul>'
          : '') +
        '</li>').join('') + '</ul>' +
    '</div>' +
    '<div class="msgacts">' +
      /* Last cycle's gets a Copy too, dated with the occurrence the card is
         pointing at now rather than the one it was written for. It reads
         oddly written down and is the right behaviour: the reason to copy a
         past agenda is that the meeting it belonged to was cancelled or
         moved, so what is wanted is those topics under the new date. */
      copyBtn({
        text: clip.text, html: clip.html,
        title: opts.prev
          ? 'Copies these topics under the date on the card now, for a meeting that moved'
          : 'Copies the title and the bullets. Pasted into Google Docs they stay real bullets, both levels'
      }) +
    '</div>' +
  '</div>';
}
/* ---- Context: standing facts, not tasks ----
   Who is away, whose contract runs out when, how names are spelt. It is the one
   part of the file that is not work and cannot be worked out from the tasks, so
   it is read straight out of the markdown rather than derived. Dates tagged
   on: or until: get a live countdown, since a leave date nobody is counting is
   how a plan ends up depending on somebody who is not there. */
const CTX_DATE = /`(on|until):(\d{4}-\d{2}-\d{2})`/;

function contextBlock(){
  const lines = state.doc.pre.concat(state.doc.post);
  let inside = false;
  const out = [];
  lines.forEach(l => {
    const h = /^##\s+(.*)$/.exec(l);
    if (h) { inside = /^context\b/i.test(h[1].trim()); return; }
    if (inside) out.push(l);
  });
  return out;
}

function contextSection(){
  const lines = contextBlock();
  if (!lines.length) return '';

  let html = '', group = '', items = [];
  // Grouped facts collapse behind their heading — a dozen `###` sections is
  // most of the column's length, and only one is usually the one being read.
  // Anything before the first heading has no title to collapse behind, so it
  // stays open, plain, the way it always has.
  const flush = () => {
    if (!items.length) return;
    html += group
      ? '<details class="ctxgroup"><summary>' + esc(group) + '</summary>' + items.join('') + '</details>'
      : items.join('');
    items = [];
  };

  lines.forEach(l => {
    const s = l.trim();
    if (!s || /^---+$/.test(s)) return;
    const h = /^###\s+(.*)$/.exec(s);
    if (h) { flush(); group = h[1]; return; }
    const b = /^[-*]\s+(.*)$/.exec(s);
    if (!b) return;

    const dm = CTX_DATE.exec(b[1]);
    let chip = '';
    if (dm) {
      const di = dueInfo(dm[2]);
      const past = di.days < 0;
      chip = '<span class="tag due ' + (past ? '' : di.cls) + '">' +
             (dm[1] === 'until' ? 'until ' : '') + esc(di.label) +
             ' · ' + (past ? Math.abs(di.days) + 'd ago' : 'in ' + di.days + 'd') + '</span>';
    }
    items.push('<article class="ref ctx">' +
      // Lifting the date out leaves "back on ." behind, so close the gap it left.
      '<div class="ctxtext">' + mdInline(
        b[1].replace(CTX_DATE, '').replace(/\s+([.,])/g, '$1').replace(/\s{2,}/g, ' ').trim()
      ) + '</div>' +
      (chip ? '<div class="meta">' + chip + '</div>' : '') +
    '</article>');
  });
  flush();
  return html;
}

/* Four tabs. Each reference section is generated from the tags on the tasks,
   so nothing here can name a task that is not on the board. */
function viewDefs(){
  const defs = [
    { id:'overview', label:'Overview' },
    { id:'sep0', sep:true },
    { id:'board',    label:'Board' },
    { id:'matrix',   label:'Matrix' },
    { id:'timeline', label:'Timeline' },
    { id:'sep1', sep:true },
    { id:'plans',    label:'Plans' },
    { id:'sep2', sep:true },
    { id:'reports',  label:'Reports' }
  ];
  // Canvas only exists where there is an engine behind it. Same rule the Ask
  // Claude buttons follow: no CLI, no helper, or a host serving these files
  // statically, and the tab is simply not there rather than being there and
  // empty. It sits before Plans, in the same group, since both are process
  // views rather than spatial ones like Board and Matrix.
  if (state.chatsOn && !state.locked) defs.splice(6, 0, { id:'canvas', label:'AI processes' });
  return defs;
}
/* Backups isn't a view of the board, it's a data operation — see the Backups
   button in the header's data menu — so it sits outside viewDefs() and its
   tabs, but it still needs a #backups URL and a renderView() case of its own. */
function isKnownView(id){
  // 'canvas' is listed by hand rather than read off viewDefs(), which only
  // offers it once the engine has answered. A link is read before that, and a
  // refresh onto #canvas should land on the canvas rather than falling back to
  // the board for the half-second it takes /claude.json to reply.
  return id === 'backups' || id === 'canvas' || viewDefs().some(d => d.id === id);
}

/* =========================================================================
   4b2. Reports — what the file says about work that is already finished.

   Every other view answers "what should I do next". This one answers "what got
   done", which is the question that comes up in a one-to-one or a quarterly
   review and has never had an answer here that did not mean counting by hand.

   Read straight from state.doc, the same as every other view: nothing is
   fetched, nothing is stored, and a report of a backup preview describes that
   backup rather than the live file. Adding a second report means writing one
   more report*Report() that returns HTML and listing it in reportDefs().
   ========================================================================= */

/* Fixed choices rather than a free "since" date — this counts recent output,
   and each option answers "how am I doing lately" at a different grain. The
   30-day default is the one archiving also leaves alone (see the note in
   completedByCategoryReport), so it can never be quietly wrong about its own
   period. Past that, completedRecently() reads the archive to fill in the
   older end, which is what makes 60 and 90 trustworthy rather than a guess —
   90 is a quarter, close enough for the question a quarterly review actually
   asks. "This week" is the calendar week — Monday to today, not a rolling
   seven days — because that is the question Monday standup answers. */
const REPORT_WINDOWS = [
  { id:'week', label:'This week' },
  { id:'7',    label:'Past 7 days',  days:7 },
  { id:'15',   label:'Past 15 days', days:15 },
  { id:'30',   label:'Past 30 days', days:30 },
  { id:'60',   label:'Past 60 days', days:60 },
  { id:'90',   label:'Past 90 days', days:90 },
  /* No window at all: everything the file and the archive between them still
     remember. Last in the list because it is the one that stops answering "how
     am I doing lately" and starts answering "how much is there", which is a
     different question and a slower one — it always reads the archive. */
  { id:'all',  label:'All' }
];
const REPORT_WINDOW_KEY = 'todo-board-report-window';
function readReportWindow(){
  try {
    const saved = localStorage.getItem(REPORT_WINDOW_KEY);
    return REPORT_WINDOWS.some(w => w.id === saved) ? saved : '30';
  } catch (e) { return '30'; }
}
let reportWindow = readReportWindow();
/* Returns whether it actually changed, so the caller knows whether a
   re-render is worth doing. */
function setReportWindow(id){
  if (reportWindow === id || !REPORT_WINDOWS.some(w => w.id === id)) return false;
  reportWindow = id;
  try { localStorage.setItem(REPORT_WINDOW_KEY, id); } catch (e) {}
  return true;
}
function reportWindowStart(){
  if (reportWindow === 'all') return new Date(0);
  if (reportWindow === 'week') {
    const dow = (today().getDay() + 6) % 7;   // Monday = 0
    return new Date(today() - dow * 86400000);
  }
  const def = REPORT_WINDOWS.find(w => w.id === reportWindow);
  return new Date(today() - (def ? def.days : 30) * 86400000);
}
/* A function rather than a const, for two reasons: it depends on the picker
   above, and ARCHIVE_DAYS is declared further down the file, so a const
   reading either one up here would be evaluated before they exist. */
function reportDays(){
  /* Infinity rather than a large number, so every `age > days` comparison down
     the file lets everything through without anyone having to pick a ceiling —
     and so `> ARCHIVE_DAYS` is true, which is what pulls the archive in. */
  if (reportWindow === 'all') return Infinity;
  return Math.round((today() - reportWindowStart()) / 86400000);
}
/* "This week" reads oddly re-said as "the last 3 days" on a Wednesday, so the
   two kinds of window get their own phrasing everywhere the count is put into
   a sentence. */
function reportWindowPhrase(){
  if (reportWindow === 'all') return 'at any point';
  return reportWindow === 'week' ? 'this week' : 'in the last ' + reportDays() + ' days';
}
/* What the total calls its own period. A bare noun phrase, not the sentence
   fragment above: it is set off by a middot rather than run into the words
   around it, because no single preposition works for "this week", "the last 30
   days" and "all time" at once. */
function reportWindowLabel(){
  if (reportWindow === 'all') return 'all time';
  if (reportWindow === 'week') return 'this week';
  return 'the last ' + reportDays() + ' days';
}

function reportDefs(){
  return [completedByCategoryReport, weeklyTrendReport];
}

/* "27 Aug" — the year is noise inside a 30 day window. */
function reportDay(iso){
  const d = parseDue(iso);
  return d ? d.toLocaleDateString(undefined, { day:'numeric', month:'short' }) : iso;
}

/* ---- Reading past the archive point ----

   Finished work older than ARCHIVE_DAYS can be lifted out of todo.md into
   data/backups/done-archive.md (see "Archiving finished work" further down).
   A window longer than that used to just say so and stop — the older end of
   the count was whatever hadn't been archived yet, which is not a count at
   all. The archive is the same task-line grammar as todo.md, grouped under
   "### Bucket · Tier" headings instead of nested columns, so it is parsed
   with the same parseTask() rather than a second parser.

   Fetched once and cached: the file only grows when Archive is actually used,
   which is rare enough that a stale cache is not a real risk, and the archive
