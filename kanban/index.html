<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do list</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7inIU8L3RleHQ+PC9zdmc+">
<style>
  :root{
    --bg:#f6f7f9; --panel:#ffffff; --ink:#16181d; --ink-soft:#5d636e; --ink-faint:#8b919c;
    --line:#e3e6ea; --line-soft:#eef0f3; --accent:#2f6feb; --accent-ink:#fff;
    --red:#c8322f; --red-bg:#fdecec; --amber:#9a6100; --amber-bg:#fff4e0;
    --green:#1f7a45; --green-bg:#e8f6ed; --chip:#f0f2f5;
    --b1:#2f6feb; --b2:#c8710a; --b3:#7c4ddb; --b4:#1f8a5f; --b5:#b1306b; --b6:#0f7d93;
    --shadow:0 1px 2px rgba(16,20,28,.06), 0 4px 12px rgba(16,20,28,.05);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --panel:#1c1f25; --ink:#e9ebee; --ink-soft:#a5abb6; --ink-faint:#7b818c;
      --line:#2b3038; --line-soft:#23272e; --chip:#262b33;
      --red:#ff8a85; --red-bg:#3a1f1f; --amber:#f0b355; --amber-bg:#3a2c14;
      --green:#6fd398; --green-bg:#16301f;
      --b1:#6aa0ff; --b2:#e8a04a; --b3:#a98cf0; --b4:#57c78f; --b5:#f28cb6; --b6:#5cc3d8;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 16px rgba(0,0,0,.25);
    }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}

  /* ---------- backup preview mode ----------
     A border around the whole viewport plus a sticky bar above the header —
     belt and braces so there is no way to be in this mode and not notice.
     The frame is a fixed overlay rather than a body border, so it can't shift
     layout or get clipped by an inner scroll container. */
  .lockframe{
    position:fixed; inset:0; border:3px solid var(--amber); pointer-events:none; z-index:40;
  }
  .lockbar{
    position:sticky; top:0; z-index:30; display:flex; align-items:center;
    flex-wrap:wrap; gap:8px 10px;
    padding:8px 16px; background:var(--amber-bg); color:var(--amber);
    border-bottom:1px solid var(--amber); font-size:12.5px;
  }
  .lockbar strong{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
  }
  .lockbar .btn{background:var(--panel); border-color:var(--amber); color:var(--ink)}
  /* The header sticks below the bar rather than under it. The offset is the
     bar's real height, measured in syncLockBarHeight, because it was a fixed
     37px and the bar wraps to two lines on a narrow window or a longer label —
     at which point the header stuck too high and the bar covered its buttons.
     The fallback only applies before the first measurement. */
  body.locked header{top:var(--lockbar-h, 37px)}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:20; background:var(--panel);
    border-bottom:1px solid var(--line); padding:10px 16px;
    display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center;
  }
  h1{font-size:15px; font-weight:650; margin:0 4px 0 0; letter-spacing:-.01em}
  .status{font-size:12px; color:var(--ink-faint); white-space:nowrap}
  .status.dirty{color:var(--amber); font-weight:600}
  .spacer{flex:1 1 auto}
  .btn{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:7px; padding:6px 11px; font-size:13px; font-weight:520;
  }
  .btn:hover{border-color:var(--ink-faint)}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
  .btn.primary:disabled{opacity:.45; cursor:default}
  .btn.ghost{border-color:transparent; color:var(--ink-soft)}
  .btn.danger{color:var(--red); border-color:var(--line)}
  .menugroup{display:inline-flex; align-items:center; gap:9px}
  .menulabel{
    font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.04em;
    color:var(--ink-faint);
  }

  .filters{display:flex; flex-wrap:wrap; gap:6px; align-items:center; width:100%}
  .tabs{display:inline-flex; gap:3px; background:var(--chip); padding:3px; border-radius:9px}
  .tab{
    border:1px solid transparent; background:transparent; border-radius:7px;
    padding:5px 11px; font-size:13px; font-weight:560; color:var(--ink-soft);
    display:inline-flex; align-items:center; gap:7px; white-space:nowrap;
  }
  .tab .dot{width:7px; height:7px; border-radius:50%; background:var(--bc); opacity:.5}
  .tab .n{font-size:11px; font-weight:650; color:var(--ink-faint); background:var(--panel); border-radius:5px; padding:0 5px; min-width:19px; text-align:center}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--panel); color:var(--ink); border-color:var(--line); box-shadow:0 1px 2px rgba(16,20,28,.07); font-weight:640}
  .tab.on .dot{opacity:1}
  .tab.on .n{background:var(--chip); color:var(--ink-soft)}
  /* No colour dot: All is not one of the buckets, it is all of them. */
  .taball{font-weight:640}
  .btn.mini{padding:3px 8px; font-size:12px; font-weight:560}
  /* Editing the buckets sits beside the strip rather than inside it: the strip is
     a filter, and a pencil in among the tabs reads as one more thing to filter by.
     Icon only, and faint until it is pointed at, because renaming a bucket is a
     once-a-quarter job and a labelled button that size shouts about it all year. */
  .iconbtn{
    display:inline-flex; align-items:center; justify-content:center;
    width:28px; height:28px; padding:0; border:1px solid transparent; border-radius:7px;
    background:transparent; color:var(--ink-faint);
  }
  .iconbtn svg{width:17px; height:17px; display:block; fill:currentColor}
  .iconbtn:hover{color:var(--ink); background:var(--panel); border-color:var(--line)}
  .iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

  /* ---------- bucket editor ---------- */
  .bkrow{display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--line-soft)}
  .bkrow:last-child{border-bottom:0}
  .bknum{flex:0 0 auto; width:14px; font-size:12px; color:var(--ink-faint); font-variant-numeric:tabular-nums}
  .bkdot{flex:0 0 auto; width:8px; height:8px; border-radius:50%; background:var(--bc)}
  .bkrow input[type="text"]{
    flex:1 1 auto; min-width:0; border:1px solid var(--line); background:var(--panel);
    border-radius:7px; padding:5px 8px; font-size:13px;
  }
  .bkn{
    flex:0 0 auto; min-width:22px; text-align:center; font-size:11px; font-weight:650;
    color:var(--ink-faint); background:var(--chip); border-radius:5px; padding:2px 6px;
  }
  .bkadd{display:flex; gap:8px; margin-top:14px; padding-top:13px; border-top:1px solid var(--line)}
  .bkadd input{
    flex:1 1 auto; min-width:0; border:1px solid var(--line); background:var(--panel);
    border-radius:7px; padding:6px 9px; font-size:13px;
  }
  /* Always in the layout, so an error appearing does not shove the buttons down. */
  .bkerr{margin:11px 0 0; min-height:1.3em; font-size:12.5px; color:var(--red)}
  input[type="search"]{
    border:1px solid var(--line); background:var(--panel); border-radius:7px;
    padding:5px 9px; width:200px;
  }
  label.toggle{font-size:12px; color:var(--ink-soft); display:inline-flex; gap:6px; align-items:center}

  /* ---------- the one thing ----------
     A single bar above the board. Set, it is the loudest thing on the page,
     because that is the point of picking one. Empty, it is a thin dashed strip
     that says what it is for and otherwise stays out of the way. */
  .headline{
    display:flex; align-items:center; gap:14px; margin:0 0 12px; padding:11px 14px;
    border:1.5px dashed var(--line); border-radius:12px; background:transparent;
  }
  .headline.set{
    border-style:solid; border-color:color-mix(in srgb, var(--accent) 40%, transparent);
    background:color-mix(in srgb, var(--accent) 6%, var(--panel)); box-shadow:var(--shadow);
  }
  .headline.over{border-color:var(--accent); background:color-mix(in srgb, var(--accent) 12%, var(--panel))}
  /* Set, the whole bar opens the task, the same as a card. The empty bar has
     nothing to open, so only the set state takes the pointer and the focus ring. */
  .headline.set{cursor:pointer}
  .headline.set:hover{border-color:color-mix(in srgb, var(--accent) 70%, transparent)}
  .headline.set:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .hllabel{
    flex:none; font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink-faint);
  }
  .headline.set .hllabel{color:var(--accent)}
  .hlempty{font-size:12.5px; color:var(--ink-faint)}
  .hlempty strong{font-weight:640; color:var(--ink-soft)}
  .hlmain{flex:1; min-width:0}
  /* Not a button any more: the bar around it is the thing you click, and a button
     inside a button is neither valid nor tabbable in a sensible order. */
  .hltitle{
    font-size:15px; font-weight:600; letter-spacing:-.01em; color:var(--ink); line-height:1.3;
  }
  .headline.set:hover .hltitle{text-decoration:underline}
  .hlmeta{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-top:6px}
  .hlwhere{font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-faint)}
  .tag.unblocks{background:color-mix(in srgb, var(--green) 14%, transparent); color:var(--green)}
  .hlright{flex:none; display:flex; align-items:center; gap:10px}
  .hlage{font-size:11.5px; color:var(--ink-faint)}
  .hldone{font-size:11.5px; font-weight:640; color:var(--green)}
  .hlclear{
    border:1px solid var(--line); background:var(--panel); color:var(--ink-soft);
    border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600;
  }
  .hlclear:hover{color:var(--ink); border-color:var(--ink-faint)}
  /* The panel's own button for the same thing, since dragging is not obvious. */
  .hlset{
    border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:7px;
    padding:7px 9px; width:100%; text-align:left; font-size:13px;
  }
  .hlset:hover{border-color:var(--ink-faint)}
  .hlset.on{
    border-color:color-mix(in srgb, var(--accent) 45%, transparent);
    background:color-mix(in srgb, var(--accent) 8%, var(--bg)); color:var(--accent); font-weight:600;
  }

  /* ---------- intake: what still needs scoring ---------- */
  .scorechip{
    border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:5px 10px;
    font-size:12px; font-weight:620; color:var(--ink-soft); white-space:nowrap;
  }
  .scorechip:hover{color:var(--ink); border-color:var(--ink-faint)}
  .scorechip.on{
    background:var(--amber-bg); color:var(--amber);
    border-color:color-mix(in srgb, var(--amber) 40%, transparent);
  }
  .tag.needsscore{background:var(--amber-bg); color:var(--amber)}

  /* ---------- the matrix ----------
     Nine cells. Impact down the left, effort across the top, so the cheap
     high-impact corner is top-left where the eye lands first. Cells are tinted
     by impact ÷ effort, which makes the gradient run corner to corner and turns
     "where is my work sitting" into something you see rather than count. */
  .mgrid{
    display:grid; grid-template-columns:auto repeat(3, minmax(150px, 1fr));
    gap:6px; margin:14px 0 0;
  }
  /* Both axis names sit in the corner cell, stacked and arrowed, so neither
     overlaps the other and each says which way it runs. */
  .mcorner{
    min-width:74px; display:flex; flex-direction:column; align-items:flex-end;
    justify-content:flex-end; gap:1px; padding:0 9px 8px 0;
  }
  .maxis{
    font-size:9.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase;
    color:var(--ink-faint); white-space:nowrap;
  }
  .mhead{
    padding:0 0 7px; text-align:center; font-size:12.5px; font-weight:700;
    color:var(--ink-soft); display:flex; flex-direction:column; gap:2px;
  }
  .mhead .mhint{font-size:10.5px; font-weight:500; color:var(--ink-faint)}
  .mside{
    display:flex; align-items:center; justify-content:flex-end; padding-right:9px;
    font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    color:var(--ink-soft); min-width:62px;
  }
  .mcell{
    border:1px solid var(--line); border-radius:10px; padding:8px 9px 9px; min-height:96px;
    display:flex; flex-direction:column; gap:7px;
    /* --w is impact ÷ effort, 0.33 to 3. Divided by 3 it drives the tint. */
    background:color-mix(in srgb, var(--accent) calc(var(--w,1) * 4%), var(--panel));
  }
  .mcell.first{border-color:color-mix(in srgb, var(--accent) 50%, transparent)}
  .mcell.empty{background:transparent; border-style:dashed}
  .mcellhead{display:flex; align-items:baseline; gap:6px}
  .madvice{flex:1; font-size:11px; font-weight:620; color:var(--ink-soft); line-height:1.3}
  .mcell.first .madvice{color:var(--accent)}
  .mcell.empty .madvice{color:var(--ink-faint); font-weight:550}
  .mcount{font-size:11px; font-weight:700; color:var(--ink-faint)}
  .mdots{display:flex; flex-wrap:wrap; gap:5px; align-content:flex-start}
  /* One task. Bucket colour carries which area it belongs to, the title is on
     hover, and a click opens the real card — so nothing is lost by shrinking it. */
  .mdot{
    width:14px; height:14px; border-radius:50%; border:0; padding:0; flex:none;
    background:var(--bc); opacity:.85; cursor:pointer;
  }
  .mdot:hover{opacity:1; transform:scale(1.25)}
  .mdot:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .mdot.urgent{box-shadow:0 0 0 2px var(--red-bg), 0 0 0 3px color-mix(in srgb, var(--red) 55%, transparent)}
  .mdot.hl{box-shadow:0 0 0 2px var(--panel), 0 0 0 4px var(--accent)}
  /* The real card, floating beside the dot. Fixed so the scrolling column it
     lives in cannot clip it, and inert so it cannot intercept the click. */
  .mpreview{
    position:fixed; left:0; top:0; z-index:40; width:252px; pointer-events:none;
    opacity:0; transform:translateY(3px); transition:opacity .12s ease, transform .12s ease;
  }
  .mpreview.on{opacity:1; transform:none}
  .mpreview .card{
    cursor:default; border-color:var(--ink-faint);
    box-shadow:0 10px 28px rgba(10,12,16,.24), 0 2px 6px rgba(10,12,16,.14);
  }
  .mpreview .card.done{opacity:1}      /* a preview is for reading, not for dimming */
  @media (prefers-reduced-motion:reduce){
    .mpreview{transition:none}
  }
  .mlegend{display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:0 0 4px}
  .mkey{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink-soft)}
  .mkey i{width:10px; height:10px; border-radius:50%; background:var(--bc); flex:none}
  .mkeyhl i{background:transparent; box-shadow:0 0 0 2px var(--accent)}
  .mkeyurg i{background:var(--ink-faint); box-shadow:0 0 0 1.5px var(--bg), 0 0 0 3px color-mix(in srgb, var(--red) 55%, transparent)}
  .mread{margin:6px 0 0 !important; font-size:12.5px !important; color:var(--ink-soft) !important}
  .mread strong{font-weight:700; color:var(--ink)}
  /* Tasks with a score missing cannot be placed, so they sit under the grid
     rather than being dropped. A dropped task is one he never scores. */
  .mtray{
    margin-top:12px; padding:10px 11px; border:1px dashed color-mix(in srgb, var(--amber) 45%, transparent);
    background:var(--amber-bg); border-radius:10px;
  }
  .mtrayhead{display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline; margin-bottom:8px}
  .mtrayhead strong{font-size:12.5px; font-weight:700; color:var(--amber)}
  .mtrayhead span{font-size:11.5px; color:var(--ink-soft)}
  @media (max-width:720px){
    .mgrid{grid-template-columns:auto repeat(3, minmax(84px, 1fr))}
    .madvice{font-size:10px}
    .mhead .mhint{display:none}
  }

  /* ---------- board ---------- */
  main{padding:14px 16px 40px; overflow-x:auto}
  /* --cols is set from the number of sections found in the file. */
  .board{
    display:grid; gap:12px; align-items:start;
    grid-template-columns:repeat(var(--cols,5), minmax(230px,1fr));
    min-width:calc(var(--cols,5) * 242px);
  }
  /* Columns stay on one row and the board scrolls sideways when the window is
     narrow — wrapping them would break the left-to-right order of the flow. */
  .col.donecol{background:transparent; border-style:dashed}
  .col.donecol h2{color:var(--ink-faint)}
  /* Done work should recede far enough that the eye skips it, but stay readable
     on hover so the column is still a record you can check. */
  .col.donecol .card{opacity:.38}
  .col.donecol .card:hover{opacity:1}
  .col{background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; min-height:120px}
  .col h2{
    margin:0; padding:11px 13px 9px; font-size:12.5px; font-weight:680; letter-spacing:.02em; text-transform:uppercase;
    color:var(--ink-soft); display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line-soft);
  }
  .col h2 .count{margin-left:auto; font-weight:600; color:var(--ink-faint); font-size:12px; letter-spacing:0}
  /* Says which order the column is in, and changes it. Quiet until it is on,
     because "your order" is the normal state and needs no announcing. */
  .sortbtn{
    margin-left:auto; flex:none; border:1px solid transparent; background:transparent; border-radius:6px;
    padding:2px 6px; font-size:11px; font-weight:650; letter-spacing:.02em; text-transform:none;
    color:var(--ink-faint); opacity:.55;
  }
  .col:hover .sortbtn{opacity:1}
  .sortbtn:hover{color:var(--ink); border-color:var(--line)}
  .sortbtn.on{
    color:var(--accent); border-color:color-mix(in srgb, var(--accent) 35%, transparent);
    background:color-mix(in srgb, var(--accent) 8%, transparent); opacity:1; font-size:10.5px;
  }
  .col h2 .sortbtn + .count{margin-left:8px}
  .col .hint{font-size:11px; font-weight:500; text-transform:none; letter-spacing:0; color:var(--ink-faint)}
  .drop{padding:9px; display:flex; flex-direction:column; gap:8px; flex:1}
  .drop.over{background:color-mix(in srgb, var(--accent) 7%, transparent)}
  /* Where the card being dragged will land. Sits in the gap between two cards,
     so the line is the answer to "in front of which one?". */
  .dropline{
    flex:none; height:3px; border-radius:2px; background:var(--accent); position:relative;
  }
  .dropline::before, .dropline::after{
    content:""; position:absolute; top:-2px; width:7px; height:7px; border-radius:50%; background:var(--accent);
  }
  .dropline::before{left:-3px}
  .dropline::after{right:-3px}
  .col footer{padding:0 9px 10px}
  .addbtn{width:100%; border:1px dashed var(--line); background:transparent; color:var(--ink-faint); border-radius:8px; padding:7px; font-size:12.5px}
  .addbtn:hover{color:var(--ink); border-color:var(--ink-faint)}
  .empty{color:var(--ink-faint); font-size:12.5px; padding:6px 4px 10px}

  /* ---------- lists view ---------- */
  /* CSS columns rather than grid: sections are wildly different heights, and
     columns pack them without leaving the row-sized gaps a grid would. */
  .lists{columns:2; column-gap:12px; max-width:1180px}
  /* Overview puts every section in its own column, like the board. It never
     stacks: when the window is narrow the row scrolls sideways instead. */
  .lists.split{
    columns:auto; max-width:none; display:grid; align-items:start; gap:14px;
    grid-template-columns:repeat(var(--refcols,4), minmax(380px,1fr));
    min-width:calc(var(--refcols,4) * 394px);
  }
  .lists.split .listcard{margin:0}
  /* Matrix pairs the nine cells with the dependency chain beside them. The grid
     keeps the room it needs and the chain takes a fixed reading width, rather
     than the two splitting the window evenly. */
  .lists.mview{
    columns:auto; max-width:none; display:grid; align-items:start; gap:14px;
    grid-template-columns:minmax(620px,1fr) 400px; min-width:1034px;
  }
  .lists.mview .listcard{margin:0}
  /* In a column this narrow, a Copy button sitting beside the text leaves it
     two words wide. Give the text the full row and drop the button under it. */
  .lists.split .msg{flex-wrap:wrap; margin-left:0}
  .lists.split .msgtext{flex:1 1 100%}
  .lists.split .copy{margin-left:auto}
  @media (max-width:820px){ .lists{columns:1} }
  .listcard{
    background:var(--panel); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow);
    padding:14px 16px 16px; margin:0 0 12px; break-inside:avoid; display:inline-block; width:100%;
  }
  .listcard h3{margin:0 0 10px; font-size:13px; font-weight:680; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft)}
  .listcard h4{margin:14px 0 6px; font-size:13px; font-weight:640}
  .listcard p{margin:0 0 9px; color:var(--ink-soft); font-size:13.5px; line-height:1.55}
  .listcard p:last-child{margin-bottom:0}
  .listcard .mdlist{margin:0 0 10px; padding-left:18px; display:flex; flex-direction:column; gap:5px}
  .listcard ul.mdlist{list-style:none; padding-left:0}
  .listcard ol.mdlist{padding-left:20px}
  .listcard li{font-size:13.5px; line-height:1.5}
  .listcard ul.mdlist > li{padding-left:14px; position:relative}
  .listcard ul.mdlist > li::before{content:"·"; position:absolute; left:3px; color:var(--ink-faint); font-weight:700}
  .listcard li.chk{padding-left:24px}
  .listcard li.chk::before{content:none}
  .listcard li.chk .box{
    position:absolute; left:0; top:1px; width:15px; height:15px; border:1px solid var(--line);
    border-radius:4px; font-size:10px; line-height:14px; text-align:center; color:var(--green);
  }
  .listcard li.chk.done{color:var(--ink-faint); text-decoration:line-through}
  .listcard li.chk.done .box{border-color:color-mix(in srgb, var(--green) 45%, transparent)}
  .listcard code{background:var(--chip); padding:1px 5px; border-radius:4px; font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---------- backups view ----------
     Scoped under .backupsview so its .row/.tag/.name/.empty/.err don't collide
     with the task-card classes of the same name used everywhere else. */
  .backupsview h2{
    font-size:12px; font-weight:650; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); margin:20px 0 9px;
  }
  .backupsview h2:first-of-type{margin-top:4px}
  .backupsview .row{
    display:flex; align-items:center; gap:12px; background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:11px 13px; margin-bottom:7px;
  }
  .backupsview .when{font-weight:600; color:inherit; text-decoration:none; min-width:14.5em}
  .backupsview .when:hover{text-decoration:underline}
  .backupsview .ago{color:var(--ink-faint); font-size:12.5px; min-width:8em}
  .backupsview .size{color:var(--ink-faint); font-size:12.5px; min-width:5em; text-align:right}
  .backupsview .tag{
    font-size:11px; font-weight:650; border-radius:5px; padding:2px 7px;
    background:var(--green-bg); color:var(--green);
  }
  .backupsview .tag.session{background:var(--chip); color:var(--ink-soft)}
  .backupsview .name{
    font-size:11.5px; color:var(--ink-faint); font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .backupsview .empty{color:var(--ink-faint); font-size:13px; padding:6px 0 14px}
  .backupsview .err{background:var(--red-bg); color:var(--red); padding:11px 13px; border-radius:9px; font-size:13px}
  .backupsview .loadbtn{flex:none; font-size:12px; padding:4px 10px}
  @media (max-width:640px){
    .backupsview .row{flex-wrap:wrap}
    .backupsview .when, .backupsview .ago, .backupsview .size{min-width:0}
  }

  /* ---------- reports view ----------
     Scoped under .reportsview for the same reason the backups view is scoped:
     .row, .name and .tag already mean something else on a task card. A report
     is a picture of the file at one moment, so nothing in here is clickable
     except the task titles, which open the drawer like anywhere else. */
  /* The report's own name, not a section eyebrow: on this view the h2 is the
     heading you read, so it carries weight instead of shrinking away. */
  .reportsview h2{
    font-size:15px; font-weight:660; color:var(--ink); margin:26px 0 3px; letter-spacing:-.01em;
  }
  .reportsview h2:first-of-type{margin-top:6px}
  .reportsview .window{font-size:12.5px; color:var(--ink-faint); margin:0 0 14px}
  /* The total is the answer to the question; the buckets underneath say where
     it came from. Big enough to read from across the desk. */
  .reportsview .total{
    display:flex; align-items:baseline; gap:10px; background:var(--bg);
    border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:16px;
  }
  .reportsview .totaln{font-size:30px; font-weight:680; line-height:1; color:var(--ink)}
  .reportsview .totall{font-size:13px; color:var(--ink-soft)}
  /* One bucket is a group, not a row: the count and the list behind it are the
     same fact, so the rule goes under the pair. With the rule under the row
     instead, an opened list sat below its own divider and read as the next
     bucket's. */
  .reportsview .bkgroup{border-bottom:1px solid var(--line-soft)}
  .reportsview .bkgroup:last-of-type{border-bottom:0}
  .reportsview .row{display:flex; align-items:center; gap:12px; padding:9px 2px}
  .reportsview .bkname{
    display:flex; align-items:center; gap:8px; min-width:13em; flex:none;
    font-size:13px; font-weight:600; color:var(--ink);
  }
  .reportsview .bkname i{width:9px; height:9px; border-radius:50%; background:var(--bc); flex:none}
  /* The bar is the comparison. It is scaled to the biggest bucket rather than to
     the total, so a quiet month still reads as a shape instead of four slivers. */
  .reportsview .bar{flex:1; min-width:60px; height:9px; background:var(--chip); border-radius:5px; overflow:hidden}
  .reportsview .bar span{display:block; height:100%; background:var(--bc); border-radius:5px}
  .reportsview .n{min-width:2.5em; text-align:right; font-size:14px; font-weight:660; color:var(--ink)}
  .reportsview .pct{min-width:4em; text-align:right; font-size:12.5px; color:var(--ink-faint)}
  .reportsview .zero .n, .reportsview .zero .bkname{color:var(--ink-faint)}
  /* Each bucket can be opened to see which tasks made the number. Closed by
     default: the count is the report, the list is the evidence behind it. */
  /* Indented under the bucket name it belongs to, so the pairing survives a
     glance down the column. */
  .reportsview details{margin:0 0 4px 21px}
  .reportsview summary{
    font-size:12.5px; color:var(--ink-faint); cursor:pointer; padding:2px 2px 8px; list-style:none;
  }
  .reportsview summary::-webkit-details-marker{display:none}
  .reportsview summary::before{content:'▸ '; color:var(--ink-faint)}
  .reportsview details[open] summary::before{content:'▾ '}
  .reportsview summary:hover{color:var(--ink-soft)}
  .reportsview .done{margin:2px 0 12px; padding:0; list-style:none}
  .reportsview .done li{
    display:flex; gap:10px; align-items:baseline; padding:5px 10px; margin-bottom:4px;
    background:var(--bg); border:1px solid var(--line); border-radius:8px;
    border-left:3px solid var(--bc,var(--line));
  }
  .reportsview .done .dt{
    flex:none; min-width:6.5em; font-size:11.5px; color:var(--ink-faint);
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .reportsview .done .tt{
    flex:1; min-width:0; font-size:13px; line-height:1.4; color:var(--ink);
    background:transparent; border:0; padding:0; text-align:left; cursor:pointer;
  }
  .reportsview .done .tt:hover{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
  .reportsview .done .where{flex:none; font-size:11.5px; color:var(--ink-faint)}
  .reportsview .empty{color:var(--ink-faint); font-size:13px; padding:6px 0 14px}
  .reportsview .note{margin:14px 0 0 !important; font-size:12.5px !important; color:var(--ink-faint) !important}
  @media (max-width:640px){
    .reportsview .row{flex-wrap:wrap}
    .reportsview .bkname{min-width:0; flex:1 0 100%}
    .reportsview details{margin-left:0}
    .reportsview .done li{flex-wrap:wrap}
  }

  /* ---------- drawer, read-only ----------
     Disabled controls already grey themselves out; this just makes the footer
     say so instead of offering Delete on something there is nothing to delete
     from. */
  #drawer.readonly #del{display:none}
  #drawer.readonly #dfootHelp{color:var(--amber)}
  .msglead{margin:0 0 4px 14px !important; font-size:12.5px !important; color:var(--ink-faint) !important}
  .msg{
    margin:2px 0 12px 14px; padding:10px 12px; background:var(--bg); border:1px solid var(--line);
    border-left:3px solid var(--accent); border-radius:8px;
    display:flex; gap:10px; align-items:flex-start;
  }
  .msgtext{flex:1; font-size:13px; line-height:1.55; color:var(--ink)}
  .copy{
    flex:none; border:1px solid var(--line); background:var(--panel); color:var(--ink-soft);
    border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600;
  }
  .copy:hover{color:var(--ink); border-color:var(--ink-faint)}
  /* Copy and Open in Claude stack, so a long prompt keeps its full width. */
  .msgacts{flex:none; display:flex; flex-direction:column; gap:6px; align-items:stretch}
  /* Split lists right-align a lone Copy button; stacked, the two want to be
     the same width instead, so that rule is undone in here. */
  .lists.split .msgacts .copy, .msgacts .copy{margin-left:0}
  .toclaude{
    border:1px solid var(--line); background:var(--panel); color:var(--ink-soft);
    border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600;
    text-decoration:none; text-align:center; white-space:nowrap;
  }
  .toclaude:hover{color:var(--ink); border-color:var(--ink-faint)}
  .copy.done{color:var(--green); border-color:color-mix(in srgb, var(--green) 45%, transparent)}
  .copy.warn{color:var(--amber); border-color:color-mix(in srgb, var(--amber) 45%, transparent)}
  .listcard strong{font-weight:640; color:var(--ink)}
  .listcard em{color:var(--ink-faint)}
  .listnote{max-width:1180px; margin:4px 2px 0}
  .listlead{margin:0 2px 10px}   /* one explanation above the columns, not one per column */

  /* ---------- reference cards ----------
     One per real task, in the sections outside the board. Deliberately lighter
     than a board card: a line of title, where it lives, its tags, and only the
     message or prompt where that is the whole point of the entry. Each one is
     bordered so a list of them reads as separate things to act on. */
  .ref{
    position:relative; background:var(--panel); border:1px solid var(--line); border-radius:9px;
    border-left:3px solid var(--bc,var(--line)); padding:9px 11px; margin:0 0 8px;
  }
  .ref:last-child{margin-bottom:0}
  .ref.done{opacity:.42}
  .ref.done:hover{opacity:1}
  .ref.done .reftitle{text-decoration:line-through}
  .refhead{display:flex; align-items:flex-start; gap:7px}
  .reftitle{
    flex:1; min-width:0; font-size:13.5px; font-weight:570; line-height:1.4; color:var(--ink);
    background:transparent; border:0; padding:0; text-align:left; cursor:pointer;
  }
  .reftitle:hover{color:var(--accent); text-decoration:underline; text-underline-offset:2px}
  .refbox{
    flex:none; width:16px; height:16px; margin-top:1px; border:1px solid var(--line);
    border-radius:4px; font-size:10px; line-height:14px; text-align:center; color:var(--green);
    background:var(--bg); padding:0; cursor:pointer;
  }
  .refbox:hover{border-color:var(--ink-faint)}
  .refdrop{
    flex:none; border:1px solid transparent; background:transparent; color:var(--ink-faint);
    border-radius:6px; padding:2px 7px; font-size:11.5px; font-weight:600; cursor:pointer; opacity:0;
  }
  .ref:hover .refdrop, .refdrop:focus-visible{opacity:1}
  .refdrop:hover{color:var(--amber); border-color:color-mix(in srgb, var(--amber) 45%, transparent)}
  .reflink{
    flex:none; border:1px solid var(--line); background:transparent; color:var(--ink-faint);
    border-radius:6px; padding:2px 8px; font-size:11.5px; font-weight:600; cursor:pointer;
  }
  .reflink:hover{color:var(--ink); border-color:var(--ink-faint); background:var(--bg)}
  .refwhere{margin:3px 0 0 21px; font-size:11.5px; color:var(--ink-faint)}
  .ref .meta{display:flex; flex-wrap:wrap; gap:5px; margin:7px 0 0 21px}
  .ref .msg{margin:8px 0 0 21px}
  .ref .msglead, .reflead{margin:7px 0 0 21px; font-size:12px; color:var(--ink-faint)}
  .reflead.draft{color:var(--amber); font-weight:600}
  .refgroup{margin:16px 0 8px !important; font-size:12.5px !important; font-weight:660 !important; color:var(--ink-soft)}
  .refgroup:first-child{margin-top:0 !important}
  .refhint{margin:0 0 10px !important; font-size:12.5px !important; color:var(--ink-faint) !important}
  .refnote{margin:10px 0 0 !important; font-size:12.5px !important; color:var(--ink-faint) !important}
  .refwarn{
    margin:0 0 10px; padding:8px 10px; border:1px solid color-mix(in srgb, var(--amber) 45%, transparent);
    background:color-mix(in srgb, var(--amber) 8%, transparent); border-radius:8px;
    font-size:12.5px; color:var(--ink)
  }
  /* Quieter than refwarn: what was held back is a fact about the list, not a
     problem with it. */
  .refheld{margin:0 0 10px !important; font-size:12px !important; color:var(--ink-faint) !important}
  .refheld strong{font-weight:640; color:var(--ink-soft)}
  .refrow{display:flex; align-items:flex-start; gap:9px}
  .refrow .ref{flex:1; min-width:0}
  .refnum{
    flex:none; width:22px; height:22px; margin-top:9px; border-radius:6px; background:var(--chip);
    color:var(--ink-soft); font-size:11.5px; font-weight:700; line-height:22px; text-align:center;
  }
  .refwaits{display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:7px 0 0; font-size:11.5px; color:var(--ink-faint)}
  .refchip{
    border:1px solid var(--line); background:var(--bg); color:var(--ink-soft); border-radius:6px;
    padding:3px 8px; font-size:11.5px; font-weight:560; cursor:pointer;
  }
  .refchip:hover{color:var(--ink); border-color:var(--ink-faint)}
  .refchip.missing{color:var(--red); border-color:color-mix(in srgb, var(--red) 45%, transparent); cursor:default}
  .empty{font-size:13px; color:var(--ink-faint)}
  /* Context entries are facts, not work: no tick box, no link, nothing to open. */
  .ref.ctx{border-left-color:var(--line); padding:8px 11px}
  .ctxtext{font-size:13px; line-height:1.5; color:var(--ink-soft)}
  /* A string with nowhere to wrap — a pasted URL in Context, a long slug in a
     message — used to run straight out through the side of its card. "anywhere"
     rather than "break-word" so it also stops that string forcing the whole
     column wider than the one it is sitting in. */
  .ref, .msg, .msgtext, .ctxtext{min-width:0}
  .ctxtext, .msgtext, .reftitle, .refchip, .refwaits, .listcard p, .listcard li{overflow-wrap:anywhere}
  .ctxtext strong{color:var(--ink); font-weight:620}
  .ref.ctx .meta{margin:6px 0 0}
  #lists.hidden{display:none}
  .allbuckets{
    font-size:12.5px; font-weight:620; color:var(--ink-soft);
    background:var(--chip); border-radius:7px; padding:6px 11px;
  }
  select#aiFilter{border:1px solid var(--line); background:var(--panel); border-radius:7px; padding:5px 8px}
  .legend{max-width:1180px; margin:2px 0 10px; border:1px solid var(--line); border-radius:12px; background:var(--panel)}
  .legend summary{cursor:pointer; padding:11px 15px; font-size:12.5px; font-weight:640; color:var(--ink-soft); list-style:none}
  .legend summary::-webkit-details-marker{display:none}
  .legend summary::before{content:"▸ "; color:var(--ink-faint)}
  .legend[open] summary::before{content:"▾ "}
  .legend summary:hover{color:var(--ink)}
  .legendbody{padding:0 15px 14px; border-top:1px solid var(--line-soft); padding-top:12px}
  .legendbody p, .legendbody li{color:var(--ink-soft); font-size:13px}
  .legendbody .mdlist{margin:0 0 10px; padding-left:0; list-style:none; display:flex; flex-direction:column; gap:5px}
  .legendbody ul.mdlist > li{padding-left:14px; position:relative}
  .legendbody ul.mdlist > li::before{content:"·"; position:absolute; left:3px; color:var(--ink-faint); font-weight:700}
  .legendbody code{background:var(--chip); padding:1px 5px; border-radius:4px; font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace}

  /* ---------- card ---------- */
  .card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--bc,var(--line));
    border-radius:9px; padding:9px 10px; cursor:grab; box-shadow:0 1px 1px rgba(16,20,28,.04);
  }
  .card:hover{border-color:var(--ink-faint)}
  .card:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  .card.dragging{opacity:.4}
  .card.done{opacity:.34}
  .card.done:hover{opacity:1}
  .card.done .title{text-decoration:line-through}
  .card .row1{display:flex; align-items:center; gap:6px; margin-bottom:5px}
  .bucket{font-size:10.5px; font-weight:700; letter-spacing:.03em; text-transform:uppercase; color:var(--bc)}
  .card .row1 .right{margin-left:auto; display:flex; gap:5px; align-items:center}
  .title{font-size:13.5px; font-weight:570; line-height:1.35; letter-spacing:-.005em}
  .meta{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; align-items:center}
  .tag{font-size:11px; font-weight:600; padding:2px 6px; border-radius:5px; background:var(--chip); color:var(--ink-soft)}
  .tag.impact-high{color:var(--ink)}
  .tag.due{background:var(--chip)}
  /* A start date reads as a gate, not a warning: hollow rather than filled, so a
     deadline still wins the eye on a card carrying both. */
  .tag.startdate{
    background:transparent; border:1px dashed var(--line); color:var(--ink-faint); font-weight:550;
  }
  .tag.due.soon{background:var(--amber-bg); color:var(--amber)}
  .tag.due.over{background:var(--red-bg); color:var(--red)}
  .tag.urgent{background:var(--red-bg); color:var(--red)}
  .tag.ai{background:transparent; border:1px solid var(--line); color:var(--ink-faint); font-weight:550}
  .tag.ai-full{color:var(--green); border-color:color-mix(in srgb, var(--green) 35%, transparent)}
  .tag.ai-partial{color:var(--ink-soft)}
  .mini{font-style:normal; font-size:11px; font-weight:600; color:var(--ink-faint); background:var(--chip); border-radius:4px; padding:1px 5px; margin-left:6px; white-space:nowrap}
  .mini.over{background:var(--red-bg); color:var(--red)}
  .mini.soon{background:var(--amber-bg); color:var(--amber)}
  .prog{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:11px; color:var(--ink-faint)}
  .bar{flex:1; height:3px; border-radius:2px; background:var(--line-soft); overflow:hidden}
  .bar i{display:block; height:100%; background:var(--green)}
  .notecount{font-size:11px; color:var(--ink-faint); margin-top:6px}

  /* ---------- drawer ---------- */
  .scrim{position:fixed; inset:0; background:rgba(10,12,16,.28); opacity:0; pointer-events:none; transition:opacity .15s; z-index:30}
  .scrim.open{opacity:1; pointer-events:auto}
  aside{
    position:fixed; top:0; right:0; height:100%; width:400px; max-width:100vw; z-index:31;
    background:var(--panel); border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(10,12,16,.12);
    transform:translateX(103%); transition:transform .18s ease; display:flex; flex-direction:column;
  }
  aside.open{transform:none}
  aside .dhead{padding:12px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:8px}
  aside .dhead strong{font-size:13px; font-weight:650}
  aside .dbody{padding:14px; overflow:auto; flex:1; display:flex; flex-direction:column; gap:14px}
  aside .dfoot{padding:11px 14px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center}
  .field{display:flex; flex-direction:column; gap:5px}
  .field > span{font-size:11px; font-weight:650; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint)}
  .field input[type="text"], .field input[type="date"], .field select, .field textarea{
    border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:7px 9px; width:100%;
  }
  .field textarea{min-height:200px; resize:vertical; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12.5px; line-height:1.5; white-space:pre-wrap; overflow-wrap:anywhere}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .sublabel{font-style:normal; font-weight:550; text-transform:none; letter-spacing:0; color:var(--ink-faint); opacity:.85; margin-left:6px}
  .substeps{display:flex; flex-direction:column; gap:1px}
  .sub{
    display:flex; gap:7px; align-items:flex-start; font-size:13px; padding:5px 6px; color:var(--ink);
    border:1px solid transparent; border-radius:7px; background:var(--bg);
  }
  .sub:hover{border-color:var(--line)}
  .sub.checked .subtext{color:var(--ink-faint); text-decoration:line-through}
  .sub input{margin-top:3px; flex:none}
  .sub .subtext{flex:1; cursor:text}
  .sub .subtext:hover{color:var(--accent)}
  .sub.checked .subtext:hover{color:var(--ink-faint)}
  .sub .grip{cursor:grab; color:var(--ink-faint); opacity:.45; font-size:13px; line-height:1.5; user-select:none; flex:none}
  .sub:hover .grip{opacity:.9}
  .sub.dragging{opacity:.4}
  .sub.over-top{box-shadow:inset 0 2px 0 var(--accent)}
  .sub.over-bottom{box-shadow:inset 0 -2px 0 var(--accent)}
  .subedit{
    flex:1; border:1px solid var(--accent); background:var(--panel); color:var(--ink);
    border-radius:5px; padding:2px 6px; font-size:13px; font-family:inherit;
  }
  .addsub{
    align-self:flex-start; margin-top:6px; border:1px dashed var(--line); background:transparent;
    color:var(--ink-soft); border-radius:7px; padding:6px 10px; font-size:12.5px; font-weight:600;
  }
  .addsub:hover{border-color:var(--ink-faint); color:var(--ink)}

  /* ---------- date picker ---------- */
  .dpbtn{
    border:1px solid var(--line); background:var(--bg); border-radius:7px; padding:7px 9px;
    width:100%; text-align:left; font-size:13px; color:var(--ink);
  }
  .dpbtn:hover{border-color:var(--ink-faint)}
  .dpbtn.empty{color:var(--ink-faint)}
  .cal{border:1px solid var(--line); border-radius:9px; background:var(--bg); padding:9px 10px 8px}
  .calhead{display:flex; align-items:center; justify-content:space-between; margin-bottom:7px}
  .calhead strong{font-size:12.5px; font-weight:650}
  .calnav{
    border:1px solid var(--line); background:var(--panel); border-radius:6px; width:24px; height:24px;
    color:var(--ink-soft); font-size:14px; line-height:1;
  }
  .calnav:hover{color:var(--ink); border-color:var(--ink-faint)}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:2px}
  .cw{font-size:10px; font-weight:650; color:var(--ink-faint); text-align:center; padding-bottom:3px}
  .cd{
    border:1px solid transparent; background:transparent; border-radius:6px; padding:5px 0;
    font-size:12.5px; color:var(--ink); text-align:center;
  }
  .cd:hover{background:var(--chip)}
  .cd.pad{visibility:hidden}
  .cd.now{font-weight:700; color:var(--accent)}
  .cd.sel{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:650}
  .cd.sel.now{color:#fff}
  .calfoot{display:flex; gap:6px; margin-top:8px; padding-top:7px; border-top:1px solid var(--line-soft)}
  .calsm{
    flex:1; border:1px solid var(--line); background:var(--panel); border-radius:6px; padding:4px 8px;
    font-size:11.5px; font-weight:600; color:var(--ink-soft);
  }
  .calsm:hover{color:var(--ink); border-color:var(--ink-faint)}

  /* ---------- suggestion sections in the panel ---------- */
  .sugg .msg{margin:0 0 7px; padding:9px 11px}
  .sugg .msg:last-of-type{margin-bottom:6px}
  .sugg .msgtext{font-size:12.5px}
  /* Which sub-step the message belongs to. A quiet line, not a heading: the
     message underneath is the thing being read. */
  .suggwhere{
    display:block; font-style:normal; font-size:11.5px; font-weight:550;
    color:var(--ink-faint); margin-bottom:5px; line-height:1.4;
  }
  .suggwhere.draft{color:var(--amber); font-weight:600}

  .dgrip{position:absolute; left:-3px; top:0; bottom:0; width:9px; cursor:col-resize; z-index:2}
  .dgrip::after{content:""; position:absolute; left:3px; top:0; bottom:0; width:3px; background:transparent; transition:background .12s}
  .dgrip:hover::after, .dgrip.active::after{background:var(--accent)}
  body.resizing{cursor:col-resize; user-select:none}
  .help{font-size:11.5px; color:var(--ink-faint); line-height:1.5}
  .datewarn{
    margin:0; padding:8px 10px; border-radius:8px; font-size:12px; line-height:1.45;
    background:var(--red-bg); color:var(--red);
    border:1px solid color-mix(in srgb, var(--red) 40%, transparent);
  }
  .datenote{margin:0; font-size:11.5px; color:var(--ink-faint); line-height:1.5}

  /* ---------- start screen ---------- */
  .start{max-width:560px; margin:8vh auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:26px; box-shadow:var(--shadow)}
  .start h2{margin:0 0 6px; font-size:18px; letter-spacing:-.01em}
  .start p{color:var(--ink-soft); margin:0 0 16px; font-size:13.5px}
  .start .drops{border:1.5px dashed var(--line); border-radius:10px; padding:18px; text-align:center; color:var(--ink-faint); font-size:13px; margin-top:14px}
  .start .drops.over{border-color:var(--accent); color:var(--accent)}
  .err{background:var(--red-bg); color:var(--red); padding:9px 11px; border-radius:8px; font-size:12.5px; margin-top:12px}

  /* ---------- auto-save toggle ---------- */
  .autotoggle{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px;
    color:var(--ink-soft); white-space:nowrap; cursor:pointer;
  }
  .autotoggle input{margin:0; accent-color:var(--accent)}

  /* ---------- conflict modal ----------
     The one place the board interrupts. It only appears when the file on disk
     and the unsaved work in the tab have both moved, because that is the only
     situation where picking wrong loses something. */
  /* Its own class, not the drawer's .scrim — that one is a permanent element
     kept at opacity 0, and sharing the rule would break it. */
  .mscrim{
    position:fixed; inset:0; z-index:60; background:rgba(16,20,28,.45);
    display:flex; align-items:center; justify-content:center; padding:24px;
  }
  .sheet{
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    box-shadow:0 12px 40px rgba(16,20,28,.28); width:min(560px,100%);
    max-height:min(78vh,660px); display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet h2{font-size:15px; font-weight:660; margin:0; letter-spacing:-.01em}
  .sheet .top{padding:18px 20px 12px; border-bottom:1px solid var(--line-soft)}
  .sheet .msub{font-size:13px; color:var(--ink-soft); margin:7px 0 0; line-height:1.5}
  .sheet .mid{padding:14px 20px; overflow:auto; flex:1 1 auto}
  .sheet .foot{
    padding:13px 20px; border-top:1px solid var(--line-soft);
    display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; background:var(--bg);
  }
  .changes{margin:0 0 16px}
  .changes:last-child{margin-bottom:0}
  .changes h3{
    font-size:11px; font-weight:660; text-transform:uppercase; letter-spacing:.06em;
    color:var(--ink-faint); margin:0 0 7px;
  }
  .changes ul{list-style:none; margin:0; padding:0}
  .changes li{
    display:flex; gap:8px; align-items:baseline; font-size:12.5px;
    padding:5px 0; border-bottom:1px solid var(--line-soft); line-height:1.4;
  }
  .changes li:last-child{border-bottom:0}
  .changes .what{
    flex:0 0 auto; font-size:10.5px; font-weight:660; text-transform:uppercase;
    letter-spacing:.04em; border-radius:4px; padding:2px 6px; background:var(--chip); color:var(--ink-soft);
  }
  .changes .what.added{background:var(--green-bg); color:var(--green)}
  .changes .what.removed{background:var(--red-bg); color:var(--red)}
  .changes .what.ticked{background:var(--green-bg); color:var(--green)}
  .changes .what.moved,
  .changes .what.renamed{background:var(--amber-bg); color:var(--amber)}
  .changes .where{color:var(--ink-faint)}
  .changes .none{font-size:12.5px; color:var(--ink-faint)}
  .hidden{display:none !important}
</style>
</head>
<body>

<div class="lockframe hidden" id="lockFrame" aria-hidden="true"></div>
<div class="lockbar hidden" id="lockBar">
  <strong id="lockBarKind">Backup Preview</strong>
  <span id="lockBarLabel"></span>
  <span class="spacer"></span>
  <button class="btn" id="exitLock">Return to today's list</button>
</div>

<header id="hdr" class="hidden">
  <h1>My To-Do list</h1>
  <span class="tabs" id="viewToggle"></span>
  <span class="spacer"></span>
  <span class="status" id="status">read only</span>
  <label class="autotoggle" id="autoWrap" for="autosave"
         title="Saves on its own every 5 minutes, but only when something has changed.">
    <input type="checkbox" id="autosave"> Auto-save
  </label>
  <button class="btn hidden" id="archiveBtn"></button>
  <span class="menugroup" id="dataMenu">
    <span class="menulabel">Data</span>
    <button class="btn" id="reload" title="Re-read the file from disk">Reload</button>
    <button class="btn" id="download">Download copy</button>
    <button class="btn primary" id="save" disabled>Save to file</button>
  </span>

  <div class="filters">
    <span class="tabs" id="bucketFilters"></span>
    <button class="iconbtn" id="editBuckets" aria-label="Edit buckets"
            title="Rename, reorder, add or remove the buckets">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
    <span class="allbuckets hidden" id="allBuckets">All buckets</span>
    <button class="scorechip hidden" id="scoreChip"></button>
    <span class="spacer"></span>
    <span id="aiWrap">
      <label class="toggle" for="aiFilter" title="How much of the task AI can take on">AI can do</label>
      <select id="aiFilter">
        <option value="">Any amount</option>
        <option value="ai">All or part of it</option>
        <option value="full">All of it</option>
        <option value="partial">Part of it</option>
        <option value="none">None of it</option>
      </select>
    </span>
    <input type="search" id="q" placeholder="Search tasks…">
  </div>
</header>

<main id="main">
  <div class="headline hidden" id="headline"></div>
  <div class="board hidden" id="board"></div>
  <div id="lists" class="hidden"></div>
  <section class="start" id="start">
    <h2 id="startTitle">Loading todo.md…</h2>
    <div id="startErr"></div>
    <p style="margin-top:14px"><button class="btn primary" id="retry">Try again</button></p>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <div class="dgrip" id="dgrip" title="Drag to resize · double-click to reset"></div>
  <div class="dhead">
    <strong id="drawerTitle">Edit task</strong>
    <span class="spacer"></span>
    <button class="btn ghost" id="closeDrawer">Close</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot">
    <button class="btn danger" id="del">Delete task</button>
    <span class="spacer"></span>
    <span class="help" id="dfootHelp">Changes apply straight away</span>
  </div>
</aside>

<script>
'use strict';

/* =========================================================================
   1. Markdown  <->  model
   ========================================================================= */

/* The list lives in data/, which is the only folder git ignores and the only
   one Obsidian opens as a vault. The name shown in the header stays todo.md:
   the folder is a fact about where the file is kept, not part of what it is. */
const FILE_URL = '/data/todo.md';
/* The example list, used when there is no real one to read. Absolute rather than
   relative to this page, because a host can serve index.html at the root as
   readily as at /kanban/, and a relative path would only find it in one of the
   two. See loadDemo. */
const DEMO_URL = '/kanban/demo.md';

const TASK_RE   = /^-\s+\[([ xX])\]\s?(.*)$/;
const BUCKET_RE = /^##\s+(\d+)\.\s+(.*)$/;
const TIER_RE   = /^###\s+(.*)$/;
const HR_RE     = /^---\s*$/;

let uidCounter = 0;
const uid = () => 't' + (++uidCounter);

/* Two tag syntaxes, one meaning. `impact`, `effort`, `due` and `ai` moved to
   Dataview's inline-field form on 12 Aug 2026 — `[due:: 2026-08-21]` rather than
   a code span — because those four are what the Dataview queries in views.md
   filter on, and Dataview cannot see inside a code span. The rest stay code
   spans: nothing queries them, and the line is already busy enough.

   Both forms are read everywhere, permanently, not as a migration window. The
   backups, the done-archive and anything he pastes back out of an old snapshot
   are full of the old form, and a board that silently loses the scores off a
   restored task is worse than one that reads both. Only the new form is
   written.

   The bracket pattern insists on the double colon, so `[[a wikilink]]` and
   `[label](a link)` are left alone.

   One pass over both forms rather than one pass each, so an unrecognised tag
   keeps its position on the line instead of drifting to the end of it the next
   time the task is saved. */
const ANY_TAG_RE = /\[([A-Za-z][\w-]*)::\s*([^\]]*)\]|`([A-Za-z][\w-]*):([^`]*)`/g;
/* Every tag form, for stripping a line back to its readable title. */
const ALL_TAGS_RE = /\[[A-Za-z][\w-]*::[^\]]*\]|`[A-Za-z#][\w-]*:?[^`]*`/g;

/* One field, either syntax, or '' when the line does not carry it. */
function readField(text, key){
  const m = new RegExp('\\[' + key + '::\\s*([^\\]]*)\\]|`' + key + ':([^`]*)`', 'i').exec(text);
  if (!m) return '';
  return (m[1] != null ? m[1] : m[2]).trim();
}
function hasField(text, key){
  return new RegExp('\\[' + key + '::|`' + key + ':', 'i').test(text);
}
/* Strips every tag in both syntaxes, leaving the words a human wrote. */
function stripTags(text){
  return text.replace(ALL_TAGS_RE, '').replace(/`(urgent|week)`/g, '');
}

/* Pulls every tag off a task line. The four added on 10 Aug 2026 — #slug, week,
   blocked-by: and rank: — are the sole source for the sections above the board,
   so they are parsed as first-class fields rather than left in `extra`. Anything
   still unrecognised goes to `extra` and is written back untouched. */
function parseTask(rawLines){
  const first = rawLines[0];
  const m = TASK_RE.exec(first);
  let rest = m[2];
  const tags = {};
  const extra = [];                                   // any tag we don't know about, kept verbatim
  let blockedBy = [], rank = null, slug = '', headline = '';
  /* Either syntax lands here, so a tag means the same thing whichever form it
     arrived in. `whole` is what goes into `extra`, which keeps an unrecognised
     tag exactly as it was written. */
  const take = (whole, bk, bv, sk, sv) => {
    const k = bk != null ? bk : sk, v = bk != null ? bv : sv;
    const key = k.toLowerCase();
    if (key === 'impact' || key === 'effort' || key === 'due' || key === 'ai' ||
        key === 'start' || key === 'done') tags[key] = v.trim();
    else if (key === 'blocked-by') blockedBy = v.split(',').map(s => s.trim()).filter(Boolean);
    else if (key === 'rank') rank = parseInt(v.trim(), 10);
    else if (key === 'headline') headline = v.trim();
    else extra.push(whole);
    return ' ';
  };
  rest = rest.replace(ANY_TAG_RE, take);
  rest = rest.replace(/`#([a-z0-9][a-z0-9-]*)`/gi, (whole, s) => { slug = s.toLowerCase(); return ' '; });
  let urgent = false, week = false;
  rest = rest.replace(/`urgent`/g, () => { urgent = true; return ' '; });
  rest = rest.replace(/`week`/g, () => { week = true; return ' '; });
  let title = rest.replace(/\s+/g, ' ').trim();
  const bold = /^\*\*[\s\S]*\*\*$/.test(title);
  if (bold) title = title.slice(2, -2).trim();
  return {
    id: uid(),
    done: m[1].toLowerCase() === 'x',
    title, bold,
    impact: tags.impact || '',
    effort: tags.effort || '',
    due: tags.due || '',
    /* The deadline and the earliest possible start are two different facts. One
       date was doing both jobs, which meant nothing could tell "finish by the
       7th" apart from "cannot begin until the 1st". */
    start: tags.start || '',
    /* The day it was ticked off. Nothing in the file used to record this, so
       "finished a while ago" was unanswerable — which is exactly what archiving
       old finished work needs to know. Written when a task is ticked. */
    doneOn: tags.done || '',
    ai: tags.ai || '',
    urgent, week, slug, blockedBy, rank, headline, extra,
    body: rawLines.slice(1),
    raw: first,
    dirty: false
  };
}

function serializeTask(t){
  let first;
  if (!t.dirty) {
    first = t.raw;
  } else {
    const box = t.done ? '[x]' : '[ ]';
    const name = t.bold === false ? t.title : '**' + t.title + '**';
    const tags = [];
    /* The four Dataview reads are written as inline fields; the rest stay code
       spans. Order is unchanged, so a task rewritten by the board still diffs
       cleanly against one edited by hand. */
    if (t.slug)   tags.push('`#' + t.slug + '`');
    if (t.impact) tags.push('[impact:: ' + t.impact + ']');
    if (t.effort) tags.push('[effort:: ' + t.effort + ']');
    if (t.start)  tags.push('`start:' + t.start + '`');
    if (t.due)    tags.push('[due:: ' + t.due + ']');
    if (t.done && t.doneOn) tags.push('`done:' + t.doneOn + '`');
    if (t.urgent) tags.push('`urgent`');
    if (t.week)   tags.push('`week`');
    if (t.ai)     tags.push('[ai:: ' + t.ai + ']');
    if (t.blockedBy && t.blockedBy.length) tags.push('`blocked-by:' + t.blockedBy.join(',') + '`');
    if (t.rank != null && !isNaN(t.rank)) tags.push('`rank:' + t.rank + '`');
    if (t.headline) tags.push('`headline:' + t.headline + '`');
    if (t.extra && t.extra.length) tags.push.apply(tags, t.extra);
    first = '- ' + box + ' ' + [name].concat(tags).join(' ');
  }
  const body = t.body.slice();
  while (body.length && body[body.length - 1].trim() === '') body.pop();
  return [first].concat(body);
}

/* Everything between the task lines — blank lines, stray prose, the `---` rule at
   the foot of a bucket — is kept verbatim so that saving a file nobody edited
   gives back the same bytes. `lead` is what sits under a column heading, `sep`
   is what follows a task, `tail` is what closes a column, `tail` on the bucket
   is what closes the bucket (so a column added later lands above the rule). */
function parseDoc(text){
  const lines = text.replace(/\r\n?/g, '\n').split('\n');
  const doc = { pre: [], buckets: [], post: [] };
  let i = 0;

  while (i < lines.length && !BUCKET_RE.test(lines[i])) doc.pre.push(lines[i++]);

  while (i < lines.length) {
    const bm = BUCKET_RE.exec(lines[i]);
    if (!bm) break;
    const bucket = { num: bm[1], name: bm[2].trim(), raw: lines[i], intro: [], tiers: [], tail: [] };
    i++;
    while (i < lines.length && !TIER_RE.test(lines[i]) && !/^##\s/.test(lines[i])) bucket.intro.push(lines[i++]);

    while (i < lines.length && TIER_RE.test(lines[i])) {
      const tier = { name: TIER_RE.exec(lines[i])[1].trim(), raw: lines[i],
                     lead: null, tasks: [], tail: [] };
      i++;
      let gap = [];                                   // lines seen since the last task
      while (i < lines.length && !TIER_RE.test(lines[i]) && !/^##\s/.test(lines[i])) {
        const line = lines[i];
        if (TASK_RE.test(line)) {
          if (tier.tasks.length) tier.tasks[tier.tasks.length - 1].sep = gap;
          else tier.lead = gap;
          gap = [];
          const raw = [line];
          i++;
          while (i < lines.length) {
            const l = lines[i];
            if (l.trim() === '') {                       // blank: keep only if the block continues
              let j = i;
              while (j < lines.length && lines[j].trim() === '') j++;
              if (j < lines.length && /^\s+\S/.test(lines[j])) { raw.push.apply(raw, lines.slice(i, j)); i = j; continue; }
              break;
            }
            if (/^\s+\S/.test(l)) { raw.push(l); i++; continue; }  // indented: part of this task
            break;
          }
          tier.tasks.push(parseTask(raw));
        } else {
          gap.push(line);
          i++;
        }
      }
      if (tier.tasks.length) {
        tier.tail = gap;
      } else {
        /* Empty column: the blank line belongs under the heading, anything after
           it closes the column, so a first card lands between the two. */
        let k = 0;
        while (k < gap.length && gap[k].trim() === '') k++;
        tier.lead = gap.slice(0, k);
        tier.tail = gap.slice(k);
      }
      bucket.tiers.push(tier);
    }
    /* Hand the closing blank/rule lines back to the bucket, so they stay at the
       bottom even if a new column is appended. */
    if (bucket.tiers.length) {
      const last = bucket.tiers[bucket.tiers.length - 1];
      let cut = last.tail.length;
      while (cut > 0 && (last.tail[cut - 1].trim() === '' || HR_RE.test(last.tail[cut - 1]))) cut--;
      /* Leave one blank line with the column, so a card appended to it is still
         separated from the rule below. */
      if (cut < last.tail.length && last.tail[cut].trim() === '') cut++;
      bucket.tail = last.tail.slice(cut);
      last.tail = last.tail.slice(0, cut);
    }
    doc.buckets.push(bucket);
  }
  doc.post = lines.slice(i);
  return doc;
}

function serializeDoc(doc){
  const out = doc.pre.slice();
  doc.buckets.forEach(b => {
    out.push(b.raw != null ? b.raw : '## ' + b.num + '. ' + b.name);
    out.push.apply(out, b.intro);
    b.tiers.forEach(tier => {
      out.push(tier.raw != null ? tier.raw : '### ' + tier.name);
      out.push.apply(out, tier.lead != null ? tier.lead : ['']);
      tier.tasks.forEach((t, idx) => {
        out.push.apply(out, serializeTask(t));
        const last = idx === tier.tasks.length - 1;
        out.push.apply(out, last ? (tier.tail || ['']) : (t.sep != null ? t.sep : ['']));
      });
      if (!tier.tasks.length) out.push.apply(out, tier.tail || []);
    });
    out.push.apply(out, b.tail != null ? b.tail : []);
  });
  out.push.apply(out, doc.post);
  return out.join('\n');
}

/* =========================================================================
   2. State
   ========================================================================= */

const state = {
  doc: null,
  originalText: '',
  fileName: 'todo.md',
  dirty: false,
  activeBucket: null,
  query: '',
  aiFilter: '',
  unscoredOnly: false,
  sort: {},           /* column name -> 'priority'; absent means his own order */
  view: 'overview',   /* the view the file opens on */
  openTask: null,
  /* Last-Modified of todo.md as this tab last agreed with it. Used to notice
     edits made outside the board. */
  diskStamp: null,
  drawerWidth: +(localStorage.getItem('todo-board-drawer') || 400),
  /* Backup Preview: state.doc holds an old backup instead of the live file, and
     nothing may write to it. Every mutation path checks this before touching
     anything; see updateLockUI for what it hides. */
  locked: false,
  lockedLabel: '',
  /* Example data is standing in for a list that is not there. It is a kind of
     lock rather than a separate mode, so nothing it renders can be written
     back — see loadDemo for why that matters. */
  demo: false
};
state.sort = readSort();
/* The URL's #slug is the one thing a refresh doesn't wipe, so read it before the
   first render — otherwise every reload snaps back to the default view. */
(function initViewFromHash(){
  const id = location.hash.slice(1);
  if (viewDefs().some(d => d.id === id)) state.view = id;
})();

/* Six, and the fifth used to be the accent blue — which is the first bucket's
   colour, so a fifth bucket came out looking like the first. Nothing could add
   one before, so it never showed. Past six they repeat, which is honest: at that
   point the list is not colour-coded any more whatever we do. */
const BUCKET_COLOR = ['var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)','var(--b6)'];
const DONE_COL = 'Done';
/* The first bucket tab shows every bucket at once. Not a real bucket, so it
   needs a name no heading in the file could ever produce. */
const ALL_BUCKETS = '__all__';
/* Hints match the tier descriptions in the file. Unknown tier names simply
   show no hint, so renaming a section in todo.md never breaks the board. */
const TIER_HINT = {
  'Backlog': 'no time pressure yet',
  'Waiting review': 'done, waiting on someone else',
  'Later':   'no time pressure',
  'To do':   'two to four weeks out',
  'Next':    'after that',
  'Doing':   'current focus, next two weeks',
  'Now':     'current focus',
  'Done':    'ticked off'
};

/* The file lists tiers Now → Backlog. The board shows them the other way
   round, with a Done column on the far right for anything ticked off. */
function boardColumns(){ return allTiers().slice().reverse().concat([DONE_COL]); }

/* =========================================================================
   2b. Tier one: impact against effort
   Every task carries two scores, set when it lands. Together they answer "is
   this worth starting next" — matters a lot, costs little, goes first. A task
   missing either one cannot be placed at all, so the board says so out loud
   rather than quietly sorting it as though it scored zero.
   ========================================================================= */

const IMPACT_N = { high:3, med:2, low:1 };
const EFFORT_N = { S:1, M:2, L:3 };
function unscored(t){ return !IMPACT_N[t.impact] || !EFFORT_N[t.effort]; }
/* Higher comes first. Deliberately impact ÷ effort rather than impact − effort:
   a high/S beats a high/L, and a med/S beats a high/L too, which is the whole
   point of favouring lighter lifts. */
function priorityScore(t){
  if (unscored(t)) return -1;               // sinks below everything that is scored
  return IMPACT_N[t.impact] / EFFORT_N[t.effort];
}
/* Sorting is a way of looking at a column, not a change to the file. His own
   order is the file order and it means something, so priority sort never
   rewrites it — which is also why hand-reordering is off while it is on. */
const SORT_KEY = 'todo-board-sort';
function sortMode(col){ return state.sort[col] === 'priority' ? 'priority' : 'manual'; }
function setSortMode(col, mode){
  if (mode === 'priority') state.sort[col] = 'priority'; else delete state.sort[col];
  try { localStorage.setItem(SORT_KEY, JSON.stringify(state.sort)); } catch (e) {}
}
function readSort(){
  try { return JSON.parse(localStorage.getItem(SORT_KEY) || '{}') || {}; } catch (e) { return {}; }
}

/* =========================================================================
   2c. Tier two: the one thing
   One task at a time carries `headline:<date it was set>`. It is the task that
   makes the others easier or unnecessary, so it is not simply the top of the
   sorted list — it is chosen, and it stays chosen until it is solved.
   ========================================================================= */

function headlineTask(){
  if (!state.doc) return null;
  for (const b of state.doc.buckets)
    for (const ti of b.tiers)
      for (const t of ti.tasks)
        if (t.headline) return { task:t, bucket:b, tier:ti };
  return null;
}
/* Clearing every other one first is what keeps "one thing" true. Two headlines
   in the file is the same failure as a week with two priorities. */
function setHeadline(id){
  if (state.locked) return;
  const loc = locate(id);
  if (!loc) return;
  clearHeadline(true);
  loc.task.headline = ymd(today());
  loc.task.dirty = true;
  markDirty(); refreshView();
  if (state.openTask) openDrawer(state.openTask);
}
function clearHeadline(quiet){
  if (state.locked) return;
  state.doc.buckets.forEach(b => b.tiers.forEach(ti => ti.tasks.forEach(t => {
    if (t.headline) { t.headline = ''; t.dirty = true; }
  })));
  if (quiet) return;
  markDirty(); refreshView();
  if (state.openTask) openDrawer(state.openTask);
}
/* How many live tasks name this one as their blocker. This is the evidence for
   picking it, so the bar shows the number rather than asking him to trust it. */
function unblockCount(t){
  if (!t.slug) return 0;
  return allItems().filter(i => !i.done && i.blockedBy.indexOf(t.slug) > -1).length;
}

/* The board calls this column Backlog, so the file says Backlog too. */
/* Tasks ticked off before the board started dating them have no `done:` at all,
   so nothing can tell whether they were finished yesterday or in March. They are
   stamped with today on first sight: the clock has to start somewhere, and
   starting it now means nothing is archived before it has been sat with for the
   full thirty days. Returns how many were stamped, to say so rather than quietly
   marking the file dirty. */
function stampDoneDates(doc){
  let n = 0;
  const now = ymd(today());
  doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (t.done && !t.doneOn) { t.doneOn = now; t.dirty = true; n++; }
  })));
  return n;
}

function renameParked(doc){
  let changed = false;
  doc.buckets.forEach(b => b.tiers.forEach(t => { if (t.name === 'Parked') { t.name = 'Backlog'; t.raw = null; changed = true; } }));
  if (changed) doc.pre = doc.pre.map(l => l.replace(/\*\*Parked\*\*/g, '**Backlog**'));
  return changed;
}

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function allTiers(){
  const names = [];
  (state.doc ? state.doc.buckets : []).forEach(b => b.tiers.forEach(t => { if (names.indexOf(t.name) < 0) names.push(t.name); }));
  return names.length ? names : ['Now','Next','Later','Parked'];
}
/* A bucket may not have every column heading yet (e.g. an empty "Now").
   Create it in the right place the first time a card lands there. */
function ensureTier(bucket, name){
  const found = bucket.tiers.find(t => t.name === name);
  if (found) return found;
  const tier = { name, raw: null, lead: [''], tasks: [], tail: [''] };
  const order = allTiers();
  const pos = order.indexOf(name);
  let at = bucket.tiers.length;
  for (let i = 0; i < bucket.tiers.length; i++){
    if (order.indexOf(bucket.tiers[i].name) > pos) { at = i; break; }
  }
  bucket.tiers.splice(at, 0, tier);
  return tier;
}
function locate(id){
  const d = state.doc;
  for (let bi = 0; bi < d.buckets.length; bi++){
    const b = d.buckets[bi];
    for (let ti = 0; ti < b.tiers.length; ti++){
      const idx = b.tiers[ti].tasks.findIndex(t => t.id === id);
      if (idx > -1) return { bucket:b, bi, tier:b.tiers[ti], ti, index:idx, task:b.tiers[ti].tasks[idx] };
    }
  }
  return null;
}
/* The single way a task's tick is changed. Five places used to set .done by hand,
   and every one of them would now have to remember to date it — so they all go
   through here instead. Returns true if anything actually changed. */
function setDone(t, on){
  if (state.locked) return false;
  if (t.done === on) return false;
  t.done = on;
  t.doneOn = on ? ymd(today()) : '';
  t.dirty = true;
  return true;
}

function markDirty(){
  if (state.locked) return;
  state.dirty = true;
  $('#save').disabled = false;
  const s = $('#status');
  s.textContent = 'unsaved changes';
  s.classList.add('dirty');
}
/* auto: the board did this on its own — an auto-save, or a reload the watcher
   ran because the file moved under it — so he may not have been looking when it
   happened. Those carry a relative stamp that keeps itself current, because the
   only question you ask of a message you did not trigger is how long it has been
   sitting there. Messages he asked for keep the clock time: he knows when. */
function markClean(msg, auto){
  state.dirty = false;
  $('#save').disabled = true;
  const s = $('#status');
  s.classList.remove('dirty');
  if (auto && msg) { autoStatus(msg); return; }
  statusAgo = null;
  s.textContent = msg;
}

/* The stamp re-renders on a timer rather than being written once, so "just now"
   does not still say that twenty minutes later. */
let statusAgo = null;
function shortAgo(at){
  const mins = Math.floor((Date.now() - at) / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  return hrs === 1 ? 'an hour ago' : hrs + ' hours ago';
}
function autoStatus(msg){
  statusAgo = { at: Date.now(), msg, painted: null };
  paintStatusAgo();
}
function paintStatusAgo(){
  if (!statusAgo) return;
  const s = $('#status');
  // Something else has written to the line since — a save, an archive, the
  // unsaved-changes flag. That message owns the space now, so stand down rather
  // than overwrite it on the next tick.
  if (statusAgo.painted !== null && s.textContent !== statusAgo.painted) { statusAgo = null; return; }
  statusAgo.painted = statusAgo.msg + ' · ' + shortAgo(statusAgo.at);
  s.textContent = statusAgo.painted;
}
setInterval(paintStatusAgo, 30000);

/* =========================================================================
   3. Dates & sub-steps
   ========================================================================= */

function today(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseDue(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((s||'').trim());
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
function dueInfo(s){
  const d = parseDue(s);
  if (!d) return null;
  const days = Math.round((d - today()) / 86400000);
  const label = d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
  let cls = '', note = '';
  if (days < 0)       { cls = 'over'; note = Math.abs(days) + 'd late'; }
  else if (days === 0){ cls = 'over'; note = 'today'; }
  else if (days <= 4) { cls = 'soon'; note = 'in ' + days + 'd'; }
  return { label, cls, note, days };
}
/* `start:` is the earliest the work can begin. Only the future matters — a start
   date that has passed is just history, and showing it would be noise on every
   card that has ever had one. */
function startInfo(s){
  const d = parseDue(s);
  if (!d) return null;
  const days = Math.round((d - today()) / 86400000);
  if (days <= 0) return null;                      // already open, nothing to say
  return {
    days,
    label: 'from ' + d.toLocaleDateString(undefined, { day:'numeric', month:'short' }),
    note: days === 1 ? 'tomorrow' : 'in ' + days + 'd'
  };
}
function notYet(s){ return !!startInfo(s); }
/* The stricter of two start dates. Both may be blank. */
function laterOf(a, b){
  const da = parseDue(a), db = parseDue(b);
  if (!da) return b || '';
  if (!db) return a || '';
  return da > db ? a : b;
}

const SUB_RE = /^(\s*)-\s+\[([ xX])\]\s+(.*)$/;
function subSteps(t){
  const out = [];
  t.body.forEach((line, i) => {
    const m = SUB_RE.exec(line);
    if (!m) return;
    out.push({
      line: i, indent: m[1], done: m[2].toLowerCase() === 'x', text: m[3],
      due: readField(m[3], 'due'),
      clean: stripTags(m[3]).replace(/\s+/g, ' ').replace(/\s*—\s*$/, '').trim()
    });
  });
  return out;
}
function noteLines(t){
  return t.body.filter(l => l.trim() !== '' && !SUB_RE.test(l)).length;
}

/* Notes and sub-steps are edited separately, so split them apart — remembering
   how many notes came before the steps, to put the block back where it was. */
function bodyParts(t){
  const notes = [], subs = [];
  let subsAt = -1;
  t.body.forEach(l => {
    if (SUB_RE.test(l)) { if (subsAt < 0) subsAt = notes.length; subs.push(l); }
    else notes.push(l);
  });
  return { notes, subs, subsAt: subsAt < 0 ? notes.length : subsAt };
}
function rebuildBody(t, notes, subs, subsAt){
  const at = Math.max(0, Math.min(subsAt, notes.length));
  t.body = notes.slice(0, at).concat(subs, notes.slice(at));
}
function moveSub(t, from, to){
  if (state.locked) return;
  const p = bodyParts(t);
  if (from === to || from < 0 || from >= p.subs.length) return;
  const item = p.subs.splice(from, 1)[0];
  p.subs.splice(to > from ? to - 1 : to, 0, item);
  rebuildBody(t, p.notes, p.subs, p.subsAt);
  markDirty();
}
function toggleSub(t, lineIdx){
  if (state.locked) return;
  const m = SUB_RE.exec(t.body[lineIdx]);
  if (!m) return;
  const box = m[2].toLowerCase() === 'x' ? '[ ]' : '[x]';
  t.body[lineIdx] = m[1] + '- ' + box + ' ' + m[3];
  markDirty();
}
/* Replaces the text of one sub-step in place, keeping its indent and tick state.
   The line still carries whatever tags it had — due dates and the rest — since
   the edit box holds the raw line, the same convention the notes textarea uses. */
function setSubText(t, lineIdx, text){
  if (state.locked) return;
  const m = SUB_RE.exec(t.body[lineIdx]);
  if (!m) return;
  t.body[lineIdx] = m[1] + '- [' + m[2] + '] ' + text;
  markDirty();
}
function removeSubLine(t, lineIdx){
  if (state.locked) return;
  t.body.splice(lineIdx, 1);
  markDirty();
}
/* Appends a blank step at the end of the list. It comes back empty rather than
   with placeholder text, because the caller drops straight into editing it. */
function addSub(t){
  if (state.locked) return;
  const p = bodyParts(t);
  p.subs.push('  - [ ] ');
  rebuildBody(t, p.notes, p.subs, p.subsAt);
  markDirty();
}

/* =========================================================================
   4. Render board
   ========================================================================= */

function matchesAi(t){
  const f = state.aiFilter;
  if (!f) return true;
  if (f === 'ai') return t.ai === 'full' || t.ai === 'partial';
  return t.ai === f;
}
function matches(t){
  if (!matchesAi(t)) return false;
  // Scoring a task he has already finished is busywork, so done ones never
  // count as needing it however they are tagged.
  if (state.unscoredOnly && (t.done || !unscored(t))) return false;
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return (t.title + ' ' + t.body.join(' ')).toLowerCase().indexOf(q) > -1;
}

function allMode(){ return state.activeBucket === ALL_BUCKETS; }
function activeBucket(){
  return state.doc.buckets.find(b => b.name === state.activeBucket) || state.doc.buckets[0];
}
/* Which buckets the board draws. The AI filter cuts across every bucket, and so
   do the All tab and the unscored queue, so any of them widens it from the
   single active bucket. Scoring is an intake job: what needs a score in
   Strategic matters as much as what needs one in People. */
function shownBuckets(){
  return (state.aiFilter || allMode() || state.unscoredOnly) ? state.doc.buckets : [activeBucket()];
}

function renderTabs(){
  const wrap = $('#bucketFilters');
  const openIn = b => b.tiers.reduce((m, t) => m + t.tasks.filter(x => !x.done && matches(x)).length, 0);
  const total = state.doc.buckets.reduce((m, b) => m + openIn(b), 0);
  const all = '<button class="tab taball' + (allMode() ? ' on' : '') + '" data-bucket="' + ALL_BUCKETS + '"' +
    ' title="every bucket at once" aria-pressed="' + allMode() + '">All' +
    '<span class="n">' + total + '</span></button>';
  wrap.innerHTML = all + state.doc.buckets.map((b, i) => {
    const on = !allMode() && b === activeBucket();
    return '<button class="tab' + (on ? ' on' : '') + '" data-bucket="' + esc(b.name) + '"' +
      ' title="open tasks" aria-pressed="' + on + '" style="--bc:' + BUCKET_COLOR[i % BUCKET_COLOR.length] + '">' +
      '<i class="dot"></i>' + esc(b.name) + '<span class="n">' + openIn(b) + '</span></button>';
  }).join('');
  wrap.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { state.activeBucket = el.dataset.bucket; renderTabs(); renderBoard(); };
  });
  $('#editBuckets').onclick = openBucketEditor;
}
