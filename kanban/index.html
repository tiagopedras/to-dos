<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do list</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7inIU8L3RleHQ+PC9zdmc+">
<!-- The chat modal's own styling, served live from ai_chat/interface — see ai_chat/README.md. -->
<link rel="stylesheet" href="/ai-chat/chat.css">
<!-- The board's own styling. Absolute rather than relative for the same reason
     DEMO_URL is: the page is served at / on Vercel and at /kanban/ locally, and a
     relative href would only resolve in one of the two. -->
<link rel="stylesheet" href="/kanban/board.css">
</head>
<body>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="lockframe hidden" id="lockFrame" aria-hidden="true"></div>
<div class="lockbar hidden" id="lockBar">
  <strong id="lockBarKind">Backup Preview</strong>
  <span id="lockBarLabel"></span>
  <span class="spacer"></span>
  <button class="btn" id="exitLock">Return to today's list</button>
</div>

<header id="hdr" class="hidden">
  <h1>My To-Do list</h1>
  <span class="tabs" id="viewToggle"></span>
  <span class="spacer"></span>
  <span class="status" id="status">read only</span>
  <button class="btn hidden" id="archiveBtn"></button>
  <span class="menugroup" id="dataMenu">
    <span class="menulabel">Data</span>
    <button class="btn" id="undo" disabled title="Undo the last change (⌘Z)">Undo</button>
    <button class="btn" id="download">Download copy</button>
    <button class="btn" id="backupsBtn">Backups</button>
    <button class="btn" id="scheduleBtn" title="What runs on a clock, and what the usage windows have been doing">Schedule</button>
  </span>
  <!-- Which private folder under data/ the board is pointed at. Hidden until
       loadDatasets() hears back from /datasets.json — an older server with no
       such route leaves the board exactly as it was before this existed. -->
  <span class="menugroup hidden" id="datasetMenu">
    <span class="menulabel">List</span>
    <select id="datasetSelect" title="Switch to-do lists"></select>
  </span>

  <div class="filters">
    <span class="tabs" id="bucketFilters"></span>
    <button class="iconbtn" id="editBuckets" aria-label="Edit buckets"
            title="Rename, reorder, add or remove the buckets">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
    <button class="iconbtn" id="editTiers" aria-label="Edit columns"
            title="Rename, reorder, add or remove the columns (states) tasks move through">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 4h4v16h-4z"/></svg>
    </button>
    <span class="allbuckets hidden" id="allBuckets">All buckets</span>
    <button class="scorechip hidden" id="scoreChip"></button>
    <span class="spacer"></span>
    <span id="aiWrap">
      <label class="toggle" for="aiFilter" title="How much of the task AI can take on">AI can do</label>
      <select id="aiFilter">
        <option value="">Any amount</option>
        <option value="ai">All or part of it</option>
        <option value="full">All of it</option>
        <option value="partial">Part of it</option>
        <option value="none">None of it</option>
      </select>
    </span>
    <span id="urgentWrap">
      <label class="toggle" for="urgentFilter" title="Tasks marked urgent, or with a deadline set">
        <input type="checkbox" id="urgentFilter"> Urgent or due
      </label>
    </span>
    <input type="search" id="q" placeholder="Search tasks…">
  </div>
</header>

<main id="main">
  <div class="headline hidden" id="headline"></div>
  <div class="board hidden" id="board"></div>
  <div id="lists" class="hidden"></div>
<div class="canvas hidden" id="canvas"></div>
  <section class="start" id="start">
    <h2 id="startTitle">Loading todo.md…</h2>
    <div id="startErr"></div>
    <p style="margin-top:14px"><button class="btn primary" id="retry">Try again</button></p>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <div class="dgrip" id="dgrip" title="Drag to resize · double-click to reset"></div>
  <div class="dhead">
    <strong id="drawerTitle">Edit task</strong>
    <span class="spacer"></span>
    <button class="hlpin hidden" id="dheadHl" type="button">Make headline</button>
    <button class="btn ghost" id="closeDrawer">Close</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot">
    <button class="btn danger" id="del">Delete task</button>
    <span class="spacer"></span>
    <span class="help" id="dfootHelp">Changes save automatically</span>
  </div>
</aside>

<!-- The chat modal itself is injected by ai_chat's chat.js the first time a
     chat is opened — see AIChat.create() further down. It sits outside this
     document's own DOM on purpose, same reasoning as before: a chat outlives
     the panel that started it. -->

<!-- The engine and interface live one level up, in ai_chat/, so any app can
     load the same module. server.py serves them at /ai-chat/ straight from
     that sibling folder — see ai_chat/README.md. -->
<script src="/ai-chat/chat.js"></script>
<!-- Where a card sits and the box around a group of them, shared with the
     Electron canvas rather than written twice. A module script, so it is
     deferred and sets window.AICards after this document is parsed — every
     read of it here happens when something is drawn, which is long after. -->
<script type="module" src="/ai-chat/cards.js"></script>
<!-- The to-do format itself: parsing, serialising, sub-steps and recurrence.
     Classic rather than a module, and before the inline script below, because
     that script is classic and inline and would otherwise run first. See the
     header of core/todo.js. -->
<script src="/core/todo.js"></script>
<!-- The board's own script, split into one classic <script> per banner-marked
     section rather than kept as one 7,900-line inline block — see
     IMPROVEMENTS.md, "The rest of index.html could be split the same way".
     Classic and in source order on purpose: separate <script src> tags share
     one global environment the same way one inline script's top-level
     declarations do, as long as nothing runs immediately at the top of an
     earlier file that reaches into a later one — checked section by section
     when this was split, and boot.js last is where the two genuine exceptions
     that turned up now live. Keep new sections in this same list, in the same
     relative order they'd have had inside the old single script. -->
<script src="js/01-markdown-model.js"></script>
<script src="js/02-state.js"></script>
<script src="js/03-tier-one-impact-effort.js"></script>
<script src="js/04-tier-two-the-one-thing.js"></script>
<script src="js/05-undo.js"></script>
<script src="js/06-dates-substeps.js"></script>
<script src="js/07-render-board.js"></script>
<script src="js/08-buckets.js"></script>
<script src="js/09-columns.js"></script>
<script src="js/10-reference-sections.js"></script>
<script src="js/11-canvas.js"></script>
<script src="js/12-reports.js"></script>
<script src="js/13-plans.js"></script>
<script src="js/14-schedule.js"></script>
<script src="js/15-backups.js"></script>
<script src="js/16-backup-preview.js"></script>
<script src="js/17-matrix.js"></script>
<script src="js/18-timeline.js"></script>
<script src="js/19-drawer.js"></script>
<script src="js/20-loading-saving.js"></script>
<script src="js/21-datasets.js"></script>
<script src="js/22-telling-him-what-changed.js"></script>
<script src="js/23-conflict-modal.js"></script>
<script src="js/24-autosave-watching.js"></script>
<script src="js/25-archiving.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
