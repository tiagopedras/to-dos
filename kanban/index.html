      body: lines.slice(1).join('\n').trim()
    });
  })));
  return out;
}

/* An added task and a removed one in the same column, carrying the same
   sub-steps, is one task that was renamed. Saying so is worth the pass: "new"
   plus "deleted" reads like work was lost when nothing was. */
function foldRenames(changes){
  const added = changes.filter(c => c.what === 'added' && c.body);
  const removed = changes.filter(c => c.what === 'removed' && c.body);
  const used = new Set();
  removed.forEach(r => {
    const hit = added.find(x => !used.has(x) && x.body === r.body &&
                                x.bucket === r.bucket && x.tier === r.tier);
    if (!hit) return;
    used.add(hit);
    hit.what = 'renamed';
    hit.where = 'was “' + r.title + '”';
    r.drop = true;
  });
  return changes.filter(c => !c.drop);
}

/* One line per task that moved, in the order they appear in the file. */
function describeChanges(fromText, toText){
  let a, b;
  try { a = flattenDoc(parseDoc(fromText)); b = flattenDoc(parseDoc(toText)); }
  catch (err) { return null; }          // unparseable: better to say nothing than to guess

  const changes = [];
  b.forEach((to, key) => {
    const from = a.get(key);
    if (!from) {
      changes.push({ what:'added', title:to.title, bucket:to.bucket, tier:to.tier, body:to.body,
                     where:to.bucket + ' · ' + (to.done ? DONE_COL : to.tier) });
      return;
    }
    if (from.done !== to.done) {
      changes.push({ what: to.done ? 'ticked' : 'untick', title: to.title,
                     where: to.done ? 'marked done' : 'put back to ' + to.tier });
      return;
    }
    if (from.tier !== to.tier || from.bucket !== to.bucket) {
      changes.push({ what:'moved', title:to.title,
                     where: (from.bucket !== to.bucket ? from.bucket + ' · ' : '') + from.tier +
                            ' → ' + (to.bucket !== from.bucket ? to.bucket + ' · ' : '') + to.tier });
      return;
    }
    if (from.block !== to.block) changes.push({ what:'edited', title:to.title, where:to.bucket + ' · ' + to.tier });
  });
  a.forEach((from, key) => {
    if (!b.has(key)) changes.push({ what:'removed', title:from.title, bucket:from.bucket,
                                    tier:from.tier, body:from.body,
                                    where:'was in ' + from.bucket + ' · ' + from.tier });
  });
  return foldRenames(changes);
}

const CHANGE_LABEL = { added:'new', removed:'deleted', ticked:'done', untick:'reopened',
                       moved:'moved', edited:'edited', renamed:'renamed' };

function changesHTML(title, changes, blank, limit){
  let body;
  if (changes === null) body = '<div class="none">Could not read the details — treat both versions as different.</div>';
  else if (!changes.length) body = '<div class="none">' + esc(blank) + '</div>';
  else {
    const cap = limit || 12;
    const shown = changes.slice(0, cap);
    body = '<ul>' + shown.map(c =>
      '<li><span class="what ' + c.what + '">' + CHANGE_LABEL[c.what] + '</span>' +
      '<span><strong>' + mdInline(c.title) + '</strong>' +
      (c.where ? ' <span class="where">' + esc(c.where) + '</span>' : '') + '</span></li>').join('') +
      '</ul>';
    if (changes.length > cap) {
      body += '<div class="none">…and ' + (changes.length - cap) + ' more.</div>';
    }
  }
  return '<div class="changes"><h3>' + esc(title) +
    (Array.isArray(changes) && changes.length ? ' (' + changes.length + ')' : '') + '</h3>' + body + '</div>';
}

/* =========================================================================
   Conflict modal
   ========================================================================= */

let modalEl = null;

function closeModal(){
  if (modalEl) { modalEl.remove(); modalEl = null; }
  document.removeEventListener('keydown', modalKeys);
}
function modalKeys(e){ if (e.key === 'Escape') closeModal(); }

/* buttons: [{ label, primary, danger, run }] — the first is the safe default.
   opts: { wide } — wide is the document-width variant a written report opens
   in, rather than the confirmation-sized default. */
function showModal(heading, sub, bodyHTML, buttons, opts){
  closeModal();
  modalEl = document.createElement('div');
  modalEl.className = 'mscrim';
  modalEl.innerHTML =
    '<div class="sheet' + (opts && opts.wide ? ' wide' : '') + '" role="dialog" aria-modal="true" aria-label="' + esc(heading) + '">' +
      '<div class="top"><h2>' + esc(heading) + '</h2><p class="msub">' + sub + '</p></div>' +
      '<div class="mid">' + bodyHTML + '</div>' +
      '<div class="foot">' + buttons.map((b, i) =>
        '<button class="btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '') +
        '" data-i="' + i + '">' + esc(b.label) + '</button>').join('') +
      '</div>' +
    '</div>';
  // Clicking the backdrop is a cancel, not a choice. Nothing is decided by it.
  modalEl.onclick = e => { if (e.target === modalEl) closeModal(); };
  modalEl.querySelectorAll('.foot .btn').forEach(btn => {
    btn.onclick = () => { const b = buttons[+btn.dataset.i]; closeModal(); if (b.run) b.run(); };
  });
  document.body.appendChild(modalEl);
  document.addEventListener('keydown', modalKeys);
  const first = modalEl.querySelector('.foot .btn');
  if (first) first.focus();
}

/* Changes of his own, as against the board's own tidy-up on load. Only the
   first kind is worth stopping for. */
function hasOwnChanges(){ return state.dirty && !state.migratedOnly; }

async function reload(){
  if (state.locked) return;
  if (!hasOwnChanges()) return loadFile();
  // Same collision as an outside edit, so it gets the same modal — he can see
  // what he would be throwing away before he throws it away.
  let diskText = null;
  try {
    const res = await fetch(FILE_URL + '?t=' + Date.now(), { cache:'no-store' });
    if (res.ok) diskText = await res.text();
  } catch (err) { /* handled below by the null check */ }
  offerReload(diskText, true);
}

/* The modal both Reload and the outside-edit watcher land in when there is
   something here it would overwrite. diskText may be null if the file could
   not be read, in which case discarding is not offered. */
function offerReload(diskText, manual){
  const mine = describeChanges(state.originalText, serializeDoc(state.doc));
  const theirs = diskText === null ? null : describeChanges(state.originalText, diskText);

  const sub = '<strong>todo.md changed on disk</strong> while you had unsaved changes here. ' +
    'Nothing has been overwritten either way — pick which version wins.';

  const body =
    changesHTML('Your unsaved changes', mine, 'Nothing — your tab matches the file.') +
    (diskText === null
      ? '<div class="changes"><h3>Changed on disk</h3><div class="none">Could not read the file to compare.</div></div>'
      : changesHTML('Changed on disk', theirs, 'Nothing found — the file may only have been re-saved.'));

  const buttons = [{ label:'Keep my changes', primary:true }];
  buttons.push({ label:'Download my copy first', run: () => downloadText(serializeDoc(state.doc), state.fileName) });
  if (diskText !== null) {
    buttons.push({ label:'Discard mine, use the file', danger:true, run: () => {
      try { load(diskText, 'todo.md'); rememberStamp(); closeDrawer(); markClean('reloaded from disk'); }
      catch (err) { alert('Could not read the file on disk: ' + (err.message || err)); }
    }});
  }
  showModal('Two versions of this list', sub, body, buttons);
}

/* =========================================================================
   Auto-save and watching the file

   Two jobs that share one fact: what the file on disk looked like the last time
   this tab agreed with it. Last-Modified is enough — the board is the only
   thing writing, so a changed timestamp means a real change.
   ========================================================================= */

/* No toggle and no button any more — a change on a card, in the sidebar or on
   the board, saves to disk on its own within a few seconds. That is the one
   behaviour now, not an option someone could switch off and forget. */
const AUTOSAVE_MS = 4 * 1000;
const WATCH_MS = 15 * 1000;
let conflictShown = false;

async function diskStamp(){
  try {
    const res = await fetch(FILE_URL, { method:'HEAD', cache:'no-store' });
    if (!res.ok) return null;
    return res.headers.get('Last-Modified') || null;
  } catch (err) { return null; }
}
async function rememberStamp(){ state.diskStamp = await diskStamp(); }

/* Saves only when there is something to save, so an idle tab never touches the
   file and never triggers a backup for no reason. The clock runs from the last
   save, so a manual save (⌘S) also resets the four seconds.

   Checked twice a second rather than on the save interval itself, so a change
   made just after a tick still lands within roughly one interval rather than
   waiting out a second one. Runs regardless of what has focus — a title or
   notes field mid-edit already holds its new value in state.doc, so saving
   under it is safe, and holding off until the field is blurred is exactly the
   wait he asked to remove. */
let lastSaveAt = Date.now();
async function autosaveTick(){
  if (state.locked || !state.doc || !state.dirty || modalEl) return;
  if (Date.now() - lastSaveAt < AUTOSAVE_MS) return;
  await saveFile(true);
}

/* Picks up edits made outside the board — Claude working through the list, or
   the file being changed in an editor. With nothing of his unsaved here,
   reloading is free, so it happens quietly and says so afterwards rather than
   asking first. Only his own unsaved work turns it into a question. */
async function watchTick(){
  if (state.locked || !state.doc || modalEl || conflictShown) return;
  const stamp = await diskStamp();
  if (!stamp) return;                              // helper stopped; saveFile reports that
  if (!state.diskStamp) { state.diskStamp = stamp; return; }
  if (stamp === state.diskStamp) return;

  if (!hasOwnChanges()) {
    try {
      const res = await fetch(FILE_URL + '?t=' + Date.now(), { cache:'no-store' });
      if (!res.ok) return;
      const text = await res.text();
      if (text === state.originalText) { state.diskStamp = stamp; return; }
      const changes = describeChanges(state.originalText, text);
      closeDrawer();                               // ids are rebuilt by the parse
      load(text, 'todo.md');
      state.diskStamp = stamp;
      const n = changes ? changes.length : 0;
      const note = 'reloaded — the file changed on disk' +
        (n ? ' (' + n + ' task' + (n > 1 ? 's' : '') + ')' : '');
      // The fresh parse may have re-run the load-time tidy-up, which is a real
      // pending save. Say what happened without clearing it.
      if (state.migratedOnly) autoStatus(note); else markClean(note, true);
    } catch (err) { /* try again on the next tick */ }
    return;
  }

  // Unsaved work here and a changed file there: his call, not the board's.
  conflictShown = true;
  let diskText = null;
  try {
    const res = await fetch(FILE_URL + '?t=' + Date.now(), { cache:'no-store' });
    if (res.ok) diskText = await res.text();
  } catch (err) { /* offerReload copes with null */ }
  state.diskStamp = stamp;                         // asked once per outside change
  conflictShown = false;
  offerReload(diskText);
}

/* =========================================================================
   Archiving finished work

   A task ticked off a month ago is history, not a list. It comes out of todo.md
   and goes into data/backups/done-archive.md, which is append-only and never pruned —
   so this is a move, not a delete, and the record outlives the backups that
   would otherwise have been the only copy.

   Never automatic. The list shrinking on its own, while the tab is open, is
   indistinguishable from the board losing work.
   ========================================================================= */

const ARCHIVE_DAYS = 30;

function daysSince(iso){
  const d = parseDue(iso);
  return d ? Math.round((today() - d) / 86400000) : null;
}

/* Ticked, dated, and dated long enough ago. An undated done task is left alone:
   without a date there is no claim to make about its age. */
function archivable(){
  const out = [];
  if (!state.doc) return out;
  state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (!t.done || !t.doneOn) return;
    const age = daysSince(t.doneOn);
    if (age != null && age > ARCHIVE_DAYS) out.push({ bucket:b, tier, task:t, age });
  })));
  return out.sort((x, y) => y.age - x.age);
}

function updateArchiveChip(){
  const btn = $('#archiveBtn');
  if (!btn) return;
  if (state.locked) { btn.classList.add('hidden'); return; }
  const n = archivable().length;
  btn.classList.toggle('hidden', n === 0);
  btn.textContent = 'Archive ' + n + ' finished';
  btn.title = n + ' task' + (n === 1 ? '' : 's') + ' ticked off more than ' +
              ARCHIVE_DAYS + ' days ago. Moves them to data/backups/done-archive.md.';
}

/* Grouped by where they were, because "which bucket was this in" is most of what
   makes an archived task findable a year later. */
function archiveMarkdown(list){
  const groups = new Map();
  list.forEach(it => {
    const key = it.bucket.name + ' · ' + it.tier.name;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(it.task);
  });
  const out = [];
  groups.forEach((tasks, key) => {
    out.push('### ' + key, '');
    tasks.forEach(t => { out.push.apply(out, serializeTask(t)); });
    out.push('');
  });
  return out.join('\n');
}

async function archiveOldDone(){
  if (state.locked) return;
  const list = archivable();
  if (!list.length) return;

  const body =
    '<div class="changes"><h3>Moving out of todo.md (' + list.length + ')</h3><ul>' +
    list.slice(0, 40).map(it =>
      '<li><span class="what">' + it.age + 'd</span><span><strong>' + mdInline(it.task.title) +
      '</strong> <span class="where">' + esc(it.bucket.name + ' · ' + it.tier.name) +
      ' · ticked ' + esc(it.task.doneOn) + '</span></span></li>').join('') +
    '</ul>' + (list.length > 40 ? '<div class="none">…and ' + (list.length - 40) + ' more.</div>' : '') +
    '</div>';

  showModal('Archive finished work',
    'These were ticked off more than ' + ARCHIVE_DAYS + ' days ago. They move to ' +
    '<strong>data/backups/done-archive.md</strong>, which is never pruned, and a fresh backup of ' +
    'the whole list is taken first. Sub-steps and notes go with them.',
    body,
    [{ label:'Archive ' + list.length, primary:true, run:runArchive },
     { label:'Not now' }]);

  async function runArchive(){
    const text = archiveMarkdown(list);
    try {
      const res = await fetch('/archive', {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        body: JSON.stringify({ text })
      });
      const info = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(info.error || ('the server answered ' + res.status));
    } catch (err) {
      alert('Nothing was archived, and nothing was removed from todo.md.\n\n' +
            (err.message || err));
      return;
    }
    // Only now is it safe to take them out: the copy is already on disk.
    list.forEach(it => {
      const i = it.tier.tasks.indexOf(it.task);
      if (i > -1) it.tier.tasks.splice(i, 1);
    });
    invalidateArchiveEntries();       // this batch is now in the file the reports view reads
    closeDrawer();
    markDirty();
    refreshView();
    await saveFile(false, true);
    $('#status').textContent = 'archived ' + list.length + ' finished task' +
      (list.length === 1 ? '' : 's') + ' → data/backups/done-archive.md';
  }
}

setInterval(autosaveTick, 2 * 1000);                // checked often, saves at most every 4 seconds
setInterval(watchTick, WATCH_MS);

/* wiring */
$('#download').onclick = () => downloadText(serializeDoc(state.doc), state.fileName);
$('#archiveBtn').onclick = archiveOldDone;
$('#retry').onclick = loadFile;
$('#q').oninput = e => { state.query = e.target.value; renderBoard(); };
$('#aiFilter').onchange = e => { state.aiFilter = e.target.value; closeDrawer(); renderBoard(); };
$('#urgentFilter').onchange = e => { state.urgentFilter = e.target.checked; closeDrawer(); renderBoard(); };

/* The reference cards are a working surface, not a report. Everything here
   writes to the same task the card was built from, then re-renders the view,
   which recomputes it from scratch — so a tick moves the card out of Quick wins
   and into its done state everywhere at once, with nothing to keep in step. */
$('#lists').addEventListener('click', e => {
  /* The pace chart's key. Only the counted card is redrawn, since nothing about
     the list itself has changed — this is a change of view, not an edit. */
  const key = e.target.closest('[data-trendkey]');
  if (key) {
    const name = key.dataset.trendkey;
    if (trendHidden.has(name)) trendHidden.delete(name); else trendHidden.add(name);
    renderCountedReports();
    return;
  }

  const tick = e.target.closest('[data-tick]');
  if (tick) {
    const found = locate(tick.dataset.tick);
    if (!found) return;
    if (tick.dataset.sub != null) toggleSub(found.task, +tick.dataset.sub);
    else { setDone(found.task, !found.task.done); markDirty(); }
    renderView();
    return;
  }

  /* Taking something out of the week is the edit that never gets made, because
     it means admitting the week was over-committed. One click, from the list
     where he notices it. */
  const drop = e.target.closest('[data-unweek]');
  if (drop) {
    const found = locate(drop.dataset.unweek);
    if (!found) return;
    if (drop.dataset.sub != null) {
      const i = +drop.dataset.sub;
      const m = SUB_RE.exec(found.task.body[i]);
      if (m) found.task.body[i] = m[1] + '- [' + m[2] + '] ' + m[3].replace(/\s*`week`/g, '');
    } else {
      found.task.week = false;
      found.task.dirty = true;
    }
    markDirty();
    renderView();
    return;
  }

  /* Dismissing a quick win is a preference about this list, not an edit —
     nothing is marked dirty and nothing is saved to todo.md. */
  const dismissQuick = e.target.closest('[data-quickdismiss]');
  if (dismissQuick) {
    const set = quickDismissedSet();
    set.add(dismissQuick.dataset.quickdismiss);
    setQuickDismissed(set);
    renderView();
    return;
  }
  if (e.target.closest('[data-quickrestore]')) {
    setQuickDismissed(new Set());
    renderView();
    return;
  }

  /* Open the task where he is standing. This used to throw him onto the board
     first, which lost his place in the list he was reading and made a two second
     edit feel like a detour. The drawer edits the task itself, not the card, so
     it works the same from any view. */
  const open = e.target.closest('[data-open]');
  if (!open) return;
  if (!locate(open.dataset.open)) return;
  openDrawer(open.dataset.open);
});

/* Matrix hover preview. Delegated from #lists, which survives every re-render,
   rather than bound per dot — the grid is rebuilt on any edit and per-dot
   handlers would be re-attached thirty times for nothing.

   Keyboard gets the same treatment through focusin: the dots are real buttons,
   so tabbing through the grid should show what each one is. */
$('#lists').addEventListener('mouseover', e => {
  const dot = e.target.closest('.mdot');
  if (dot) showMatrixPreview(dot);
  const pt = e.target.closest('.trendpt');
  if (pt) showTrendPreview(pt);
});
$('#lists').addEventListener('mouseout', e => {
  if (e.target.closest('.mdot')) hideMatrixPreview();
  if (e.target.closest('.trendpt')) hideTrendPreview();
});
$('#lists').addEventListener('focusin', e => {
  const dot = e.target.closest('.mdot');
  if (dot) showMatrixPreview(dot);
  const pt = e.target.closest('.trendpt');
  if (pt) showTrendPreview(pt);
});
$('#lists').addEventListener('focusout', e => {
  if (e.target.closest('.mdot')) hideMatrixPreview();
  if (e.target.closest('.trendpt')) hideTrendPreview();
});
/* A preview left floating over a scrolled page points at the wrong dot, and one
   left up after a click sits on top of the drawer that just opened. */
window.addEventListener('scroll', () => { hideMatrixPreview(); hideTrendPreview(); }, { passive: true });
window.addEventListener('resize', () => { hideMatrixPreview(); hideTrendPreview(); });
$('#lists').addEventListener('click', () => { hideMatrixPreview(); hideTrendPreview(); }, true);

/* The Matrix's own filter. A change event rather than click, since this is a
   real checkbox and click would fire before its checked state settled. */
$('#lists').addEventListener('change', e => {
  if (!e.target.closest('[data-mxfilter]')) return;
  state.matrixHideWaiting = e.target.checked;
  refreshView();
});

/* Copy a ready-written message to the clipboard. Used by the list views and by
   the two suggestion sections at the bottom of the panel.

   The whole module is the click target, not just the icon: Copy is the one
   thing worth reaching for on a suggestion card without hunting for a small
   button first. A click that actually landed on one of the other controls —
   Dismiss, Ask Claude, Open in Claude, Raise in Jira — opts itself out, since
   those already have their own job and bubble up through here otherwise. A
   card with no Copy at all (a Jira note) has nothing to fall back to and
   this quietly does nothing, which is correct. */
async function handleCopy(e){
  let btn = e.target.closest('.copy');
  if (!btn) {
    if (e.target.closest('.dismiss, .toclaude, .askclaude, .tojira')) return;
    const msg = e.target.closest('.msg');
    btn = msg && msg.querySelector('.copy');
  }
  if (!btn) return;
  const text = btn.dataset.copy || '';
  /* An agenda carries a second flavour. Google Docs turns a leading "- " into a
     bullet only sometimes and loses the second level every time, so a plain-text
     agenda arrives as literal hyphens. Given text/html on the clipboard it reads
     the <ul> and produces real nested bullets. Both flavours go on together, so
     anywhere that cannot read HTML — a terminal, a plain notes field — still
     gets the text and nothing has to choose in advance. */
  const html = btn.dataset.copyHtml || '';
  let copied = false;
  try {
    if (html && window.ClipboardItem && navigator.clipboard.write) {
      await navigator.clipboard.write([new ClipboardItem({
        'text/html':  new Blob([html], { type:'text/html' }),
        'text/plain': new Blob([text], { type:'text/plain' }),
      })]);
      copied = true;
    } else {
      await navigator.clipboard.writeText(text);
      copied = true;
    }
  } catch (err) {
    /* Older fallback. A contenteditable div rather than a textarea where there is
       an HTML flavour to keep: copying a selection out of live DOM is the only
       way execCommand ever carried formatting, and losing the bullets here would
       undo the whole point of the second flavour. */
    const el = document.createElement(html ? 'div' : 'textarea');
    if (html) { el.contentEditable = 'true'; el.innerHTML = html; }
    else el.value = text;
    el.style.position = 'fixed';
    el.style.opacity = '0';
    document.body.appendChild(el);
    if (html) {
      const range = document.createRange();
      range.selectNodeContents(el);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    } else el.select();
    try { copied = document.execCommand('copy'); } catch (e2) { copied = false; }
    el.remove();
  }
  if (!copied) {
    /* Never claim success: select the message so the keyboard shortcut works.
       From the whole block rather than from the button's own parent — the button
       lives in .msgacts, which is a sibling of .msgtext, so looking inside it
       found nothing and the last resort silently did nothing at all. */
    const box = (btn.closest('.msg') || btn.parentElement).querySelector('.msgtext');
    if (box) {
      const range = document.createRange();
      range.selectNodeContents(box);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }
  btn.innerHTML = copied ? ICON_CHECK : ICON_COPY;
  btn.title = copied ? 'Copied' : 'Now press ⌘C';
  btn.setAttribute('aria-label', btn.title);
  btn.classList.toggle('done', copied);
  btn.classList.toggle('warn', !copied);
  clearTimeout(btn._t);
  btn._t = setTimeout(() => {
    btn.innerHTML = ICON_COPY;
    btn.title = 'Copy';
    btn.setAttribute('aria-label', 'Copy');
    btn.classList.remove('done','warn');
  }, copied ? 1500 : 4000);
}
/* Removes one suggestion line from the task it was written on — Message,
   Prompt or Jira. The text was never anything but a note under the task, so
   dismissing it is the same edit as deleting that note by hand: find the raw
   line and take it out of the body. A Jira note may carry a description on
   the line under it, which goes with it. */
function handleDismiss(e){
  const btn = e.target.closest('.dismiss');
  if (!btn || state.locked) return;
  const loc = state.openTask && locate(state.openTask);
  if (!loc) return;
  const t = loc.task;
  const raw = btn.dataset.dismiss;
  const idx = t.body.indexOf(raw);
  if (idx === -1) return;
  t.body.splice(idx, 1);
  const descRaw = btn.dataset.dismissDesc;
  if (descRaw) {
    const di = t.body.indexOf(descRaw);
    if (di !== -1) t.body.splice(di, 1);
  }
  t.dirty = true;
  markDirty();
  refreshView();
  openDrawer(t.id);
}
/* Opens the task named in a Dependencies row, from inside the panel that is
   already open on a different task. openDrawer replaces #dbody's content in
   place, the same as it does from any other trigger. */
function handleDepLink(e){
  const link = e.target.closest('.deplink');
  if (!link) return;
  if (!locate(link.dataset.open)) return;
  openDrawer(link.dataset.open);
}
/* Copy and the chat trigger buttons live inside the same containers, so one
   listener each rather than two. The modal itself is AIChat's own DOM, and it
   wires its own controls — see ai_chat/interface/chat.js. */
function handleMsgClick(e){ handleAsk(e); handleCopy(e); handleDismiss(e); handleDepLink(e); }
$('#lists').onclick = handleMsgClick;
$('#dbody').onclick = handleMsgClick;

window.addEventListener('beforeunload', e => { if (state.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* Back/forward and hand-edited URLs come through here rather than the tab
   clicks above, which drive the switch straight off state.view instead. */
window.addEventListener('hashchange', () => {
  const id = location.hash.slice(1);
  if (viewDefs().some(d => d.id === id) && id !== state.view) {
    state.view = id;
    renderView();
  }
});

loadFile();
loadJira();
loadDatasets();
// Is there a Claude Code CLI behind the helper, and what is it allowed to
// do. Everything about this can fail and none of it matters: a 404 on a
// static host, a helper too old to know the endpoint, a machine with no CLI
// installed. All three land in the same place — chat.available() stays
// false and the prompts keep the link they always had. onStatusChanged, set
// on AIChat.create() above, redraws the view once the answer is in.
chat.loadStatus();
</script>
