<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My To-Do list</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxMDAgMTAwIj48dGV4dCB5PSIuOWVtIiBmb250LXNpemU9IjkwIj7inIU8L3RleHQ+PC9zdmc+">
<!-- The chat modal's own styling, served live from ai_chat/interface — see ai_chat/README.md. -->
<link rel="stylesheet" href="/ai-chat/chat.css">
<!-- The board's own styling. Absolute rather than relative for the same reason
     DEMO_URL is: the page is served at / on Vercel and at /kanban/ locally, and a
     relative href would only resolve in one of the two. -->
<link rel="stylesheet" href="/kanban/board.css">
</head>
<body>

<div class="toasts" id="toasts" aria-live="polite"></div>

<div class="lockframe hidden" id="lockFrame" aria-hidden="true"></div>
<div class="lockbar hidden" id="lockBar">
  <strong id="lockBarKind">Backup Preview</strong>
  <span id="lockBarLabel"></span>
  <span class="spacer"></span>
  <button class="btn" id="exitLock">Return to today's list</button>
</div>

<header id="hdr" class="hidden">
  <h1>My To-Do list</h1>
  <span class="tabs" id="viewToggle"></span>
  <span class="spacer"></span>
  <span class="status" id="status">read only</span>
  <button class="btn hidden" id="archiveBtn"></button>
  <span class="menugroup" id="dataMenu">
    <span class="menulabel">Data</span>
    <button class="btn" id="undo" disabled title="Undo the last change (⌘Z)">Undo</button>
    <button class="btn" id="download">Download copy</button>
    <button class="btn" id="backupsBtn">Backups</button>
    <button class="btn" id="scheduleBtn" title="What runs on a clock, and what the usage windows have been doing">Schedule</button>
  </span>
  <!-- Which private folder under data/ the board is pointed at. Hidden until
       loadDatasets() hears back from /datasets.json — an older server with no
       such route leaves the board exactly as it was before this existed. -->
  <span class="menugroup hidden" id="datasetMenu">
    <span class="menulabel">List</span>
    <select id="datasetSelect" title="Switch to-do lists"></select>
  </span>

  <div class="filters">
    <span class="tabs" id="bucketFilters"></span>
    <button class="iconbtn" id="editBuckets" aria-label="Edit buckets"
            title="Rename, reorder, add or remove the buckets">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.9959.9959 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
    </button>
    <button class="iconbtn" id="editTiers" aria-label="Edit columns"
            title="Rename, reorder, add or remove the columns (states) tasks move through">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 4h4v16H4zM10 4h4v16h-4zM16 4h4v16h-4z"/></svg>
    </button>
    <span class="allbuckets hidden" id="allBuckets">All buckets</span>
    <button class="scorechip hidden" id="scoreChip"></button>
    <span class="spacer"></span>
    <span id="aiWrap">
      <label class="toggle" for="aiFilter" title="How much of the task AI can take on">AI can do</label>
      <select id="aiFilter">
        <option value="">Any amount</option>
        <option value="ai">All or part of it</option>
        <option value="full">All of it</option>
        <option value="partial">Part of it</option>
        <option value="none">None of it</option>
      </select>
    </span>
    <span id="urgentWrap">
      <label class="toggle" for="urgentFilter" title="Tasks marked urgent, or with a deadline set">
        <input type="checkbox" id="urgentFilter"> Urgent or due
      </label>
    </span>
    <input type="search" id="q" placeholder="Search tasks…">
  </div>
</header>

<main id="main">
  <div class="headline hidden" id="headline"></div>
  <div class="board hidden" id="board"></div>
  <div id="lists" class="hidden"></div>
<div class="canvas hidden" id="canvas"></div>
  <section class="start" id="start">
    <h2 id="startTitle">Loading todo.md…</h2>
    <div id="startErr"></div>
    <p style="margin-top:14px"><button class="btn primary" id="retry">Try again</button></p>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside id="drawer">
  <div class="dgrip" id="dgrip" title="Drag to resize · double-click to reset"></div>
  <div class="dhead">
    <strong id="drawerTitle">Edit task</strong>
    <span class="spacer"></span>
    <button class="hlpin hidden" id="dheadHl" type="button">Make headline</button>
    <button class="btn ghost" id="closeDrawer">Close</button>
  </div>
  <div class="dbody" id="dbody"></div>
  <div class="dfoot">
    <button class="btn danger" id="del">Delete task</button>
    <span class="spacer"></span>
    <span class="help" id="dfootHelp">Changes save automatically</span>
  </div>
</aside>

<!-- The chat modal itself is injected by ai_chat's chat.js the first time a
     chat is opened — see AIChat.create() further down. It sits outside this
     document's own DOM on purpose, same reasoning as before: a chat outlives
     the panel that started it. -->

<!-- The engine and interface live one level up, in ai_chat/, so any app can
     load the same module. server.py serves them at /ai-chat/ straight from
     that sibling folder — see ai_chat/README.md. -->
<script src="/ai-chat/chat.js"></script>
<!-- Where a card sits and the box around a group of them, shared with the
     Electron canvas rather than written twice. A module script, so it is
     deferred and sets window.AICards after this document is parsed — every
     read of it here happens when something is drawn, which is long after. -->
<script type="module" src="/ai-chat/cards.js"></script>
<!-- The to-do format itself: parsing, serialising, sub-steps and recurrence.
     Classic rather than a module, and before the inline script below, because
     that script is classic and inline and would otherwise run first. See the
     header of core/todo.js. -->
<script src="/core/todo.js"></script>
<script>
'use strict';

/* =========================================================================
   1. Markdown  <->  model
   ========================================================================= */

/* The list lives in data/, which is the only folder git ignores and the only
   one Obsidian opens as a vault. The name shown in the header stays todo.md:
   the folder is a fact about where the file is kept, not part of what it is. */
const FILE_URL = '/data/todo.md';
/* The example list, used when there is no real one to read. Absolute rather than
   relative to this page, because a host can serve index.html at the root as
   readily as at /kanban/, and a relative path would only find it in one of the
   two. See loadDemo. */
const DEMO_URL = '/kanban/demo.md';
/* Which Jira boards the Raise a ticket buttons offer. It lives in data/ with
   everything else private: it names a company Jira and an account id, and this
   repo is public. Missing is the normal case for anyone but him — the buttons
   simply do not appear. See loadJira. */
const JIRA_URL = '/data/jira.json';
/* Which private folders under data/ exist, and which one FILE_URL and
   JIRA_URL above actually resolve to right now — the server rewrites
   /data/... to /data/<current>/... on its side, so this page never needs to
   know a dataset's name to read or save the list, only to draw the dropdown
   and to ask for a different one. See loadDatasets. */
const DATASETS_URL = '/datasets.json';

/* =========================================================================
   2. State
   ========================================================================= */

const state = {
  doc: null,
  /* The Jira boards read from data/jira.json, or null when there is no such
     file. Null is a normal state, not an error: no file, no buttons. */
  jira: null,
  /* True once /datasets.json has answered at least once. An older server
     with no such route leaves this false forever and the dropdown hidden —
     the board works exactly as it did before data sets existed. */
  datasets: false,
  /* Everything about the Claude chat engine — the CLI's status, which
     sessions sit under which task, any run in flight, the modal itself —
     lives inside the `chat` object from ai_chat/interface/chat.js rather
     than here. Nothing of it is written to the file or survives a reload. */
  originalText: '',
  fileName: 'todo.md',
  dirty: false,
  /* True when the only thing standing between this tab and the file is a tidy-up
     the board did to itself on load — dating finished tasks, renaming Parked.
     Nothing of his is at stake, so the watcher treats it as clean and reloads
     rather than asking. The tidy-up runs again on the way back in. */
  migratedOnly: false,
  activeBucket: null,
  /* The whole sessions index, owner key -> rows, handed over by chat.js's
     onSessionsChanged. The drawer only ever needs one owner's worth and asks
     for it directly; the canvas needs all of them at once, so this keeps the
     last thing the engine said rather than asking again per box. */
  chats: {},
  /* Whether there is a Claude engine behind this board, as a plain flag rather
     than a question asked of the chat object.

     viewDefs() has to answer before that object exists: the first thing this
     script does is read the URL's view out of the hash, which runs at the top
     of the file, and `chat` is a const two thousand lines below it. Reaching
     for it there is a temporal dead zone error that aborts the whole script
     with no view, no board and nothing in the console to say why. */
  chatsOn: false,
  // False until onChatStatusChanged's first answer arrives — see renderView's
  // isPendingCanvas, which needs to tell "canvas doesn't exist here" apart from
  // "canvas exists, we just don't know it yet".
  chatsChecked: false,
  /* Where each card sits and the box around each task's cards, read from and
     written to data/<dataset>/canvas.json. Furniture, not content: losing it
     costs an arrangement and nothing else. */
  canvas: { version: 1, cards: {}, boxes: {}, viewed: {} },
  canvasLoaded: false,
  query: '',
  aiFilter: '',
  urgentFilter: false,
  unscoredOnly: false,
  matrixHideWaiting: false,
  /* Width of the timeline's frozen title column. Remembered the same way the
     drawer's own width is — a drag he does once should not repeat itself. */
  tlLabelWidth: (+localStorage.getItem('todo-board-tl-label')) || 200,
  sort: {},           /* column name -> 'priority'; absent means his own order */
  view: 'overview',   /* the view the file opens on */
  openTask: null,
  /* The same panel, showing a project folder instead of a task. Only ever one
     of the two is set. */
  openProject: null,
  /* Last-Modified of todo.md as this tab last agreed with it. Used to notice
     edits made outside the board. */
  diskStamp: null,
  drawerWidth: (+localStorage.getItem('todo-board-drawer')) || 400,
  /* Backup Preview: state.doc holds an old backup instead of the live file, and
     nothing may write to it. Every mutation path checks this before touching
     anything; see updateLockUI for what it hides. */
  locked: false,
  lockedLabel: '',
  /* Example data is standing in for a list that is not there. It is a kind of
     lock rather than a separate mode, so nothing it renders can be written
     back — see loadDemo for why that matters. */
  demo: false,
  /* A task named in the URL that hasn't been opened yet, because the document
     wasn't loaded when the link arrived. Cleared the moment it is acted on;
     see parseHash. */
  pendingTask: ''
};
state.sort = readSort();

/* The fragment carries two different things, so it needs a split:

     #timeline               the view — durable, rewritten on every render
     #timeline!task=ds-audit  …and a card to open, once
     #!task=ds-audit          a card to open, whatever view is up

   They don't compete. The view segment sets the view exactly as it always did;
   the task segment opens a drawer over whatever is showing; an empty view
   segment means leave the view alone. renderView writes `#<view>` back on the
   next draw, which is what drops the task again — an instruction that has been
   carried out shouldn't survive a refresh.

   The fragment rather than a query string on purpose. A link that differs only
   after the `#` is a same-document navigation, so the browser brings the tab
   that is already open to the front and fires hashchange. A `?task=` would be a
   different URL and would give a second tab on one list, and two tabs both
   autosaving the same file is the one thing this board cannot survive. */
function parseHash(){
  const raw = location.hash.slice(1);
  const cut = raw.indexOf('!');
  const view = cut < 0 ? raw : raw.slice(0, cut);
  const rest = cut < 0 ? '' : raw.slice(cut + 1);
  const m = /^task=(.*)$/.exec(rest);
  let task = '';
  if (m) { try { task = decodeURIComponent(m[1]); } catch (e) { task = m[1]; } }
  // `#canvas!chat=<session>` opens one conversation, the same way `!task=`
  // opens one card. A session id is Claude Code's own and stable, so unlike a
  // task it needs no slug-or-title guessing.
  const c = /^chat=(.*)$/.exec(rest);
  let chatId = '';
  if (c) { try { chatId = decodeURIComponent(c[1]); } catch (e) { chatId = c[1]; } }
  return { view, task: task.trim(), chat: chatId.trim() };
}

/* A task's `id` is minted fresh on every parse (see uid), so nothing outside
   this tab can name a card by it. Two things in the file are stable enough to
   link to: its `#slug` where it has one, and its title where it doesn't. Both
   are tried, slug first — a slug is deliberate, a title is only as unique as he
   happened to make it. */
function findTaskByKey(key){
  if (!key || !state.doc) return null;
  const want = key.replace(/\s+/g, ' ').trim().toLowerCase();
  let bySlug = null, byTitle = null;
  for (const b of state.doc.buckets)
    for (const tier of b.tiers)
      for (const t of tier.tasks){
        if (!bySlug && t.slug && t.slug.toLowerCase() === want) bySlug = t;
        if (!byTitle && String(t.title || '').replace(/\s+/g, ' ').trim().toLowerCase() === want) byTitle = t;
      }
  return bySlug || byTitle;
}

/* Open the card a link named. The bucket tab is moved to the one holding it
   first, so the card is actually behind the panel rather than filtered out of
   the view underneath — a drawer over an empty board reads as a bug. */
function openTaskByKey(key){
  const t = findTaskByKey(key);
  if (!t) {
    renderView();
    $('#status').textContent = 'no task called “' + key + '” on this list';
    return false;
  }
  const loc = locate(t.id);
  if (loc && state.activeBucket !== ALL_BUCKETS && loc.bucket.name !== state.activeBucket) {
    state.activeBucket = loc.bucket.name;
  }
  renderView();
  openDrawer(t.id);
  return true;
}

/* Open the conversation a link named. Unlike a task there is nothing to search
   for: the id is in sessions.json under exactly one owner, and that owner is
   what the modal needs to know as well. */
function openChatByKey(id){
  if (!id) return false;
  const index = state.chats || {};
  for (const key of Object.keys(index)){
    if (!(index[key] || []).some(r => r.id === id)) continue;
    const task = tasksByChatKey()[key];
    chat.openSession(task ? task.id : key, key, id);
    return true;
  }
  $('#status').textContent = 'no conversation with that id on this list';
  return false;
}

/* The URL's #slug is the one thing a refresh doesn't wipe, so read it before the
   first render — otherwise every reload snaps back to the default view. */
(function initViewFromHash(){
  const h = parseHash();
  if (isKnownView(h.view)) state.view = h.view;
  state.pendingTask = h.task;
  state.pendingChat = h.chat;
})();

/* Six, and the fifth used to be the accent blue — which is the first bucket's
   colour, so a fifth bucket came out looking like the first. Nothing could add
   one before, so it never showed. Past six they repeat, which is honest: at that
   point the list is not colour-coded any more whatever we do. */
const BUCKET_COLOR = ['var(--b1)','var(--b2)','var(--b3)','var(--b4)','var(--b5)','var(--b6)'];
const DONE_COL = 'Done';
/* Not a special column the way Done is — just a tier the board tints, so a
   renamed section simply stops matching and goes back to looking normal. */
const WAIT_COL = 'Waiting review';
/* Sits between Doing and Waiting review. Unlike the other columns it has no
   standing heading in every bucket — it is only ever created the first time a
   task is moved into it (see ensureTier), and the board hides it again once
   nothing is left there (see the filter in renderBoard). */
const BLOCKED_TIER = 'Blocked';
/* The first bucket tab shows every bucket at once. Not a real bucket, so it
   needs a name no heading in the file could ever produce. */
const ALL_BUCKETS = '__all__';
/* Hints match the tier descriptions in the file. Unknown tier names simply
   show no hint, so renaming a section in todo.md never breaks the board. */
const TIER_HINT = {
  'Backlog': 'no time pressure yet',
  'Waiting review': 'done, waiting on someone else',
  'Later':   'no time pressure',
  'To do':   'two to four weeks out',
  'Next':    'after that',
  'Doing':   'current focus, next two weeks',
  'Now':     'current focus',
  'Done':    'ticked off',
  'Blocked': "can't move until something changes"
};

/* The file lists tiers Now → Backlog. The board shows them the other way
   round, with a Done column on the far right for anything ticked off. */
function boardColumns(){ return allTiers().slice().reverse().concat([DONE_COL]); }

/* =========================================================================
   2b. Tier one: impact against effort
   Every task carries two scores, set when it lands. Together they answer "is
   this worth starting next" — matters a lot, costs little, goes first. A task
   missing either one cannot be placed at all, so the board says so out loud
   rather than quietly sorting it as though it scored zero.
   ========================================================================= */

/* IMPACT_N, EFFORT_N, unscored and priorityScore moved to core/todo.js on
   5 Sep 2026, when nightly/pick.py needed the same answer to order its queue
   and a second copy of "high is 3" became a thing that could drift. That file
   is loaded as a classic script above this one, so all four are already in
   scope here. Only the emoji stayed: the picker has no use for them and the
   board is the only thing that draws a card. */
const IMPACT_EMOJI = { high:'🔥', med:'🌤️', low:'🍃' };
/* Sorting is a way of looking at a column, not a change to the file. His own
   order is the file order and it means something, so priority sort never
   rewrites it — which is also why hand-reordering is off while it is on. */
const SORT_KEY = 'todo-board-sort';
function sortMode(col){ return state.sort[col] === 'priority' ? 'priority' : 'manual'; }
function setSortMode(col, mode){
  if (mode === 'priority') state.sort[col] = 'priority'; else delete state.sort[col];
  try { localStorage.setItem(SORT_KEY, JSON.stringify(state.sort)); } catch (e) {}
}
function readSort(){
  try { return JSON.parse(localStorage.getItem(SORT_KEY) || '{}') || {}; } catch (e) { return {}; }
}

/* =========================================================================
   2c. Tier two: the one thing
   One task at a time carries `headline:<date it was set>`. It is the task that
   makes the others easier or unnecessary, so it is not simply the top of the
   sorted list — it is chosen, and it stays chosen until it is solved.
   ========================================================================= */

function headlineTask(){
  if (!state.doc) return null;
  for (const b of state.doc.buckets)
    for (const ti of b.tiers)
      for (const t of ti.tasks)
        if (t.headline) return { task:t, bucket:b, tier:ti };
  return null;
}
/* Clearing every other one first is what keeps "one thing" true. Two headlines
   in the file is the same failure as a week with two priorities. */
function setHeadline(id){
  if (state.locked) return;
  const loc = locate(id);
  if (!loc) return;
  clearHeadline(true);
  loc.task.headline = ymd(today());
  loc.task.dirty = true;
  markDirty(); refreshView();
  if (state.openTask) openDrawer(state.openTask);
}
function clearHeadline(quiet){
  if (state.locked) return;
  state.doc.buckets.forEach(b => b.tiers.forEach(ti => ti.tasks.forEach(t => {
    if (t.headline) { t.headline = ''; t.dirty = true; }
  })));
  if (quiet) return;
  markDirty(); refreshView();
  if (state.openTask) openDrawer(state.openTask);
}
/* How many live tasks name this one as their blocker. This is the evidence for
   picking it, so the bar shows the number rather than asking him to trust it. */
function unblockCount(t){
  if (!t.slug) return 0;
  return allItems().filter(i => !i.done && i.blockedBy.indexOf(t.slug) > -1).length;
}

/* The board calls this column Backlog, so the file says Backlog too. */
/* Tasks ticked off before the board started dating them have no `done:` at all,
   so nothing can tell whether they were finished yesterday or in March. They are
   stamped with today on first sight: the clock has to start somewhere, and
   starting it now means nothing is archived before it has been sat with for the
   full thirty days. Returns how many were stamped, to say so rather than quietly
   marking the file dirty. */
function stampDoneDates(doc){
  let n = 0;
  const now = ymd(today());
  doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (t.done && !t.doneOn) { t.doneOn = now; t.dirty = true; n++; }
  })));
  return n;
}

/* ---- Rolling a recurring task onto its next occurrence ----
   Runs on load, beside the two fixups above and for the same reason: it is a
   fact about the calendar rather than a decision, so waiting to be asked would
   only mean the card said something untrue until somebody noticed.

   The board rather than the skill does it because the board is open every day
   and a check-in is not. A week without a check-in would otherwise leave last
   week's date on the card.

   Three things happen when an occurrence has passed:

   1. The agenda that was on it becomes `Previous agenda (that date):`, replacing
      whatever was there before. One cycle of history, which is what writing the
      next agenda actually needs — anything older is in his meeting notes.
   2. The tick comes off. On a recurring task the tick means "prepared for this
      one", so it has to come off when "this one" changes, or the card claims
      next week is done.
   3. `[due:: ]` moves to the next occurrence. In a loop, since the gap since the
      last time the board was open can be longer than one cycle.

   Nothing is rolled while the board is showing a backup: that document is a
   record of a past state and rewriting the dates in it would be a lie about
   what was on disk that day. */
/* How many lines a block-shaped note occupies, counting its heading. Used to cut
   one out without disturbing anything at or above its own indent. */
function blockLength(lines, at){
  const base = leadIndent(lines[at]);
  let end = at + 1;
  while (end < lines.length && (!lines[end].trim() || leadIndent(lines[end]) > base)) end++;
  return end - at;
}

/* Moves a date field on one line by a number of days, in whichever of the two
   syntaxes it was written in. Leaves the line alone when it carries no such
   field, which is the ordinary case. */
function shiftFieldDate(text, key, days){
  if (!days) return text;
  const re = new RegExp('(\\[' + key + '::\\s*)(\\d{4}-\\d{2}-\\d{2})(\\s*\\])|(`' + key +
                        ':)(\\d{4}-\\d{2}-\\d{2})(`)', 'i');
  return text.replace(re, (whole, a, d1, b, c, d2, e) => {
    const iso = d1 || d2;
    const d = parseDue(iso);
    if (!d) return whole;
    d.setDate(d.getDate() + days);
    return d1 ? a + ymd(d) + b : c + ymd(d) + e;
  });
}

function rollRecurring(doc){
  const now = today();
  let n = 0, c = 0;
  const archived = [];
  doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    const rep = readRepeat(t.repeat);
    if (!rep) return;

    /* No date yet — a task he has just tagged, or one the skill wrote without
       one. Give it its next occurrence rather than flagging it: the tag already
       says which day, so the date is derivable and asking would be busywork. */
    const cur = parseDue(t.due);
    if (!cur) {
      t.due = ymd(occurrenceFrom(rep, now));
      t.dirty = true;
      n++;
      return;
    }
    if (cur >= now) return;

    let next = occurrenceAfter(rep, cur);
    while (next < now) next = occurrenceAfter(rep, next);
    const shift = Math.round((next - cur) / 86400000);

    /* Edited on `t.body` in place, line by line, rather than through
       bodyParts/rebuildBody. Those two split every sub-step line away from every
       note line and reassemble the two runs back to back, which is right for the
       drawer's Description box — it only ever shows the task's own notes — and
       lossy here: a note belonging to a sub-step, a suggested message under
       "send the nudge", comes back attached to whichever step happens to end up
       last. In place, nothing moves that was not meant to. */
    /* The tick is what decides whether the agenda has been used. It means
       "prepared for this occurrence", so a ticked card whose date has gone is
       one where the prep was delivered — file the agenda as last cycle's. An
       unticked one is prep that never happened, which means those topics were
       never raised, so they carry forward to the new date instead.

       That distinction is the whole answer to a 1:1 that does not happen. The
       topics survive rather than being filed as history he then has to dig out,
       and carrying a topic that did get discussed is the cheaper mistake of the
       two: he deletes a line he can see, rather than losing one he cannot. */
    const agAt = t.body.findIndex(l => AGENDA_NOTE.test(l));
    let carried = false;
    if (agAt > -1 && t.done) {
      /* Cut last cycle's Previous block first, or a year of them accumulates
         under a task nobody scrolls to the bottom of. Cut before rewriting, and
         re-find the agenda afterwards, since cutting shifts the indices.

         The card keeps one cycle of history, which is what writing the next
         agenda needs — but the one being cut here is not nothing, it is a
         record of a meeting that happened. Filed to agenda-history.md before
         it goes, so a month back is still readable somewhere, just not on the
         card itself. */
      const prevAt = t.body.findIndex(l => PREV_AGENDA_NOTE.test(l));
      if (prevAt > -1) {
        const old = readPrevAgenda(t.body);
        if (old) archived.push({ title: t.title, when: old.date, topics: old.topics });
        t.body.splice(prevAt, blockLength(t.body, prevAt));
      }
      const at = t.body.findIndex(l => AGENDA_NOTE.test(l));
      const m = AGENDA_NOTE.exec(t.body[at]);
      t.body[at] = m[1] + '- Previous agenda (' + t.due + '):';
    } else if (agAt > -1) {
      carried = true;
    }

    setDone(t, false);
    /* And every sub-step with it. A recurring task's steps are the work of one
       occurrence — send the nudge, review what came back — so a step still
       ticked from last time reads as already done for a cycle it has never seen.
       Their `done:` dates go the same way the task's does.

       A step's own `[due:: ]` is an offset from the occurrence rather than a
       fixed date — "the nudge goes out two days before" — so it moves by exactly
       what the parent moved by. Clearing it would lose that intent and leaving it
       would point at a session that has already happened. */
    t.body.forEach((line, i) => {
      const sm = SUB_RE.exec(line);
      if (!sm) return;
      let text = sm[3];
      if (sm[2].toLowerCase() === 'x') {
        text = text.replace(/\[done::\s*[^\]]*\]|`done:[^`]*`/i, '')
                   .replace(/\s{2,}/g, ' ').trim();
      }
      text = shiftFieldDate(text, 'due', shift);
      text = shiftFieldDate(text, 'start', shift);
      t.body[i] = sm[1] + '- [ ] ' + text;
    });
    t.due = ymd(next);
    t.dirty = true;
    n++;
    if (carried) c++;
  })));
  return { n, carried: c, archived };
}

/* The plain-text shape of one filed agenda, reused from agendaClipboard's
   bullet-building but without the clipboard's title/blank-line wrapper —
   this is a heading in a file that already carries the date and the task
   it belonged to, not a document pasted somewhere else. */
function agendaHistoryMarkdown(entries){
  return entries.map(e => {
    const heading = '## ' + e.title + (e.when ? ' (' + e.when + ')' : '');
    const body = e.topics.map(t =>
      ['- ' + t.title].concat(t.context.map(c => '  - ' + c)).join('\n')
    ).join('\n');
    return heading + '\n\n' + body;
  }).join('\n\n');
}

/* Best effort, and silent on failure. Before this existed, a previous agenda
   the roll cut was simply gone — so a write that fails here leaves things no
   worse than they always were, and is not worth interrupting a page load
   over. Fired once, right after the roll that produced these entries. */
async function flushAgendaHistory(entries){
  if (!entries || !entries.length) return;
  try {
    await fetch('/agenda-history', {
      method: 'POST',
      headers: { 'Content-Type':'application/json' },
      body: JSON.stringify({ text: agendaHistoryMarkdown(entries) })
    });
  } catch (err) { /* nothing to do — see comment above */ }
}

function renameParked(doc){
  let changed = false;
  doc.buckets.forEach(b => b.tiers.forEach(t => { if (t.name === 'Parked') { t.name = 'Backlog'; t.raw = null; changed = true; } }));
  if (changed) doc.pre = doc.pre.map(l => l.replace(/\*\*Parked\*\*/g, '**Backlog**'));
  return changed;
}

const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function allTiers(){
  const names = [];
  (state.doc ? state.doc.buckets : []).forEach(b => b.tiers.forEach(t => { if (names.indexOf(t.name) < 0) names.push(t.name); }));
  if (!names.length) return ['Now','Next','Later','Parked'];
  // Blocked always sits right after Waiting review. Once a bucket actually
  // has the heading, the scan above finds it wherever that bucket happens to
  // put it in the merged list — meaningless, and it throws the board order
  // off (reversed, the end of this list is the far left of the board) — so
  // pull it back out and reinsert it in its fixed spot every time.
  const at = names.indexOf(BLOCKED_TIER);
  if (at > -1) names.splice(at, 1);
  const after = names.indexOf('Waiting review');
  names.splice(after < 0 ? names.length : after + 1, 0, BLOCKED_TIER);
  return names;
}
/* A bucket may not have every column heading yet (e.g. an empty "Now").
   Create it in the right place the first time a card lands there. */
function ensureTier(bucket, name){
  const found = bucket.tiers.find(t => t.name === name);
  if (found) return found;
  const tier = { name, raw: null, lead: [''], tasks: [], tail: [''] };
  const order = allTiers();
  const pos = order.indexOf(name);
  let at = bucket.tiers.length;
  for (let i = 0; i < bucket.tiers.length; i++){
    if (order.indexOf(bucket.tiers[i].name) > pos) { at = i; break; }
  }
  bucket.tiers.splice(at, 0, tier);
  return tier;
}
function locate(id){
  const d = state.doc;
  for (let bi = 0; bi < d.buckets.length; bi++){
    const b = d.buckets[bi];
    for (let ti = 0; ti < b.tiers.length; ti++){
      const idx = b.tiers[ti].tasks.findIndex(t => t.id === id);
      if (idx > -1) return { bucket:b, bi, tier:b.tiers[ti], ti, index:idx, task:b.tiers[ti].tasks[idx] };
    }
  }
  return null;
}
/* The single way a task's tick is changed. Five places used to set .done by hand,
   and every one of them would now have to remember to date it — so they all go
   through here instead. Returns true if anything actually changed. */
function setDone(t, on){
  if (state.locked) return false;
  if (t.done === on) return false;
  t.done = on;
  t.doneOn = on ? ymd(today()) : '';
  t.dirty = true;
  // Ticking the card off ticks its sub-steps too — a card in Done with open
  // steps under it reads as unfinished work, which it no longer is. Going the
  // other way leaves steps alone: dragging a card back out of Done doesn't
  // mean the steps that were already ticked got undone.
  if (on) splitBody(t).steps.forEach(s => { if (!s.done) toggleSub(t, s.line); });
  return true;
}

function markDirty(){
  if (state.locked) return;
  noteUndo();
  applyDirty();
}
function applyDirty(msg){
  state.dirty = true;
  state.migratedOnly = false;
  const s = $('#status');
  s.textContent = msg || 'unsaved changes';
  s.classList.add('dirty');
}

/* =========================================================================
   2d. Undo — five steps back, no more
   state.doc is mutated in place everywhere, so the only way to go back is to
   keep whole-document text snapshots and reparse one on request. Five is
   plenty for "I didn't mean that" and cheap to keep — this is Markdown for a
   personal list, not a novel.

   A snapshot is taken the moment a burst of changes starts, not on every
   markDirty() call: typing a title fires markDirty() once per keystroke, and
   one undo step per letter would make the button useless. Instead the text as
   it stood before the burst (undoBaseline) is pushed the first time markDirty
   fires, and a short pause with no further changes closes the burst and moves
   the baseline forward. Two checkboxes ticked half a second apart land in the
   same step — an acceptable coarseness for what this button is for. */
const UNDO_LIMIT = 5;
const UNDO_GAP_MS = 600;
let undoStack = [];
let undoBaseline = '';
let undoTimer = null;

/* Called once per load — a fresh document starts with nothing to undo back
   past, and reparsed text carries fresh task ids anyway (see uid()), so an
   older snapshot would not line up with anything on screen. */
function resetUndo(){
  undoStack = [];
  undoBaseline = state.doc ? serializeDoc(state.doc) : '';
  clearTimeout(undoTimer);
  undoTimer = null;
  updateUndoButton();
}
function noteUndo(){
  if (!state.doc) return;
  if (undoTimer === null) {
    undoStack.push(undoBaseline);
    if (undoStack.length > UNDO_LIMIT) undoStack.shift();
    updateUndoButton();
  }
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => {
    undoTimer = null;
    undoBaseline = serializeDoc(state.doc);   // burst settled; this is the next step's floor
  }, UNDO_GAP_MS);
}
function updateUndoButton(){
  const b = $('#undo');
  b.disabled = !undoStack.length;
  b.title = undoStack.length
    ? 'Undo the last change (⌘Z) — ' + undoStack.length + ' step' + (undoStack.length === 1 ? '' : 's') + ' back'
    : 'Nothing to undo';
}
/* Reparsing rather than reversing a diff — simplest, and it's exactly what
   Reload from disk already does. Fresh ids mean the drawer can't stay open on
   whatever was showing, same as any other reparse. */
function undo(){
  if (state.locked || !undoStack.length) return;
  clearTimeout(undoTimer);
  undoTimer = null;
  const text = undoStack.pop();
  closeDrawer();
  state.doc = parseDoc(text);
  undoBaseline = text;
  applyDirty('undone');
  refreshView();
  updateUndoButton();
}
/* auto: the board did this on its own — an auto-save, or a reload the watcher
   ran because the file moved under it — so he may not have been looking when it
   happened. Those carry a relative stamp that keeps itself current, because the
   only question you ask of a message you did not trigger is how long it has been
   sitting there. Messages he asked for keep the clock time: he knows when. */
function markClean(msg, auto){
  state.dirty = false;
  const s = $('#status');
  s.classList.remove('dirty');
  if (auto && msg) { autoStatus(msg); return; }
  statusAgo = null;
  s.textContent = msg;
}

/* The stamp re-renders on a timer rather than being written once, so "just now"
   does not still say that twenty minutes later. */
let statusAgo = null;
function shortAgo(at){
  const mins = Math.floor((Date.now() - at) / 60000);
  if (mins < 1)  return 'just now';
  if (mins < 60) return mins + ' min ago';
  const hrs = Math.round(mins / 60);
  return hrs === 1 ? 'an hour ago' : hrs + ' hours ago';
}
function autoStatus(msg){
  statusAgo = { at: Date.now(), msg, painted: null };
  paintStatusAgo();
}
function paintStatusAgo(){
  if (!statusAgo) return;
  const s = $('#status');
  // Something else has written to the line since — a save, an archive, the
  // unsaved-changes flag. That message owns the space now, so stand down rather
  // than overwrite it on the next tick.
  if (statusAgo.painted !== null && s.textContent !== statusAgo.painted) { statusAgo = null; return; }
  statusAgo.painted = statusAgo.msg + ' · ' + shortAgo(statusAgo.at);
  s.textContent = statusAgo.painted;
}
setInterval(paintStatusAgo, 30000);

/* =========================================================================
   3. Dates & sub-steps
   ========================================================================= */

function today(){ const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function parseDue(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec((s||'').trim());
  return m ? new Date(+m[1], +m[2]-1, +m[3]) : null;
}
/* `muted` is set on anything sitting in Waiting review: the date is still
   worth showing, but the work is done as far as he is concerned, so it should
   not read as something to act on today. The label and the note stay — "5d
   late" is still a true fact about the date — only the red/amber urgency
   colour is withheld. */
function dueInfo(s, muted){
  const d = parseDue(s);
  if (!d) return null;
  const days = Math.round((d - today()) / 86400000);
  const label = d.toLocaleDateString(undefined, { day:'numeric', month:'short' });
  let cls = '', note = '';
  if (days < 0)       { note = Math.abs(days) + 'd late'; }
  else if (days === 0){ note = 'today'; }
  else if (days <= 4) { note = 'in ' + days + 'd'; }
  if (!muted) {
    if (days <= 0) cls = 'over';
    else if (days <= 4) cls = 'soon';
  }
  return { label, cls, note, days };
}
/* `start:` is the earliest the work can begin. Only the future matters — a start
   date that has passed is just history, and showing it would be noise on every
   card that has ever had one. */
function startInfo(s){
  const d = parseDue(s);
  if (!d) return null;
  const days = Math.round((d - today()) / 86400000);
  if (days <= 0) return null;                      // already open, nothing to say
  return {
    days,
    label: 'from ' + d.toLocaleDateString(undefined, { day:'numeric', month:'short' }),
    note: days === 1 ? 'tomorrow' : 'in ' + days + 'd'
  };
}
function notYet(s){ return !!startInfo(s); }
/* The stricter of two start dates. Both may be blank. */
function laterOf(a, b){
  const da = parseDue(a), db = parseDue(b);
  if (!da) return b || '';
  if (!db) return a || '';
  return da > db ? a : b;
}

function subSteps(t){
  const out = [];
  t.body.forEach((line, i) => {
    const m = SUB_RE.exec(line);
    if (!m) return;
    out.push({
      line: i, indent: m[1], done: m[2].toLowerCase() === 'x', text: m[3],
      due: readField(m[3], 'due'),
      doneOn: readField(m[3], 'done'),
      clean: stripTags(m[3]).replace(/\s+/g, ' ').replace(/\s*—\s*$/, '').trim()
    });
  });
  return out;
}
function noteLines(t){
  return t.body.filter(l => l.trim() !== '' && !SUB_RE.test(l)).length;
}

/* ---- Projects ----
   Work carrying more context than a line can hold keeps a folder under
   `data/projects/<name>/`, with a CLAUDE.md inside holding the background and
   the source documents beside it. The task stays short and names the folder in
   an ordinary note on it:

     - Project: `data/projects/AOP2027`. Background in its CLAUDE.md, the raw
       material for the rescope in redefinition-brief.md.

   The board reads that note rather than asking for a tag of its own. The
   pointer was already written this way in the file before the board knew about
   projects, and a second syntax for the same fact would only give the two a
   chance to disagree. Only the name is taken; the rest of the sentence stays a
   note, where a person put it. */
const PROJECT_RE = /(?:^|[\s`(\[])data\/projects\/([A-Za-z0-9][A-Za-z0-9._-]*)/;
function taskProject(t){
  for (let i = 0; i < t.body.length; i++) {
    const m = PROJECT_RE.exec(t.body[i]);
    if (m) return m[1];
  }
  return '';
}
/* Every task pointing at one folder, in board order, Done included — a project
   is the whole of the work, and half of it being finished is the answer to
   "where is this up to" rather than something to hide. */
function projectTasks(name){
  const out = [];
  state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (taskProject(t) === name) {
      out.push({ task: t, bucket: b.name, tier: t.done ? DONE_COL : tier.name });
    }
  })));
  return out;
}

/* Notes and sub-steps are edited separately, so split them apart — remembering
   how many notes came before the steps, to put the block back where it was. */
function bodyParts(t){
  const notes = [], subs = [];
  let subsAt = -1;
  t.body.forEach(l => {
    if (SUB_RE.test(l)) { if (subsAt < 0) subsAt = notes.length; subs.push(l); }
    else notes.push(l);
  });
  return { notes, subs, subsAt: subsAt < 0 ? notes.length : subsAt };
}
function rebuildBody(t, notes, subs, subsAt){
  const at = Math.max(0, Math.min(subsAt, notes.length));
  t.body = notes.slice(0, at).concat(subs, notes.slice(at));
}
function moveSub(t, from, to){
  if (state.locked) return;
  const p = bodyParts(t);
  if (from === to || from < 0 || from >= p.subs.length) return;
  const item = p.subs.splice(from, 1)[0];
  p.subs.splice(to > from ? to - 1 : to, 0, item);
  rebuildBody(t, p.notes, p.subs, p.subsAt);
  markDirty();
}
/* setDone's treatment, applied to one sub-step: ticking writes a `done:` date
   on the line, unticking clears it, so a sub-step is dated the same way a
   task is rather than leaving the box as the only record of when it moved. */
function toggleSub(t, lineIdx){
  if (state.locked) return;
  const m = SUB_RE.exec(t.body[lineIdx]);
  if (!m) return;
  const toDone = m[2].toLowerCase() !== 'x';
  const box = toDone ? '[x]' : '[ ]';
  let text = m[3].replace(/\[done::\s*[^\]]*\]|`done:[^`]*`/i, '')
                  .replace(/\s{2,}/g, ' ').trim();
  if (toDone) text = (text ? text + ' ' : '') + '[done:: ' + ymd(today()) + ']';
  t.body[lineIdx] = m[1] + '- ' + box + ' ' + text;
  markDirty();
}
/* Replaces the text of one sub-step in place, keeping its indent and tick state.
   The line still carries whatever tags it had — due dates and the rest — since
   the edit box holds the raw line, the same convention the notes textarea uses. */
function setSubText(t, lineIdx, text){
  if (state.locked) return;
  const m = SUB_RE.exec(t.body[lineIdx]);
  if (!m) return;
  t.body[lineIdx] = m[1] + '- [' + m[2] + '] ' + text;
  markDirty();
}
function removeSubLine(t, lineIdx){
  if (state.locked) return;
  t.body.splice(lineIdx, 1);
  markDirty();
}
/* Appends a blank step at the end of the list. It comes back empty rather than
   with placeholder text, because the caller drops straight into editing it. */
function addSub(t){
  if (state.locked) return;
  const p = bodyParts(t);
  p.subs.push('  - [ ] ');
  rebuildBody(t, p.notes, p.subs, p.subsAt);
  markDirty();
}

/* =========================================================================
   4. Render board
   ========================================================================= */

function matchesAi(t){
  const f = state.aiFilter;
  if (!f) return true;
  if (f === 'ai') return t.ai === 'full' || t.ai === 'partial';
  return t.ai === f;
}
function matches(t){
  if (!matchesAi(t)) return false;
  if (state.urgentFilter && !(t.urgent || t.due)) return false;
  // Scoring a task he has already finished is busywork, so done ones never
  // count as needing it however they are tagged.
  if (state.unscoredOnly && (t.done || !unscored(t))) return false;
  const q = state.query.trim().toLowerCase();
  if (!q) return true;
  return (t.title + ' ' + t.body.join(' ')).toLowerCase().indexOf(q) > -1;
}

function allMode(){ return state.activeBucket === ALL_BUCKETS; }
function activeBucket(){
  return state.doc.buckets.find(b => b.name === state.activeBucket) || state.doc.buckets[0];
}
/* Which buckets the board draws. The AI filter cuts across every bucket, and so
   do the urgent/due filter, the All tab and the unscored queue, so any of them
   widens it from the single active bucket. Scoring is an intake job: what
   needs a score in Strategic matters as much as what needs one in People. */
function shownBuckets(){
  return (state.aiFilter || state.urgentFilter || allMode() || state.unscoredOnly) ? state.doc.buckets : [activeBucket()];
}

function renderTabs(){
  const wrap = $('#bucketFilters');
  const openIn = b => b.tiers.reduce((m, t) => m + t.tasks.filter(x => !x.done && matches(x)).length, 0);
  const total = state.doc.buckets.reduce((m, b) => m + openIn(b), 0);
  const all = '<button class="tab taball' + (allMode() ? ' on' : '') + '" data-bucket="' + ALL_BUCKETS + '"' +
    ' title="every bucket at once" aria-pressed="' + allMode() + '">All' +
    '<span class="n">' + total + '</span></button>';
  wrap.innerHTML = all + state.doc.buckets.map((b, i) => {
    const on = !allMode() && b === activeBucket();
    return '<button class="tab' + (on ? ' on' : '') + '" data-bucket="' + esc(b.name) + '"' +
      ' title="open tasks" aria-pressed="' + on + '" style="--bc:' + BUCKET_COLOR[i % BUCKET_COLOR.length] + '">' +
      '<i class="dot"></i>' + esc(b.name) + '<span class="n">' + openIn(b) + '</span></button>';
  }).join('');
  wrap.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { state.activeBucket = el.dataset.bucket; renderTabs(); refreshView(); };
  });
  $('#editBuckets').onclick = openBucketEditor;
  $('#editTiers').onclick = openTierEditor;
}

/* =========================================================================
   3b. The buckets themselves
   A bucket is a `## N. Name` line in the file and nothing else — no id, no
   record anywhere of which tasks belong to it beyond the fact that they sit
   under it. So renaming one is a rewrite of that single line, and reordering
   is a rewrite of the numbers on all of them. Nothing about a task changes
   either way, which is why this can be a small feature rather than a migration.
   ========================================================================= */

/* The number in the heading *is* the position, so anything that moves, adds or
   removes a bucket has to restate it. Dropping `raw` is what lets serializeDoc
   rebuild the line from num and name instead of handing back the one it read. */
function renumberBuckets(){
  state.doc.buckets.forEach((b, i) => {
    const num = String(i + 1);
    if (b.num !== num) { b.num = num; b.raw = null; }
  });
}
function bucketTaskCount(b){ return b.tiers.reduce((m, t) => m + t.tasks.length, 0); }
/* Returns the bucket already holding the name, so the complaint can quote what
   is actually in the file rather than the capitalisation just typed at it. */
function bucketNameTaken(name, except){
  const k = name.toLowerCase();
  return state.doc.buckets.find(b => b !== except && b.name.toLowerCase() === k) || null;
}
/* One name, tidied the same way wherever it arrives from. A heading cannot carry
   a line break, and two spaces in the middle of a bucket name are a typo rather
   than a decision. */
function cleanBucketName(name){ return String(name).replace(/\s+/g, ' ').trim(); }

/* Each of these returns an error to show, or '' when it went through. The board
   is redrawn here rather than by the caller, because a rename changes the tab
   strip and the label on every card in that bucket. */
function renameBucket(b, name){
  const clean = cleanBucketName(name);
  if (!clean) return 'A bucket needs a name.';
  if (clean === b.name) return '';
  const clash = bucketNameTaken(clean, b);
  if (clash) return 'There is already a bucket called \u201c' + clash.name + '\u201d.';
  const was = b.name;
  b.name = clean;
  b.raw = null;
  // activeBucket is held by name, so the tab he is looking at has to follow it.
  if (state.activeBucket === was) state.activeBucket = clean;
  markDirty(); refreshView();
  return '';
}

function addBucket(name){
  const clean = cleanBucketName(name);
  if (!clean) return 'A bucket needs a name.';
  const clash = bucketNameTaken(clean, null);
  if (clash) return 'There is already a bucket called \u201c' + clash.name + '\u201d.';
  /* Born with the same columns as its siblings, all empty. A bucket with no
     `###` headings parses and draws perfectly well — ensureTier writes one the
     first card it gets — but the file is also read in Obsidian and by the
     checker, and there a bucket shaped unlike the rest reads as half-written.
     The closing rule matches what the other buckets end with, so the heading
     lands below the last one's rule and above whatever follows the buckets. */
  const tiers = allTiers().map(n => ({ name: n, raw: null, lead: [''], tasks: [], tail: [] }));
  // The blank line the closing rule sits under belongs to the last column, which
  // is where the parser puts it when it reads one of the buckets already there.
  if (tiers.length) tiers[tiers.length - 1].tail = [''];
  state.doc.buckets.push({ num: String(state.doc.buckets.length + 1), name: clean, raw: null,
                           intro: [''], tiers, tail: ['---', ''] });
  renumberBuckets();
  markDirty(); refreshView();
  return '';
}

/* Deleting a bucket must never delete work, so one with tasks in it can only go
   once they have somewhere to land. Each task keeps its column and its own text
   verbatim: this is the move the drawer's Bucket field already makes, done for
   every task in the bucket at once. */
function deleteBucket(b, dest){
  const list = state.doc.buckets;
  // The board cannot draw a list with no buckets, and load() refuses to read one.
  if (list.length < 2) return;
  const n = bucketTaskCount(b);
  if (n && !dest) return;
  if (n) b.tiers.forEach(tier => tier.tasks.forEach(t => ensureTier(dest, tier.name).tasks.push(t)));
  list.splice(list.indexOf(b), 1);
  renumberBuckets();
  if (state.activeBucket === b.name) state.activeBucket = dest ? dest.name : ALL_BUCKETS;
  markDirty(); refreshView();
}

/* Two different questions, so two different sheets. Empty, deleting a bucket
   costs a heading. With tasks in it, the only safe delete is a move, so it asks
   where they go and says how many are going there. */
function confirmDeleteBucket(b, back){
  const n = bucketTaskCount(b);
  const others = state.doc.buckets.filter(x => x !== b);
  if (!n) {
    showModal('Delete \u201c' + b.name + '\u201d?',
      'Nothing is in it. The heading goes, the buckets below it renumber, and none of it ' +
      'reaches the file until you save.', '',
      [{ label: 'Keep it', run: back },
       { label: 'Delete it', danger: true, run: () => { deleteBucket(b, null); back(); } }]);
    return;
  }
  let dest = others[0];
  showModal('Delete \u201c' + b.name + '\u201d?',
    'It still holds ' + n + ' task' + (n === 1 ? '' : 's') + ', finished ones included. They move ' +
    'rather than go \u2014 each one keeps its column, its text and its tags, and lands in the ' +
    'bucket you pick here.',
    '<label class="field"><span>Move its tasks to</span><select id="bkDest">' +
      others.map((x, i) => '<option value="' + i + '">' + esc(x.name) + '</option>').join('') +
    '</select></label>',
    [{ label: 'Keep it', run: back },
     { label: 'Move ' + n + ' and delete', danger: true, run: () => { deleteBucket(b, dest); back(); } }]);
  /* Read as it changes rather than when the button is pressed: showModal takes
     the sheet down before it runs the choice, so by then the select is gone. */
  const sel = modalEl.querySelector('#bkDest');
  sel.onchange = () => { dest = others[+sel.value]; };
}

/* The editor is one sheet holding every bucket, because the questions it answers
   are comparative — is this the right name next to the other three, is this the
   right order. A per-bucket menu on each tab could not show that. */
function openBucketEditor(){
  if (state.locked || !state.doc) return;
  /* An open task drawer behind this is stale the moment a bucket is renamed —
     its Bucket field lists the old name — and it is the wrong altitude anyway. */
  closeDrawer();

  const setErr = msg => { const el = modalEl && modalEl.querySelector('.bkerr'); if (el) el.textContent = msg; };

  const draw = () => {
    const list = state.doc.buckets;
    const rows = list.map((b, i) => {
      const n = bucketTaskCount(b);
      return '<div class="bkrow">' +
        '<span class="bknum">' + (i + 1) + '</span>' +
        '<i class="bkdot" style="background:' + BUCKET_COLOR[i % BUCKET_COLOR.length] + '"></i>' +
        '<input type="text" data-name="' + i + '" value="' + esc(b.name) + '" aria-label="Bucket name">' +
        '<span class="bkn" title="tasks in it, finished ones included">' + n + '</span>' +
        '<button class="btn mini" data-up="' + i + '" title="Move up" aria-label="Move up"' +
          (i === 0 ? ' disabled' : '') + '>\u2191</button>' +
        '<button class="btn mini" data-down="' + i + '" title="Move down" aria-label="Move down"' +
          (i === list.length - 1 ? ' disabled' : '') + '>\u2193</button>' +
        '<button class="btn mini danger" data-del="' + i + '"' +
          (list.length < 2 ? ' disabled title="A list needs at least one bucket"' : '') +
          '>Delete</button>' +
      '</div>';
    }).join('');

    showModal('Buckets',
      'The headings your list is organised under. A rename rewrites that one heading in ' +
      esc(state.fileName) + ' and leaves every task under it alone. The number and the colour ' +
      'follow the order, so moving a bucket renumbers the ones it passes. Nothing reaches the ' +
      'file until you save.',
      '<div class="bklist">' + rows + '</div>' +
      '<div class="bkadd">' +
        '<input type="text" id="bkNew" placeholder="New bucket name" aria-label="New bucket name">' +
        '<button class="btn" id="bkAdd">Add bucket</button>' +
      '</div>' +
      '<p class="bkerr" role="status"></p>',
      [{ label: 'Done', primary: true }]);
    wire();
  };

  const wire = () => {
    const list = state.doc.buckets;
    modalEl.querySelectorAll('input[data-name]').forEach(inp => {
      const b = list[+inp.dataset.name];
      /* A rejected name is not redrawn away: he keeps what he typed, with the
         reason under it, because the fix is usually one character. */
      const apply = () => {
        const msg = renameBucket(b, inp.value);
        if (msg) { setErr(msg); }
        else { setErr(''); inp.value = b.name; }
      };
      inp.onchange = apply;
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); apply(); } };
    });
    modalEl.querySelectorAll('[data-up]').forEach(el => {
      el.onclick = () => { moveBucket(list[+el.dataset.up], -1); draw(); };
    });
    modalEl.querySelectorAll('[data-down]').forEach(el => {
      el.onclick = () => { moveBucket(list[+el.dataset.down], 1); draw(); };
    });
    modalEl.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = () => confirmDeleteBucket(list[+el.dataset.del], draw);
    });
    const add = () => {
      const inp = modalEl.querySelector('#bkNew');
      const msg = addBucket(inp.value);
      if (msg) setErr(msg); else draw();
    };
    modalEl.querySelector('#bkAdd').onclick = add;
    modalEl.querySelector('#bkNew').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  };

  draw();
}

function moveBucket(b, dir){
  const list = state.doc.buckets;
  const i = list.indexOf(b), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(i, 1);
  list.splice(j, 0, b);
  renumberBuckets();
  markDirty(); refreshView();
}

/* =========================================================================
   2c. Columns — the states every task moves through inside a bucket.

   These are not stored as a list of their own: they are the `###` headings
   already sitting inside the buckets, read off by allTiers()/boardColumns()
   above, which unions them by scanning the buckets in order and remembering
   each name the first time it turns up. That scan is why every edit below
   ends by calling syncTierShapes() rather than touching only the buckets a
   column happens to already be in: a column that only exists in one bucket
   — Design System's Blocked, say — cannot be reordered relative to the
   others just by moving it around inside that one bucket, because nothing
   about its position there is visible to a scan that never gets past the
   earlier buckets' own tiers first. Giving every bucket the same set closes
   that blind spot, and costs nothing on screen: the board already draws
   Blocked as a column on every bucket's view, empty wherever that bucket has
   no tasks in it, whether or not that bucket's file section mentions the
   heading at all. See syncTierShapes for the rest of this.
   ========================================================================= */

/* Left to right, the way the board actually draws them, with Done left off —
   it is never a heading, just where a ticked task lands regardless of which
   column it sits under. */
function tierOrder(){ return boardColumns().filter(n => n !== DONE_COL); }

function tierTaskCount(name){
  return state.doc.buckets.reduce((sum, b) => {
    const t = b.tiers.find(x => x.name === name);
    return sum + (t ? t.tasks.length : 0);
  }, 0);
}

/* Returns the name already taken, so the complaint can quote it back rather
   than just the one just typed. Done included: a real column called Done
   would sit behind the synthetic one and never be reachable. */
function tierNameTaken(name, except){
  const k = name.toLowerCase();
  if (k === DONE_COL.toLowerCase() && name !== except) return DONE_COL;
  return tierOrder().find(n => n !== except && n.toLowerCase() === k) || null;
}

function cleanTierName(name){ return String(name).replace(/\s+/g, ' ').trim(); }

/* Makes every bucket carry exactly this set of columns, in this order —
   inventing an empty one wherever a bucket does not already have it. That
   sounds bigger than it is: the board already shows every column somewhere
   like Design System's Blocked in every bucket's view whether or not that
   bucket's own file section mentions it (boardColumns() is global, see
   above), so this changes nothing anyone sees on screen. What it fixes is
   allTiers() itself — its order is read off by scanning buckets in turn and
   remembering each name the first time it appears, which means a column
   missing from an early bucket can never be reordered relative to the
   others: nothing about where it sits inside the one bucket that does have
   it is visible to that scan. Every bucket agreeing on the full set removes
   the blind spot, so reordering, adding and deleting all do this rather than
   only touching the buckets a column already happened to be in. */
function syncTierShapes(order){
  const fileOrder = order.slice().reverse();   // boardColumns() reverses allTiers()
  state.doc.buckets.forEach(b => {
    const byName = {};
    b.tiers.forEach(t => { byName[t.name] = t; });
    b.tiers = fileOrder.map(name => byName[name] || { name, raw: null, lead: [''], tasks: [], tail: [''] });
  });
}

function renameTier(oldName, newName){
  const clean = cleanTierName(newName);
  if (!clean) return 'A column needs a name.';
  if (clean === oldName) return '';
  const clash = tierNameTaken(clean, oldName);
  if (clash) return 'There is already a column called “' + clash + '”.';
  state.doc.buckets.forEach(b => {
    const t = b.tiers.find(x => x.name === oldName);
    if (t) { t.name = clean; t.raw = null; }
  });
  if (oldName in state.sort) { state.sort[clean] = state.sort[oldName]; delete state.sort[oldName]; }
  markDirty(); refreshView();
  return '';
}

function addTier(name){
  const clean = cleanTierName(name);
  if (!clean) return 'A column needs a name.';
  const clash = tierNameTaken(clean, null);
  if (clash) return 'There is already a column called “' + clash + '”.';
  const order = tierOrder();
  order.push(clean);
  syncTierShapes(order);
  markDirty(); refreshView();
  return '';
}

function moveTier(name, dir){
  const order = tierOrder();
  const i = order.indexOf(name), j = i + dir;
  if (i < 0 || j < 0 || j >= order.length) return;
  order.splice(i, 1);
  order.splice(j, 0, name);
  syncTierShapes(order);
  markDirty(); refreshView();
}

/* A column with tasks in it can only go once they have somewhere to land —
   the same rule deleteBucket already enforces, applied once per bucket that
   has this column, since its tasks can be spread across every one of them.
   The sync afterwards drops it everywhere at once, rather than leaving it
   behind in whichever buckets happened to have no tasks in it to trigger
   the check above. */
function deleteTier(name, dest){
  const order = tierOrder();
  if (order.length < 2) return;
  const n = tierTaskCount(name);
  if (n && !dest) return;
  if (n) state.doc.buckets.forEach(b => {
    const t = b.tiers.find(x => x.name === name);
    if (t && t.tasks.length) t.tasks.forEach(task => ensureTier(b, dest).tasks.push(task));
  });
  syncTierShapes(order.filter(x => x !== name));
  delete state.sort[name];
  markDirty(); refreshView();
}

/* Two different questions, so two different sheets — same split as deleting a
   bucket, and for the same reason: empty, a column just goes; holding work,
   the only safe delete is a move, so it asks where to first. */
function confirmDeleteTier(name, back){
  const n = tierTaskCount(name);
  const others = tierOrder().filter(x => x !== name);
  if (!n) {
    showModal('Delete “' + name + '”?',
      'Nothing is in it, in any bucket. The heading goes wherever it appears, and none of it ' +
      'reaches the file until you save.', '',
      [{ label: 'Keep it', run: back },
       { label: 'Delete it', danger: true, run: () => { deleteTier(name, null); back(); } }]);
    return;
  }
  let dest = others[0];
  showModal('Delete “' + name + '”?',
    'It still holds ' + n + ' task' + (n === 1 ? '' : 's') + ', across every bucket that has it, ' +
    'finished ones included. They move rather than go — each one keeps its bucket, its text ' +
    'and its tags, and lands in the column you pick here.',
    '<label class="field"><span>Move its tasks to</span><select id="tierDest">' +
      others.map((x, i) => '<option value="' + i + '">' + esc(x) + '</option>').join('') +
    '</select></label>',
    [{ label: 'Keep it', run: back },
     { label: 'Move ' + n + ' and delete', danger: true, run: () => { deleteTier(name, dest); back(); } }]);
  const sel = modalEl.querySelector('#tierDest');
  sel.onchange = () => { dest = others[+sel.value]; };
}

/* One sheet holding every column, same reasoning as the bucket editor: the
   questions are comparative — is this the right name next to the others, is
   this the right order — and a per-column menu could not show that. */
function openTierEditor(){
  if (state.locked || !state.doc) return;
  closeDrawer();

  const setErr = msg => { const el = modalEl && modalEl.querySelector('.bkerr'); if (el) el.textContent = msg; };

  const draw = () => {
    const order = tierOrder();
    const rows = order.map((name, i) => {
      const n = tierTaskCount(name);
      return '<div class="bkrow">' +
        '<input type="text" data-tiername="' + i + '" value="' + esc(name) + '" aria-label="Column name">' +
        '<span class="bkn" title="tasks in it, across every bucket, finished ones included">' + n + '</span>' +
        '<button class="btn mini" data-tierback="' + i + '" title="Move up (left on the board)" aria-label="Move up"' +
          (i === 0 ? ' disabled' : '') + '>↑</button>' +
        '<button class="btn mini" data-tierfwd="' + i + '" title="Move down (right on the board)" aria-label="Move down"' +
          (i === order.length - 1 ? ' disabled' : '') + '>↓</button>' +
        '<button class="btn mini danger" data-tierdel="' + i + '"' +
          (order.length < 2 ? ' disabled title="A list needs at least one column"' : '') +
          '>Delete</button>' +
      '</div>';
    }).join('');

    showModal('Columns',
      'The states every task moves through inside a bucket, left to right on the board. Every bucket ' +
      'shows every column, whether or not its own section has tasks in it, so a rename, reorder, add ' +
      'or delete here reaches every bucket the same way. Done sits fixed at the far right and is not ' +
      'listed here, since it is never a heading, just where a ticked task lands. Nothing reaches the ' +
      'file until you save.',
      '<div class="bklist">' + rows + '</div>' +
      '<div class="bkadd">' +
        '<input type="text" id="tierNew" placeholder="New column name" aria-label="New column name">' +
        '<button class="btn" id="tierAdd">Add column</button>' +
      '</div>' +
      '<p class="bkerr" role="status"></p>',
      [{ label: 'Done', primary: true }]);
    wire();
  };

  const wire = () => {
    const order = tierOrder();
    modalEl.querySelectorAll('input[data-tiername]').forEach(inp => {
      const i = +inp.dataset.tiername;
      const apply = () => {
        const msg = renameTier(order[i], inp.value);
        if (msg) { setErr(msg); }
        else { setErr(''); order[i] = cleanTierName(inp.value); inp.value = order[i]; }
      };
      inp.onchange = apply;
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); apply(); } };
    });
    modalEl.querySelectorAll('[data-tierback]').forEach(el => {
      el.onclick = () => { moveTier(order[+el.dataset.tierback], -1); draw(); };
    });
    modalEl.querySelectorAll('[data-tierfwd]').forEach(el => {
      el.onclick = () => { moveTier(order[+el.dataset.tierfwd], 1); draw(); };
    });
    modalEl.querySelectorAll('[data-tierdel]').forEach(el => {
      el.onclick = () => confirmDeleteTier(order[+el.dataset.tierdel], draw);
    });
    const add = () => {
      const inp = modalEl.querySelector('#tierNew');
      const msg = addTier(inp.value);
      if (msg) setErr(msg); else draw();
    };
    modalEl.querySelector('#tierAdd').onclick = add;
    modalEl.querySelector('#tierNew').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  };

  draw();
}

/* opts.static drops the drag and focus attributes. The matrix hover preview is
   the same card, but it is a picture of one rather than one you can act on, so
   it must not be draggable or land in the tab order. */
function cardHTML(t, color, bucketLabel, opts){
  opts = opts || {};
  const subs = subSteps(t);
  const doneSubs = subs.filter(s => s.done).length;
  const di = dueInfo(t.due, opts.muted);
  const notes = noteLines(t);

  let meta = '';
  /* The card sitting in its own column is the same task as the one pinned in
     the headline bar, and used to give no sign of that — open two tabs and
     they read as two different tasks. The ring round the card and the tag
     both point back at the bar rather than duplicating it. */
  if (t.headline) meta += '<span class="tag onething" title="This is the headline — pinned at the top as the one thing">the one thing</span>';
  /* First, because it says which piece of work this belongs to, and that frames
     everything after it. Clicking it opens the project rather than the card —
     see the capture-phase handler on [data-project]. */
  const proj = taskProject(t);
  if (proj) meta += '<span class="tag proj" data-project="' + esc(proj) + '" title="' +
    esc('Everything on ' + proj) + '">' + esc(proj) + '</span>';
  // Says it once, on the card, rather than leaving a gap that reads as "low".
  if (unscored(t) && !t.done) meta += '<span class="tag needsscore">needs scoring</span>';
  if (t.impact) meta += '<span class="tag impact-' + esc(t.impact) + '" title="' + esc(t.impact) + ' impact">' + (IMPACT_EMOJI[t.impact] || esc(t.impact)) + '</span>';
  if (t.effort) meta += '<span class="tag">' + esc(t.effort) + '</span>';
  const si = startInfo(t.start);
  if (si) meta += '<span class="tag startdate">' + esc(si.label) + ' · ' + esc(si.note) + '</span>';
  if (t.ai && t.ai !== 'none') meta += '<span class="tag ai ai-' + esc(t.ai) + '" title="' + esc(t.ai) + ' AI help">ai</span>';
  if (t.to && t.to.trim()) meta += '<span class="tag who" title="Delegated to ' +
    esc(t.to.trim()) + '">\u2192 ' + esc(t.to.trim()) + '</span>';
  /* A ticket waiting to be raised is a fact about the task worth seeing in the
     column, but the button belongs where there is room for it — the task panel
     and the reference cards. So the card gets the marker and not the link. */
  const tickets = jiraNotes(t);
  if (tickets.length && !t.done) {
    tickets.forEach(n => { meta += '<span class="tag jira">' + esc(n.key ? n.key + ' ticket' : 'ticket') + '</span>'; });
  }
  /* How often the task comes round, and nothing about whether it is prepared.
     There is no "agenda ready" chip on purpose: on a recurring task the tick
     already says that. The card is the prep — tick it when the agenda is
     written, and it leaves Quick wins and sits in Done until the meeting has
     passed and the board rolls it onto the next date. A chip saying the same
     thing a second way is a second thing to keep in step. */
  const rep = readRepeat(t.repeat);
  if (rep) meta += '<span class="tag repeat" title="Recurring ' + esc(rep.label) +
    '. The board moves the date on once this one has passed.">' + esc(rep.label) + '</span>';
  // Urgent and due are the "look at this now" signals, so they get their own
  // corner rather than sitting in the wrap with everything else.
  let metaWhen = '';
  if (t.urgent) metaWhen += '<span class="tag urgent">urgent</span>';
  if (di) metaWhen += '<span class="tag due ' + di.cls + '">' + esc(di.label) + (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (metaWhen) meta += '<span class="meta-when">' + metaWhen + '</span>';

  let prog = '';
  if (subs.length) {
    const pct = Math.round(doneSubs / subs.length * 100);
    prog = '<div class="prog"><span>' + doneSubs + '/' + subs.length + ' steps</span>' +
           '<span class="bar"><i style="width:' + pct + '%"></i></span></div>';
  } else if (notes) {
    prog = '<div class="notecount">' + notes + ' note' + (notes > 1 ? 's' : '') + '</div>';
  }

  return '<article class="card' + (t.done ? ' done' : '') + (t.headline ? ' onething' : '') + '"' +
    (opts.static ? '' : ' tabindex="0" role="button"' + (opts.noDrag ? '' : ' draggable="true"')) +
    ' data-id="' + t.id + '" style="--bc:' + color + '">' +
    (bucketLabel ? '<div class="row1"><span class="bucket">' + esc(bucketLabel) + '</span></div>' : '') +
    '<div class="title">' + mdInline(t.title) + '</div>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') +
    prog +
  '</article>';
}

/* =========================================================================
   4b. Reference sections. Overview is four columns — Big rocks, This week, Quick
       wins, Delegate to Claude — plus Context. Dependency chain sits on Matrix,
       beside the nine cells.

   These used to be rendered as prose straight out of the markdown, which meant
   an entry was a sentence that happened to look like a task. Nothing connected
   it to the real card, so it could name a task that no longer existed and the
   view would show it happily. Since the tags moved onto the tasks, every entry
   here is built from a task or a sub-step, and clicking one opens it.
   ========================================================================= */

/* A prompt lives as a note under the thing it serves, the same way a suggested
   message does — see MSG_NOTE in core/todo.js, which reads the other one. */
const PROMPT_NOTE = /^\s*-\s+Prompt\s*:/i;
/* A ticket that needs raising. The board key in brackets says which one, the
   same shape as (draft) on a message: - Jira (DSYS): "Summary line". Leave the
   brackets off and every configured board is offered, which is the honest
   answer when it is not yet decided where the ticket belongs. */
const JIRA_NOTE   = /^\s*-\s+Jira(\s*\(([^)]*)\))?\s*:/i;
/* The ticket body, on the line under the Jira note it belongs to. "Description
   to paste" is what the first of these were written as, back when the board only
   carried the summary and the body really did have to be pasted. It still reads
   correctly, so it still parses — but `Description:` is the one to write now. */
const DESC_NOTE   = /^\s*-\s+Description(\s+to\s+paste)?\s*:/i;
/* The agenda for a recurring meeting. Unlike everything above it this is not one
   quoted line: what he pastes into the shared meeting notes is a bullet list, one
   bullet for the topic and one nested under it for the context, so the note is a
   heading and the block indented beneath it is the content.

      - Agenda:
        - AOP2027
          - Confirm the rescoped recommendation is agreed ...
        - Personal objectives
          - Shared 26 Aug, pending validation before Sage.

   No date on it, deliberately. The task's `[due:: ]` is the date of the next
   occurrence and the board rolls it forward itself, so a date here would be the
   same fact written twice with two chances to disagree. What the block holds is
   always the agenda for the meeting the task is currently pointing at, because
   rolling the task forward clears it. */
const AGENDA_NOTE = /^(\s*)-\s+Agenda\s*:/i;
/* Last meeting's agenda, kept for one cycle so the next one can be written
   against what was actually raised. Written by the roll, not by hand, which is
   why this one does carry a date: there is no field left pointing at it. */
const PREV_AGENDA_NOTE = /^(\s*)-\s+Previous agenda(\s*\(([^)]*)\))?\s*:/i;

/* One block-shaped note — an agenda — out of a run of note lines. Depth is what
   pairs them: a topic sits at the shallowest indent inside the block, and
   everything deeper under it is that topic's context. The block ends at the
   first line not indented past the heading, so an ordinary note can follow it. */
function readBlockNote(lines, head_re){
  const at = lines.findIndex(l => head_re.test(l));
  if (at < 0) return null;
  const head = head_re.exec(lines[at]);
  const headIndent = head[1].length;
  const block = [];
  for (let i = at + 1; i < lines.length; i++) {
    const l = lines[i];
    if (!l.trim()) continue;
    if (leadIndent(l) <= headIndent) break;
    block.push(l);
  }
  if (!block.length) return null;
  const topIndent = Math.min.apply(null, block.map(leadIndent));
  const topics = [];
  block.forEach(l => {
    const text = l.replace(/^\s*-\s+/, '').trimEnd();
    if (leadIndent(l) === topIndent) topics.push({ title: text, context: [] });
    else if (topics.length) topics[topics.length - 1].context.push(text);
  });
  if (!topics.length) return null;
  return { at, date: (head[3] || '').trim(), topics };
}
function readAgenda(lines){ return readBlockNote(lines, AGENDA_NOTE); }
function readPrevAgenda(lines){ return readBlockNote(lines, PREV_AGENDA_NOTE); }

/* What goes on the clipboard, in the shape the shared notes want rather than the
   shape this file wants. Three parts, and the first two are what he asked for:
   the meeting date as the title, a blank line, then the word Agenda, then the
   list. Both levels are real bullets — the topic and its context each being a
   bullet is the whole format, so neither can be plain indented text.

   Two flavours, because plain text alone does not survive the paste. Google Docs
   turns a leading "- " into a bullet only sometimes and drops the second level
   every time; given a text/html flavour it reads the <ul> and produces real
   nested bullets. Every clipboard that cannot read HTML still gets the text. */
function agendaClipboard(ag, when){
  const title = when ? longDate(when) : '';
  const text = (title ? title + '\n\n' : '') + 'Agenda\n' +
    ag.topics.map(t =>
      ['- ' + t.title].concat(t.context.map(c => '  - ' + c)).join('\n')
    ).join('\n');
  const html =
    (title ? '<p><strong>' + esc(title) + '</strong></p><p><br></p>' : '') +
    '<p>Agenda</p><ul>' +
    ag.topics.map(t =>
      '<li>' + mdInline(t.title) +
      (t.context.length
        ? '<ul>' + t.context.map(c => '<li>' + mdInline(c) + '</li>').join('') + '</ul>'
        : '') +
      '</li>').join('') +
    '</ul>';
  return { text, html };
}
/* Long form, because this one is a document title rather than a chip: "Wednesday,
   2 September 2026" reads as a heading where dueLabel's "Wed, 2 Sept 2026" reads
   as a tag. */
function longDate(s){
  const d = parseDue(s);
  if (!d) return '';
  return d.toLocaleDateString(undefined, { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}

function noteMeta(lines){
  const meta = { message: '', draft: false, prompt: '', jira: null, agenda: null };
  lines.forEach(l => {
    if (MSG_NOTE.test(l))    { meta.message = quoted(l); meta.draft = /\(draft\)/i.test(l); }
    else if (PROMPT_NOTE.test(l)) { meta.prompt = quoted(l); }
  });
  /* Also a second pass, for the same reason as a description: an agenda is a
     block of lines rather than one line, so it cannot be read line by line. */
  meta.agenda = readAgenda(lines);
  /* Read in a second pass: a description sits on the line after the note it
     belongs to, so this cannot be decided one line at a time. */
  const tickets = readJiraRun(lines, '');
  if (tickets.length) meta.jira = tickets[0];
  return meta;
}

/* One Jira note as a board key and a summary. The key is whatever sat in the
   brackets, upper-cased so `dsys` and `DSYS` are the same board; an empty key
   means every board is offered. */
function readJira(line){
  const m = JIRA_NOTE.exec(line);
  const key = (m && m[2] ? m[2] : '').trim().toUpperCase();
  return { key, summary: quoted(line), description: '', raw: line, descRaw: '' };
}

/* Jira notes out of one run of note lines, each taking the description written
   under it. Order is what pairs them: a description belongs to the last Jira
   note seen, so a step carrying two tickets keeps two separate bodies rather
   than both of them collapsing onto the first. */
function readJiraRun(lines, where){
  const out = [];
  lines.forEach(l => {
    if (JIRA_NOTE.test(l)) out.push(Object.assign(readJira(l), { where }));
    else if (DESC_NOTE.test(l) && out.length) { out[out.length - 1].description = quoted(l); out[out.length - 1].descRaw = l; }
  });
  return out;
}

/* Every task and sub-step as one flat list. The reference sections all filter
   this, so an entry can never exist without the thing it points at. */
function allItems(){
  const out = [];
  state.doc.buckets.forEach((b, bi) => {
    const color = BUCKET_COLOR[bi % BUCKET_COLOR.length];
    b.tiers.forEach(tier => tier.tasks.forEach(t => {
      const parts = splitBody(t);
      const own = noteMeta(parts.notes);
      out.push({
        id: t.id, task: t, sub: null, color,
