    t.title,
    t.bucket + ' · ' + t.tierName,
    t.blocked ? 'blocked' : '',
    di ? 'due ' + di.label + (di.note ? ', ' + di.note : '') : 'no date'
  ].filter(Boolean).join(', ');
  return '<button class="mdot' + (t.headline ? ' hl' : '') + (t.urgent ? ' urgent' : '') +
    (t.muted ? ' muted' : '') +
    '" data-open="' + t.id + '" style="--bc:' + color + '"' +
    ' aria-label="' + esc(label) + '"></button>';
}

/* ---- Hover preview ----
   The dot says where a task sits, not what it is. Rather than a tooltip that
   paraphrases the card, this shows the card itself — the same cardHTML the board
   renders — so hovering a dot answers the same question as looking at the board.

   Fixed position and appended to the body, because the grid sits inside a
   scrolling column and an absolutely positioned child would be clipped by it.
   pointer-events:none throughout, so the preview can never sit between the
   cursor and the dot it describes and swallow the click. */
let mPreviewEl = null;
function matrixPreview(){
  if (!mPreviewEl) {
    mPreviewEl = document.createElement('div');
    mPreviewEl.className = 'mpreview';
    mPreviewEl.setAttribute('aria-hidden', 'true');
    document.body.appendChild(mPreviewEl);
  }
  return mPreviewEl;
}
function showMatrixPreview(dot){
  const loc = locate(dot.dataset.open);
  if (!loc) return;
  const el = matrixPreview();
  const color = BUCKET_COLOR[state.doc.buckets.indexOf(loc.bucket) % BUCKET_COLOR.length];
  const where = loc.bucket.name + ' · ' + (loc.task.done ? DONE_COL : loc.tier.name);
  el.innerHTML = cardHTML(loc.task, color, where, { static: true, muted: loc.tier.name === WAIT_COL });
  el.classList.add('on');
  placeMatrixPreview(dot);
}
/* Beside the dot, flipping to the other side rather than running off the edge,
   and never taller than the window allows. */
function placeMatrixPreview(dot){
  const el = mPreviewEl;
  if (!el) return;
  const r = dot.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight, gap = 12, edge = 8;
  let left = r.right + gap;
  if (left + w > window.innerWidth - edge) left = r.left - gap - w;
  left = Math.max(edge, Math.min(left, window.innerWidth - w - edge));
  let top = r.top + r.height / 2 - h / 2;
  top = Math.max(edge, Math.min(top, window.innerHeight - h - edge));
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
}
function hideMatrixPreview(){ if (mPreviewEl) mPreviewEl.classList.remove('on'); }

/* ---- Weekly pace hover popover ----
   Same shape as the Matrix's own hover preview just above — a single fixed
   element, reused rather than rebuilt on every point, positioned fresh each
   time it is shown. The content is read straight off the point's own data
   attributes, written once when the chart was drawn. */
let tPreviewEl = null;
function trendPreview(){
  if (!tPreviewEl) {
    tPreviewEl = document.createElement('div');
    tPreviewEl.className = 'tpreview';
    tPreviewEl.setAttribute('aria-hidden', 'true');
    document.body.appendChild(tPreviewEl);
  }
  return tPreviewEl;
}
function showTrendPreview(pt){
  const el = trendPreview();
  const count = +pt.dataset.trendcount;
  el.innerHTML =
    '<div class="tprow" style="--bc:' + esc(pt.dataset.trendcolor) + '"><i></i>' + esc(pt.dataset.trendlabel) + '</div>' +
    '<div class="tpcount"><strong>' + count + '</strong> task' + (count === 1 ? '' : 's') +
      ', week of ' + esc(pt.dataset.trendweek) + '</div>';
  el.classList.add('on');
  placeTrendPreview(pt);
}
/* Above the point by default — a tooltip reads as pointing at what it is
   about, and below would sit over the line and the point it just left. Only
   drops beneath when there is no room above. */
function placeTrendPreview(pt){
  const el = tPreviewEl;
  if (!el) return;
  const r = pt.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight, gap = 10, edge = 8;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(edge, Math.min(left, window.innerWidth - w - edge));
  let top = r.top - gap - h;
  if (top < edge) top = r.bottom + gap;
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
}
function hideTrendPreview(){ if (tPreviewEl) tPreviewEl.classList.remove('on'); }

/* Top-level tasks only. Sub-steps carry no impact or effort of their own, so
   they have no position here — placing them under their parent's scores would
   double-count the same piece of work. Done tasks are left out: this is a tool
   for deciding what is next, not a record of what happened. */
function matrixTasks(){
  const items = allItems();
  const out = [];
  state.doc.buckets.forEach((b, bi) => {
    const color = BUCKET_COLOR[bi % BUCKET_COLOR.length];
    b.tiers.forEach(tier => tier.tasks.forEach(t => {
      if (t.done || !matches(t)) return;
      const it = items.find(i => i.id === t.id && !i.sub);
      const blocked = !!it && !actionable(items, it);
      const waiting = tier.name === MATRIX_MUTED_TIER;
      out.push({ id: t.id, title: t.title, impact: t.impact, effort: t.effort,
                 due: t.due, ai: t.ai, urgent: t.urgent, headline: !!t.headline,
                 bucket: b.name, tierName: tier.name, color,
                 held: tier.name === HELD_TIER,
                 blocked,
                 waiting,
                 muted: waiting || blocked });
    }));
  });
  return out;
}

function matrixSection(){
  const all = matrixTasks();
  const hideWaiting = state.matrixHideWaiting;
  const hiddenWaiting = hideWaiting ? all.filter(t => t.waiting).length : 0;
  const visible = hideWaiting ? all.filter(t => !t.waiting) : all;
  const held = visible.filter(t => t.held);
  const tasks = visible.filter(t => !t.held);
  const placed = tasks.filter(t => IMPACT_N[t.impact] && EFFORT_N[t.effort]);
  const missing = tasks.filter(t => !IMPACT_N[t.impact] || !EFFORT_N[t.effort]);

  const legend = '<div class="mlegend">' +
    state.doc.buckets.map((b, i) =>
      '<span class="mkey" style="--bc:' + BUCKET_COLOR[i % BUCKET_COLOR.length] + '">' +
      '<i></i>' + esc(b.name) + '</span>').join('') +
    '<span class="mkey mkeyhl"><i></i>the one thing</span>' +
    '<span class="mkey mkeyurg"><i></i>urgent</span>' +
    '<span class="mkey mkeymuted"><i></i>waiting or blocked</span>' +
    '<label class="mxfilter"><input type="checkbox" data-mxfilter' +
      (hideWaiting ? ' checked' : '') + '> Hide Waiting review</label>' +
  '</div>';

  let grid = '<div class="mgrid">' +
    '<div class="mcorner">' +
      '<span class="maxis">Effort →</span>' +
      '<span class="maxis">↓ Impact</span>' +
    '</div>' +
    MATRIX_EFFORT.map(e => '<div class="mhead">' + esc(e) +
      '<span class="mhint">' + esc(EFFORT_HINT[e]) + '</span></div>').join('');

  MATRIX_IMPACT.forEach(imp => {
    grid += '<div class="mside">' + esc(imp) + '</div>';
    MATRIX_EFFORT.forEach(eff => {
      const key = imp + '/' + eff;
      const inCell = placed.filter(t => t.impact === imp && t.effort === eff);
      const score = IMPACT_N[imp] / EFFORT_N[eff];
      grid += '<div class="mcell' + (key === 'high/S' ? ' first' : '') +
          (inCell.length ? '' : ' empty') + '" data-score="' + score.toFixed(2) + '"' +
          ' style="--w:' + score.toFixed(2) + '">' +
        '<div class="mcellhead">' +
          '<span class="madvice">' + esc(CELL_ADVICE[key]) + '</span>' +
          '<span class="mcount">' + inCell.length + '</span>' +
        '</div>' +
        '<div class="mdots">' + inCell.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>';
    });
  });
  grid += '</div>';

  const tray = missing.length
    ? '<div class="mtray"><div class="mtrayhead">' +
        '<strong>' + missing.length + ' not on the matrix</strong>' +
        '<span>Missing an impact or an effort score, so they have no position. ' +
        'Click one to score it.</span></div>' +
        '<div class="mdots">' + missing.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>'
    : '';

  const holdTray = held.length
    ? '<div class="mtray mhold"><div class="mtrayhead">' +
        '<strong>' + held.length + ' in ' + esc(HELD_TIER) + '</strong>' +
        '<span>Parked on purpose, so they are kept off the grid however they ' +
        'score. Move one out of ' + esc(HELD_TIER) + ' and it takes its ' +
        'cell.</span></div>' +
        '<div class="mdots">' + held.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>'
    : '';

  const total = placed.length;
  /* Counted on what he could pick up today. A high impact, cheap task that is
     waiting on a review or on another task is not a place to start, so it is
     left out of the advice even though its dot is still in the cell. */
  const cheapWins = placed.filter(t => t.impact === 'high' && t.effort === 'S' && !t.muted).length;
  const cut = placed.filter(t => t.impact === 'low' && t.effort === 'L').length;
  const heavy = placed.filter(t => t.effort === 'L').length;
  const waiting = placed.filter(t => t.muted).length;
  let read = '';
  if (total) {
    const bits = [];
    bits.push(cheapWins
      ? '<strong>' + cheapWins + '</strong> high impact and cheap — start there'
      : 'nothing is both high impact and cheap right now');
    bits.push('<strong>' + heavy + '</strong> of ' + total + ' need a week or more');
    if (cut) bits.push('<strong>' + cut + '</strong> in the cut corner');
    if (waiting) bits.push('<strong>' + waiting + '</strong> waiting or blocked');
    read = '<p class="mread">' + bits.join(' · ') + '</p>';
  }

  const hiddenNote = hiddenWaiting
    ? '<p class="mhidden">' + hiddenWaiting + ' hidden, sitting in Waiting review.</p>'
    : '';

  return legend + read + hiddenNote + grid + tray + holdTray;
}

/* opts.collapsible is Overview's own five sections: shut until he opens one,
   remembered per section the same way the drawer's are — see overviewOpen.
   Matrix's two sections stay plain, always open, since there is only ever
   the two of them and nothing to skim past. */
function refSection(title, hint, html, opts){
  opts = opts || {};
  if (opts.collapsible) {
    const key = 'ov:' + title;
    return '<details class="listcard ovsection" data-ovcollapse="' + esc(key) + '"' +
      (overviewOpen(key) ? ' open' : '') + '>' +
      '<summary>' + esc(title) + '</summary>' +
      (hint ? '<p class="refhint">' + mdInline(hint) + '</p>' : '') +
      html +
      '</details>';
  }
  return '<section class="listcard"><h3>' + esc(title) + '</h3>' +
         (hint ? '<p class="refhint">' + mdInline(hint) + '</p>' : '') +
         html +
         '</section>';
}

/* The split grid is written out here rather than in the stylesheet because
   Context is the last column and the only one with a different width: it is
   prose in full sentences, not cards, and at card width it reads as a ribbon.
   repeat() cannot take a computed count reliably across browsers, so the tracks
   are listed one by one. */
const REF_TRACK = 'minmax(380px,1fr)';
const CTX_TRACK = 'minmax(540px,1.5fr)';
function splitGridCSS(cols, hasCtx){
  const plain = hasCtx ? cols - 1 : cols;
  const tracks = Array(plain).fill(REF_TRACK);
  if (hasCtx) tracks.push(CTX_TRACK);
  // Below this the row scrolls sideways instead of squeezing the columns.
  const minW = plain * 394 + (hasCtx ? 554 : 0);
  return 'grid-template-columns:' + tracks.join(' ') + ';min-width:' + minW + 'px';
}

function renderSections(viewId){
  // The grid is rebuilt from scratch here, so any preview on screen is pointing
  // at a dot that no longer exists.
  hideMatrixPreview();
  const items = allItems();
  let html = '', split = false, mview = false, cols = 4, hasCtx = false;

  if (viewId === 'overview') {
    const ctx = contextSection();
    split = true;
    // One section per column, left to right, the same way the board reads.
    const secs = [
      refSection('Big rocks', 'High impact, L effort. Needs protected time.', bigRocksSection(items), { collapsible:true }),
      refSection('This week', 'Everything tagged `week`, soonest first.', weekSection(items), { collapsible:true }),
      refSection('Quick wins', 'Yours to do: meeting agendas, `effort:S` and written messages. Anything `ai:full` sits in Delegate instead.', quickSection(items), { collapsible:true }),
      refSection('Delegate to Claude', 'Everything tagged `ai:full`, in `rank:` order.', delegateSection(items), { collapsible:true })
    ];
    if (ctx) {
      secs.push(refSection('Context', 'Standing facts, not tasks. Edit these in todo.md.', ctx, { collapsible:true }));
      hasCtx = true;
    }
    cols = secs.length;
    html = secs.join('');
  } else if (viewId === 'matrix') {
    mview = true;
    // The chain sits beside the matrix: both answer "what can I actually start",
    // one by score and one by what is still waiting on something else.
    html = refSection('Impact against effort',
      'Every open task by its two scores, except the ones parked in Backlog. One dot per task, coloured by bucket — hover for the title, click to open it. Faded dots are waiting on a review or on another task.',
      matrixSection()) +
      refSection('Dependency chain', 'Built from every `blocked-by:` tag.', chainSection(items));
  }

  $('#lists').innerHTML =
    '<div class="lists' + (split ? ' split' : '') + (mview ? ' mview' : '') + '"' +
      (split ? ' style="' + splitGridCSS(cols, hasCtx) + '"' : '') + '>' + html + '</div>' +
    '<p class="help listnote">Generated from the tags on the tasks, so every card here is a real task. ' +
    'Open one to change it, then Save.</p>';
  capMsgCards();
}

/* .ref .msg's 400px cap is CSS, and CSS alone cannot tell a card that landed
   on exactly 400px from one three screens long — so once the cards are
   actually in the DOM, measure each one against its own scroll height and
   mark the ones truncation really cut. Only .capped gets the fade and the
   label; a card that fits gets neither. */
function capMsgCards(){
  $('#lists').querySelectorAll('.ref .msg').forEach(el => {
    el.classList.toggle('capped', el.scrollHeight > el.clientHeight + 1);
  });
}

/* Two views: the board, and the hand-written summaries from the end of the file.
   The bucket tabs, the AI filter and search only make sense on the board. */
function renderView(){
  // Up front, not at the end: the board case returns early, and the chip belongs
  // to the header rather than to any one view.
  updateArchiveChip();
  const defs = viewDefs();
  // Quick wins and Delegate to Claude are columns of Overview now, so an old
  // #quick or #delegate link lands where its content actually lives.
  if (state.view === 'quick' || state.view === 'delegate') state.view = 'overview';
  if (!defs.some(d => d.id === state.view)) state.view = 'board';
  const def = defs.find(d => d.id === state.view);
  const isBoard = def.id === 'board';
  // Keep the URL in step with whichever tab is on screen, so a refresh (or a
  // link back to this page) lands on the same view instead of the default.
  // replaceState rather than the hash setter: it doesn't add a history entry
  // or fire hashchange, so this can't loop with the listener below.
  if (location.hash.slice(1) !== state.view) history.replaceState(null, '', '#' + state.view);

  $('#viewToggle').innerHTML = defs.map(d =>
    '<button class="tab' + (d.id === state.view ? ' on' : '') + '" data-view="' + d.id + '">' + esc(d.label) + '</button>'
  ).join('');
  $('#viewToggle').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { state.view = b.dataset.view; renderView(); };
  });

  $('#board').classList.toggle('hidden', !isBoard);
  $('#lists').classList.toggle('hidden', isBoard);
  $('#aiWrap').classList.toggle('hidden', !isBoard);
  $('#urgentWrap').classList.toggle('hidden', !isBoard);
  $('#q').classList.toggle('hidden', !isBoard);

  if (isBoard) { renderBoard(); return; }
  $('#bucketFilters').classList.add('hidden');
  $('#editBuckets').classList.add('hidden');
  $('#editTiers').classList.add('hidden');
  $('#allBuckets').classList.add('hidden');
  $('#scoreChip').classList.add('hidden');
  $('#headline').classList.add('hidden');
  // Its chip is board-only, so leaving it on here would filter a view with no
  // visible control to explain why half the tasks are missing.
  state.unscoredOnly = false;
  if (def.id === 'reports') { renderReportsView(); return; }
  if (def.id === 'backups') { renderBackupsView(); return; }
  renderSections(def.id);
}

/* Re-draw whichever view is on screen. The drawer opens from the lists as well
   as the board now, so an edit has to show up where it was made — renderBoard
   alone does nothing when a list view is up. */
function refreshView(){
  if (state.view === 'board') renderBoard();
  else if (state.view === 'reports') renderReportsView();
  else if (state.view === 'backups') renderBackupsView();
  else renderSections(state.view);
  updateArchiveChip();
}

/* The bar above the board. Empty it is a slim invitation, not a banner: an empty
   headline is a normal state, and the board should not shout about it. */
function renderHeadline(){
  const bar = $('#headline');
  const hl = headlineTask();
  bar.classList.toggle('hidden', state.view !== 'board' || state.locked);
  bar.classList.toggle('set', !!hl);
  if (!hl) {
    bar.innerHTML = '<span class="hllabel">The one thing</span>' +
      '<span class="hlempty">Nothing set. Drag a card here, or open a task and press ' +
      '<strong>Make this the headline</strong>.</span>';
    // Nothing to open, so the bar goes back to being a strip of text. Left set,
    // the old role and handler would survive the removal and open a stale task.
    bar.removeAttribute('role');
    bar.removeAttribute('tabindex');
    bar.onclick = null;
    bar.onkeydown = null;
    return;
  }
  const t = hl.task;
  const di = dueInfo(t.due);
  const blocks = unblockCount(t);
  const set = parseDue(t.headline);
  const age = set ? Math.round((today() - set) / 86400000) : null;

  let tags = '';
  if (t.impact) tags += '<span class="tag impact-' + esc(t.impact) + '" title="' + esc(t.impact) + ' impact">' + (IMPACT_EMOJI[t.impact] || esc(t.impact)) + '</span>';
  if (t.effort) tags += '<span class="tag">' + esc(t.effort) + '</span>';
  if (di) tags += '<span class="tag due ' + di.cls + '">' + esc(di.label) +
                  (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (blocks) tags += '<span class="tag unblocks">frees up ' + blocks +
                      ' other task' + (blocks > 1 ? 's' : '') + '</span>';

  bar.innerHTML = '<span class="hllabel">The one thing</span>' +
    '<div class="hlmain">' +
      '<div class="hltitle">' + mdInline(t.title) + '</div>' +
      '<div class="hlmeta">' +
        '<span class="hlwhere">' + esc(hl.bucket.name) + ' · ' +
          esc(t.done ? DONE_COL : hl.tier.name) + '</span>' + tags +
      '</div>' +
    '</div>' +
    '<div class="hlright">' +
      (age === null ? '' : '<span class="hlage">' +
        (age <= 0 ? 'set today' : 'set ' + age + ' day' + (age > 1 ? 's' : '') + ' ago') + '</span>') +
      (t.done ? '<span class="hldone">solved — pick the next one</span>' : '') +
      '<button class="hlclear" id="hlClear">Remove</button>' +
    '</div>';

  /* The whole bar opens the task, like a card. Only the Remove button is carved
     out of that, or the one gesture that gets rid of the headline would open it. */
  bar.setAttribute('role', 'button');
  bar.setAttribute('tabindex', '0');
  bar.onclick = e => { if (!e.target.closest('.hlclear')) openDrawer(t.id); };
  bar.onkeydown = e => {
    if (e.target.closest('.hlclear')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(t.id); }
  };
  $('#hlClear').onclick = e => { e.stopPropagation(); clearHeadline(false); };
}

function renderBoard(){
  if (state.view !== 'board') return;
  renderTabs();
  renderHeadline();
  renderScoreChip();
  const board = $('#board');
  // The "who does it" filter cuts across every bucket, so it overrides the tabs.
  // The urgent/due filter does the same. The All tab does the same thing, but
  // the tabs stay up so it can be undone.
  const across = !!state.aiFilter || state.urgentFilter;
  const shown = shownBuckets();
  const many = shown.length > 1;
  $('#bucketFilters').classList.toggle('hidden', across);
  // Follows the strip it belongs to, and goes with it in a preview or the demo,
  // where the file behind it is not one that can be written to.
  $('#editBuckets').classList.toggle('hidden', across || state.locked);
  // Columns are global, so this one has no reason to hide when the AI filter
  // narrows the view across every bucket — only a backup preview, which
  // cannot write anything, takes it away.
  $('#editTiers').classList.toggle('hidden', state.locked);
  $('#allBuckets').classList.toggle('hidden', !across);

  // Blocked stays off the board entirely until something is actually sitting
  // in it — the empty-column treatment other tiers get would be misleading
  // here, since Blocked has no standing heading to justify a permanent slot.
  const hasBlocked = state.doc.buckets.some(b => {
    const tier = b.tiers.find(t => t.name === BLOCKED_TIER);
    return tier && tier.tasks.some(t => !t.done);
  });
  const columns = boardColumns().filter(name => name !== BLOCKED_TIER || hasBlocked);
  board.style.setProperty('--cols', columns.length);
  board.innerHTML = columns.map(name => {
    const isDone = name === DONE_COL;
    const mode = sortMode(name);
    let entries = [];
    shown.forEach(bucket => {
      const color = BUCKET_COLOR[state.doc.buckets.indexOf(bucket) % BUCKET_COLOR.length];
      const label = many ? bucket.name : '';
      if (isDone) {
        bucket.tiers.forEach(tier => tier.tasks.forEach(t => {
          if (t.done && matches(t)) entries.push({ t, color, label });
        }));
      } else {
        const tier = bucket.tiers.find(t => t.name === name);
        if (tier) tier.tasks.forEach(t => { if (!t.done && matches(t)) entries.push({ t, color, label }); });
      }
    });
    // Stable: equal scores keep the order he put them in, so the sort only ever
    // answers the question it was asked.
    if (mode === 'priority') {
      entries = entries.map((e, i) => ({ e, i }))
        .sort((a, b) => (priorityScore(b.e.t) - priorityScore(a.e.t)) || (a.i - b.i))
        .map(x => x.e);
    }
    const n = entries.length;
    const cards = entries.map(e => cardHTML(e.t, e.color, e.label, { noDrag: state.locked, muted: name === WAIT_COL })).join('');

    const sortBtn = isDone ? '' :
      '<button class="sortbtn' + (mode === 'priority' ? ' on' : '') + '" data-sort="' + esc(name) + '"' +
      ' title="' + (mode === 'priority'
        ? 'Showing highest impact for the lightest lift first. Hand-reordering is off while this is on.'
        : 'Showing your own order. Click to sort by impact against effort.') + '">' +
      (mode === 'priority' ? 'by priority' : '⇅') + '</button>';

    return '<section class="col' + (isDone ? ' donecol' : '') +
        (name === WAIT_COL ? ' waitcol' : '') +
        (mode === 'priority' ? ' sorted' : '') + '" data-tier="' + esc(name) + '">' +
      '<h2>' + esc(name) + (TIER_HINT[name] ? ' <span class="hint">' + esc(TIER_HINT[name]) + '</span>' : '') +
      sortBtn + '<span class="count">' + n + '</span></h2>' +
      '<div class="drop" data-tier="' + esc(name) + '">' + (n ? cards : '<div class="empty">Nothing here</div>') + '</div>' +
      (isDone || state.locked ? '' : '<footer><button class="addbtn" data-add="' + esc(name) + '">+ Add task</button></footer>') +
    '</section>';
  }).join('');

  board.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openDrawer(el.dataset.id);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(el.dataset.id); } };
  });
  // Drag-and-drop, the add-task footer and their wiring only mean anything for
  // the live file — a backup preview has nothing to reorder into.
  if (!state.locked) {
    board.querySelectorAll('.card').forEach(el => {
      el.ondragstart = e => {
        e.dataTransfer.setData('text/plain', el.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        dragId = el.dataset.id;
        requestAnimationFrame(() => el.classList.add('dragging'));
      };
      el.ondragend = () => { el.classList.remove('dragging'); dragId = null; hideDropLine(); };
    });
    board.querySelectorAll('.drop').forEach(zone => {
      zone.ondragover = e => {
        e.preventDefault();
        zone.classList.add('over');
        showDropLine(zone, e.clientY);
      };
      // Moving onto a card inside the zone counts as leaving the zone in most
      // browsers, so check where the pointer actually went before clearing.
      zone.ondragleave = e => {
        if (zone.contains(e.relatedTarget)) return;
        zone.classList.remove('over');
        hideDropLine();
      };
      zone.ondrop = e => {
        e.preventDefault();
        zone.classList.remove('over');
        hideDropLine();
        const id = e.dataTransfer.getData('text/plain') || dragId;
        if (id) dropTask(id, zone.dataset.tier, zone, e.clientY);
      };
    });
    board.querySelectorAll('.addbtn').forEach(el => { el.onclick = () => addTask(el.dataset.add); });
  }
  board.querySelectorAll('.sortbtn').forEach(el => {
    el.onclick = () => {
      setSortMode(el.dataset.sort, sortMode(el.dataset.sort) === 'priority' ? 'manual' : 'priority');
      renderBoard();
    };
  });
}

/* The intake queue. Counts across every bucket whatever the tabs say, because
   a task with no scores is not in a bucket's flow yet — it is waiting to enter
   one. Clicking it shows exactly those. */
function renderScoreChip(){
  const chip = $('#scoreChip');
  if (state.view !== 'board' || !state.doc) { chip.classList.add('hidden'); return; }
  let n = 0;
  state.doc.buckets.forEach(b => b.tiers.forEach(ti => ti.tasks.forEach(t => {
    if (!t.done && unscored(t) && matchesAi(t)) n++;
  })));
  chip.classList.toggle('hidden', n === 0 && !state.unscoredOnly);
  chip.classList.toggle('on', state.unscoredOnly);
  chip.textContent = state.unscoredOnly
    ? 'Showing ' + n + ' unscored · show all'
    : n + ' need scoring';
  chip.title = state.unscoredOnly
    ? 'Back to the whole board'
    : 'Tasks with no impact or no effort score yet. Click to see just those.';
  chip.onclick = () => { state.unscoredOnly = !state.unscoredOnly; renderBoard(); };
}

let dragId = null;
let subDrag = null;

/* A line showing where the card will land. One element, moved around the board
   rather than one per gap, so there is never more than one target on screen.
   It reads the same cards dropTask does — only same-bucket ones count, since a
   card can only be reordered against its own bucket's list — so the line always
   marks the place the card actually goes. */
let dropLine = null;
function insertAfterEl(zone, clientY, dragBucket, skipId){
  let after = null;
  zone.querySelectorAll('.card').forEach(el => {
    if (el.classList.contains('dragging') || el.dataset.id === skipId) return;
    const other = locate(el.dataset.id);
    if (!other || (dragBucket && other.bucket !== dragBucket)) return;
    const r = el.getBoundingClientRect();
    if (clientY > r.top + r.height / 2) after = el;
  });
  return after;
}
function showDropLine(zone, clientY){
  if (subDrag !== null) return;                       // a sub-step drag, not a card
  // Nothing to point at in a sorted column: the order is worked out, so there
  // is no gap to drop into. The column still highlights as a valid target.
  if (sortMode(zone.dataset.tier) === 'priority') return;
  if (!dropLine) {
    dropLine = document.createElement('div');
    dropLine.className = 'dropline';
  }
  const from = dragId ? locate(dragId) : null;
  const after = insertAfterEl(zone, clientY, from ? from.bucket : null, dragId);
  if (after) after.after(dropLine);
  else zone.prepend(dropLine);
}
function hideDropLine(){ if (dropLine && dropLine.parentNode) dropLine.remove(); }

/* Dropping a card on the bar makes it the one thing. Bound once, not per render,
   since the bar itself is never replaced — only its contents are. */
(function wireHeadlineDrop(){
  const bar = $('#headline');
  bar.ondragover = e => {
    if (subDrag !== null || !dragId) return;
    e.preventDefault();
    bar.classList.add('over');
  };
  bar.ondragleave = e => { if (!bar.contains(e.relatedTarget)) bar.classList.remove('over'); };
  bar.ondrop = e => {
    e.preventDefault();
    bar.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain') || dragId;
    if (id && locate(id)) setHeadline(id);
  };
})();

/* Move a task to another tier, inserting near where it was dropped.
   Cards from other buckets are ignored when working out the position. */
function dropTask(id, tierName, zone, clientY){
  if (state.locked) return;
  const loc = locate(id);
  if (!loc) return;

  // Done is not a section in the file — it is the tick box on the task.
  if (tierName === DONE_COL) {
    if (setDone(loc.task, true)) { markDirty(); refreshView(); }
    if (state.openTask === id) openDrawer(id);
    return;
  }
  setDone(loc.task, false);                       // dragged back out of Done

  const targetTier = ensureTier(loc.bucket, tierName);

  // In a sorted column the position on screen is worked out, not chosen, so
  // there is nothing to read off the drop point. Move the task into the column
  // and leave his order alone — the sort will place it.
  const manual = sortMode(tierName) !== 'priority';
  const afterEl = manual ? insertAfterEl(zone, clientY, loc.bucket, id) : null;
  const after = afterEl ? (locate(afterEl.dataset.id) || {}).task : null;

  loc.tier.tasks.splice(loc.index, 1);
  let at;
  if (!manual) at = targetTier.tasks.length;
  else if (after) { const k = targetTier.tasks.indexOf(after); at = k > -1 ? k + 1 : targetTier.tasks.length; }
  else at = 0;
  targetTier.tasks.splice(at, 0, loc.task);

  markDirty(); refreshView();
  if (state.openTask === id) openDrawer(id);
}

function addTask(tierName){
  if (state.locked) return;
  const tier = ensureTier(activeBucket(), tierName);
  const t = { id: uid(), done:false, title:'New task', bold:true, impact:'', effort:'', due:'', ai:'', to:'',
              urgent:false, week:false, slug:'', blockedBy:[], rank:null, extra:[], body:[], raw:'', dirty:true };
  tier.tasks.push(t);
  markDirty(); refreshView(); openDrawer(t.id, true);
}

/* Taking work back off Claude has to take the prompt with it.
   Delegate to Claude is generated from the ai: tag, so a task switched to
   partial or none drops out of that list — but the prompt written for it would
   stay behind on the task, still reading as an instruction to hand it over. The
   next person to rebuild the section would have a prompt with nothing asking for
   it. A sub-step carrying its own ai:full is left alone, because it did not
   inherit the tag that just changed. Returns what was removed, so the change
   can be reported rather than happening silently. */
function stripDelegation(t){
  const removed = [];
  const out = [];
  let base = null, inherits = false;

  t.body.forEach(line => {
    const m = SUB_RE.exec(line);
    if (m && (base === null || m[1].length <= base)) {
      base = m[1].length;
      inherits = !hasField(m[3], 'ai');                    // no ai: of its own, so it follows the parent
      let text = m[3];
      if (inherits) text = text.replace(/\s*`rank:\d+`/g, '');
      out.push(m[1] + '- [' + m[2] + '] ' + text);
      return;
    }
    const deeper = base !== null && /^\s+\S/.test(line) && leadIndent(line) > base;
    if (PROMPT_NOTE.test(line) && (!deeper || inherits)) { removed.push(line.trim()); return; }
    out.push(line);
  });

  if (removed.length || t.rank != null) {
    t.body = out;
    t.rank = null;
    t.dirty = true;
  }
  return removed;
}

/* =========================================================================
   5. Drawer
   ========================================================================= */

function dedent(lines){ return lines.map(l => l.replace(/^ {1,2}/, '')).join('\n').replace(/\n+$/, ''); }
function indent(text){
  return text.replace(/\s+$/,'').split('\n').map(l => l.trim() === '' ? '' : '  ' + l);
}

/* ---- Date picker ----
   A month grid rather than <input type="date">, which hides its calendar behind
   a small icon and draws a different control in every browser. It opens in the
   flow under the field instead of floating over it: the panel scrolls, and a
   floating calendar gets cut off at the bottom edge. */
const CAL_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CAL_MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
function dueLabel(s){
  const d = parseDue(s);
  if (!d) return 'No date';
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}
function calendarHTML(month, selected){
  const y = month.getFullYear(), m = month.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;      // weeks start on Monday
  const days = new Date(y, m + 1, 0).getDate();
  const now = ymd(today());
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cd pad"></span>';
  for (let d = 1; d <= days; d++){
    const key = ymd(new Date(y, m, d));
    cells += '<button type="button" class="cd' + (key === selected ? ' sel' : '') +
      (key === now ? ' now' : '') + '" data-day="' + key + '">' + d + '</button>';
  }
  return '<div class="calhead">' +
      '<button type="button" class="calnav" data-cal="-1" title="Previous month">‹</button>' +
      '<strong>' + CAL_MONTHS[m] + ' ' + y + '</strong>' +
      '<button type="button" class="calnav" data-cal="1" title="Next month">›</button>' +
    '</div>' +
    '<div class="calgrid">' +
      CAL_DAYS.map(w => '<span class="cw" title="' + w + '">' + w[0] + '</span>').join('') +
      cells +
    '</div>' +
    '<div class="calfoot">' +
      '<button type="button" class="calsm" data-day="' + now + '">Today</button>' +
      '<button type="button" class="calsm" data-day="">Clear</button>' +
    '</div>';
}
/* One picker per date field, so `field` says which one is being edited. Both
   dates use the same calendar; only the value they write differs. */
const calMonth = {};
function wireDatePicker(t, touch, field){
  const btn = $('#f-' + field), cal = $('#f-cal-' + field);
  if (!btn || !cal) return;
  const draw = () => { cal.innerHTML = calendarHTML(calMonth[field], parseDue(t[field]) ? t[field] : ''); };
  btn.onclick = () => {
    const closed = cal.classList.toggle('hidden');
    if (closed) return;
    const from = parseDue(t[field]) || today();
    calMonth[field] = new Date(from.getFullYear(), from.getMonth(), 1);
    draw();
    cal.scrollIntoView({ block:'nearest' });
  };
  cal.onclick = e => {
    const nav = e.target.closest('[data-cal]');
    if (nav) {
      const m = calMonth[field];
      calMonth[field] = new Date(m.getFullYear(), m.getMonth() + (+nav.dataset.cal), 1);
      draw();
      return;
    }
    const day = e.target.closest('[data-day]');
    if (!day) return;
    t[field] = day.dataset.day;
    cal.classList.add('hidden');
    btn.textContent = dueLabel(t[field]);
    btn.classList.toggle('empty', !t[field]);
    touch();
    // The two dates constrain each other, so a change can make the other one
    // wrong. Re-open so the warning appears or clears straight away.
    openDrawer(state.openTask);
  };
}

/* ---- Dependencies, both directions, in the panel ----
   Backward is a plain read of `blocked-by:` — this line waits on that slug.
   Forward has no tag of its own: it is every other item in the file whose
   `blocked-by:` names this one, the same scan `unblockCount` already does
   for the headline bar, just kept as a list instead of collapsed to a
   number. A task or sub-step with neither a slug nor a `blocked-by:` has
   nothing to say either way, so it is left out rather than shown empty. */
function taskDependencies(t){
  const items = allItems();
  const parts = splitBody(t);
  const out = [];
  const addFor = (slug, blockedBy, where) => {
    const waitingOn = (blockedBy || []).map(s => ({ slug: s, item: itemBySlug(items, s) }));
    const blocks = slug ? items.filter(i => !i.done && i.blockedBy.indexOf(slug) > -1) : [];
    if (waitingOn.length || blocks.length) out.push({ where, waitingOn, blocks });
  };
  addFor(t.slug, t.blockedBy, '');
  parts.steps.forEach(s => addFor(s.slug, s.blockedBy, s.clean));
  return out;
}
function depLink(item, missingSlug){
  if (!item) return '<li class="depitem missing">#' + esc(missingSlug) + ' — no task carries this slug</li>';
  return '<li class="depitem' + (item.done ? ' done' : '') + '">' +
    '<button type="button" class="deplink" data-open="' + item.id + '">' +
      (item.done ? '✓ ' : '') + mdInline(item.title) +
    '</button></li>';
}
function depGroupHTML(g){
  const waiting = g.waitingOn.length
    ? '<div class="depcol"><span class="deplabel">Waiting on</span><ul class="deplist">' +
      g.waitingOn.map(w => depLink(w.item, w.slug)).join('') + '</ul></div>'
    : '';
  const blocks = g.blocks.length
    ? '<div class="depcol"><span class="deplabel">Blocks</span><ul class="deplist">' +
      g.blocks.map(i => depLink(i)).join('') + '</ul></div>'
    : '';
  return '<div class="depgroup">' +
    (g.where ? '<em class="suggwhere">for: ' + esc(g.where) + '</em>' : '') +
    '<div class="depcols">' + waiting + blocks + '</div>' +
  '</div>';
}
function dependenciesSection(t){
  const groups = taskDependencies(t);
  if (!groups.length) return '';
  const key = 'sugg:deps';
  return '<hr class="dsep">' +
    '<details class="field sugg" data-collapse="' + esc(key) + '"' + (sectionCollapsed(key) ? '' : ' open') + '>' +
    '<summary>Dependencies</summary>' +
    groups.map(depGroupHTML).join('') +
    '</details>';
}

/* ---- Messages and prompts written for this task ----
   Both live in the markdown as a note under the thing they serve, which means
   they arrive as one line buried in Notes. Pulled out here so the two things
   that are actually ready to send get their own place at the bottom of the
   panel, with a Copy button. The text itself is still edited in Notes — this is
   the same line, shown properly. */
function suggestions(t){
  const parts = splitBody(t);
  const out = { message: [], prompt: [], jira: [], agenda: [] };
  const take = (lines, where) => lines.forEach(l => {
    if (MSG_NOTE.test(l))         out.message.push({ text: quoted(l), draft: /\(draft\)/i.test(l), where, raw: l });
    else if (PROMPT_NOTE.test(l)) out.prompt.push({ text: quoted(l), draft: false, where, raw: l });
  });
  take(parts.notes, '');
  parts.steps.forEach(s => take(s.notes, s.clean));
  out.jira = jiraNotes(t);
  /* Read as a block rather than line by line, like a Jira description, so it
     goes through readAgenda on each run of notes instead of through take(). */
  const own = readAgenda(parts.notes);
  if (own) out.agenda.push(Object.assign({ where: '' }, own));
  parts.steps.forEach(s => {
    const ag = readAgenda(s.notes);
    if (ag) out.agenda.push(Object.assign({ where: s.clean }, ag));
  });
  return out;
}
function suggestionSection(label, list, opts){
  opts = opts || {};
  if (!list.length) return '';
  const key = 'sugg:' + label;
  return '<hr class="dsep">' +
    '<details class="field sugg" data-collapse="' + esc(key) + '"' + (sectionCollapsed(key) ? '' : ' open') + '>' +
    '<summary>' + esc(label) +
    (list.length > 1 ? ' <em class="sublabel">' + list.length + '</em>' : '') + '</summary>' +
    list.map(s => messageHTML(s.text, {
      where: s.where, draft: s.draft, claude: opts.claude, task: opts.task,
      dismiss: state.locked ? '' : s.raw
    })).join('') +
    '</details>';
}

/* The agenda for a recurring meeting, in the panel. Its own section rather than
   a third kind of message suggestion, because it is many lines rather than one
   and because the date the topics belong to comes from the task rather than from
   the note, which a message suggestion has no equivalent of.

   Open by default, unlike the other two: on a meeting task this is the whole of
   what the panel is for.

   `prev` is last cycle's agenda, kept by the roll. Shown under this one and
   without a Copy, because its only job is to be read while the next is written. */
function agendaSection(list, when, prev){
  if (!list.length && !prev) return '';
  const key = 'sugg:agenda';
  return '<hr class="dsep">' +
    '<details class="field sugg" data-collapse="' + esc(key) + '"' +
    (sectionCollapsed(key) ? '' : ' open') + '>' +
    '<summary>Meeting agenda' +
    (list.length > 1 ? ' <em class="sublabel">' + list.length + '</em>' : '') + '</summary>' +
    list.map(ag => agendaHTML(ag, when, { where: ag.where })).join('') +
    (prev ? agendaHTML(prev, '', { prev:true }) : '') +
    '<span class="help">Copy takes the date, the word Agenda and both levels of ' +
    'bullets, as bullets. The topics themselves are edited in Description.</span>' +
    '</details>';
}

/* Tickets waiting to be raised. Its own section rather than a third kind of
   suggestion, because the button is a link out to Jira rather than a copy, and
   because which board it goes to is part of what the row has to say. */
function jiraSection(list){
  if (!list.length) return '';
  return '<div class="field sugg"><span>Jira tickets' +
    (list.length > 1 ? ' <em class="sublabel">' + list.length + '</em>' : '') + '</span>' +
    list.map(n => jiraHTML(n, {
      where: n.where, dismiss: state.locked ? '' : n.raw, dismissDesc: n.descRaw
    })).join('') +
    '<span class="help">The link fills in the summary and the description. Nothing is raised until you press Create in Jira.</span>' +
    '</div>';
}

/* Turns one sub-step's text into an editable field in place. The row's drag
   handle stays put, but the row itself must stop being draggable while an
   input sits inside it, or selecting text tries to drag the row instead.
   Clearing the text and leaving removes the step, so there is no separate
   delete control to add just for this. */
function editSubtext(span, t, lineIdx, id, opts){
  if (state.locked) return;
  const chain = !!(opts && opts.chain);
  const row = span.closest('.sub');
  const m = SUB_RE.exec(t.body[lineIdx]);
  if (!m) return;
  row.draggable = false;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subedit';
  input.value = m[3];
  span.replaceWith(input);
  input.focus();
  input.select();
  let settled = false;
  const finish = save => {
    if (settled) return;
    settled = true;
    if (save) {
      const val = input.value.trim();
      if (val) setSubText(t, lineIdx, val); else removeSubLine(t, lineIdx);
    }
    refreshView();
    openDrawer(id);
  };
  input.onblur = () => finish(true);
  input.onkeydown = e => {
    if (e.key === 'Enter') {
      e.preventDefault();
      /* Typing a run of steps. Enter commits this one and opens the next, so a
         list of five is five lines and four Enters rather than five trips to
         the Add button. Read before finish(), which takes the input away.

         An empty step ends the run instead of adding another blank one, so
         Enter on a blank line is how you stop — the same way it works
         everywhere else that lists are typed. */
      const more = chain && !!input.value.trim();
      finish(true);
      if (more) addStepAndEdit(t, id);
    }
    else if (e.key === 'Escape') { e.preventDefault(); finish(false); }
  };
}

/* Adds a step and puts the cursor straight in it. Shared by the Add button and
   by Enter inside a new step, so both arrive in the same state. */
function addStepAndEdit(t, id){
  addSub(t);
  refreshView();
  openDrawer(id);
  const spans = $('#f-subs').querySelectorAll('.subtext');
  const last = spans[spans.length - 1];
  if (last) editSubtext(last, t, +last.dataset.line, id, { chain: true });
}

function openDrawer(id, focusTitle){
  const loc = locate(id);
  if (!loc) return;
  state.openTask = id;
  const t = loc.task;
  // A backup preview opens the same panel to look at a task, but nothing in it
  // may change — every field below is disabled and nothing is wired to it.
  const ro = state.locked;
  // Same list as the board, Done included: a ticked-off task is in the Done
  // column there, so the panel says the same thing rather than hiding it in a
  // tick box that has nothing to do with the other columns.
  const cols = boardColumns();
  const nowIn = t.done ? DONE_COL : loc.tier.name;
  const subs = subSteps(t);
  const sugg = suggestions(t);
  const proj = taskProject(t);
  const dis = ro ? ' disabled' : '';

  state.openProject = null;
  $('#drawer').classList.remove('projectview');
  $('#drawer').classList.toggle('readonly', ro);
  $('#drawerTitle').textContent = ro ? 'View task (read-only)' : 'Edit task';

  /* The headline is the one thing on the whole list, so the control for it sits
     in the panel's frame rather than in the run of fields — a decision about
     the task, next to the other one, instead of the eighth thing to scroll
     past. The explanation it used to carry underneath moves to the tooltip:
     it is worth reading once, not on every task. */
  const hlBtn = $('#dheadHl');
  hlBtn.classList.remove('hidden');
  hlBtn.classList.toggle('on', !!t.headline);
  hlBtn.textContent = t.headline ? 'The one thing' : 'Make headline';
  hlBtn.title = t.headline
    ? 'Set ' + dueLabel(t.headline) + '. It stays the headline until you solve it. Click to remove it.'
    : 'The task that makes the others easier or unnecessary. Only one at a time.';
  hlBtn.disabled = ro;
  $('#dfootHelp').textContent = ro
    ? 'Read-only — from a backup, nothing here can be changed.'
    : 'Changes save automatically';

  $('#dbody').innerHTML =
    '<label class="field"><span>Title</span><input type="text" id="f-title" value="' + esc(t.title) + '"' + dis + '></label>' +
    '<details class="field" data-collapse="notes"' + (sectionCollapsed('notes') ? '' : ' open') + '>' +
      '<summary>Description</summary>' +
      '<textarea id="f-body" spellcheck="false"' + dis + '>' + esc(dedent(bodyParts(t).notes)) + '</textarea>' +
      '<span class="help">Sub-steps live in the list below. Anything you type here is a note on the task.</span>' +
    '</details>' +
    '<div class="grid2">' +
      '<label class="field"><span>Bucket</span><select id="f-bucket"' + dis + '>' +
        state.doc.buckets.map(b => '<option' + (b === loc.bucket ? ' selected' : '') + '>' + esc(b.name) + '</option>').join('') +
      '</select></label>' +
      '<label class="field"><span>Column</span><select id="f-tier"' + dis + '>' +
        cols.map(n => '<option' + (n === nowIn ? ' selected' : '') + '>' + esc(n) + '</option>').join('') +
      '</select></label>' +
    '</div>' +
    '<div class="grid2">' +
      '<label class="field"><span>Impact</span><select id="f-impact"' + dis + '>' +
        ['','high','med','low'].map(v => '<option value="' + v + '"' + (v === t.impact ? ' selected' : '') + '>' + (v || '—') + '</option>').join('') +
      '</select></label>' +
      '<label class="field"><span>Effort</span><select id="f-effort"' + dis + '>' +
        ['','S','M','L'].map(v => '<option value="' + v + '"' + (v === t.effort ? ' selected' : '') + '>' + (v || '—') + '</option>').join('') +
      '</select></label>' +
    '</div>' +
    '<div class="grid2">' +
      '<label class="field"><span>Who does it (ai:)</span><select id="f-ai"' + dis + '>' +
        ['','full','partial','none'].map(v => '<option value="' + v + '"' + (v === t.ai ? ' selected' : '') + '>' + (v || '\u2014') + '</option>').join('') +
      '</select></label>' +
      /* A person, not Claude. Left blank on anything he is doing himself, which
         is most of the list, so the card shows nothing until it is filled in. */
      '<label class="field"><span>Delegated to</span>' +
        '<input type="text" id="f-to" value="' + esc(t.to || '') + '" placeholder="Nobody"' + dis + '>' +
        '<span class="help">A name. Shows on the card.</span>' +
      '</label>' +
    '</div>' +
    /* Read out of the notes below, and shown here as the thing it is. The note
       itself stays where it was written — this is a way in, not a second copy. */
    (proj
      ? '<div class="field"><span>Project</span>' +
          '<button type="button" class="projbtn" data-project="' + esc(proj) + '">' + esc(proj) + '</button>' +
          '<span class="help">Its background and sources are in <code>data/projects/' + esc(proj) +
          '/</code>. Click to see everything on it.</span>' +
        '</div>'
      : '') +
    /* Two dates, because one was doing two jobs. "Can start" is when the work
       becomes possible; "Due" is when it has to be finished. Quick wins reads
       the first and ignores the second. */
    '<div class="grid2">' +
      '<div class="field"><span>Can start</span>' +
        '<button type="button" class="dpbtn' + (parseDue(t.start) ? '' : ' empty') + '" id="f-start"' + dis + '>' +
          esc(t.start ? dueLabel(t.start) : 'Any time') + '</button>' +
      '</div>' +
      '<div class="field"><span>Due</span>' +
        '<button type="button" class="dpbtn' + (parseDue(t.due) ? '' : ' empty') + '" id="f-due"' + dis + '>' +
          esc(dueLabel(t.due)) + '</button>' +
      '</div>' +
    '</div>' +
    '<div class="cal hidden" id="f-cal-start"></div>' +
    '<div class="cal hidden" id="f-cal-due"></div>' +
    (parseDue(t.start) && parseDue(t.due) && parseDue(t.start) > parseDue(t.due)
      ? '<p class="datewarn">This cannot start until after it is due. One of the two dates is wrong.</p>'
      : '') +
    (notYet(t.start)
      ? '<p class="datenote">Hidden from Quick wins until ' + esc(dueLabel(t.start)) + '.</p>'
      : '') +
    '<div class="field"><span>Flags</span>' +
      '<label class="toggle"><input type="checkbox" id="f-urgent"' + (t.urgent ? ' checked' : '') + dis + '> urgent</label>' +
    '</div>' +
    '<div class="field"><span>Sub-steps' +
      (subs.length && !ro ? ' <em class="sublabel">drag to reorder, click to edit</em>' : '') + '</span>' +
      '<div class="substeps" id="f-subs">' +
      subs.map((s, i) => {
        const sd = dueInfo(s.due);
        return '<div class="sub' + (s.done ? ' checked' : '') + '"' + (ro ? '' : ' draggable="true"') + ' data-i="' + i + '">' +
          '<span class="grip" title="Drag to reorder">⠿</span>' +
          '<input type="checkbox" data-line="' + s.line + '"' + (s.done ? ' checked' : '') + dis + '>' +
          '<span class="subtext" data-line="' + s.line + '"' + (ro ? '' : ' title="Click to edit"') + '>' + esc(s.clean) +
          (sd ? '<em class="mini ' + sd.cls + '">' + esc(sd.label) + '</em>' : '') + '</span>' +
          (ro ? '' : '<button type="button" class="subdel" data-line="' + s.line + '" title="Delete this step">×</button>') +
          '</div>';
      }).join('') +
      '</div>' +
      (ro ? '' : '<button type="button" class="addsub" id="f-addsub" title="Enter keeps adding, blank Enter stops">+ Add step</button>') +
    '</div>' +
    chatSection(t) +
    dependenciesSection(t) +
    agendaSection(sugg.agenda, t.due, readPrevAgenda(bodyParts(t).notes)) +
    suggestionSection('Message suggestions', sugg.message) +
    suggestionSection('Prompt suggestions', sugg.prompt, { claude:true, task:t.id }) +
    jiraSection(sugg.jira);

  // Every handler below changes the task, so none of them are wired up in a
  // backup preview — the fields are also disabled above, but this is what
  // actually stops a change from happening rather than just looking stopped.
  if (!ro) {
  const touch = () => { t.dirty = true; markDirty(); refreshView(); };

  $('#f-title').oninput  = e => { t.title = e.target.value; touch(); };
  // Not trimmed here, or a space between a first and last name would vanish as
  // it is typed. serializeTask trims it on the way to the file.
  $('#f-to').oninput     = e => { t.to = e.target.value; touch(); };
  $('#f-impact').onchange = e => { t.impact = e.target.value; touch(); };
  $('#f-effort').onchange = e => { t.effort = e.target.value; touch(); };
  $('#f-ai').onchange     = e => {
    t.ai = e.target.value;
    if (t.ai !== 'full') {
      const dropped = stripDelegation(t);
      if (dropped.length) {
        touch();
        openDrawer(id);
        $('#status').textContent = 'removed ' + dropped.length + ' prompt' +
          (dropped.length > 1 ? 's' : '') + ' — no longer ai:full';
        $('#status').classList.add('dirty');
        return;
      }
    }
    touch();
  };
  $('#f-urgent').onchange = e => { t.urgent = e.target.checked; touch(); };
  hlBtn.onclick = () => { if (t.headline) clearHeadline(false); else setHeadline(id); };
  wireDatePicker(t, touch, 'start');
  wireDatePicker(t, touch, 'due');

  /* Done is the tick box in the file, not a section, so picking it here ticks
     the task off and picking anything else unticks it — exactly what dragging a
     card in or out of the Done column does. */
  $('#f-tier').onchange = e => {
    const pick = e.target.value;
    if (pick === DONE_COL) {
      setDone(t, true);
      markDirty(); refreshView(); openDrawer(id);
      return;
    }
    setDone(t, false);
    const target = ensureTier(loc.bucket, pick);
    if (target !== loc.tier) {
      loc.tier.tasks.splice(loc.index, 1);
      target.tasks.push(t);
    }
    markDirty(); refreshView(); openDrawer(id);
  };
  $('#f-bucket').onchange = e => {
    const nb = state.doc.buckets.find(b => b.name === e.target.value);
    if (!nb) return;
    const target = ensureTier(nb, loc.tier.name);
    loc.tier.tasks.splice(loc.index, 1);
    target.tasks.push(t);
    // The filter stays put rather than following the task to its new bucket —
    // moving a card out of the one you're looking at should look like moving
    // it out, the same as any other edit that drops a task out of view.
    markDirty(); refreshView(); openDrawer(id);
  };
  const subsEl = $('#f-subs');
  if (subsEl) {
    subsEl.querySelectorAll('input').forEach(cb => {
      cb.onchange = () => { toggleSub(t, +cb.dataset.line); refreshView(); openDrawer(id); };
    });
    subsEl.querySelectorAll('.subtext').forEach(span => {
      span.onclick = () => editSubtext(span, t, +span.dataset.line, id);
    });
    subsEl.querySelectorAll('.subdel').forEach(btn => {
      btn.onclick = e => {
        e.stopPropagation();
        const lineIdx = +btn.dataset.line;
        const m = SUB_RE.exec(t.body[lineIdx]);
        const label = m ? stripTags(m[3]).replace(/\s+/g, ' ').trim() : 'this step';
        if (!confirm('Delete "' + label + '"? This removes it from todo.md when you save.')) return;
        removeSubLine(t, lineIdx);
        refreshView(); openDrawer(id);
      };
    });
    const rows = subsEl.querySelectorAll('.sub');
    const clear = () => rows.forEach(r => r.classList.remove('over-top','over-bottom','dragging'));
    rows.forEach(row => {
      row.ondragstart = e => {
        subDrag = +row.dataset.i;
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', 'substep');
        row.classList.add('dragging');
      };
      row.ondragend = () => { subDrag = null; clear(); };
      row.ondragover = e => {
        if (subDrag === null) return;
        e.preventDefault();
        const r = row.getBoundingClientRect();
        const after = e.clientY > r.top + r.height / 2;
        row.classList.toggle('over-bottom', after);
        row.classList.toggle('over-top', !after);
      };
      row.ondragleave = () => row.classList.remove('over-top','over-bottom');
      row.ondrop = e => {
        if (subDrag === null) return;
        e.preventDefault(); e.stopPropagation();
        const r = row.getBoundingClientRect();
        const to = +row.dataset.i + (e.clientY > r.top + r.height / 2 ? 1 : 0);
        const from = subDrag;
        subDrag = null; clear();
        moveSub(t, from, to);
        refreshView(); openDrawer(id);
      };
    });
  }
  /* Adds the step, then drops straight into editing its (empty) text — an
     "Add" click that still left a blank, unlabelled row would just be a second
     click waiting to happen. */
  $('#f-addsub').onclick = () => addStepAndEdit(t, id);
  $('#f-body').onchange = e => {
    const p = bodyParts(t);
    rebuildBody(t, indent(e.target.value), p.subs, p.subsAt);
    markDirty(); refreshView();
  };
  }

  $('#drawer').classList.add('open');
  $('#scrim').classList.add('open');
  if (focusTitle) { const el = $('#f-title'); el.focus(); el.select(); }
}

function closeDrawer(){
  state.openTask = null;
  state.openProject = null;
  $('#drawer').classList.remove('open');
  $('#drawer').classList.remove('projectview');
  $('#scrim').classList.remove('open');
}

/* ---- The panel, showing a project instead of a task ----
   A project is spread across buckets by design: the presentation is Design
   System work, the deck review is People work, and the list is right to keep
   them apart. That makes "what is left on this" a question the columns cannot
   answer, which is what this is for. It reads, and nothing more — every row is
   a way back into the task that owns it. */
function openProjectDrawer(name){
  const rows = projectTasks(name);
  state.openTask = null;
  state.openProject = name;

  $('#drawer').classList.add('projectview');
  $('#drawer').classList.toggle('readonly', state.locked);
  $('#drawerTitle').textContent = name;
  $('#dheadHl').classList.add('hidden');

  const open = rows.filter(r => !r.task.done);
  const done = rows.filter(r => r.task.done);
  const count = rows.length === 1 ? '1 task' : rows.length + ' tasks';
  const split = done.length
    ? count + ', ' + done.length + ' finished'
    : count;

  const row = r => {
    const di = dueInfo(r.task.due);
    return '<button type="button" class="projrow' + (r.task.done ? ' done' : '') +
        '" data-open="' + r.task.id + '">' +
      '<span class="pt">' + esc(r.task.title) + '</span>' +
      '<span class="pw">' + esc(r.bucket + ' · ' + r.tier) +
        (di ? '<em class="tag due ' + di.cls + '">' + esc(di.label) + '</em>' : '') +
        (r.task.headline ? '<em class="tag">the one thing</em>' : '') +
      '</span>' +
    '</button>';
  };

  $('#dbody').innerHTML =
    '<div class="field"><span>Folder</span>' +
      '<div class="projpath">data/projects/' + esc(name) + '/</div>' +
      '<span class="help">The background is in that folder\'s <code>CLAUDE.md</code>, with the ' +
      'source documents beside it. The board does not read those files — this is where they are.</span>' +
    '</div>' +
    '<div class="field"><span>On this project</span>' +
      (rows.length
        ? '<div class="projlist">' + open.map(row).join('') + done.map(row).join('') + '</div>' +
          '<span class="help">' + esc(split) + '. Click one to open it.</span>'
        : '<span class="help">Nothing on the list points at this folder yet. A task joins it by ' +
          'naming the folder in a note: <code>Project: data/projects/' + esc(name) + '</code>.</span>') +
    '</div>';

  $('#dbody').querySelectorAll('.projrow').forEach(el => {
    el.onclick = () => openDrawer(el.dataset.open);
  });

  $('#dfootHelp').textContent = 'A project is a folder, not a task — nothing here can be edited.';
  $('#drawer').classList.add('open');
  $('#scrim').classList.add('open');
}

/* Which of the drawer's own sections — Description, Chats, Message
   suggestions, Prompt suggestions — are shut, remembered the same way the
   drawer's own width is: a preference about the drawer's shape, not about
   one task, so closing Chats once keeps it closed on every task after.
   Absent means open, so a fresh clone or a section invented after this
   shipped both default to shown. */
const SECTION_KEY = 'todo-board-collapsed';
function sectionCollapsed(key){
  try { return !!(JSON.parse(localStorage.getItem(SECTION_KEY) || '{}') || {})[key]; }
  catch (e) { return false; }
}
function setSectionCollapsed(key, collapsed){
  let all;
  try { all = JSON.parse(localStorage.getItem(SECTION_KEY) || '{}') || {}; } catch (e) { all = {}; }
  if (collapsed) all[key] = true; else delete all[key];
  try { localStorage.setItem(SECTION_KEY, JSON.stringify(all)); } catch (e) {}
}
/* Overview's own sections — Big rocks, This week, Quick wins, Delegate to
   Claude, Context — default the other way round: shut until he opens one, on
   the same reasoning that put a limit on how many cards a column shows.
   Skimmed at a glance, five open lists is not an overview, it is the board
   again with extra steps. A separate key from the drawer's, so a section name
   the two happen to share cannot cross-wire their two different defaults. */
const OVSECTION_KEY = 'todo-board-overview-open';
function overviewOpen(key){
  try { return !!(JSON.parse(localStorage.getItem(OVSECTION_KEY) || '{}') || {})[key]; }
  catch (e) { return false; }
}
function setOverviewOpen(key, open){
  let all;
  try { all = JSON.parse(localStorage.getItem(OVSECTION_KEY) || '{}') || {}; } catch (e) { all = {}; }
  if (open) all[key] = true; else delete all[key];
  try { localStorage.setItem(OVSECTION_KEY, JSON.stringify(all)); } catch (e) {}
}
/* A suggestion he does not want dismissed without touching the task itself —
   the whole point is that nothing about the task changes, so nothing here
   writes to todo.md. Keyed on the task id plus the sub-step's own line, since
   two sub-steps under one task share the task's id and would otherwise
   dismiss each other. Persisted the same way the collapsed sections are, so
   it survives a reload rather than resetting every time the board opens. */
const QUICK_DISMISS_KEY = 'todo-board-quick-dismissed';
function quickKey(it){ return it.id + (it.sub ? ':' + it.sub.line : ''); }
function quickDismissedSet(){
  try { return new Set(JSON.parse(localStorage.getItem(QUICK_DISMISS_KEY) || '[]')); }
  catch (e) { return new Set(); }
}
function setQuickDismissed(set){
  try { localStorage.setItem(QUICK_DISMISS_KEY, JSON.stringify([...set])); } catch (e) {}
}

/* A <details>'s own toggle event does not bubble in every browser, but the
   capture phase still sees it on the way down regardless of that — so one
   listener here, rather than one wired up inside openDrawer on every redraw,
   covers every collapsible section the drawer ever draws. */
document.addEventListener('toggle', e => {
  const ds = e.target.dataset || {};
  if (ds.collapse) setSectionCollapsed(ds.collapse, !e.target.open);
  else if (ds.ovcollapse) setOverviewOpen(ds.ovcollapse, e.target.open);
}, true);

/* Drag the panel's left edge to make it wider; the width is remembered. */
function drawerMax(){
  const w = window.innerWidth || document.documentElement.clientWidth || 1280;
  return Math.max(360, w - 120);
}
/* Apply fits the panel to the window; set records what the user actually wants,
   so a narrow window never quietly overwrites their chosen width. */
function applyDrawerWidth(){
  $('#drawer').style.width = Math.round(Math.min(Math.max(state.drawerWidth, 340), drawerMax())) + 'px';
}
function setDrawerWidth(px){
  state.drawerWidth = Math.round(Math.min(Math.max(px, 340), 1200));
  try { localStorage.setItem('todo-board-drawer', state.drawerWidth); } catch (e) {}
  applyDrawerWidth();
}
applyDrawerWidth();
(() => {
  const grip = $('#dgrip');
  grip.onpointerdown = e => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    grip.classList.add('active');
    document.body.classList.add('resizing');
    const move = ev => setDrawerWidth(window.innerWidth - ev.clientX);
    const up = () => {
      grip.removeEventListener('pointermove', move);
      grip.classList.remove('active');
      document.body.classList.remove('resizing');
    };
    grip.addEventListener('pointermove', move);
    grip.addEventListener('pointerup', up, { once:true });
    grip.addEventListener('pointercancel', up, { once:true });
  };
  grip.ondblclick = () => setDrawerWidth(400);
})();
window.addEventListener('resize', applyDrawerWidth);

$('#closeDrawer').onclick = closeDrawer;
$('#scrim').onclick = closeDrawer;

/* Project chips are drawn inside cards, and a card opens its task on click.
   Capture phase, on the document, so the chip answers first and the card behind
   it never hears about it — one handler covering the board, the lists and the
   panel's own Project button, none of which need to know this exists. */
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-project]');
  if (!chip) return;
  e.preventDefault();
  e.stopPropagation();
  openProjectDrawer(chip.dataset.project);
}, true);
$('#del').onclick = () => {
  if (state.locked) return;
  const loc = state.openTask && locate(state.openTask);
  if (!loc) return;
  if (!confirm('Delete "' + loc.task.title + '"? This removes it from todo.md when you save.')) return;
  loc.tier.tasks.splice(loc.index, 1);
  closeDrawer(); markDirty(); refreshView();
};
$('#undo').onclick = undo;
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDrawer();
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); saveFile(); }
  // Not while a field has focus — cmd/ctrl+Z there means "undo my last few
  // keystrokes", which the browser already does natively on that one field.
  // Hijacking it for a whole-document undo would be a surprise, not a fix.
  if ((e.metaKey || e.ctrlKey) && !e.shiftKey && e.key.toLowerCase() === 'z') {
    const tag = (document.activeElement || {}).tagName;
    if (tag !== 'INPUT' && tag !== 'TEXTAREA') { e.preventDefault(); undo(); }
  }
});

/* =========================================================================
   6. Loading & saving
   ========================================================================= */

function load(text, name, opts){
  opts = opts || {};
  const doc = parseDoc(text);
  if (!doc.buckets.length) throw new Error('No task buckets found — expected headings like "## 1. People".');
  state.doc = doc;
  const renamed = renameParked(state.doc);
  const stamped = stampDoneDates(state.doc);
  /* Never on a document that cannot be written back. The demo and a backup
     preview are both records of something else, and rolling their dates forward
     would show dates that are nowhere on disk — the demo would also silently
     lose its example agenda to a Previous agenda note. `state.locked` is set by
     the caller after this returns, so it cannot be the guard here. */
  const rolled = opts.readOnly ? { n:0, carried:0 } : rollRecurring(state.doc);
  state.originalText = text;
  state.fileName = name || 'todo.md';
  $('#start').classList.add('hidden');
  $('#board').classList.remove('hidden');
  $('#hdr').classList.remove('hidden');
  if (state.activeBucket !== ALL_BUCKETS && !doc.buckets.some(b => b.name === state.activeBucket)) {
    state.activeBucket = ALL_BUCKETS;
  }
  markClean('');
  state.migratedOnly = false;
  renderView();
  if (renamed) { markDirty(); $('#status').textContent = 'renamed “Parked” to “Backlog” — save to apply'; }
  if (stamped) {
    markDirty();
    $('#status').textContent = 'dated ' + stamped + ' finished task' + (stamped === 1 ? '' : 's') +
      ' as done today — save to apply';
  }
  /* Said out loud, because this one moved a date and cleared a tick on a task he
     did not touch. Last, so it is the message left standing when more than one
     fixup ran: it is the only one of the three that changes what a card says. */
  if (rolled.n) {
    markDirty();
    $('#status').textContent = 'rolled ' + rolled.n + ' recurring task' + (rolled.n === 1 ? '' : 's') +
      ' onto the next date' +
      /* Said separately, because it is the one part he might disagree with: an
         agenda that was never ticked off is treated as still pending and moves
         with the card rather than being filed as last cycle's. */
      (rolled.carried
        ? ', ' + (rolled.carried === 1 ? 'one' : rolled.carried) +
          ' carrying an agenda that was never ticked off'
        : '') +
      ' — save to apply';
  }
  // After, not before: the rename/stamp fixups above are auto-applied on every
  // load, not something to undo back out of, so the freshly loaded (and fixed)
  // document is what "nothing to undo yet" means.
  resetUndo();
  // Set last: markDirty clears it, and both migrations go through markDirty.
  state.migratedOnly = !!(renamed || stamped || rolled.n);
}

function showErr(msg){
  $('#start').classList.remove('hidden');
  $('#board').classList.add('hidden');
  $('#hdr').classList.add('hidden');
  $('#startErr').innerHTML = '<div class="err">' + msg + '</div>';
}

/* Read todo.md from the project root, one folder up from this page. Needs the local
   launcher running — a browser will not let a page opened straight off the disk read
   files around it. */
async function loadFile(){
  try {
    const res = await fetch(FILE_URL + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('the server answered ' + res.status);
    load(await res.text(), 'todo.md');
    state.diskStamp = res.headers.get('Last-Modified') || null;
    /* A real list always wins: whatever was standing in for it stops here. */
    state.demo = false;
    state.locked = false;
    state.lockedLabel = '';
    updateLockUI();
  } catch (err) {
    if (await loadDemo()) return;
    showErr('<strong>Could not read todo.md.</strong><br>Close this tab and start the board by ' +
            'double-clicking <strong>run.command</strong> in the to-dos folder. ' +
            'Opening this page directly from Finder will not work — browsers block a page on disk ' +
            'from reading files beside it.<br><span style="opacity:.75">(' + esc(String(err.message || err)) + ')</span>');
  }
}

/* Read the Jira boards, if there are any. Absent is the ordinary case: the file
   is gitignored, so a fresh clone has none and the buttons simply do not show.
   It falls back to a committed example the same way the list falls back to
   demo.md, so the public deployment can still show what the feature looks like
   without a real site or account id being committed to a public repo.

   Never throws and never blocks the list: a board that cannot read this file is
   a board with no Jira buttons, which is a smaller problem than a board that
   will not open. */
async function loadJira(){
  for (const url of [JIRA_URL, '/kanban/jira.demo.json']) {
    try {
      const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
      if (!res.ok) continue;
      const cfg = await res.json();
      if (!cfg || !cfg.site || !Array.isArray(cfg.boards) || !cfg.boards.length) continue;
      state.jira = cfg;
      if (state.doc) renderView();
      return;
    } catch (err) { /* malformed or missing: no buttons, no complaint */ }
  }
}

/* =========================================================================
   Data sets — which private folder under data/ the board reads and writes.

   The dropdown lists every folder the server found; picking one asks the
   server to make it current, then reloads the page rather than trying to
   patch state in place. A switch changes the list, its backups, its Claude
   sessions and its Jira config all at once, so a full reload is the only way
   to be sure nothing from the old one lingers in this tab.
   ========================================================================= */
async function loadDatasets(){
  try {
    const res = await fetch(DATASETS_URL + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const data = await res.json();
    const sel = $('#datasetSelect');
    sel.innerHTML = '';
    (data.datasets || []).forEach(name => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      if (name === data.current) opt.selected = true;
      sel.appendChild(opt);
    });
    const add = document.createElement('option');
    add.value = '__new__';
    add.textContent = '+ New list…';
    sel.appendChild(add);
    state.datasets = true;
    if (!state.locked) $('#datasetMenu').classList.remove('hidden');
  } catch (err) {
    // No /datasets.json — an older server, or none at all. One list, no
    // picker, exactly as the board behaved before this existed.
    state.datasets = false;
    $('#datasetMenu').classList.add('hidden');
  }
}

async function switchDataset(name){
  try {
    const res = await fetch('/dataset/select', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const info = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(info.error || ('the server answered ' + res.status));
    location.reload();
  } catch (err) {
    alert('Could not switch lists.\n\n' + (err.message || err));
    loadDatasets();
  }
}

async function createDataset(){
  const raw = prompt('Name the new list:');
  if (raw === null || !raw.trim()) { loadDatasets(); return; }
  try {
    const res = await fetch('/datasets', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: raw })
    });
    const info = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(info.error || ('the server answered ' + res.status));
    location.reload();
  } catch (err) {
    alert('Could not create that list.\n\n' + (err.message || err));
    loadDatasets();
  }
}

$('#datasetSelect').onchange = e => {
  const name = e.target.value;
  if (name === '__new__') { createDataset(); return; }
  if (state.dirty) {
    alert('You have unsaved changes on this list.\n\nSave or discard them first, then switch lists.');
    loadDatasets();
    return;
  }
  switchDataset(name);
};

/* Stand an example list in for a missing todo.md, and say plainly that is what
   happened. Two situations reach here: a host serving this page as static files,
   where there is no data/ folder at all because git never had one, and the local
   board opened before the launcher is running.

   It reuses the Backup Preview lock rather than adding a mode of its own. The
   reason is the same one: invented tasks must never be able to reach disk as the
   live list. Locking is what already guarantees that everywhere — every write
   path checks it — so the example data gets it for free rather than needing a
   second set of guards that could fall out of step with the first.

   Returns false rather than throwing when there is no example file either, so
   loadFile can fall through to its real error. */
async function loadDemo(){
  try {
    const res = await fetch(DEMO_URL + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) return false;
    const text = await res.text();
    if (!parseDoc(text).buckets.length) return false;
    closeDrawer();
    load(text, 'demo.md', { readOnly:true });
    state.diskStamp = null;
    state.demo = true;
    state.locked = true;
    state.lockedLabel = 'an example list, not yours';
    updateLockUI();
    markClean('');
    renderView();
    return true;
  } catch (err) {
    return false;
  }
}

/* auto: this save was the timer's idea, not his, so a failure must not throw a
   dialog in front of whatever he is doing. It shows in the status line instead,
   and the changes stay in the tab either way. */
async function saveFile(auto, forceBackup){
  // The one guard that actually matters: state.doc can hold an old backup while
  // locked, and this must never let that overwrite the live todo.md.
  if (state.locked || !state.doc || !state.dirty) return;
  const text = serializeDoc(state.doc);
  try {
    const res = await fetch(FILE_URL + (forceBackup ? '?backup=force' : ''), {
      method: 'PUT',
      headers: { 'Content-Type':'text/markdown; charset=utf-8' },
      body: text
    });
    const info = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(info.error || ('the server answered ' + res.status));
    state.originalText = text;
    lastSaveAt = Date.now();
    // The relative stamp is the timestamp on an auto-save, so the clock time
    // would only repeat it. A manual save keeps the clock.
    markClean((auto ? 'auto-saved' : 'saved ' + new Date().toLocaleTimeString()) +
      (info.backup ? ' · backup: data/backups/' + info.backup : '') +
      (info.weekly ? ' · weekly: data/backups/' + info.weekly : '') + ' · todo.md', auto);
    // Our own write moved the file, so record it — otherwise the watcher would
    // read the new timestamp as somebody else's edit.
    await rememberStamp();
  } catch (err) {
    markDirty();
    if (auto) {
      // markDirty has just written "unsaved changes" over the line; this replaces
      // it, and keeps the clock as well as the stamp because a failure is worth
      // being able to pin to a moment.
      autoStatus('auto-save failed at ' + new Date().toLocaleTimeString() + ' — your changes are still here');
      $('#status').classList.add('dirty');
      return;
    }
    // A failed fetch means the local helper is not answering, not a bad file.
    const helperGone = err instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(String(err.message || err));
    if (helperGone) {
      $('#status').textContent = 'not saved — the board helper has stopped';
      alert('Nothing was saved, because the board helper is not running.\n\n' +
            'Your changes are still here in this tab, so do not close it.\n\n' +
            'Start board.command again (double-click it in the to-dos folder). It saves on ' +
            'its own every few seconds once it can reach the file again.\n\n' +
            'If you cannot restart it, use “Download copy” to get the changes out.');
    } else {
      alert('Could not save todo.md: ' + (err.message || err) +
            '\n\nNothing was written. Use “Download copy” if you need the changes out of the browser.');
    }
  }
}

function downloadText(text, name){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type:'text/markdown' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* =========================================================================
   Telling him what actually changed

   Both halves of the conflict modal need the same answer to the same question:
   what is different between these two versions of the file? Tasks are matched
   by title, because a title is what he recognises — an id would be accurate and
   useless. Repeated titles are matched in the order they appear.
   ========================================================================= */

function flattenDoc(doc){
  const seen = Object.create(null);
  const out = new Map();
  doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    /* A slug is a real identity — a task carrying one is still the same task
       after it is renamed. Everything else falls back to its title. */
    const base = t.slug ? 'slug:' + t.slug : t.title.trim().toLowerCase();
    seen[base] = (seen[base] || 0) + 1;
    const lines = serializeTask(t);
    out.set(base + '#' + seen[base], {
      title: t.title, bucket: b.name, tier: tier.name, done: t.done,
      block: lines.join('\n'),
