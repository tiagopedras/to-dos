/* =========================================================================
   3b. The buckets themselves
   A bucket is a `## N. Name` line in the file and nothing else — no id, no
   record anywhere of which tasks belong to it beyond the fact that they sit
   under it. So renaming one is a rewrite of that single line, and reordering
   is a rewrite of the numbers on all of them. Nothing about a task changes
   either way, which is why this can be a small feature rather than a migration.
   ========================================================================= */

/* The number in the heading *is* the position, so anything that moves, adds or
   removes a bucket has to restate it. Dropping `raw` is what lets serializeDoc
   rebuild the line from num and name instead of handing back the one it read. */
function renumberBuckets(){
  state.doc.buckets.forEach((b, i) => {
    const num = String(i + 1);
    if (b.num !== num) { b.num = num; b.raw = null; }
  });
}
function bucketTaskCount(b){ return b.tiers.reduce((m, t) => m + t.tasks.length, 0); }
/* Returns the bucket already holding the name, so the complaint can quote what
   is actually in the file rather than the capitalisation just typed at it. */
function bucketNameTaken(name, except){
  const k = name.toLowerCase();
  return state.doc.buckets.find(b => b !== except && b.name.toLowerCase() === k) || null;
}
/* One name, tidied the same way wherever it arrives from. A heading cannot carry
   a line break, and two spaces in the middle of a bucket name are a typo rather
   than a decision. */
function cleanBucketName(name){ return String(name).replace(/\s+/g, ' ').trim(); }

/* Each of these returns an error to show, or '' when it went through. The board
   is redrawn here rather than by the caller, because a rename changes the tab
   strip and the label on every card in that bucket. */
function renameBucket(b, name){
  const clean = cleanBucketName(name);
  if (!clean) return 'A bucket needs a name.';
  if (clean === b.name) return '';
  const clash = bucketNameTaken(clean, b);
  if (clash) return 'There is already a bucket called \u201c' + clash.name + '\u201d.';
  const was = b.name;
  b.name = clean;
  b.raw = null;
  // activeBucket is held by name, so the tab he is looking at has to follow it.
  if (state.activeBucket === was) state.activeBucket = clean;
  markDirty(); refreshView();
  return '';
}

function addBucket(name){
  const clean = cleanBucketName(name);
  if (!clean) return 'A bucket needs a name.';
  const clash = bucketNameTaken(clean, null);
  if (clash) return 'There is already a bucket called \u201c' + clash.name + '\u201d.';
  /* Born with the same columns as its siblings, all empty. A bucket with no
     `###` headings parses and draws perfectly well — ensureTier writes one the
     first card it gets — but the file is also read in Obsidian and by the
     checker, and there a bucket shaped unlike the rest reads as half-written.
     The closing rule matches what the other buckets end with, so the heading
     lands below the last one's rule and above whatever follows the buckets. */
  const tiers = allTiers().map(n => ({ name: n, raw: null, lead: [''], tasks: [], tail: [] }));
  // The blank line the closing rule sits under belongs to the last column, which
  // is where the parser puts it when it reads one of the buckets already there.
  if (tiers.length) tiers[tiers.length - 1].tail = [''];
  state.doc.buckets.push({ num: String(state.doc.buckets.length + 1), name: clean, raw: null,
                           intro: [''], tiers, tail: ['---', ''] });
  renumberBuckets();
  markDirty(); refreshView();
  return '';
}

/* Deleting a bucket must never delete work, so one with tasks in it can only go
   once they have somewhere to land. Each task keeps its column and its own text
   verbatim: this is the move the drawer's Bucket field already makes, done for
   every task in the bucket at once. */
function deleteBucket(b, dest){
  const list = state.doc.buckets;
  // The board cannot draw a list with no buckets, and load() refuses to read one.
  if (list.length < 2) return;
  const n = bucketTaskCount(b);
  if (n && !dest) return;
  if (n) b.tiers.forEach(tier => tier.tasks.forEach(t => ensureTier(dest, tier.name).tasks.push(t)));
  list.splice(list.indexOf(b), 1);
  renumberBuckets();
  if (state.activeBucket === b.name) state.activeBucket = dest ? dest.name : ALL_BUCKETS;
  markDirty(); refreshView();
}

/* Two different questions, so two different sheets. Empty, deleting a bucket
   costs a heading. With tasks in it, the only safe delete is a move, so it asks
   where they go and says how many are going there. */
function confirmDeleteBucket(b, back){
  const n = bucketTaskCount(b);
  const others = state.doc.buckets.filter(x => x !== b);
  if (!n) {
    showModal('Delete \u201c' + b.name + '\u201d?',
      'Nothing is in it. The heading goes, the buckets below it renumber, and none of it ' +
      'reaches the file until you save.', '',
      [{ label: 'Keep it', run: back },
       { label: 'Delete it', danger: true, run: () => { deleteBucket(b, null); back(); } }]);
    return;
  }
  let dest = others[0];
  showModal('Delete \u201c' + b.name + '\u201d?',
    'It still holds ' + n + ' task' + (n === 1 ? '' : 's') + ', finished ones included. They move ' +
    'rather than go \u2014 each one keeps its column, its text and its tags, and lands in the ' +
    'bucket you pick here.',
    '<label class="field"><span>Move its tasks to</span><select id="bkDest">' +
      others.map((x, i) => '<option value="' + i + '">' + esc(x.name) + '</option>').join('') +
    '</select></label>',
    [{ label: 'Keep it', run: back },
     { label: 'Move ' + n + ' and delete', danger: true, run: () => { deleteBucket(b, dest); back(); } }]);
  /* Read as it changes rather than when the button is pressed: showModal takes
     the sheet down before it runs the choice, so by then the select is gone. */
  const sel = modalEl.querySelector('#bkDest');
  sel.onchange = () => { dest = others[+sel.value]; };
}

/* The editor is one sheet holding every bucket, because the questions it answers
   are comparative — is this the right name next to the other three, is this the
   right order. A per-bucket menu on each tab could not show that. */
function openBucketEditor(){
  if (state.locked || !state.doc) return;
  /* An open task drawer behind this is stale the moment a bucket is renamed —
     its Bucket field lists the old name — and it is the wrong altitude anyway. */
  closeDrawer();

  const setErr = msg => { const el = modalEl && modalEl.querySelector('.bkerr'); if (el) el.textContent = msg; };

  const draw = () => {
    const list = state.doc.buckets;
    const rows = list.map((b, i) => {
      const n = bucketTaskCount(b);
      return '<div class="bkrow">' +
        '<span class="bknum">' + (i + 1) + '</span>' +
        '<i class="bkdot" style="background:' + BUCKET_COLOR[i % BUCKET_COLOR.length] + '"></i>' +
        '<input type="text" data-name="' + i + '" value="' + esc(b.name) + '" aria-label="Bucket name">' +
        '<span class="bkn" title="tasks in it, finished ones included">' + n + '</span>' +
        '<button class="btn mini" data-up="' + i + '" title="Move up" aria-label="Move up"' +
          (i === 0 ? ' disabled' : '') + '>\u2191</button>' +
        '<button class="btn mini" data-down="' + i + '" title="Move down" aria-label="Move down"' +
          (i === list.length - 1 ? ' disabled' : '') + '>\u2193</button>' +
        '<button class="btn mini danger" data-del="' + i + '"' +
          (list.length < 2 ? ' disabled title="A list needs at least one bucket"' : '') +
          '>Delete</button>' +
      '</div>';
    }).join('');

    showModal('Buckets',
      'The headings your list is organised under. A rename rewrites that one heading in ' +
      esc(state.fileName) + ' and leaves every task under it alone. The number and the colour ' +
      'follow the order, so moving a bucket renumbers the ones it passes. Nothing reaches the ' +
      'file until you save.',
      '<div class="bklist">' + rows + '</div>' +
      '<div class="bkadd">' +
        '<input type="text" id="bkNew" placeholder="New bucket name" aria-label="New bucket name">' +
        '<button class="btn" id="bkAdd">Add bucket</button>' +
      '</div>' +
      '<p class="bkerr" role="status"></p>',
      [{ label: 'Done', primary: true }]);
    wire();
  };

  const wire = () => {
    const list = state.doc.buckets;
    modalEl.querySelectorAll('input[data-name]').forEach(inp => {
      const b = list[+inp.dataset.name];
      /* A rejected name is not redrawn away: he keeps what he typed, with the
         reason under it, because the fix is usually one character. */
      const apply = () => {
        const msg = renameBucket(b, inp.value);
        if (msg) { setErr(msg); }
        else { setErr(''); inp.value = b.name; }
      };
      inp.onchange = apply;
      inp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); apply(); } };
    });
    modalEl.querySelectorAll('[data-up]').forEach(el => {
      el.onclick = () => { moveBucket(list[+el.dataset.up], -1); draw(); };
    });
    modalEl.querySelectorAll('[data-down]').forEach(el => {
      el.onclick = () => { moveBucket(list[+el.dataset.down], 1); draw(); };
    });
    modalEl.querySelectorAll('[data-del]').forEach(el => {
      el.onclick = () => confirmDeleteBucket(list[+el.dataset.del], draw);
    });
    const add = () => {
      const inp = modalEl.querySelector('#bkNew');
      const msg = addBucket(inp.value);
      if (msg) setErr(msg); else draw();
    };
    modalEl.querySelector('#bkAdd').onclick = add;
    modalEl.querySelector('#bkNew').onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); add(); } };
  };

  draw();
}

function moveBucket(b, dir){
  const list = state.doc.buckets;
  const i = list.indexOf(b), j = i + dir;
  if (i < 0 || j < 0 || j >= list.length) return;
  list.splice(i, 1);
  list.splice(j, 0, b);
  renumberBuckets();
  markDirty(); refreshView();
}

/* opts.static drops the drag and focus attributes. The matrix hover preview is
   the same card, but it is a picture of one rather than one you can act on, so
   it must not be draggable or land in the tab order. */
function cardHTML(t, color, bucketLabel, opts){
  opts = opts || {};
  const subs = subSteps(t);
  const doneSubs = subs.filter(s => s.done).length;
  const di = dueInfo(t.due);
  const notes = noteLines(t);

  let meta = '';
  // Says it once, on the card, rather than leaving a gap that reads as "low".
  if (unscored(t) && !t.done) meta += '<span class="tag needsscore">needs scoring</span>';
  if (t.impact) meta += '<span class="tag impact-' + esc(t.impact) + '">' + esc(t.impact) + ' impact</span>';
  if (t.effort) meta += '<span class="tag">' + esc(t.effort) + '</span>';
  if (t.urgent) meta += '<span class="tag urgent">urgent</span>';
  const si = startInfo(t.start);
  if (si) meta += '<span class="tag startdate">' + esc(si.label) + ' · ' + esc(si.note) + '</span>';
  if (di) meta += '<span class="tag due ' + di.cls + '">' + esc(di.label) + (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (t.ai) meta += '<span class="tag ai ai-' + esc(t.ai) + '">ai: ' + esc(t.ai) + '</span>';

  let prog = '';
  if (subs.length) {
    const pct = Math.round(doneSubs / subs.length * 100);
    prog = '<div class="prog"><span>' + doneSubs + '/' + subs.length + ' steps</span>' +
           '<span class="bar"><i style="width:' + pct + '%"></i></span></div>';
  } else if (notes) {
    prog = '<div class="notecount">' + notes + ' note' + (notes > 1 ? 's' : '') + '</div>';
  }

  return '<article class="card' + (t.done ? ' done' : '') + '"' +
    (opts.static ? '' : ' tabindex="0" role="button"' + (opts.noDrag ? '' : ' draggable="true"')) +
    ' data-id="' + t.id + '" style="--bc:' + color + '">' +
    (bucketLabel ? '<div class="row1"><span class="bucket">' + esc(bucketLabel) + '</span></div>' : '') +
    '<div class="title">' + esc(t.title) + '</div>' +
    (meta ? '<div class="meta">' + meta + '</div>' : '') +
    prog +
  '</article>';
}

/* =========================================================================
   4b. Reference sections. Overview is four columns — Big rocks, This week, Quick
       wins, Delegate to Claude — plus Context. Dependency chain sits on Matrix,
       beside the nine cells.

   These used to be rendered as prose straight out of the markdown, which meant
   an entry was a sentence that happened to look like a task. Nothing connected
   it to the real card, so it could name a task that no longer existed and the
   view would show it happily. Since the tags moved onto the tasks, every entry
   here is built from a task or a sub-step, and clicking one opens it.
   ========================================================================= */

/* A task's body splits into its own notes and its sub-steps, each sub-step
   carrying the deeper-indented notes that belong to it. That depth is what says
   whether a suggested message serves the task or one step inside it. */
function splitBody(t){
  const notes = [], steps = [];
  let base = null;
  t.body.forEach((line, idx) => {
    const m = SUB_RE.exec(line);
    if (m && (base === null || m[1].length <= base)) {
      base = m[1].length;
      const text = m[3];
      steps.push({
        line: idx,                           // index back into the body, so it can be ticked
        done: m[2].toLowerCase() === 'x',
        text,
        due:   readField(text, 'due'),
        start: readField(text, 'start'),
        ai:    readField(text, 'ai'),
        /* Half the blockers in the file are steps, not whole tasks. Without the
           slug here, a `blocked-by:` pointing at one never resolves, so anything
           waiting on it looks permanently stuck. */
        slug: (/`#([a-z0-9][a-z0-9-]*)`/i.exec(text) || [,''])[1].toLowerCase(),
        rank: /`rank:(\d+)`/.test(text) ? +/`rank:(\d+)`/.exec(text)[1] : null,
        week: /`week`/.test(text),
        /* A step can wait on another step, which is the difference between "must
           be finished by the 7th" and "cannot start until the request goes out".
           A date cannot say the second thing, so without this the two are
           indistinguishable and Quick wins has to guess. */
        blockedBy: (/`blocked-by:([^`]*)`/.exec(text) || [,''])[1]
                     .split(',').map(s => s.trim()).filter(Boolean),
        clean: stripTags(text).replace(/\s+/g, ' ').replace(/\s*—\s*$/, '').trim(),
        notes: []
      });
      return;
    }
    if (steps.length && base !== null && /^\s+\S/.test(line) && leadIndent(line) > base) {
      steps[steps.length - 1].notes.push(line);
      return;
    }
    if (line.trim()) notes.push(line);
  });
  return { notes, steps };
}
function leadIndent(l){ return l.length - l.replace(/^\s+/, '').length; }

/* A suggested message and a prompt both live as a note under the thing they
   serve. "(draft)" is the marker for one he has to edit before sending — it
   used to be free prose mid-sentence, which nothing could read reliably. */
const MSG_NOTE    = /^\s*-\s+Suggested message(\s*\(draft\))?\s*:/i;
const PROMPT_NOTE = /^\s*-\s+Prompt\s*:/i;
function quoted(line){
  const q = [];
  for (let i = 0; i < line.length; i++) if (/["“”]/.test(line[i])) q.push(i);
  if (q.length >= 2) return line.slice(q[0] + 1, q[q.length - 1]).trim();
  return line.slice(line.indexOf(':') + 1).trim();
}
function noteMeta(lines){
  const meta = { message: '', draft: false, prompt: '' };
  lines.forEach(l => {
    if (MSG_NOTE.test(l))    { meta.message = quoted(l); meta.draft = /\(draft\)/i.test(l); }
    else if (PROMPT_NOTE.test(l)) { meta.prompt = quoted(l); }
  });
  return meta;
}

/* Every task and sub-step as one flat list. The reference sections all filter
   this, so an entry can never exist without the thing it points at. */
function allItems(){
  const out = [];
  state.doc.buckets.forEach((b, bi) => {
    const color = BUCKET_COLOR[bi % BUCKET_COLOR.length];
    b.tiers.forEach(tier => tier.tasks.forEach(t => {
      const parts = splitBody(t);
      const own = noteMeta(parts.notes);
      out.push({
        id: t.id, task: t, sub: null, color,
        bucket: b.name, tier: tier.name, parent: '',
        title: t.title, done: t.done,
        due: t.due, start: t.start, ai: t.ai, impact: t.impact, effort: t.effort,
        urgent: t.urgent, week: t.week, rank: t.rank,
        slug: t.slug, blockedBy: t.blockedBy || [],
        message: own.message, draft: own.draft, prompt: own.prompt
      });
      parts.steps.forEach(s => {
        const meta = noteMeta(s.notes);
        out.push({
          id: t.id, task: t, sub: s, color,
          bucket: b.name, tier: tier.name, parent: t.title,
          title: s.clean, done: s.done || t.done,
          due: s.due,
          /* A step cannot begin before the task it sits inside can, so it takes
             the later of its own start and its parent's. */
          start: laterOf(s.start, t.start),
          ai: s.ai || t.ai, impact: '', effort: '',
          urgent: false, week: s.week, rank: s.rank,
          slug: s.slug, blockedBy: s.blockedBy,
          message: meta.message, draft: meta.draft, prompt: meta.prompt
        });
      });
    }));
  });
  return out;
}

function itemBySlug(items, slug){ return items.find(i => i.slug === slug) || null; }

/* Which of the things an item waits on are still outstanding. A blocker that is
   not ticked yet blocks it. So does a slug that names nothing in the file: he
   cannot act on a dependency he cannot even look up, so an unresolvable one
   counts the same as an unfinished one.

   A sub-step carries no blocked-by tag of its own, but it cannot start before
   the task it sits inside can, so it inherits its parent's. */
function unresolvedBlockers(items, it){
  const own = it.blockedBy || [];
  const inherited = it.sub ? (it.task.blockedBy || []) : [];
  return own.concat(inherited).filter(slug => {
    const src = itemBySlug(items, slug);
    return !src || !src.done;
  });
}
function actionable(items, it){ return unresolvedBlockers(items, it).length === 0; }
function byDue(a, b){
  if (!a.due && !b.due) return 0;
  if (!a.due) return 1;
  if (!b.due) return -1;
  return a.due < b.due ? -1 : a.due > b.due ? 1 : 0;
}

/* ---- The small bordered card every reference renders as ---- */

function refTags(it){
  let out = '';
  const si = startInfo(it.start);
  if (si) out += '<span class="tag startdate">' + esc(si.label) + ' · ' + esc(si.note) + '</span>';
  const di = dueInfo(it.due);
  if (di) out += '<span class="tag due ' + di.cls + '">' + esc(di.label) + (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (it.urgent) out += '<span class="tag urgent">urgent</span>';
  if (it.impact) out += '<span class="tag impact-' + esc(it.impact) + '">' + esc(it.impact) + ' impact</span>';
  if (it.effort) out += '<span class="tag">' + esc(it.effort) + '</span>';
  if (it.ai) out += '<span class="tag ai ai-' + esc(it.ai) + '">ai: ' + esc(it.ai) + '</span>';
  return out;
}

/* These sections are the only place the five views exist now, so a card has to
   be somewhere he can work rather than just read: tick it here, open it here,
   drop it out of the week here. The tick writes to the task or the sub-step,
   whichever the card was built from, so the board and the file agree instantly.

   opts.message / opts.prompt say whether to include the body text. */
function refCard(it, opts){
  opts = opts || {};
  const where = [it.bucket, it.parent].filter(Boolean).map(esc).join(' · ');
  const target = it.sub ? ' data-sub="' + it.sub.line + '"' : '';
  let body = '';
  if (opts.message && it.message) {
    body += (it.draft ? '<p class="reflead draft">Draft, edit before sending</p>' : '') + messageHTML(it.message);
  }
  /* Switching a task to ai:full puts it here straight away, but the prompt is
     written by hand and lags behind the tag. Say so on the card, otherwise a
     task with nothing to paste looks the same as one that is ready to go. */
  if (opts.prompt) {
    body += it.prompt ? messageHTML(it.prompt, { claude:true })
                      : '<p class="reflead draft">Needs a prompt before this can be handed over</p>';
  }

  return '<article class="ref' + (it.done ? ' done' : '') + '" style="--bc:' + it.color + '">' +
    '<div class="refhead">' +
      '<button class="refbox" data-tick="' + it.id + '"' + target +
        ' role="checkbox" aria-checked="' + it.done + '"' +
        ' title="' + (it.done ? 'Mark as not done' : 'Mark as done') + '">' + (it.done ? '✓' : '') + '</button>' +
      '<button class="reftitle" data-open="' + it.id + '" title="Open this task">' + esc(it.title) + '</button>' +
      (opts.unweek
        ? '<button class="refdrop" data-unweek="' + it.id + '"' + target + ' title="Take this out of the week">Not this week</button>'
        : '') +
    '</div>' +
    '<div class="refwhere">' + where + '</div>' +
    (refTags(it) ? '<div class="meta">' + refTags(it) + '</div>' : '') +
    body +
  '</article>';
}

function refGroup(label, cards){
  if (!cards.length) return '';
  return '<h4 class="refgroup">' + esc(label) + '</h4>' + cards.join('');
}

/* ---- The five sections, each built from its tag ---- */

function weekSection(items){
  const live = items.filter(i => i.week).sort(byDue);
  if (!live.length) return '<p class="empty">Nothing is tagged <code>week</code> yet.</p>';
  const m = live.filter(i => i.effort === 'M' && !i.done).length;
  const warn = m > 2
    ? '<p class="refwarn">' + m + ' M-effort items this week. The ceiling is two once meetings are counted.</p>'
    : '';
  return warn + live.map(i => refCard(i, { unweek:true })).join('');
}

/* A quick win has to be something he can act on right now. Anything still
   waiting on an unfinished blocker is not a win, it is a reminder that he cannot
   start — so it is left out. The count of what was held back is shown, because
   a section that quietly shrinks looks like a section with nothing in it.

   Anything tagged ai:full is left out too. Delegate to Claude already lists
   every one of them, ranked, and the two columns sit side by side on Overview —
   the same card in both reads as two jobs when it is one. Quick wins is what is
   left for him to do himself. */
function quickSection(items){
  // ai:full belongs to Delegate to Claude, not here.
  const open = items.filter(i => !i.done && i.ai !== 'full');
  // Two separate reasons something is not a quick win yet: it waits on another
  // task, or its start date has not arrived. Neither is about the deadline —
  // an overdue task is the most actionable thing on the list, not the least.
  const live = open.filter(i => actionable(items, i) && !notYet(i.start));
  const heldByDep = open.filter(i => !actionable(items, i)).length;
  const heldByDate = open.filter(i => actionable(items, i) && notYet(i.start)).length;
  const isS = i => i.sub === null && i.effort === 'S';
  const seen = new Set();
  const take = arr => arr.filter(i => { const k = i.id + '|' + i.title; if (seen.has(k)) return false; seen.add(k); return true; });

  const messages = take(live.filter(i => i.message)).sort(byDue);
  const decide   = take(live.filter(i => isS(i) && i.ai === 'partial'));
  const talk     = take(live.filter(i => isS(i) && i.ai === 'none'));

  const reasons = [];
  if (heldByDep)  reasons.push('<strong>' + heldByDep + '</strong> waiting on another task');
  if (heldByDate) reasons.push('<strong>' + heldByDate + '</strong> not startable yet');
  const note = reasons.length
    ? '<p class="refheld">Left out: ' + reasons.join(' · ') + '.</p>'
    : '';

  const out =
    refGroup('Costs one message, already written', messages.map(i => refCard(i, { message:true }))) +
    refGroup('Costs one decision', decide.map(i => refCard(i))) +
    refGroup('Costs one conversation', talk.map(i => refCard(i)));
  return out
    ? note + out
    : note + '<p class="empty">Nothing small enough to clear in a gap.</p>';
}

function bigRocksSection(items){
  const rocks = items.filter(i => i.sub === null && i.impact === 'high' && i.effort === 'L' && !i.done);
  return rocks.length ? rocks.map(i => refCard(i)).join('')
                      : '<p class="empty">No high impact, L effort tasks.</p>';
}

function chainSection(items){
  const blocked = items.filter(i => i.blockedBy.length && !i.done);
  if (!blocked.length) return '<p class="empty">Nothing carries a <code>blocked-by:</code> tag.</p>';
  return blocked.map(i => {
    const on = i.blockedBy.map(slug => {
      const src = itemBySlug(items, slug);
      return src
        ? '<button class="refchip" data-open="' + src.id + '">' + esc(src.title) + (src.done ? ' ✓' : '') + '</button>'
        : '<span class="refchip missing" title="No task carries this slug">#' + esc(slug) + ' missing</span>';
    }).join('');
    return '<article class="ref" style="--bc:' + i.color + '">' +
      '<div class="refhead"><span class="reftitle">' + esc(i.title) + '</span>' +
      '<button class="reflink" data-open="' + i.id + '">Open</button></div>' +
      '<div class="refwhere">' + esc(i.bucket) + '</div>' +
      '<div class="refwaits">waits on' + on + '</div>' +
    '</article>';
  }).join('');
}

/* Only ai:full work belongs here, and the ai: tag is the gate rather than the
   rank. A rank left behind on something he has taken back off Claude must not
   keep it in the list, otherwise the section quietly recommends delegating work
   he has already decided is his. */
function delegateSection(items){
  const ranked = items.filter(i => i.ai === 'full' && !i.done && i.rank != null)
                      .sort((a, b) => a.rank - b.rank);
  const unranked = items.filter(i => i.ai === 'full' && !i.done && i.rank == null);
  if (!ranked.length && !unranked.length) return '<p class="empty">Nothing is tagged <code>ai:full</code>.</p>';

  let html = ranked.map(i =>
    '<div class="refrow"><span class="refnum">' + i.rank + '</span>' + refCard(i, { prompt:true }) + '</div>'
  ).join('');
  if (unranked.length) {
    html += refGroup('Not ranked yet', unranked.map(i => refCard(i, { prompt:true })));
  }
  return html;
}

/* ---- Small shared renderers ---- */

function mdInline(s){
  return esc(s)
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[\s(])_([^_]+)_/g, '$1<em>$2</em>');
}
/* A prompt is written to be handed to Claude, so the board can do the handing
   rather than leaving it as a copy-and-paste. claude.ai/new?q= opens a fresh
   chat with the text already sitting in the box, unsent — which is the point,
   because most of these prompts still have a [path] to fill in before they go.
   Only prompts get this. A suggested message is for a person, not for Claude. */
function claudeHref(text){
  return 'https://claude.ai/new?q=' + encodeURIComponent(text);
}
function claudeLink(text){
  return '<a class="toclaude" href="' + claudeHref(text) + '" target="_blank" rel="noopener"' +
         ' title="Opens a new Claude chat with this prompt in the box, unsent">Open in Claude</a>';
}

/* A ready-to-send message, with a button that copies just the message text.
   opts.claude adds the hand-over link beside it. */
function messageHTML(text, opts){
  opts = opts || {};
  return '<div class="msg"><div class="msgtext">' + mdInline(text) + '</div>' +
         '<div class="msgacts">' +
           '<button class="copy" data-copy="' + esc(text) + '">Copy</button>' +
           (opts.claude ? claudeLink(text) : '') +
         '</div></div>';
}
/* ---- Context: standing facts, not tasks ----
   Who is away, whose contract runs out when, how names are spelt. It is the one
   part of the file that is not work and cannot be worked out from the tasks, so
   it is read straight out of the markdown rather than derived. Dates tagged
   on: or until: get a live countdown, since a leave date nobody is counting is
   how a plan ends up depending on somebody who is not there. */
const CTX_DATE = /`(on|until):(\d{4}-\d{2}-\d{2})`/;

function contextBlock(){
  const lines = state.doc.pre.concat(state.doc.post);
  let inside = false;
  const out = [];
  lines.forEach(l => {
    const h = /^##\s+(.*)$/.exec(l);
    if (h) { inside = /^context\b/i.test(h[1].trim()); return; }
    if (inside) out.push(l);
  });
  return out;
}

function contextSection(){
  const lines = contextBlock();
  if (!lines.length) return '';

  let html = '', group = '', items = [];
  const flush = () => {
    if (!items.length) return;
    html += (group ? '<h4 class="refgroup">' + esc(group) + '</h4>' : '') + items.join('');
    items = [];
  };

  lines.forEach(l => {
    const s = l.trim();
    if (!s || /^---+$/.test(s)) return;
    const h = /^###\s+(.*)$/.exec(s);
    if (h) { flush(); group = h[1]; return; }
    const b = /^[-*]\s+(.*)$/.exec(s);
    if (!b) return;

    const dm = CTX_DATE.exec(b[1]);
    let chip = '';
    if (dm) {
      const di = dueInfo(dm[2]);
      const past = di.days < 0;
      chip = '<span class="tag due ' + (past ? '' : di.cls) + '">' +
             (dm[1] === 'until' ? 'until ' : '') + esc(di.label) +
             ' · ' + (past ? Math.abs(di.days) + 'd ago' : 'in ' + di.days + 'd') + '</span>';
    }
    items.push('<article class="ref ctx">' +
      // Lifting the date out leaves "back on ." behind, so close the gap it left.
      '<div class="ctxtext">' + mdInline(
        b[1].replace(CTX_DATE, '').replace(/\s+([.,])/g, '$1').replace(/\s{2,}/g, ' ').trim()
      ) + '</div>' +
      (chip ? '<div class="meta">' + chip + '</div>' : '') +
    '</article>');
  });
  flush();
  return html;
}

/* Four tabs. Each reference section is generated from the tags on the tasks,
   so nothing here can name a task that is not on the board. */
function viewDefs(){
  return [
    { id:'overview', label:'Overview' },
    { id:'board',    label:'Board' },
    { id:'matrix',   label:'Matrix' },
    { id:'reports',  label:'Reports' },
    { id:'backups',  label:'Backups' }
  ];
}

/* =========================================================================
   4b2. Reports — what the file says about work that is already finished.

   Every other view answers "what should I do next". This one answers "what got
   done", which is the question that comes up in a one-to-one or a quarterly
   review and has never had an answer here that did not mean counting by hand.

   Read straight from state.doc, the same as every other view: nothing is
   fetched, nothing is stored, and a report of a backup preview describes that
   backup rather than the live file. Adding a second report means writing one
   more report*Report() that returns HTML and listing it in reportDefs().
   ========================================================================= */

/* The window is deliberately the same 30 days that archiving leaves alone, so
   the report can never be quietly wrong about its own period: anything old
   enough to fall out of this count is also old enough to have left todo.md. */
/* A function rather than a const: ARCHIVE_DAYS is declared further down the
   file, and a const reading it up here would be evaluated before it exists. */
function reportDays(){ return ARCHIVE_DAYS; }

function reportDefs(){
  return [completedByCategoryReport];
}

/* "27 Aug" — the year is noise inside a 30 day window. */
function reportDay(iso){
  const d = parseDue(iso);
  return d ? d.toLocaleDateString(undefined, { day:'numeric', month:'short' }) : iso;
}

/* Every ticked, dated task inside the window, kept with the bucket it was in so
   the breakdown does not need a second walk of the document. Sorted newest
   first, because a list of finished work is read from the top. */
function completedRecently(){
  const out = [];
  if (!state.doc) return out;
  state.doc.buckets.forEach((b, bi) => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (!t.done || !t.doneOn) return;
    const age = daysSince(t.doneOn);
    if (age == null || age < 0 || age > reportDays()) return;
    out.push({ bucket:b, bi, tier, task:t, age });
  })));
  return out.sort((x, y) => x.age - y.age);
}

/* Ticked but undated. These are real finished work that the count cannot claim,
   because without a date there is no way to say which month it belongs to — so
   they are reported as a gap rather than folded in or ignored. */
function undatedDoneCount(){
  let n = 0;
  if (!state.doc) return n;
  state.doc.buckets.forEach(b => b.tiers.forEach(tier => tier.tasks.forEach(t => {
    if (t.done && !t.doneOn) n++;
  })));
  return n;
}

function completedByCategoryReport(){
  const list = completedRecently();
  const from = new Date(today() - reportDays() * 86400000);
  const window = 'Ticked between <strong>' + esc(reportDay(ymd(from))) + '</strong> and ' +
    '<strong>' + esc(reportDay(ymd(today()))) + '</strong>, counted from the `done:` date on each task.';

  // Every bucket appears, including the empty ones. A bucket with nothing in it
  // is a finding, and dropping it would hide that.
  const rows = state.doc.buckets.map((b, i) => ({
    name: b.name,
    color: BUCKET_COLOR[i % BUCKET_COLOR.length],
    items: list.filter(it => it.bucket === b)
  }));
  const total = list.length;
  const most = rows.reduce((m, r) => Math.max(m, r.items.length), 0);

  const rowHTML = r => {
    const n = r.items.length;
    const pct = total ? Math.round(n / total * 100) : 0;
    const width = most ? (n / most * 100) : 0;
    const tasks = r.items.map(it =>
      '<li style="--bc:' + r.color + '">' +
        '<span class="dt">' + esc(reportDay(it.task.doneOn)) + '</span>' +
        '<button class="tt" data-open="' + it.task.id + '" title="Open this task">' +
          esc(it.task.title) + '</button>' +
        '<span class="where">' + esc(it.tier.name) + '</span>' +
      '</li>').join('');
    return '<div class="bkgroup">' +
        '<div class="row' + (n ? '' : ' zero') + '" style="--bc:' + r.color + '">' +
          '<span class="bkname"><i></i>' + esc(r.name) + '</span>' +
          '<span class="bar"><span style="width:' + width.toFixed(1) + '%"></span></span>' +
          '<span class="n">' + n + '</span>' +
          '<span class="pct">' + (total ? pct + '%' : '—') + '</span>' +
        '</div>' +
        (n ? '<details><summary>Show the ' + n + ' task' + (n === 1 ? '' : 's') + '</summary>' +
             '<ul class="done">' + tasks + '</ul></details>' : '') +
      '</div>';
  };

  const undated = undatedDoneCount();
  const notes = [
    'Only tasks carrying a `done:` date are counted. The board writes that date when ' +
    'a task is ticked, so anything ticked before that was added is invisible here.',
    'Finished work older than ' + ARCHIVE_DAYS + ' days can be archived out of todo.md, ' +
    'which is why this report stops at ' + reportDays() + ' days — past that the file is no ' +
    'longer the whole story.'
  ];
  if (undated) notes.unshift('<strong>' + undated + ' ticked task' + (undated === 1 ? ' has' : 's have') +
    ' no date</strong>, so ' + (undated === 1 ? 'it is' : 'they are') + ' not in the count above.');

  return '<h2>Completed in the last ' + reportDays() + ' days</h2>' +
    '<p class="window">' + window + '</p>' +
    '<div class="total"><span class="totaln">' + total + '</span>' +
      '<span class="totall">task' + (total === 1 ? '' : 's') + ' finished across ' +
      state.doc.buckets.length + ' categor' + (state.doc.buckets.length === 1 ? 'y' : 'ies') +
      '</span></div>' +
    (total ? rows.map(rowHTML).join('')
           : '<div class="empty">Nothing has been ticked off with a date in the last ' +
             reportDays() + ' days.</div>') +
    notes.map(n => '<p class="note">' + n + '</p>').join('');
}

function renderReportsView(){
  if (!state.doc) {
    $('#lists').innerHTML = '<div class="listcard reportsview"><h3>Reports</h3>' +
      '<div class="empty">No file loaded yet.</div></div>';
    return;
  }
  $('#lists').innerHTML = '<div class="listcard reportsview"><h3>Reports</h3>' +
    '<p class="help listlead">Counted from todo.md as it stands right now' +
    (state.locked ? ', which is the backup you are previewing rather than the live file' : '') +
    '. Nothing here changes the file.</p>' +
    reportDefs().map(fn => fn()).join('') +
  '</div>';
}

/* =========================================================================
   4b3. Backups — every copy of todo.md the board has kept, read from the same
   /backups.json the old standalone backups.html used. Fetched fresh each time
   the tab is opened, since a backup can land at any moment.
   ========================================================================= */
function backupSize(n){
  return n < 1024 ? n + ' B' : (n / 1024).toFixed(n < 102400 ? 1 : 0) + ' KB';
}

/* "3 days ago" is what tells him whether a copy is worth opening. The exact
   timestamp is there too, because for a backup the exact moment is the point. */
function backupAgo(iso){
  const then = new Date(iso), mins = Math.round((Date.now() - then) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return mins + ' minutes ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs === 1 ? 'an hour ago' : hrs + ' hours ago';
  const days = Math.round(hrs / 24);
  if (days < 7) return days === 1 ? 'yesterday' : days + ' days ago';
  const wks = Math.round(days / 7);
  return wks === 1 ? 'last week' : wks + ' weeks ago';
}

function backupWhen(iso){
  return new Date(iso).toLocaleString(undefined, {
    weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'
  });
}

/* The week label is in the file name, and it is more use than the file name. */
function backupWeekOf(name){
  const m = /week-(\d{4})-W(\d{2})/.exec(name);
  return m ? 'Week ' + m[2] + ', ' + m[1] : null;
}

function backupRowHTML(b){
  const wk = backupWeekOf(b.name);
  const label = (b.kind === 'weekly' ? (wk || 'weekly snapshot') : 'session backup') +
    ' · ' + backupWhen(b.modified);
  return '<div class="row">' +
    '<span class="tag' + (b.kind === 'weekly' ? '' : ' session') + '">' +
      (b.kind === 'weekly' ? (wk || 'weekly') : 'session') + '</span>' +
    '<a class="when" href="' + esc(b.url) + '" target="_blank">' + esc(backupWhen(b.modified)) + '</a>' +
    '<span class="ago">' + esc(backupAgo(b.modified)) + '</span>' +
    '<span class="spacer"></span>' +
    '<span class="name">' + esc(b.name) + '</span>' +
    '<span class="size">' + backupSize(b.bytes) + '</span>' +
    '<button type="button" class="btn loadbtn" data-load-url="' + esc(b.url) + '" data-load-label="' + esc(label) + '">Load</button>' +
  '</div>';
}

function backupGroupHTML(title, list, blank){
  return '<h2>' + esc(title) + '</h2>' +
    (list.length ? list.map(backupRowHTML).join('') : '<div class="empty">' + esc(blank) + '</div>');
}

async function renderBackupsView(){
  $('#lists').innerHTML = '<div class="listcard backupsview"><h3>Backups</h3>' +
    '<p class="help listnote">Every copy of todo.md the board has kept. Click one to read it, ' +
    'or Load it to look through it on the board — Backup Preview opens read-only, so nothing in ' +
    'it can be changed or saved over today\'s list.</p>' +
    '<div id="backupsOut">Loading…</div></div>';
  try {
    const res = await fetch('/backups.json?t=' + Date.now(), { cache:'no-store' });
    if (res.status === 404) {
      $('#backupsOut').innerHTML = '<div class="err"><strong>The board helper needs restarting.</strong><br>' +
        'It is running, but it is an older copy that does not know about backups yet. Save anything ' +
        'unsaved on the board first, then run this in Terminal:<br>' +
        '<code style="display:inline-block; margin-top:7px; font-size:12px">' +
        'lsof -ti tcp:8765 | xargs kill</code><br><br>Then double-click <strong>board.command</strong> again.</div>';
      return;
    }
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const data = await res.json();
    const all = data.backups || [];
    // Weekly ones go by their week label, not their timestamp: a snapshot copied
    // late still belongs to its own week.
    const weekly = all.filter(b => b.kind === 'weekly').sort((x, y) => y.name.localeCompare(x.name));
    const session = all.filter(b => b.kind === 'session');

    /* The archive goes first and on its own. Every other file here is a copy of
       something that still exists; this is the only one holding work that has
       been taken out of the list. */
    const a = data.archive;
    const archive = !a ? '' :
      '<h2>Archived finished work</h2>' +
      '<div class="row">' +
        '<span class="tag">never pruned</span>' +
        '<a class="when" href="' + esc(a.url) + '" target="_blank">' + esc(backupWhen(a.modified)) + '</a>' +
        '<span class="ago">' + esc(backupAgo(a.modified)) + '</span>' +
        '<span class="spacer"></span>' +
        '<span class="name">' + esc(a.name) + '</span>' +
        '<span class="size">' + backupSize(a.bytes) + '</span>' +
      '</div>' +
      '<p class="help" style="margin-top:8px">' + a.sections +
        (a.sections === 1 ? ' batch' : ' batches') +
        ' of tasks that were ticked off more than a month ago and lifted out of todo.md. ' +
        'Nothing is ever removed from this file.</p>';

    $('#backupsOut').innerHTML = archive +
      backupGroupHTML('Weekly snapshots', weekly, 'None yet — the first one is taken the next time the board runs in a new week.') +
      backupGroupHTML('Recent sessions', session, 'None yet — one is taken before the first save of each run.') +
      '<p class="help listnote">This week is ' + esc(data.week) + '. The board keeps the last ' +
        data.keep.session + ' session backups and the last ' + data.keep.weekly +
        ' weekly ones, then deletes the oldest.</p>';

    $('#backupsOut').querySelectorAll('[data-load-url]').forEach(btn => {
      btn.onclick = () => loadBackupPreview(btn.dataset.loadUrl, btn.dataset.loadLabel);
    });
  } catch (err) {
    $('#backupsOut').innerHTML = '<div class="err"><strong>Could not read the backup list.</strong><br>' +
      esc(String(err.message || err)) + '</div>';
  }
}

/* =========================================================================
   4b4. Backup Preview — loading one of the files above straight into the
   board, so it can be looked through the same way as today's list, without
   any risk of it landing back on disk as the live todo.md.

   state.doc becomes the backup's parsed content and state.locked goes true;
   every place that would otherwise write to state.doc (setDone, dropTask,
   addTask, the drawer's field handlers, sub-step edits, headline, archive,
   saveFile, autosave, the outside-edit watcher) checks state.locked first and
   refuses. Exiting always re-fetches todo.md fresh from disk rather than
   restoring anything from memory — simplest, and no live edit can be lost
   from a mode that never allowed any.
   ========================================================================= */
async function loadBackupPreview(url, label){
  if (state.dirty) {
    alert('You have unsaved changes on today\'s list.\n\n' +
          'Save or discard them first, then Load the backup again.');
    return;
  }
  try {
    const res = await fetch(url + '?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('the server answered ' + res.status);
    const text = await res.text();
    const doc = parseDoc(text);
    if (!doc.buckets.length) throw new Error('that file has no task buckets in it');
    closeDrawer();
    state.doc = doc;
    state.originalText = text;
    state.fileName = url.split('/').pop();
    state.activeBucket = ALL_BUCKETS;
    state.view = 'board';
    state.locked = true;
    state.demo = false;
    state.lockedLabel = label;
    updateLockUI();
    renderView();
  } catch (err) {
    alert('Could not load that backup.\n\n' + (err.message || err));
  }
}

async function exitBackupPreview(){
  state.locked = false;
  state.lockedLabel = '';
  state.demo = false;
  updateLockUI();
  await loadFile();
}

function updateLockUI(){
  document.body.classList.toggle('locked', state.locked);
  $('#lockFrame').classList.toggle('hidden', !state.locked);
  $('#lockBar').classList.toggle('hidden', !state.locked);
  $('#lockBarKind').textContent = state.demo ? 'Example data' : 'Backup Preview';
  $('#exitLock').textContent = state.demo ? 'Try todo.md again' : 'Return to today\'s list';
  $('#lockBarLabel').textContent = state.locked
    ? 'Viewing ' + state.lockedLabel + ' — nothing here can be edited or saved.'
    : '';
  $('#dataMenu').classList.toggle('hidden', state.locked);
  $('#autoWrap').classList.toggle('hidden', state.locked);
  syncLockBarHeight();
}

/* Tell the header how far down to stick. Both it and the bar are sticky at the
   top of the same scroller, so the header needs the bar's height as its offset
   or the two occupy the same strip and the bar, being the higher layer, hides
   the buttons underneath it. Measured rather than assumed: the bar wraps to a
   second line on a narrow window, and the Example data label is longer than the
   Backup Preview one, so no single number is right for both. */
function syncLockBarHeight(){
  const h = state.locked ? $('#lockBar').offsetHeight : 0;
  document.body.style.setProperty('--lockbar-h', h + 'px');
}

/* The bar changes height without the board re-rendering — the window is resized,
   or the label reflows — so remeasure from the element itself rather than only
   at the moments the mode changes. */
if (window.ResizeObserver) {
  new ResizeObserver(syncLockBarHeight).observe($('#lockBar'));
} else {
  window.addEventListener('resize', syncLockBarHeight);
}

$('#exitLock').onclick = exitBackupPreview;

/* =========================================================================
   4c. The matrix: impact against effort
   Tier one drawn as a grid rather than a sorted column. Nine cells, impact up
   the side, effort across the bottom, so the eye reads the shape of the whole
   list at once: how much sits in the expensive corner, whether the cheap
   high-impact cell is actually empty.

   A card per task will not fit — nine cells across one screen means roughly a
   thumbnail each — so a task is one dot, coloured by its bucket. The title is on
   hover and a click opens it, which keeps the grid scannable while losing
   nothing: everything is still one gesture from the real task.
   ========================================================================= */

const MATRIX_IMPACT = ['high', 'med', 'low'];      // top row down
const MATRIX_EFFORT = ['S', 'M', 'L'];             // left column across
const EFFORT_HINT = { S: 'under half a day', M: 'one to three days', L: 'a week or more' };

/* What each cell means, said plainly. The corner cells are the only two that
   need no explanation, and the middle is where lists quietly rot, so it gets the
   bluntest label. */
const CELL_ADVICE = {
  'high/S': 'Do these first',
  'high/M': 'Worth the time',
  'high/L': 'Protect time, or break down',
  'med/S':  'Clear in a gap',
  'med/M':  'Fine, not urgent',
  'med/L':  'Ask for a smaller version',
  'low/S':  'Batch or hand over',
  'low/M':  'Probably not worth it',
  'low/L':  'Cut these'
};

/* No `title` attribute. The browser's own tooltip would appear next to the
   floating preview a second later, saying a worse version of the same thing.
   aria-label still carries it for anyone not using a pointer. */
function matrixDot(t, color){
  const di = dueInfo(t.due);
  const label = [
    t.title,
    t.bucket + ' · ' + t.tierName,
    di ? 'due ' + di.label + (di.note ? ', ' + di.note : '') : 'no date'
  ].filter(Boolean).join(', ');
  return '<button class="mdot' + (t.headline ? ' hl' : '') + (t.urgent ? ' urgent' : '') +
    '" data-open="' + t.id + '" style="--bc:' + color + '"' +
    ' aria-label="' + esc(label) + '"></button>';
}

/* ---- Hover preview ----
   The dot says where a task sits, not what it is. Rather than a tooltip that
   paraphrases the card, this shows the card itself — the same cardHTML the board
   renders — so hovering a dot answers the same question as looking at the board.

   Fixed position and appended to the body, because the grid sits inside a
   scrolling column and an absolutely positioned child would be clipped by it.
   pointer-events:none throughout, so the preview can never sit between the
   cursor and the dot it describes and swallow the click. */
let mPreviewEl = null;
function matrixPreview(){
  if (!mPreviewEl) {
    mPreviewEl = document.createElement('div');
    mPreviewEl.className = 'mpreview';
    mPreviewEl.setAttribute('aria-hidden', 'true');
    document.body.appendChild(mPreviewEl);
  }
  return mPreviewEl;
}
function showMatrixPreview(dot){
  const loc = locate(dot.dataset.open);
  if (!loc) return;
  const el = matrixPreview();
  const color = BUCKET_COLOR[state.doc.buckets.indexOf(loc.bucket) % BUCKET_COLOR.length];
  const where = loc.bucket.name + ' · ' + (loc.task.done ? DONE_COL : loc.tier.name);
  el.innerHTML = cardHTML(loc.task, color, where, { static: true });
  el.classList.add('on');
  placeMatrixPreview(dot);
}
/* Beside the dot, flipping to the other side rather than running off the edge,
   and never taller than the window allows. */
function placeMatrixPreview(dot){
  const el = mPreviewEl;
  if (!el) return;
  const r = dot.getBoundingClientRect();
  const w = el.offsetWidth, h = el.offsetHeight, gap = 12, edge = 8;
  let left = r.right + gap;
  if (left + w > window.innerWidth - edge) left = r.left - gap - w;
  left = Math.max(edge, Math.min(left, window.innerWidth - w - edge));
  let top = r.top + r.height / 2 - h / 2;
  top = Math.max(edge, Math.min(top, window.innerHeight - h - edge));
  el.style.left = Math.round(left) + 'px';
  el.style.top = Math.round(top) + 'px';
}
function hideMatrixPreview(){ if (mPreviewEl) mPreviewEl.classList.remove('on'); }

/* Top-level tasks only. Sub-steps carry no impact or effort of their own, so
   they have no position here — placing them under their parent's scores would
   double-count the same piece of work. Done tasks are left out: this is a tool
   for deciding what is next, not a record of what happened. */
function matrixTasks(){
  const out = [];
  state.doc.buckets.forEach((b, bi) => {
    const color = BUCKET_COLOR[bi % BUCKET_COLOR.length];
    b.tiers.forEach(tier => tier.tasks.forEach(t => {
      if (t.done || !matches(t)) return;
      out.push({ id: t.id, title: t.title, impact: t.impact, effort: t.effort,
                 due: t.due, ai: t.ai, urgent: t.urgent, headline: !!t.headline,
                 bucket: b.name, tierName: tier.name, color });
    }));
  });
  return out;
}

function matrixSection(){
  const tasks = matrixTasks();
  const placed = tasks.filter(t => IMPACT_N[t.impact] && EFFORT_N[t.effort]);
  const missing = tasks.filter(t => !IMPACT_N[t.impact] || !EFFORT_N[t.effort]);

  const legend = '<div class="mlegend">' +
    state.doc.buckets.map((b, i) =>
      '<span class="mkey" style="--bc:' + BUCKET_COLOR[i % BUCKET_COLOR.length] + '">' +
      '<i></i>' + esc(b.name) + '</span>').join('') +
    '<span class="mkey mkeyhl"><i></i>the one thing</span>' +
    '<span class="mkey mkeyurg"><i></i>urgent</span>' +
  '</div>';

  let grid = '<div class="mgrid">' +
    '<div class="mcorner">' +
      '<span class="maxis">Effort →</span>' +
      '<span class="maxis">↓ Impact</span>' +
    '</div>' +
    MATRIX_EFFORT.map(e => '<div class="mhead">' + esc(e) +
      '<span class="mhint">' + esc(EFFORT_HINT[e]) + '</span></div>').join('');

  MATRIX_IMPACT.forEach(imp => {
    grid += '<div class="mside">' + esc(imp) + '</div>';
    MATRIX_EFFORT.forEach(eff => {
      const key = imp + '/' + eff;
      const inCell = placed.filter(t => t.impact === imp && t.effort === eff);
      const score = IMPACT_N[imp] / EFFORT_N[eff];
      grid += '<div class="mcell' + (key === 'high/S' ? ' first' : '') +
          (inCell.length ? '' : ' empty') + '" data-score="' + score.toFixed(2) + '"' +
          ' style="--w:' + score.toFixed(2) + '">' +
        '<div class="mcellhead">' +
          '<span class="madvice">' + esc(CELL_ADVICE[key]) + '</span>' +
          '<span class="mcount">' + inCell.length + '</span>' +
        '</div>' +
        '<div class="mdots">' + inCell.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>';
    });
  });
  grid += '</div>';

  const tray = missing.length
    ? '<div class="mtray"><div class="mtrayhead">' +
        '<strong>' + missing.length + ' not on the matrix</strong>' +
        '<span>Missing an impact or an effort score, so they have no position. ' +
        'Click one to score it.</span></div>' +
        '<div class="mdots">' + missing.map(t => matrixDot(t, t.color)).join('') + '</div>' +
      '</div>'
    : '';

  const total = placed.length;
  const cheapWins = placed.filter(t => t.impact === 'high' && t.effort === 'S').length;
  const cut = placed.filter(t => t.impact === 'low' && t.effort === 'L').length;
  const heavy = placed.filter(t => t.effort === 'L').length;
  let read = '';
  if (total) {
    const bits = [];
    bits.push(cheapWins
      ? '<strong>' + cheapWins + '</strong> high impact and cheap — start there'
      : 'nothing is both high impact and cheap right now');
    bits.push('<strong>' + heavy + '</strong> of ' + total + ' need a week or more');
    if (cut) bits.push('<strong>' + cut + '</strong> in the cut corner');
    read = '<p class="mread">' + bits.join(' · ') + '</p>';
  }

  return legend + read + grid + tray;
}

function refSection(title, hint, html){
  return '<section class="listcard"><h3>' + esc(title) + '</h3>' +
         (hint ? '<p class="refhint">' + mdInline(hint) + '</p>' : '') +
         html +
         '</section>';
}

/* The split grid is written out here rather than in the stylesheet because
   Context is the last column and the only one with a different width: it is
   prose in full sentences, not cards, and at card width it reads as a ribbon.
   repeat() cannot take a computed count reliably across browsers, so the tracks
   are listed one by one. */
const REF_TRACK = 'minmax(380px,1fr)';
const CTX_TRACK = 'minmax(540px,1.5fr)';
function splitGridCSS(cols, hasCtx){
  const plain = hasCtx ? cols - 1 : cols;
  const tracks = Array(plain).fill(REF_TRACK);
  if (hasCtx) tracks.push(CTX_TRACK);
  // Below this the row scrolls sideways instead of squeezing the columns.
  const minW = plain * 394 + (hasCtx ? 554 : 0);
  return 'grid-template-columns:' + tracks.join(' ') + ';min-width:' + minW + 'px';
}

function renderSections(viewId){
  // The grid is rebuilt from scratch here, so any preview on screen is pointing
  // at a dot that no longer exists.
  hideMatrixPreview();
  const items = allItems();
  let html = '', split = false, mview = false, cols = 4, hasCtx = false;

  if (viewId === 'overview') {
    const ctx = contextSection();
    split = true;
    // One section per column, left to right, the same way the board reads.
    const secs = [
      refSection('Big rocks', 'High impact, L effort. Needs protected time.', bigRocksSection(items)),
      refSection('This week', 'Everything tagged `week`, soonest first.', weekSection(items)),
      refSection('Quick wins', 'Yours to do: `effort:S` and written messages. Anything `ai:full` sits in Delegate instead.', quickSection(items)),
      refSection('Delegate to Claude', 'Everything tagged `ai:full`, in `rank:` order.', delegateSection(items))
    ];
    if (ctx) {
      secs.push(refSection('Context', 'Standing facts, not tasks. Edit these in todo.md.', ctx));
      hasCtx = true;
    }
    cols = secs.length;
    html = secs.join('');
  } else if (viewId === 'matrix') {
    mview = true;
    // The chain sits beside the matrix: both answer "what can I actually start",
    // one by score and one by what is still waiting on something else.
    html = refSection('Impact against effort',
      'Every open task by its two scores. One dot per task, coloured by bucket — hover for the title, click to open it.',
      matrixSection()) +
      refSection('Dependency chain', 'Built from every `blocked-by:` tag.', chainSection(items));
  }

  $('#lists').innerHTML =
    '<div class="lists' + (split ? ' split' : '') + (mview ? ' mview' : '') + '"' +
      (split ? ' style="' + splitGridCSS(cols, hasCtx) + '"' : '') + '>' + html + '</div>' +
    '<p class="help listnote">Generated from the tags on the tasks, so every card here is a real task. ' +
    'Open one to change it, then Save.</p>';
}

/* Two views: the board, and the hand-written summaries from the end of the file.
   The bucket tabs, the AI filter and search only make sense on the board. */
function renderView(){
  // Up front, not at the end: the board case returns early, and the chip belongs
  // to the header rather than to any one view.
  updateArchiveChip();
  const defs = viewDefs();
  // Quick wins and Delegate to Claude are columns of Overview now, so an old
  // #quick or #delegate link lands where its content actually lives.
  if (state.view === 'quick' || state.view === 'delegate') state.view = 'overview';
  if (!defs.some(d => d.id === state.view)) state.view = 'board';
  const def = defs.find(d => d.id === state.view);
  const isBoard = def.id === 'board';
  // Keep the URL in step with whichever tab is on screen, so a refresh (or a
  // link back to this page) lands on the same view instead of the default.
  // replaceState rather than the hash setter: it doesn't add a history entry
  // or fire hashchange, so this can't loop with the listener below.
  if (location.hash.slice(1) !== state.view) history.replaceState(null, '', '#' + state.view);

  $('#viewToggle').innerHTML = defs.map(d =>
    '<button class="tab' + (d.id === state.view ? ' on' : '') + '" data-view="' + d.id + '">' + esc(d.label) + '</button>'
  ).join('');
  $('#viewToggle').querySelectorAll('.tab').forEach(b => {
    b.onclick = () => { state.view = b.dataset.view; renderView(); };
  });

  $('#board').classList.toggle('hidden', !isBoard);
  $('#lists').classList.toggle('hidden', isBoard);
  $('#aiWrap').classList.toggle('hidden', !isBoard);
  $('#q').classList.toggle('hidden', !isBoard);

  if (isBoard) { renderBoard(); return; }
  $('#bucketFilters').classList.add('hidden');
  $('#editBuckets').classList.add('hidden');
  $('#allBuckets').classList.add('hidden');
  $('#scoreChip').classList.add('hidden');
  $('#headline').classList.add('hidden');
  // Its chip is board-only, so leaving it on here would filter a view with no
  // visible control to explain why half the tasks are missing.
  state.unscoredOnly = false;
  if (def.id === 'reports') { renderReportsView(); return; }
  if (def.id === 'backups') { renderBackupsView(); return; }
  renderSections(def.id);
}

/* Re-draw whichever view is on screen. The drawer opens from the lists as well
   as the board now, so an edit has to show up where it was made — renderBoard
   alone does nothing when a list view is up. */
function refreshView(){
  if (state.view === 'board') renderBoard();
  else if (state.view === 'reports') renderReportsView();
  else if (state.view === 'backups') renderBackupsView();
  else renderSections(state.view);
  updateArchiveChip();
}

/* The bar above the board. Empty it is a slim invitation, not a banner: an empty
   headline is a normal state, and the board should not shout about it. */
function renderHeadline(){
  const bar = $('#headline');
  const hl = headlineTask();
  bar.classList.toggle('hidden', state.view !== 'board' || state.locked);
  bar.classList.toggle('set', !!hl);
  if (!hl) {
    bar.innerHTML = '<span class="hllabel">The one thing</span>' +
      '<span class="hlempty">Nothing set. Drag a card here, or open a task and press ' +
      '<strong>Make this the headline</strong>.</span>';
    // Nothing to open, so the bar goes back to being a strip of text. Left set,
    // the old role and handler would survive the removal and open a stale task.
    bar.removeAttribute('role');
    bar.removeAttribute('tabindex');
    bar.onclick = null;
    bar.onkeydown = null;
    return;
  }
  const t = hl.task;
  const di = dueInfo(t.due);
  const blocks = unblockCount(t);
  const set = parseDue(t.headline);
  const age = set ? Math.round((today() - set) / 86400000) : null;

  let tags = '';
  if (t.impact) tags += '<span class="tag impact-' + esc(t.impact) + '">' + esc(t.impact) + ' impact</span>';
  if (t.effort) tags += '<span class="tag">' + esc(t.effort) + '</span>';
  if (di) tags += '<span class="tag due ' + di.cls + '">' + esc(di.label) +
                  (di.note ? ' · ' + esc(di.note) : '') + '</span>';
  if (blocks) tags += '<span class="tag unblocks">frees up ' + blocks +
                      ' other task' + (blocks > 1 ? 's' : '') + '</span>';

  bar.innerHTML = '<span class="hllabel">The one thing</span>' +
    '<div class="hlmain">' +
      '<div class="hltitle">' + esc(t.title) + '</div>' +
      '<div class="hlmeta">' +
        '<span class="hlwhere">' + esc(hl.bucket.name) + ' · ' +
          esc(t.done ? DONE_COL : hl.tier.name) + '</span>' + tags +
      '</div>' +
    '</div>' +
    '<div class="hlright">' +
      (age === null ? '' : '<span class="hlage">' +
        (age <= 0 ? 'set today' : 'set ' + age + ' day' + (age > 1 ? 's' : '') + ' ago') + '</span>') +
      (t.done ? '<span class="hldone">solved — pick the next one</span>' : '') +
      '<button class="hlclear" id="hlClear">Remove</button>' +
    '</div>';

  /* The whole bar opens the task, like a card. Only the Remove button is carved
     out of that, or the one gesture that gets rid of the headline would open it. */
  bar.setAttribute('role', 'button');
  bar.setAttribute('tabindex', '0');
  bar.onclick = e => { if (!e.target.closest('.hlclear')) openDrawer(t.id); };
  bar.onkeydown = e => {
    if (e.target.closest('.hlclear')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(t.id); }
  };
  $('#hlClear').onclick = e => { e.stopPropagation(); clearHeadline(false); };
}

function renderBoard(){
  if (state.view !== 'board') return;
  renderTabs();
  renderHeadline();
  renderScoreChip();
  const board = $('#board');
  // The "who does it" filter cuts across every bucket, so it overrides the tabs.
  // The All tab does the same thing, but the tabs stay up so it can be undone.
  const across = !!state.aiFilter;
  const shown = shownBuckets();
  const many = shown.length > 1;
  $('#bucketFilters').classList.toggle('hidden', across);
  // Follows the strip it belongs to, and goes with it in a preview or the demo,
  // where the file behind it is not one that can be written to.
  $('#editBuckets').classList.toggle('hidden', across || state.locked);
  $('#allBuckets').classList.toggle('hidden', !across);

  const columns = boardColumns();
  board.style.setProperty('--cols', columns.length);
  board.innerHTML = columns.map(name => {
    const isDone = name === DONE_COL;
    const mode = sortMode(name);
    let entries = [];
    shown.forEach(bucket => {
      const color = BUCKET_COLOR[state.doc.buckets.indexOf(bucket) % BUCKET_COLOR.length];
      const label = many ? bucket.name : '';
      if (isDone) {
        bucket.tiers.forEach(tier => tier.tasks.forEach(t => {
          if (t.done && matches(t)) entries.push({ t, color, label });
        }));
      } else {
        const tier = bucket.tiers.find(t => t.name === name);
        if (tier) tier.tasks.forEach(t => { if (!t.done && matches(t)) entries.push({ t, color, label }); });
      }
    });
    // Stable: equal scores keep the order he put them in, so the sort only ever
    // answers the question it was asked.
    if (mode === 'priority') {
      entries = entries.map((e, i) => ({ e, i }))
        .sort((a, b) => (priorityScore(b.e.t) - priorityScore(a.e.t)) || (a.i - b.i))
        .map(x => x.e);
    }
    const n = entries.length;
    const cards = entries.map(e => cardHTML(e.t, e.color, e.label, { noDrag: state.locked })).join('');

    const sortBtn = isDone ? '' :
      '<button class="sortbtn' + (mode === 'priority' ? ' on' : '') + '" data-sort="' + esc(name) + '"' +
      ' title="' + (mode === 'priority'
        ? 'Showing highest impact for the lightest lift first. Hand-reordering is off while this is on.'
        : 'Showing your own order. Click to sort by impact against effort.') + '">' +
      (mode === 'priority' ? 'by priority' : '⇅') + '</button>';

    return '<section class="col' + (isDone ? ' donecol' : '') +
        (mode === 'priority' ? ' sorted' : '') + '" data-tier="' + esc(name) + '">' +
      '<h2>' + esc(name) + (TIER_HINT[name] ? ' <span class="hint">' + esc(TIER_HINT[name]) + '</span>' : '') +
      sortBtn + '<span class="count">' + n + '</span></h2>' +
      '<div class="drop" data-tier="' + esc(name) + '">' + (n ? cards : '<div class="empty">Nothing here</div>') + '</div>' +
      (isDone || many || state.locked ? '' : '<footer><button class="addbtn" data-add="' + esc(name) + '">+ Add task</button></footer>') +
    '</section>';
  }).join('');

  board.querySelectorAll('.card').forEach(el => {
    el.onclick = () => openDrawer(el.dataset.id);
    el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openDrawer(el.dataset.id); } };
  });
  // Drag-and-drop, the add-task footer and their wiring only mean anything for
  // the live file — a backup preview has nothing to reorder into.
  if (!state.locked) {
    board.querySelectorAll('.card').forEach(el => {
      el.ondragstart = e => {
        e.dataTransfer.setData('text/plain', el.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        dragId = el.dataset.id;
        requestAnimationFrame(() => el.classList.add('dragging'));
      };
      el.ondragend = () => { el.classList.remove('dragging'); dragId = null; hideDropLine(); };
    });
    board.querySelectorAll('.drop').forEach(zone => {
      zone.ondragover = e => {
        e.preventDefault();
        zone.classList.add('over');
        showDropLine(zone, e.clientY);
      };
      // Moving onto a card inside the zone counts as leaving the zone in most
      // browsers, so check where the pointer actually went before clearing.
      zone.ondragleave = e => {
        if (zone.contains(e.relatedTarget)) return;
        zone.classList.remove('over');
        hideDropLine();
      };
      zone.ondrop = e => {
        e.preventDefault();
        zone.classList.remove('over');
        hideDropLine();
        const id = e.dataTransfer.getData('text/plain') || dragId;
        if (id) dropTask(id, zone.dataset.tier, zone, e.clientY);
      };
    });
    board.querySelectorAll('.addbtn').forEach(el => { el.onclick = () => addTask(el.dataset.add); });
  }
  board.querySelectorAll('.sortbtn').forEach(el => {
    el.onclick = () => {
      setSortMode(el.dataset.sort, sortMode(el.dataset.sort) === 'priority' ? 'manual' : 'priority');
      renderBoard();
    };
  });
}

/* The intake queue. Counts across every bucket whatever the tabs say, because
   a task with no scores is not in a bucket's flow yet — it is waiting to enter
   one. Clicking it shows exactly those. */
function renderScoreChip(){
  const chip = $('#scoreChip');
  if (state.view !== 'board' || !state.doc) { chip.classList.add('hidden'); return; }
  let n = 0;
  state.doc.buckets.forEach(b => b.tiers.forEach(ti => ti.tasks.forEach(t => {
    if (!t.done && unscored(t) && matchesAi(t)) n++;
  })));
  chip.classList.toggle('hidden', n === 0 && !state.unscoredOnly);
  chip.classList.toggle('on', state.unscoredOnly);
  chip.textContent = state.unscoredOnly
    ? 'Showing ' + n + ' unscored · show all'
    : n + ' need scoring';
  chip.title = state.unscoredOnly
    ? 'Back to the whole board'
    : 'Tasks with no impact or no effort score yet. Click to see just those.';
  chip.onclick = () => { state.unscoredOnly = !state.unscoredOnly; renderBoard(); };
}

let dragId = null;
let subDrag = null;

/* A line showing where the card will land. One element, moved around the board
   rather than one per gap, so there is never more than one target on screen.
   It reads the same cards dropTask does — only same-bucket ones count, since a
   card can only be reordered against its own bucket's list — so the line always
   marks the place the card actually goes. */
let dropLine = null;
function insertAfterEl(zone, clientY, dragBucket, skipId){
  let after = null;
  zone.querySelectorAll('.card').forEach(el => {
    if (el.classList.contains('dragging') || el.dataset.id === skipId) return;
    const other = locate(el.dataset.id);
    if (!other || (dragBucket && other.bucket !== dragBucket)) return;
    const r = el.getBoundingClientRect();
    if (clientY > r.top + r.height / 2) after = el;
  });
  return after;
}
function showDropLine(zone, clientY){
  if (subDrag !== null) return;                       // a sub-step drag, not a card
  // Nothing to point at in a sorted column: the order is worked out, so there
  // is no gap to drop into. The column still highlights as a valid target.
  if (sortMode(zone.dataset.tier) === 'priority') return;
  if (!dropLine) {
    dropLine = document.createElement('div');
    dropLine.className = 'dropline';
  }
  const from = dragId ? locate(dragId) : null;
  const after = insertAfterEl(zone, clientY, from ? from.bucket : null, dragId);
  if (after) after.after(dropLine);
  else zone.prepend(dropLine);
}
function hideDropLine(){ if (dropLine && dropLine.parentNode) dropLine.remove(); }

/* Dropping a card on the bar makes it the one thing. Bound once, not per render,
   since the bar itself is never replaced — only its contents are. */
(function wireHeadlineDrop(){
  const bar = $('#headline');
  bar.ondragover = e => {
    if (subDrag !== null || !dragId) return;
    e.preventDefault();
    bar.classList.add('over');
  };
  bar.ondragleave = e => { if (!bar.contains(e.relatedTarget)) bar.classList.remove('over'); };
  bar.ondrop = e => {
    e.preventDefault();
    bar.classList.remove('over');
    const id = e.dataTransfer.getData('text/plain') || dragId;
    if (id && locate(id)) setHeadline(id);
  };
})();

/* Move a task to another tier, inserting near where it was dropped.
   Cards from other buckets are ignored when working out the position. */
function dropTask(id, tierName, zone, clientY){
  if (state.locked) return;
  const loc = locate(id);
  if (!loc) return;

  // Done is not a section in the file — it is the tick box on the task.
  if (tierName === DONE_COL) {
    if (setDone(loc.task, true)) { markDirty(); refreshView(); }
    if (state.openTask === id) openDrawer(id);
    return;
  }
  setDone(loc.task, false);                       // dragged back out of Done

  const targetTier = ensureTier(loc.bucket, tierName);

  // In a sorted column the position on screen is worked out, not chosen, so
  // there is nothing to read off the drop point. Move the task into the column
  // and leave his order alone — the sort will place it.
  const manual = sortMode(tierName) !== 'priority';
  const afterEl = manual ? insertAfterEl(zone, clientY, loc.bucket, id) : null;
  const after = afterEl ? (locate(afterEl.dataset.id) || {}).task : null;

  loc.tier.tasks.splice(loc.index, 1);
  let at;
  if (!manual) at = targetTier.tasks.length;
  else if (after) { const k = targetTier.tasks.indexOf(after); at = k > -1 ? k + 1 : targetTier.tasks.length; }
  else at = 0;
  targetTier.tasks.splice(at, 0, loc.task);

  markDirty(); refreshView();
  if (state.openTask === id) openDrawer(id);
}

function addTask(tierName){
  if (state.locked) return;
  const tier = ensureTier(activeBucket(), tierName);
  const t = { id: uid(), done:false, title:'New task', bold:true, impact:'', effort:'', due:'', ai:'',
              urgent:false, week:false, slug:'', blockedBy:[], rank:null, extra:[], body:[], raw:'', dirty:true };
  tier.tasks.push(t);
  markDirty(); refreshView(); openDrawer(t.id, true);
}

/* Taking work back off Claude has to take the prompt with it.
   Delegate to Claude is generated from the ai: tag, so a task switched to
   partial or none drops out of that list — but the prompt written for it would
   stay behind on the task, still reading as an instruction to hand it over. The
   next person to rebuild the section would have a prompt with nothing asking for
   it. A sub-step carrying its own ai:full is left alone, because it did not
   inherit the tag that just changed. Returns what was removed, so the change
   can be reported rather than happening silently. */
function stripDelegation(t){
  const removed = [];
  const out = [];
  let base = null, inherits = false;

  t.body.forEach(line => {
    const m = SUB_RE.exec(line);
    if (m && (base === null || m[1].length <= base)) {
      base = m[1].length;
      inherits = !hasField(m[3], 'ai');                    // no ai: of its own, so it follows the parent
      let text = m[3];
      if (inherits) text = text.replace(/\s*`rank:\d+`/g, '');
      out.push(m[1] + '- [' + m[2] + '] ' + text);
      return;
    }
    const deeper = base !== null && /^\s+\S/.test(line) && leadIndent(line) > base;
    if (PROMPT_NOTE.test(line) && (!deeper || inherits)) { removed.push(line.trim()); return; }
    out.push(line);
  });

  if (removed.length || t.rank != null) {
    t.body = out;
    t.rank = null;
    t.dirty = true;
  }
  return removed;
}

/* =========================================================================
   5. Drawer
   ========================================================================= */

function dedent(lines){ return lines.map(l => l.replace(/^ {1,2}/, '')).join('\n').replace(/\n+$/, ''); }
function indent(text){
  return text.replace(/\s+$/,'').split('\n').map(l => l.trim() === '' ? '' : '  ' + l);
}

/* ---- Date picker ----
   A month grid rather than <input type="date">, which hides its calendar behind
   a small icon and draws a different control in every browser. It opens in the
   flow under the field instead of floating over it: the panel scrolls, and a
   floating calendar gets cut off at the bottom edge. */
const CAL_DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const CAL_MONTHS = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];
function ymd(d){
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') +
         '-' + String(d.getDate()).padStart(2, '0');
}
function dueLabel(s){
  const d = parseDue(s);
  if (!d) return 'No date';
  return d.toLocaleDateString(undefined, { weekday:'short', day:'numeric', month:'short', year:'numeric' });
}
function calendarHTML(month, selected){
  const y = month.getFullYear(), m = month.getMonth();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;      // weeks start on Monday
  const days = new Date(y, m + 1, 0).getDate();
  const now = ymd(today());
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cd pad"></span>';
  for (let d = 1; d <= days; d++){
    const key = ymd(new Date(y, m, d));
    cells += '<button type="button" class="cd' + (key === selected ? ' sel' : '') +
      (key === now ? ' now' : '') + '" data-day="' + key + '">' + d + '</button>';
  }
  return '<div class="calhead">' +
      '<button type="button" class="calnav" data-cal="-1" title="Previous month">‹</button>' +
      '<strong>' + CAL_MONTHS[m] + ' ' + y + '</strong>' +
      '<button type="button" class="calnav" data-cal="1" title="Next month">›</button>' +
    '</div>' +
    '<div class="calgrid">' +
      CAL_DAYS.map(w => '<span class="cw" title="' + w + '">' + w[0] + '</span>').join('') +
      cells +
    '</div>' +
    '<div class="calfoot">' +
      '<button type="button" class="calsm" data-day="' + now + '">Today</button>' +
      '<button type="button" class="calsm" data-day="">Clear</button>' +
    '</div>';
}
/* One picker per date field, so `field` says which one is being edited. Both
   dates use the same calendar; only the value they write differs. */
const calMonth = {};
function wireDatePicker(t, touch, field){
  const btn = $('#f-' + field), cal = $('#f-cal-' + field);
  if (!btn || !cal) return;
  const draw = () => { cal.innerHTML = calendarHTML(calMonth[field], parseDue(t[field]) ? t[field] : ''); };
  btn.onclick = () => {
    const closed = cal.classList.toggle('hidden');
    if (closed) return;
    const from = parseDue(t[field]) || today();
    calMonth[field] = new Date(from.getFullYear(), from.getMonth(), 1);
    draw();
    cal.scrollIntoView({ block:'nearest' });
  };
  cal.onclick = e => {
    const nav = e.target.closest('[data-cal]');
    if (nav) {
      const m = calMonth[field];
      calMonth[field] = new Date(m.getFullYear(), m.getMonth() + (+nav.dataset.cal), 1);
      draw();
      return;
    }
    const day = e.target.closest('[data-day]');
    if (!day) return;
    t[field] = day.dataset.day;
    cal.classList.add('hidden');
    btn.textContent = dueLabel(t[field]);
    btn.classList.toggle('empty', !t[field]);
    touch();
    // The two dates constrain each other, so a change can make the other one
    // wrong. Re-open so the warning appears or clears straight away.
    openDrawer(state.openTask);
  };
}

/* ---- Messages and prompts written for this task ----
   Both live in the markdown as a note under the thing they serve, which means
   they arrive as one line buried in Notes. Pulled out here so the two things
   that are actually ready to send get their own place at the bottom of the
   panel, with a Copy button. The text itself is still edited in Notes — this is
   the same line, shown properly. */
function suggestions(t){
  const parts = splitBody(t);
  const out = { message: [], prompt: [] };
  const take = (lines, where) => lines.forEach(l => {
    if (MSG_NOTE.test(l))         out.message.push({ text: quoted(l), draft: /\(draft\)/i.test(l), where });
    else if (PROMPT_NOTE.test(l)) out.prompt.push({ text: quoted(l), draft: false, where });
  });
  take(parts.notes, '');
  parts.steps.forEach(s => take(s.notes, s.clean));
  return out;
}
function suggestionSection(label, list, opts){
  opts = opts || {};
  if (!list.length) return '';
  return '<div class="field sugg"><span>' + esc(label) +
    (list.length > 1 ? ' <em class="sublabel">' + list.length + '</em>' : '') + '</span>' +
    list.map(s =>
      '<div class="msg">' +
        '<div class="msgtext">' +
          (s.where ? '<em class="suggwhere">for: ' + esc(s.where) + '</em>' : '') +
          (s.draft ? '<em class="suggwhere draft">draft — read it before sending</em>' : '') +
          mdInline(s.text) +
        '</div>' +
        '<div class="msgacts">' +
          '<button type="button" class="copy" data-copy="' + esc(s.text) + '">Copy</button>' +
          (opts.claude ? claudeLink(s.text) : '') +
        '</div>' +
      '</div>').join('') +
    '</div>';
}

/* Turns one sub-step's text into an editable field in place. The row's drag
   handle stays put, but the row itself must stop being draggable while an
   input sits inside it, or selecting text tries to drag the row instead.
   Clearing the text and leaving removes the step, so there is no separate
   delete control to add just for this. */
function editSubtext(span, t, lineIdx, id){
  if (state.locked) return;
  const row = span.closest('.sub');
  const m = SUB_RE.exec(t.body[lineIdx]);
  if (!m) return;
  row.draggable = false;
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'subedit';
  input.value = m[3];
  span.replaceWith(input);
  input.focus();
  input.select();
  let settled = false;
